th faint purple lip-gloss.\n\nShe gave Aunt Helen a quick kiss and winked at the portrait of Charii, feeling that today of all days her ancestor should be proud of what she had accomplished. She stepped out of the house carrying a small wristlet that held her cell phone, taking on the new day with determination. She met Niara and Adair with five minutes to spare at the end of the Main Street cul-de-sac. She knew that it would be a warm early fall day, not so hot as to keep the visitors inside. She took the time to meet every vendor along the strip, patiently listening to registration and lot assignment frustrations. She paused to take pictures with a few people that believed in her royal lineage and had the honor of purchasing and tasting some of the first foods prepared for the day.\n\nShe stood with Niara as she oversaw the raising of the stage and braved the band line-up sound checks. Niara was cool and calm, completely in her element during the early morning set up. Her dark brown hair had been swept up into a quick ponytail with bangs that made her look nearly ten years younger than her twenty-eight years. Her skin was warmly tanned, making her cool grey eyes seem electrified in contrast. Adair, on the other hand, was tense, regulating retail items and food handling as well as calming vendors who didn’t get exactly what they’d expected. Everything seemed to be a buzz of anxious anticipation until the MC took the stage and the first of the festival visitors began to straggle in.\n\nThe first Gullah Resort ferry left the South Carolina coast and came to the island at nine o’clock sharp. When Aiyana spotted the ferry, which seemed filled to the brim, all complaining vendors turned into happy campers as the customers began to arrive. Niara turned to Aiyana with a mixture of relief and pride on her face.\n\n“You did it, Ms. Gamelle. Your event is off and running without a hitch.” She extended a hand and Aiyana took it.\n\nNiara handed Aiyana a clipboard with an excel file print out and walkie-talkie.\n\n“This is a schedule of events for the week as well as when and where security will be during the festival. So far, the crowd seems tame, but we’ll see how things progress in the evening. I’m going to mingle and keep SLED on their toes. ” She smiled, devilishly clapping her hands before walking away.\n\nChief Adair used Niara’s exit to speak directly and confidentially to Aiyana.\n\n“All looks real good, Ms. Gamelle,” he offered.\n\nAiyana turned to take in Main Street as the visitors from the ferry walked through the vendor displays.\n\n“I couldn’t have pulled this off without you and Niara.”\n\n“We made an interesting but effective team,” he offered. “I’ve instructed the boys to ignore petty marijuana and drug use this week.”\n\nAiyana smiled. “Good idea. Otherwise we’d be arresten half of the island.”\n\n“Anything that looks like sales or distribution will be taken in.”\n\n“Understood.”\n\n“Well, you should try to enjoy some of this festival, Ms. Gamelle.”\n\n“I’ll try,” she promised, and he turned to walk away.", "voices": [["“I’m gonna get ready. Th", "Aiyana"], ["“You’re welcome.” Aunt H", "Aunt Helen"], ["“You did it, Ms. Gamelle", "Niara"], ["“This is a schedule of e", "Niara"], ["“All looks real good, Ms", "Adair"], ["“I couldn’t have pulled ", "Aiyana"], ["“We made an interesting ", "Adair"], ["Aiyana smiled. “Good ide", "Aiyana"], ["“Anything that looks lik", "Adair"], ["“Understood.”", "Aiyana"], ["“Well, you should try to", "Adair"], ["“I’ll try,” she promised", "Aiyana"]]}}]}, {"id": "ev7", "title": "Chapter Three, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev7_1", "name": "Part 1", "text": "From her seat near the calypso band, Aiyana noticed a small group of Esta-owey elders gathering to the side in their sharp suits and shiny shoes. She hadn’t thought Sakima would be further interested in the festival.\n\n“Congratulations, Aiyana.”\n\nShe turned to wire rimmed glasses over dark green eyes and a cautious smile. It took a moment to recognize Caleb Ware after four years. He was much bigger, his wavy black hair cropped short. He’d left for New York University on a track scholarship; he’d never liked being under Sakima’s thumb.\n\n“Caleb Ware, why didn’t you tell me you were comen?” She allowed him to pull her into an embrace that was almost too familiar.\n\nHe had been on the island a week, and she hadn’t heard.\n\n“Did they tell you ‘bout the festival?” She pointed to the Esta-owey elders.\n\n“Yeah. I’m not of the current chief’s bloodline, but I guess I’m somewhere on the Esta-owey phone tree now. Being one of few to go to college and then getting accepted into medical school improved my tribal social standing.”\n\nShe spotted her brothers and sisters coming down Main Street and nudged Caleb behind a vendor’s tent.\n\n“Still hiding me?” He asked with an amused smile even as his voice carried a twinge of disappointment.", "choices": [{"label": "Show him your eyes", "to": "ev7_3"}, {"label": "Admit you are still hiding him", "to": "ev7_2"}], "voices": [["“Congratulations, Aiyana", "Caleb"], ["“Caleb Ware, why didn’t ", "Aiyana"], ["“Did they tell you ‘bout", "Aiyana"], ["“Yeah. I’m not of the cu", "Caleb"], ["“Still hiding me?” He as", "Caleb"]], "alt": {"text": "She took her clipboard and walkie-talkie closer to the stage, taking in the early morning calypso band playing light music. She found a spot and took a seat among the early morning crowd of listeners. She let her eyes drift over the visitors enjoying the music. As she did she noticed a small group of Esta-owey elders gathering to the side of the festivities, in their sharp suits and shiny shoes. Aiyana was surprised by their appearance. Aiyana realized that Niara must have had to clear it with Sakima to work on the festival and he’d been amenable to it. But, having not heard anything from him personally on the subject, she hadn’t thought he would be further interested in it.\n\n“Congratulations, Aiyana.”\n\nA familiar voice broke into her thoughts and she turned away from the Esta-owey. As she did her eyes landed on a pair of wire rimmed glasses set over dark green eyes and a cautious smile. It took a moment for her to recognize Caleb Ware, after four years of not seeing him. He was much bigger than he’d been on the day he graduated high school. His wavy black hair, which had once been a large mass that fell just over his shoulders, was cropped short. His skin was no longer deeply tanned but much lighter than she remembered.\n\nShe figured that was due to the four years he spent in the city. He’d gotten accepted into New York University on a track and field scholarship and, as far as Aiyana knew, had left the island behind. He’d never liked being under Sakima’s thumb and going to college was his only ticket out.\n\nShe smiled, pleasantly surprised, and stood up. He offered her a strong arm to help, an arm that was nearly three times the size she remembered. She was certain that he was also at least three inches taller as they were no longer eye-to-eye when facing each other.\n\n“Caleb Ware, why didn’t you tell me you were comen?” She allowed him to pull her into an embrace that was almost too familiar. His strong arms squeezing away any thoughts of playing it cool as she returned his hug.\n\n“I wanted to surprise you.” He pulled back a little and looked her over. “Wow!”\n\nHis eyes fell to her chest and curves. She felt herself get flushed and stepped away. Caleb laughed.\n\n“I should have come home much, much sooner.”\n\n“Same ole Caleb,” she looked around embarrassed as strangers began to notice them and became interested.\n\nAiyana smiled tightly and nodded Caleb in the opposite direction of the cul-de-sac to take attention off of them and put it back on the stage.\n\n“When’d you get back?” Aiyana asked as they made their way through the growing crowd of tourists from the resort mixed with tourists from the ferry.\n\n“About a week now,” Caleb admitted.\n\n“You’ve been on the island a week? I hadn’t heard.”\n\n“Well, you were busy with all of this.” He indicated the festival. Aiyana picked up on his changed accent as well.\n\n“Did they tell you ‘bout the festival?” She pointed to the Esta-owey elders.\n\n“Yeah. I’m not of the current chief’s bloodline, but I guess I’m somewhere on the Esta-owey phone tree now. Being one of few to go to college and then getting accepted into medical school improved my tribal social standing.”\n\n“Good for you.”\n\n“Also, I heard your grandma isn’t doing well.”\n\n“No, she’s not. The doctors don’t give her much time.”\n\n“I’m sorry to hear that.” They let a brief pause fill the space for a moment. “So, you want to go to breakfast and catch up?” Caleb offered.\n\nAiyana pointed to a vendor selling funnel cake on a stick. Caleb nodded and they waited in line for the fried dough topped with powdered sugar with strawberries skewered in between the folds.\n\nAiyana balanced the clipboard and walkie-talkie in one arm as she ate with the opposite hand. Her mouth was full when she spotted her brothers and sisters making their way down Main Street towards them. She swallowed her last bite dumping the rest in a trashcan as she nudged Caleb behind a vendor’s tent.\n\n“Still hiding me?” He asked with an amused smile even as his voice carried a twinge of disappointment.", "voices": [["“Congratulations, Aiyana", "Caleb"], ["“Caleb Ware, why didn’t ", "Aiyana"], ["“I wanted to surprise yo", "Caleb"], ["“I should have come home", "Caleb"], ["“Same ole Caleb,” she lo", "Aiyana"], ["“When’d you get back?” A", "Aiyana"], ["“About a week now,” Cale", "Caleb"], ["“You’ve been on the isla", "Aiyana"], ["“Well, you were busy wit", "Caleb"], ["“Did they tell you ‘bout", "Aiyana"], ["“Yeah. I’m not of the cu", "Caleb"], ["“Good for you.”", "Aiyana"], ["“Also, I heard your gran", "Caleb"], ["“No, she’s not. The doct", "Aiyana"], ["“I’m sorry to hear that.", "Caleb"], ["“Still hiding me?” He as", "Caleb"]]}}, {"id": "ev7_2", "name": "NEW DRAFT: Still hiding", "text": "“Yes,” Aiyana said. “I’m still hiden you. From them, and from whatever’s comen for me.”\n\nHis smile slipped. “I’d hoped four years might have changed it.”\n\n“Four years changed you. It didn’t change this.”", "choices": [{"label": "Continue", "to": "ev7_3"}], "voices": [["“Yes,” Aiyana said. “I’m", "Aiyana"], ["His smile slipped. “I’d ", "Caleb"], ["“Four years changed you.", "Aiyana"]], "alt": {"text": "“Yes,” Aiyana said. “I’m still hiden you. From them, and from whatever’s comen for me.”\n\n“That’s honest.” His smile slipped. “I’d hoped four years might have changed it.”\n\n“Four years changed you. It didn’t change this.”", "voices": [["“Yes,” Aiyana said. “I’m", "Aiyana"], ["“That’s honest.” His smi", "Caleb"], ["“Four years changed you.", "Aiyana"]]}}, {"id": "ev7_3", "name": "Part 2", "text": "Aiyana let her eyes blaze bright yellow. He took a startled step backwards.\n\n“Yeah, I remember,” He said.\n\n“I don’t think you should get mixed up with me and all of this.” She blurted it out. “They may have killed my father.”\n\n“Who are they?”\n\n“My Aunts and Uncle,” Aiyana said pointedly.\n\nHe leaned in and kissed her. She paused, not fighting nor responding.\n\n“I don’t want to be a part of history repeaten itself.”\n\n“We are not your parents,” Caleb said. “If there is any chance, Aiyana…”\n\n“I’ll try,” was all she could promise.\n\n“There is no one for me but you.”\n\nAiyana patted his cheek. “Give it time.”\n\nShe walked away before he could see through her false bravado, and joined her siblings as the MC announced the island’s first family.", "choices": [], "voices": [["“Yeah, I remember,” He s", "Caleb"], ["“I don’t think you shoul", "Aiyana"], ["“Who are they?”", "Caleb"], ["“My Aunts and Uncle,” Ai", "Aiyana"], ["“I don’t want to be a pa", "Aiyana"], ["“We are not your parents", "Caleb"], ["“I’ll try,” was all she ", "Aiyana"], ["“There is no one for me ", "Caleb"], ["Aiyana patted his cheek.", "Aiyana"]], "alt": {"text": "Aiyana looked at him earnestly and let her eyes blaze bright yellow. He took a startled step backwards then exhaled.\n\n“Yeah, I remember,” He said.\n\n“Good.” Aiyana exhaled.\n\n“I just thought we would be old enough by now to choose what we want.”\n\n“I don’t think it works like that.” Aiyana looked at Caleb earnestly. “I don’t think you should get mixed up with me and all of this.”\n\n“Too late.” Caleb winked at her. “I’m already mixed up in this.”\n\n“I’m serious. They may have killed my father.” Aiyana blurted out.\n\n“Who are they?” Caleb wanted to know.\n\n“My Aunts and Uncle,” Aiyana said pointedly. “Caleb, I…”\n\nHe didn’t let her finish her line of rational thought as he leaned in and kissed her. She paused, not fighting nor responding. It took him several moments to open his eyes and pull back.\n\n“You don’t feel the same way?” he asked puzzled.\n\n“I don’t know what I feel, Caleb. I don’t want to be a part of history repeaten itself.”\n\n“We are not your parents,” Caleb said.\n\n“I know but…” Aiyana felt frustrated by the things she could not explain, because she didn’t understand them herself.\n\nShe looked into his face and she realized he understood the frustration of it. She was certain his tribe repeated over and over that he should stay away from her and her family. But, he was no longer a child and neither was she. They should be able to make their own future.\n\n“If there is any chance, Aiyana…”\n\n“I’ll try,” was all she could promise. “I have to meet my brothers and sisters in the conference room. We are summoned to have brunch with some penthouse and trust fund folks. Count to thirty after I leave then you come out, okay?”\n\n“Aiyana…”\n\nAiyana waited for him to complete his thought. She could see the war in his head displayed in his eyes.\n\n“There is no one for me but you.”\n\nAiyana smiled and patted his cheek. “Give it time.”\n\nShe walked away before he could see through her false bravado. She entered Main Street and saw that her siblings were nearly to the stage. She took her time catching up to them. They all put on happy faces as the MC announced them as the island’s first family. They spent nearly an hour dancing in the crowd, taking pictures and signing autographs.", "voices": [["“Yeah, I remember,” He s", "Caleb"], ["“Good.” Aiyana exhaled.", "Aiyana"], ["“I just thought we would", "Caleb"], ["“I don’t think it works ", "Aiyana"], ["“Too late.” Caleb winked", "Caleb"], ["“I’m serious. They may h", "Aiyana"], ["“Who are they?” Caleb wa", "Caleb"], ["“My Aunts and Uncle,” Ai", "Aiyana"], ["“You don’t feel the same", "Caleb"], ["“I don’t know what I fee", "Aiyana"], ["“We are not your parents", "Caleb"], ["“I know but…” Aiyana fel", "Aiyana"], ["“If there is any chance,", "Caleb"], ["“I’ll try,” was all she ", "Aiyana"], ["“Aiyana…”", "Caleb"], ["“There is no one for me ", "Caleb"], ["Aiyana smiled and patted", "Aiyana"]]}}]}, {"id": "ev8", "title": "Chapter Three, Part 3", "access": "pass", "price": 0, "scenes": [{"id": "ev8_1", "name": "Part 1", "text": "Sakima had joined the Esta-owey elders, in a full three piece suit. They were merely observing, as if waiting for something to happen. When Aiyana’s eyes met his, she could have sworn his expression darkened into a snarl, and a strange whisper in a strange language surrounded her.", "choices": [{"label": "Turn away", "to": "ev8_3"}, {"label": "Hold Sakima’s stare", "to": "ev8_2"}], "alt": {"text": "Aiyana was caught off guard as she looked to the group of Esta-owey elders. She took note that Sakima had joined them, dressed in a full three piece suit she was sure cost more than her car. But it was plain to see that they were all merely observing the festival, as if waiting for something to happen. When Aiyana’s eyes met Sakima’s, she could have sworn his expression darkened into a snarl, and a strange whisper in a strange language surrounded her.", "voices": []}, "voices": []}, {"id": "ev8_2", "name": "NEW DRAFT: Sakima’s stare", "text": "Aiyana made herself hold his stare. The whisper thickened, words she almost knew pressing in around her ears. Sakima looked as if he were the one who wanted to turn away and could not.\n\nThen a child ran between them trailing a balloon, and whatever held them broke.", "choices": [{"label": "Continue", "to": "ev8_3"}], "alt": {"text": "Aiyana made herself hold his stare. The whisper thickened, words she almost knew pressing in around her ears, and for one breath the noise of the festival dropped away.\n\nSakima’s jaw tightened. He looked as if he were the one who wanted to turn away and could not.\n\nThen a child ran between them trailing a balloon, and whatever held them broke.", "voices": []}, "voices": []}, {"id": "ev8_3", "name": "Part 2", "text": "She turned away quickly. She wondered if he were related to her father, his brother or perhaps cousin? If she simply asked him what happened to her parents would he be able to tell her?\n\nNiara buzzed her on the walkie-talkie to remind her of tea in the conference room. There Niara brought over a very handsome man with deep blue bedroom eyes and pale blonde hair.\n\n“Aiyana this is William Rutledge, the third. He is the architect responsible for the new boardwalk in Atlantic Beach, South Carolina,” Niara said eagerly.\n\n“This island is just the most charming plot of real estate I have seen in a long, long time.” He wondered why Main Street didn’t have a boardwalk of its own.\n\n“Show me what you have.”\n\nThe lights were lowered, and his presentation came up against the wall.", "choices": [], "voices": [["“Aiyana this is William ", "Niara"], ["“This island is just the", "Mr. Rutledge"], ["“Show me what you have.”", "Aiyana"]], "alt": {"text": "She turned away quickly, letting the chill caused by his expression come and go. She wondered if he were related to her father, his brother or perhaps cousin? She wondered if she simply asked him what happened to her parents would he be able to tell her? Did they have the story written in some book? Was it a story they told amongst themselves in their own language? Or would the story die and stay buried with those that were there to witness it?\n\nWhen Niara buzzed her on the walkie-talkie to remind her of tea in the conference room, she came out of her deep thoughts and nudged Eva and Vivi. They had to pry Levi and Lucas away from the female entourage that swarmed around them. Making their way to the tallest tower of the resort they walked to the conference room, which was set up for tea and a presentation.\n\nAiyana quickly took in all who attended. There was only one young lady at the table that held five college boys, three older men, and two women, who seemed to be secretaries or assistants. The young lady was plain but pretty and attentive in a way that was much different from the young, disinterested college boys at the table. She was blonde with blue eyes, but those eyes didn’t reflect the same vacant light of her counterparts.\n\nAiyana smiled at the group of bored young people among an overeager group of older adults. She reminded herself how much they were spending at the resort as she took a seat near Niara who popped up to pour her tea and place a plate of cookies in front of her.\n\nNiara walked around the table and tapped a very handsome man with deep blue bedroom eyes and pale blonde hair on the shoulder. She whispered to the man and then pointed in Aiyana’s direction. Aiyana assumed he must be Mr. Rutledge.\n\nAiyana and Levi stood as Niara brought the man around the table for introductions.\n\n“Aiyana this is William Rutledge, the third. He is the architect responsible for the new boardwalk in Atlantic Beach, South Carolina,” Niara said eagerly.\n\nWilliam extended a hand, and Aiyana took it.\n\n“This island is just the most charming plot of real estate I have seen in a long, long time. When my son told me that you were finally opening up to large festivals, I took a look at your Main Street and wondered why you didn’t have a boardwalk of your own.”\n\n“Really?” Aiyana asked, knowing that nothing she said would get her out of sitting through the presentation he and his colleagues had prepared.\n\n“I knew you would be too busy to even think about new construction. Plus, having freshly dealt with the vendor situation, you will appreciate the possibilities that outlet shopping could afford year-round as well as during special occasions.”\n\nAiyana thought better of reminding him that the island was private property and home to many families that did not want year-round business traffic. The quiet solitude was a key attraction to vacationers and made their side of the island less prone to drugs and crime.\n\n“Show me what you have.” She smiled encouragingly and retook her seat.\n\nWilliam indicated that the lights should be lowered. As they were, his presentation came up against the wall and Aiyana got ready to be dazzled.", "voices": [["“Aiyana this is William ", "Niara"], ["“This island is just the", "Mr. Rutledge"], ["“Really?” Aiyana asked, ", "Aiyana"], ["“I knew you would be too", "Mr. Rutledge"], ["“Show me what you have.”", "Aiyana"]]}}]}, {"id": "ev9", "title": "Chapter Four, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev9_1", "name": "Part 1", "text": "After the two-hour presentation, Aiyana was certain she had gone cross-eyed. But the rent Mr. Rutledge estimated for land use alone did give her pause.\n\n“We’ll think about it,” Levi answered for her and she was grateful. “You understand we don’t want to build the same kind of boardwalk you could see anywhere.”\n\n“Alright!” A younger version of Mr. Rutledge popped out of his seat. “Now that business is over, time for fun.”\n\nHe was eyeing Eva as he spoke. His father, beyond embarrassed, told him to sit.\n\nLevi asked for the week to look over the proposal. Over the buffet Mr. Rutledge introduced his daughter, Rosalind, and his son, William. Niara was called away to the stage.\n\nAiyana met Levi by the window with Mr. Rutledge and three other men. Niara had surely informed them that she was the decision maker, but they focused their words and attention on him.", "choices": [{"label": "Let them talk to Levi", "to": "ev9_3"}, {"label": "Remind them who decides", "to": "ev9_2"}], "voices": [["“We’ll think about it,” ", "Levi"], ["“Alright!” A younger ver", "William IV"]], "alt": {"text": "After enduring the two-hour presentation, Aiyana was certain that she had gone cross-eyed. Of course, she recognized the celebrities and brand names tossed about, but she was not interested in catering to them. But when Mr. Rutledge estimated the amount of money the rent for land use alone could be, it did give her pause.\n\n“We’ll think about it,” Levi answered for her and she was grateful. “You understand we don’t want to build the same kind of boardwalk you could see anywhere. If anything were to happen it would have to have heavy local involvement as this is their home as much as ours.”\n\n“Of course,” Mr. Rutledge said patronizingly.\n\nAiyana got the impression that he believed his presentation had gone a lot better for him than it actually had.\n\n“Alright!” A younger version of Mr. Rutledge popped out of his seat as if it had been set on fire. “Now that business is over, time for fun.”\n\nAiyana noticed that the young man was eyeing Eva as he spoke. She held back a snicker as she looked over to Mr. Rutledge who seemed beyond embarrassed by the young man’s behavior.\n\n“Have a seat, son,” he instructed and the young man obeyed. “Were there any questions or concerns?” Mr. Rutledge recomposed himself.\n\n“Not at this time,” Levi assured him. “Give us the week to look over the proposal and we’ll schedule a more personal meeting.”\n\n“Wonderful!” Mr. Rutledge indicated that the lights should go up. “We have taken the liberty of having your local restaurant cater some surf and turf.”\n\n“Thank goodness,” the young woman, who seemed somehow stuffed into a suit too big for her, exhaled.\n\nThe door to the conference room opened as prepared buffet tables spilling over with steak, lobster, shrimp, chicken, fish and more were wheeled in and placed in front of the ocean view window.\n\n“Now that my daughter, Rosalind, and my son, William, have introduced themselves, everyone feel free to chatter and mingle with our royal hosts.” Mr. Rutledge said.\n\nAiyana turned to see how her siblings felt about this but they were already up and out of their seats, headed towards the buffet just behind Rosalind. Niara turned to Aiyana with her eyes glued to her PDA.\n\n“There is some line up confusion at the stage,” Niara said. “You mingle. There is no need to buy anything. But, if you plan to make this an annual or bi-annual thing, these are the people you want in your corner.”\n\n“Indeed,” Aiyana said humorously.\n\n“I will be back as soon as I can.”\n\nAiyana lifted her eyes to see Lucas working his charm on a blushing Rosalind. She wondered if it was his slim, pretty boy face or his island accent tinted with Gullah that girls found irresistible. She also took note of the young men huddled in a corner looking in Eva’s direction as if taking bets, while she nibbled on a plate with Vivi, ignoring them. Aiyana wished she could get in on their wagers, as she was certain each yuppie burnout would crash and burn.\n\nShe went to grab a glass of wine and met Levi by the window with Mr. Rutledge and three other men. Aiyana was quite certain that Niara had informed each of them that she was the decision maker, however since Levi had taken a protective role in shielding her from their money hungry plans, they focused their words and attention on him.", "voices": [["“We’ll think about it,” ", "Levi"], ["“Of course,” Mr. Rutledg", "Mr. Rutledge"], ["“Alright!” A younger ver", "William IV"], ["“Have a seat, son,” he i", "Mr. Rutledge"], ["“Not at this time,” Levi", "Levi"], ["“Wonderful!” Mr. Rutledg", "Mr. Rutledge"], ["“Thank goodness,” the yo", "Rosalind"], ["“Now that my daughter, R", "Mr. Rutledge"], ["“There is some line up c", "Niara"], ["“Indeed,” Aiyana said hu", "Aiyana"], ["“I will be back as soon ", "Niara"]]}}, {"id": "ev9_2", "name": "NEW DRAFT: Who decides", "text": "“Gentlemen.” Aiyana waited until all four turned. “My brother speaks for me today because I asked him to. The signature at the bottom will be mine.”\n\nMr. Rutledge’s smile widened without warming. “Of course, Ms. Gamelle.”\n\nThe men’s eyes had already slid back to Levi.", "choices": [{"label": "Continue", "to": "ev9_3"}], "voices": [["“Gentlemen.” Aiyana wait", "Aiyana"], ["Mr. Rutledge’s smile wid", "Mr. Rutledge"]], "alt": {"text": "“Gentlemen.” Aiyana waited until all four turned. “My brother speaks for me today because I asked him to. The signature at the bottom will be mine.”\n\nMr. Rutledge’s smile widened without warming. “Of course, Ms. Gamelle. We wouldn’t dream otherwise.”\n\nLevi hid a grin behind his glass. The men’s eyes had already slid back to him.", "voices": [["“Gentlemen.” Aiyana wait", "Aiyana"], ["Mr. Rutledge’s smile wid", "Mr. Rutledge"]]}}, {"id": "ev9_3", "name": "Part 2", "text": "Aiyana welcomed the ignorance as it gave her a moment to think about Caleb. Not knowing what the transition would entail made things dangerous for both of them, especially if Eva’s visions were to be believed.\n\n“Aiyana, dis Rosalind,” Lucas said.\n\n“Rose, please,” she extended a hand and Aiyana took it, liking the girl on instinct. She was an underwater photographer.\n\n“Maybe Lucas can take you to the cove for some underwater shooting this week. It’s never been done there before.”\n\nLucas offered first thing in the morning. Across the room the young men had surrounded Eva and Vivi, and Aiyana went to her sisters’ aid.\n\n“Eva, Vivi, look at the time. We need to be getten ready for Manci.”\n\nManci would be closing out the day stage live on Thump TV.\n\n“Any chance we could get on that stage?” William, the fourth, asked.\n\n“Be at the stage around seven and we’ll see.” Aiyana ushered the girls out.", "choices": [], "voices": [["“Aiyana, dis Rosalind,” ", "Lucas"], ["“Rose, please,” she exte", "Rosalind"], ["“Maybe Lucas can take yo", "Aiyana"], ["“Eva, Vivi, look at the ", "Aiyana"], ["“Any chance we could get", "William IV"], ["“Be at the stage around ", "Aiyana"]], "alt": {"text": "Aiyana welcomed the ignorance as it gave her a moment to think about Caleb. She smiled in spite of her need to turn him away. Not knowing everything the transition would entail made things more complicated and perhaps dangerous for both of them, especially if Eva’s visions were to be believed.\n\nWhen Aiyana first began sleepwalking, she’d gotten a strange feeling of déjà vu. She’d also gotten the feeling that something terrible had happened to her parents, especially when she finally questioned the fact that there were no photographs of her mother anywhere. She would not be able to live with herself if anything happened to Caleb because of her or her family.\n\n“Aiyana,” Lucas’ voice broke into her thoughts and she turned to see him waving her over to meet Rosalind.\n\nShe silently excused herself from the conversation she was not a part of and walked over to Lucas’ side.\n\n“Aiyana, dis Rosalind,” Lucas introduced.\n\n“Rose, please,” she extended a hand and Aiyana took it.\n\n“Aiyana,” Aiyana said, liking the girl on instinct.\n\n“Wow, I was just telling Luke that I love this island just the way it is. I’m due to graduate in a year and wouldn’t mind making this my home.”\n\nAiyana smiled. “We would be happy to have you here. What are you studying?”\n\n“Art and marine biology.”\n\n“Interesting. Are you an artist?”\n\n“An underwater photographer.”\n\n“Now, I am impressed. There’s a cove near my other brother’s house. You bring your camera?”\n\n“Everywhere I go,” she gushed.\n\n“Maybe Lucas can take you to the cove for some underwater shooting this week. It’s never been done there before.”\n\n“Oh, I would love that.”\n\nShe looked at Lucas expectantly. Aiyana could read the very emphatic thank you for being an awesome sister wingman in his eyes.\n\n“We have to stay on the resort tonight for the evening performance and bonfire, but perhaps first thing in the morning, before it’s a chance to get too hot.”\n\nAiyana smiled, winking at Lucas as Rosalind turned to put her plate down.\n\n“Just let me get your number and I’ll text you mine so we can meet up.”\n\n“Sure,” Lucas said pulling his phone from his pocket.\n\nAiyana turned to see that the young men had surrounded Eva and Vivi. They were not taking the hint that their attention was unwanted. Aiyana could see that Eva was two seconds away from giving them a sharp piece of her mind.\n\n“Excuse me,” she said as she went to her sisters’ aid. “Eva, Vivi, look at the time. We need to be getten ready for Manci.”\n\n“Manci?” One of the young men asked excitedly.\n\n“Yes, they’re going to be closen out the day stage live on Thump TV.”\n\n“Sweet!” Another young man said, giving a high five to all of his friends.\n\n“Any chance we could get on that stage?” William, the fourth, asked.\n\n“Be at the stage around seven and we’ll see.” Aiyana said, ushering the girls away and out of the conference room.", "voices": [["“Aiyana,” Lucas’ voice b", "Lucas"], ["“Aiyana, dis Rosalind,” ", "Lucas"], ["“Rose, please,” she exte", "Rosalind"], ["“Aiyana,” Aiyana said, l", "Aiyana"], ["“Wow, I was just telling", "Rosalind"], ["Aiyana smiled. “We would", "Aiyana"], ["“Art and marine biology.", "Rosalind"], ["“Interesting. Are you an", "Aiyana"], ["“An underwater photograp", "Rosalind"], ["“Now, I am impressed. Th", "Aiyana"], ["“Everywhere I go,” she g", "Rosalind"], ["“Maybe Lucas can take yo", "Aiyana"], ["“Oh, I would love that.”", "Rosalind"], ["“We have to stay on the ", "Lucas"], ["“Just let me get your nu", "Rosalind"], ["“Sure,” Lucas said pulli", "Lucas"], ["“Excuse me,” she said as", "Aiyana"], ["“Manci?” One of the youn", "Young man"], ["“Yes, they’re going to b", "Aiyana"], ["“Sweet!” Another young m", "Young man"], ["“Any chance we could get", "William IV"], ["“Be at the stage around ", "Aiyana"]]}}]}, {"id": "ev10", "title": "Chapter Four, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev10_1", "name": "Part 1", "text": "At the cottage, Aiyana was surprised to see her Aunt Fey seated in place of Aunt Helen.\n\n“Where’s Aunt Helen?”\n\n“In the room with your grandma… prayen.” Aunt Fey rolled her eyes. “This will be televised?”\n\n“Yes,” Aiyana nudged her sisters towards her room.\n\n“Be careful who you call to.” Aiyana paused to look at her Aunt Fey, whose eyes were fixed on the portrait of Charii. “Eventually they’ll come.”", "choices": [{"label": "Let it pass", "to": "ev10_3"}, {"label": "Ask her what she means", "to": "ev10_2"}], "voices": [["“Where’s Aunt Helen?”", "Aiyana"], ["“In the room with your g", "Aunt Fey"], ["“Yes,” Aiyana nudged her", "Aiyana"], ["“Be careful who you call", "Aunt Fey"]], "alt": {"text": "They took the short walk across the resort property through the backyard and to the cottage. When Aiyana opened the door she was surprised to see her Aunt Fey seated in place of Aunt Helen. Her Aunt Fey and her Aunt Helen looked very similar except Aunt Fey had the gray rinsed out of her hair on a regular basis. While neither woman had ever gotten married; Aunt Fey was notorious for her hot, short lived affairs, especially after Aiyana moved out of her house and onto the resort. Some of her most recent affairs had involved men only slightly older than Aiyana.\n\n“Aunt Fey, is everythen alright?”\n\n“Of course it is,” she said briskly. “How’s the carnival?”\n\n“Festival.” Aiyana corrected annoyed. “Where’s Aunt Helen?”\n\n“In the room with your grandma… prayen.” Aunt Fey rolled her eyes making it clear she didn’t understand Aunt Helen’s insistence on praying at this late stage. “How’s the festival, then?”\n\n“So far so good. We came to rest for a few hours ‘til we’re needed on stage  the island.”\n\n“Scoot over. I need a nap.”", "choices": [], "voices": [["“Yes, ma’am,” Aiyana sai", "Aiyana"], ["“So, we buyen into the R", "Eva"], ["“I don’t think so,” Aiya", "Aiyana"], ["“Scoot over. I need a na", "Aiyana"]], "alt": {"text": "“Yes, ma’am,” Aiyana said and followed her sisters down the hall. She stopped for a moment at her grandmother’s door that was more ajar than usual. Aunt Helen was on her knees crying and praying at the foot of the bed. She then continued on until they were all safely in her room.\n\n“What’s wrong with them?” Eva asked as she flopped on the bed, taking up the middle as Vivi crouched onto the bed’s edge.\n\nAiyana took a seat at her computer and looked up the Rutledge family. She was surprised to see how refined and polished they all looked on the website. She was also surprised to see that there appeared to be five more children under the age of eighteen. Aiyana surmised that they must have been left at home with Mrs. Rutledge, who appeared to have been remade by head-to-toe plastic surgery. She took note of the contact address in Malibu, California. It seemed odd that Mr. Rutledge was trying to drum up new business so far from home.\n\n“So, we buyen into the Rutledge dream?” Eva asked.\n\n“I don’t think so,” Aiyana said. “I can’t see haven brand names plastered on the island.”\n\n“Plus, them little boys are creepy. The sooner dey leabe da better,” Vivi said.\n\n“What time we meeten up with Manci?” Eva asked.\n\n“At six.”\n\n“Those creeps are gonna be pissed when they get there at seven.” Eva smiled.\n\n“But, Lucas into da Rosalind girl.” Vivi looked to Aiyana.\n\n“Yeah, she seemed nice. I invited her to the cove by Levi’s.”\n\nEva and Vivi looked at Aiyana, surprised.\n\n“She’s a nice millionaire heiress. He could do worse.” Aiyana said. “Scoot over. I need a nap.”", "voices": [["“Yes, ma’am,” Aiyana sai", "Aiyana"], ["“What’s wrong with them?", "Eva"], ["“So, we buyen into the R", "Eva"], ["“I don’t think so,” Aiya", "Aiy ugh", "Eva"]], "alt": {"text": "Eva had the pool to herself, a paperback she had read twice, and a pitcher of something pink that one of the hotel bartenders had left behind from the party.\n\nHe was still there, as it turned out, stacking glasses into crates on the patio. Young. Resort uniform, sleeves rolled. He had the careful walk of a man who had been up all night on someone else’s schedule.\n\n“You need that topped off, Miss Eva?”\n\n“I need it taken away from me. But go ahead.”\n\nHe laughed and poured. When he handed back the glass their fingers touched.\n\nWet grass. Hedges, black in the dark. The white of that same uniform, wrong somehow, lying where nobody should lie.\n\nEva jerked. Pink spilled down her wrist.\n\n“You all right?”\n\n“What time do you get off tonight?”\n\nHe blinked, and then he smiled like she was flirting, and she let him think it. “Late. After the bonfire.”\n\n“Don’t walk back through the gardens.”\n\n“Ma’am?”\n\n“Take the road. The long way.” She heard how she sounded. She made herself shrug. “Snakes.”\n\n“Yes, ma’am.” He was still smiling when he carried the crates around the side of the house.\n\nEva put the glass down on the concrete and did not pick it up again. She had told him. That had to count for something. It had to.", "voices": [["“You need that topped of", "Bartender"], ["“I need it taken away fr", "Eva"], ["“You all right?”", "Bartender"], ["“What time do you get of", "Eva"], ["He blinked, and then he ", "Bartender"], ["“Don’t walk back through", "Eva"], ["“Ma’am?”", "Bartender"], ["“Take the road. The long", "Eva"], ["“Yes, ma’am.” He was sti", "Bartender"]]}}]}, {"id": "ev15", "title": "Chapter Six, Part 3", "access": "pass", "price": 0, "scenes": [{"id": "ev15_1", "name": "Part 1", "text": "They took Levi’s paddleboat to the cove with snorkel gear and Rosalind’s photography equipment. Lucas scooped Rose in his arms, carried her into the water and kissed her sweetly. They swam around a corner, vanishing from view.", "choices": [{"label": "Stay with Aiyana and Caleb", "to": "ev15_3"}, {"label": "Follow Lucas: around the point", "to": "ev15_2"}], "alt": {"text": "They piled into Levi’s paddleboat along with packed lunches, snorkel gear, and Rosalind’s travel photography equipment. The sun shone warmly on them, getting hotter during the two minutes it took to load up and make it to the cove.\n\nLucas and Caleb dragged the boat through the shallow water to shore. Before Rose had a chance to grab her equipment, Lucas scooped her in his arms and carried her into the water until he was waist deep. He set her down and Aiyana watched as they kissed each other sweetly. Lucas turned to see her staring, then motioned that they would go out further. They swam to the other side of the cove and turned a corner, vanishing from view.", "voices": []}, "voices": []}, {"id": "ev15_2", "name": "NEW DRAFT: Lucas and Rose at the cove (sibling episode)", "text": "Around the point was a second, smaller pool most people never found. Rose surfaced with her camera, grinning.\n\n“Your father know you’d rather be doen this than builden his boardwalk?”\n\n“My father thinks this is a hobby I’ll grow out of. What does your family think you’ll grow out of?”\n\n“Dey ain’t never thought ’bout me long enough to say.”\n\n“What’s that?”\n\nHis finger had been moving in the wet sand. Lines and hooks and small closed shapes, row under row, neat as print.\n\n“Nothen.” He swept his palm across it. “Jus’ scratchen.”", "choices": [{"label": "Return to Aiyana", "to": "ev15_3"}], "voices": [["“Your father know you’d ", "Lucas"], ["“My father thinks this i", "Rosalind"], ["“Dey ain’t never thought", "Lucas"], ["“What’s that?”", "Rosalind"], ["“Nothen.” He swept his p", "Lucas"]], "alt": {"text": "Around the point the cove opened into a second, smaller pool that most people never found. Lucas had been keeping it to himself since he was twelve.\n\nRose surfaced with the camera held over her head, hair slicked flat, grinning like a child. “There’s a ray down there the size of a tabletop.”\n\n“He live here. Dat’s his house you in.”\n\n“Then tell him I said thank you.”\n\nShe hauled herself onto the rock beside him and tipped the screen so he could see. Blue on blue. A silver crowd of fish turning all at once. He had swum this water his whole life and had never seen it look like that.\n\n“Your father know you’d rather be doen this than builden his boardwalk?”\n\n“My father thinks this is a hobby I’ll grow out of.” She wiped the lens with her thumb. “What does your family think you’ll grow out of?”\n\n“Me?” Lucas laughed. “Dey ain’t never thought ’bout me long enough to say.”\n\nShe looked at him a moment longer than was polite. Then she looked down. “What’s that?”\n\nHis finger had been moving in the wet sand at the water’s edge. Lines and hooks and small closed shapes, row under row, neat as print.\n\n“Nothen.” He swept his palm across it. “Jus’ scratchen.”\n\nThe next wave came up and finished the job. Rose lifted the camera and took his picture instead, before he could pull a face.", "voices": [["Rose surfaced with the c", "Rosalind"], ["“He live here. Dat’s his", "Lucas"], ["“Then tell him I said th", "Rosalind"], ["“Your father know you’d ", "Lucas"], ["“My father thinks this i", "Rosalind"], ["“Me?” Lucas laughed. “De", "Lucas"], ["She looked at him a mome", "Rosalind"], ["“Nothen.” He swept his p", "Lucas"]]}}, {"id": "ev15_3", "name": "Part 2", "text": "Left alone, Aiyana and Caleb snorkeled along the edges of the cove. She took her skirt off, but Caleb kept his shirt on.\n\n“Let’s lay on the shore. Get some sun.”\n\n“Yeah, I need a tan, huh?”\n\n“It’s not that you need a tan… But, I remember growing up how the brown in your skin made your eyes stand out. I’m sure I noticed everythen, Caleb. I was in love with you.”\n\nCaleb rested his forehead against hers. “That is the first time you’ve said it. Do you think you could love me again?”\n\n“If I let myself, of course.”\n\n“Will you let yourself, Aiyana?”\n\nThe answer got stuck in her throat. She didn’t know what loving Caleb would mean for their future.\n\n“I’m not scared of your family secrets, or this transition, or anything.”\n\nHe kissed her, and they lay in the sun on the rocky bank.\n\n“You love this island. But, you don’t enjoy it. You and Sakima are a lot alike that way.”\n\nAiyana was surprised to be compared to the Chief, who seemed to hate her and her family very much.\n\n“What’s up with the t-shirt?” She finally asked.\n\n“I’m shy,” he said but his smile faltered.\n\n“What’s wrong?”\n\n“Nothing.”", "choices": [{"label": "Lift his shirt", "to": "ev15_5"}, {"label": "Let him keep his secret", "to": "ev15_4"}], "voices": [["“Let’s lay on the shore.", "Aiyana"], ["“Yeah, I need a tan, huh", "Caleb"], ["“It’s not that you need ", "Aiyana"], ["Caleb rested his forehea", "Caleb"], ["“If I let myself, of cou", "Aiyana"], ["“Will you let yourself, ", "Caleb"], ["“I’m not scared of your ", "Caleb"], ["“You love this island. B", "Caleb"], ["“What’s up with the t-sh", "Aiyana"], ["“I’m shy,” he said but h", "Caleb"], ["“What’s wrong?”", "Aiyana"], ["“Nothing.”", "Caleb"]], "alt": {"text": "“I think they want to be alone.” Caleb laughed.\n\n“I think you’re right.”\n\n“What do you want to do?”\n\n“To see the underwater wildlife with you.”\n\nThey put on their snorkel gear and walked into the water side by side. She took her skirt off, but Caleb kept his shirt on. She thought it was strange but didn’t ask why. Once they were waist deep, they dove into the water. She looked through the clear water at the marine life, which seemed uninterested in the human invasion.\n\nShe and Caleb stayed fairly close to the edges of the cove and coral life there. She let her eyes travel over the underwater world, where oysters and crabs and starfish mingled together in peace and harmony. Caleb pointed out a squat looking octopus in time for Aiyana to see it ink.\n\nShe swam to the surface and removed her gear in order to laugh. Caleb rose to the surface as well.\n\n“Did he just expel gas?” He asked.\n\n“I think he wants us to leave.”\n\n“Well I’m not going to argue with an octopus.”\n\n“Let’s lay on the shore. Get some sun.” Aiyana suggested.\n\n“Yeah, I need a tan, huh?” Caleb asked.\n\n“It’s not that you need a tan… But, I remember growing up how the brown in your skin made your eyes stand out.”\n\n“You noticed that while we were growing up?”\n\n“Of course.”\n\n“What else did you notice?”\n\n“I’m sure I noticed everythen, Caleb. I was in love with you.”\n\nCaleb pulled her closer to him and rested his forehead against hers.\n\n“That is the first time you’ve said it.”\n\n“Said what?” She asked, but she knew what he meant.\n\n“That you loved me. Do you think you could love me again?”\n\n“If I let myself, of course.”\n\n“Will you let yourself, Aiyana?”\n\nAiyana felt the answer get stuck in her throat. She didn’t know if she would let herself. She didn’t know what loving Caleb would mean for their future.\n\n“That is a long pause,” he observed. “I’m not scared of your family secrets, or this transition, or anything.”\n\n“I don’t want you to get hurt.”\n\n“I hurt anyway, without you.” Caleb looked sad.\n\n“Let’s just take it one day at a time.” Aiyana said. “We aren’t the same kids. I’m sure we’ve both changed and…”\n\nHe kissed her, cutting off her reasoning.\n\n“I’m not going to let you talk yourself out of our possible happiness. Come on, lie with me in the sun, so my eyes can pop again.”\n\nAiyana swam with him to the smooth rocky bank of the cove and they lay in the sun where the water met the land. Aiyana noted once again that Caleb did not take off his shirt.\n\n“So, tell me about your last four years on the island.”\n\n“Island life never changes, Caleb. Traditions keep everythen the same.”\n\n“Can you name at least three special things that happened in the last four years?”\n\nIt bothered Aiyana that she couldn’t.\n\n“The best thing to happen in the last four years is the festival. You know with the mainland economy, tourism has taken a hit. So, this festival is very important. For everyone on the island.”\n\n“You love this island.”\n\n“I do.”\n\n“But, you don’t enjoy it.” Caleb observed. “You and Sakima are a lot alike that way.”\n\nAiyana was surprised to be compared to the Chief that Caleb didn’t like at all, and who seemed to hate her and her family very much.\n\n“Do you know how many people in New York would kill to wake up next to the water every day? It’s so strange that when I was young I dreamt of the big city and excitement. But, before the end of my freshman year, I just wanted to look up at the sky and see the stars.”\n\n“Did you date a lot of girls?”\n\n“No. At first I was skinny and awkward. Then I was just not interested in the fake girls that I went to class with.”\n\n“Did you sleep with anyone?” Aiyana tried to sound casual but she knew she failed.\n\n“I did,” He answered honestly with a nod. “Please, don’t ask me how many. I don’t want to tell you and I don’t want to lie to you either.”\n\n“How many?” Aiyana asked with a laugh.\n\n“None of them stuck, Aiyana. Only one woman was meant for me.”\n\nAiyana felt the heat rise to her face and turned over to sun her back.\n\n“What’s up with the t-shirt?” She finally asked.\n\n“I’m shy,” he said but his smile faltered.\n\n“What’s wrong?”\n\n“Nothing.”", "voices": [["“I think they want to be", "Caleb"], ["“I think you’re right.”", "Aiyana"], ["“What do you want to do?", "Caleb"], ["“To see the underwater w", "Aiyana"], ["“Did he just expel gas?”", "Caleb"], ["“I think he wants us to ", "Aiyana"], ["“Well I’m not going to a", "Caleb"], ["“Let’s lay on the shore.", "Aiyana"], ["“Yeah, I need a tan, huh", "Caleb"], ["“It’s not that you need ", "Aiyana"], ["“You noticed that while ", "Caleb"], ["“Of course.”", "Aiyana"], ["“What else did you notic", "Caleb"], ["“I’m sure I noticed ever", "Aiyana"], ["“That is the first time ", "Caleb"], ["“Said what?” She asked, ", "Aiyana"], ["“That you loved me. Do y", "Caleb"], ["“If I let myself, of cou", "Aiyana"], ["“Will you let yourself, ", "Caleb"], ["“That is a long pause,” ", "Caleb"], ["“I don’t want you to get", "Aiyana"], ["“I hurt anyway, without ", "Caleb"], ["“Let’s just take it one ", "Aiyana"], ["“I’m not going to let yo", "Caleb"], ["“So, tell me about your ", "Caleb"], ["“Island life never chang", "Aiyana"], ["“Can you name at least t", "Caleb"], ["“The best thing to happe", "Aiyana"], ["“You love this island.”", "Caleb"], ["“I do.”", "Aiyana"], ["“But, you don’t enjoy it", "Caleb"], ["“Do you know how many pe", "Caleb"], ["“Did you date a lot of g", "Aiyana"], ["“No. At first I was skin", "Caleb"], ["“Did you sleep with anyo", "Aiyana"], ["“I did,” He answered hon", "Caleb"], ["“How many?” Aiyana asked", "Aiyana"], ["“None of them stuck, Aiy", "Caleb"], ["“What’s up with the t-sh", "Aiyana"], ["“I’m shy,” he said but h", "Caleb"], ["“What’s wrong?”", "Aiyana"], ["“Nothing.”", "Caleb"]]}}, {"id": "ev15_4", "name": "NEW DRAFT: His secret", "text": "Aiyana lay back and let it go. Everybody on this island was entitled to one thing they did not have to explain.\n\nCaleb shifted beside her, and winced, and tried to turn it into a stretch.\n\n“Caleb.”\n\n“It’s nothing.”", "choices": [{"label": "Continue", "to": "ev15_5"}], "voices": [["“Caleb.”", "Aiyana"], ["“It’s nothing.”", "Caleb"]], "alt": {"text": "Aiyana lay back and let it go. Everybody on this island was entitled to one thing they did not have to explain.\n\nThe sun moved. Caleb shifted beside her, and winced, and tried to turn it into a stretch.\n\n“Caleb.”\n\n“It’s nothing.”", "voices": [["“Caleb.”", "Aiyana"], ["“It’s nothing.”", "Caleb"]]}}, {"id": "ev15_5", "name": "Part 3", "text": "She could tell he was lying. She sat up and lifted his shirt, and sucked in a breath. His abdomen was covered in red and purple hand prints.\n\nShe placed her palm against one of the handprints. They matched perfectly. “I did that?”\n\nAiyana thought back to the electric feeling she’d experienced with him. “That’s not normal, is it? It’s the transition.”\n\n“Aiyana, it’s okay. Something happened while we were together and it was amazing.” He kissed her. “I’m with you, no matter what, baby.”\n\nThey made it back with five minutes to spare to head the festival parade. It wound through the casino campus, where Sakima and the elders stood watching from a balcony.\n\nAiyana was the only representative of her family on stage when Niara handed over the list of winners. With Caleb by her side, it was okay. She hoped her brothers and sisters were all lost in the crowd, having fun.", "choices": [], "voices": [["She placed her palm agai", "Aiyana"], ["Aiyana thought back to t", "Aiyana"], ["“Aiyana, it’s okay. Some", "Caleb"]], "alt": {"text": "She could tell he was lying. She sat up again and reached over to lift his shirt. She sucked in a breath as she looked at his abdomen, which was covered in red and purple hand prints.\n\n“What the…” Aiyana held her hand up to his torso and placed her palm against one of the handprints. They matched perfectly. “I did that?”\n\n“It doesn’t hurt,” Caleb said quickly pulling his shirt back down.\n\n“But, how did that happen? I didn’t hit you I just…” Aiyana thought back to the electric feeling she’d experienced while she was with him. “That’s not normal, is it? It’s the transition.” She could hear a little panic creep into her voice.\n\n“Aiyana, it’s okay. Something happened while we were together and it was amazing.”\n\n“It looks terrible, Caleb.”\n\n“No, just a little bruised, but baby, I love it.”\n\n“You do?”\n\n“Yes, I do. I can still feel your touch on me and I love it.”\n\nHe leaned over and kissed her lips.\n\n“It doesn’t scare you?”\n\n“No, it just makes me want you more.”\n\nAiyana smiled and hugged him. Seeing those handprints freaked her out. But, Caleb’s calm reassurance kept her from going crazy.\n\n“I’m with you, no matter what, baby.”\n\nThey spent the rest of the morning on the bank of the cove. Lucas and Rosalind brought the packed food to them and showed them the underwater photos she was able to take on her digital camera. They took a last swim together back to the boat and paddled back to Levi’s house.\n\nThey made it back in time to head the festival parade on top of a float put together by festival volunteers with only five minutes to spare. Niara was upset until she saw that the glowing Caleb next to her had been the reason.\n\n“Nicely done,” Niara winked, taking her seat on the float with Aiyana, Caleb and her brothers and sisters. The parade lasted close to two hours, with more than a hundred floats by Gullah and Esta-owey groups in flashy parade costumes winding through the Gullah and Esta-owey sides of the island. They threw out small toys, chocolate, candy, fake jewelry and even silver dollars. Aiyana was impressed that Niara had coordinated the parade to roam through the casino campus and she took note of Sakima and the elders standing and watching from a conference level balcony.\n\nThe parade wound back through the resort and came to a halt on Main Street. Drivers took the floats away while the crowds and participants flooded the street, headed for the stage. Aiyana found that she was the only representative of her family on stage when Niara handed over the list of winners and box of prizes. But she was glad to see a healthy mixture of Gullah and Esta-owey in the crowd. With Caleb by her side, it was okay. She hoped her brothers and sisters were all lost in the crowd, having fun.", "voices": [["“What the…” Aiyana held ", "Aiyana"], ["“It doesn’t hurt,” Caleb", "Caleb"], ["“But, how did that happe", "Aiyana"], ["“Aiyana, it’s okay. Some", "Caleb"], ["“It looks terrible, Cale", "Aiyana"], ["“No, just a little bruis", "Caleb"], ["“You do?”", "Aiyana"], ["“Yes, I do. I can still ", "Caleb"], ["“It doesn’t scare you?”", "Aiyana"], ["“No, it just makes me wa", "Caleb"], ["“I’m with you, no matter", "Caleb"], ["“Nicely done,” Niara win", "Niara"]]}}]}, {"id": "ev16", "title": "Chapter Seven, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev16_1", "name": "Part 1", "text": "Aiyana allowed herself to simply enjoy the night with Caleb. When the music ended, the MC sent the crowd down the beach to the final bonfire for a tale of local island lore.\n\nVivi stood next to Harold at the fire, Eva beside her. Beyond it, SLED officers kept an eye on the crowd.\n\n“Da fam’ly dat own dis i’lan resort come from African royalty.” Vivi’s skinny local friend with dreads, Harold, was telling the visitors a story.\n\n“They is pure of blood. An’ we cun trace dem all da way back the ancient African goddess, Mawu. Is way they get dem yellow eyes. From da energy of they goddess.”\n\n“Some goddess.” Eva snorted.\n\nWhat good was a mythical goddess if their supposed royal family was drenched in head-to-toe secrecy, death, and dysfunction?\n\nThe bonfire’s warmth and beauty made her cast off the last of her cares. She stood, bringing Caleb to his feet, and leaned over to whisper to Eva.\n\n“Don’t wait up for me, okay? I’m going to… be with Caleb.”\n\n“Aiyana, are you sure?” Eva asked earnestly.", "choices": [{"label": "Tell her you are sure", "to": "ev16_3"}, {"label": "Ask Eva what she has seen", "to": "ev16_2"}], "voices": [["“Da fam’ly dat own dis i", "Harold"], ["“They is pure of blood. ", "Harold"], ["“Some goddess.” Eva snor", "Eva"], ["“Don’t wait up for me, o", "Aiyana"], ["“Aiyana, are you sure?” ", "Eva"]], "alt": {"text": "During the next performance, Aiyana stepped off of the stage with Caleb. She allowed herself to simply enjoy the night, the food, the music and the dancing in a way that she would not have if Caleb were not there. When the music ended, the MC took to the stage.\n\n“Alright, the beach party isn’t over yet,” the MC announced. “Just down the beach the final bonfire is blazing. If you’re not ready to go home, or back to your room, head over that way and prepare to enjoy a tale of local island lore.”\n\nCaleb intertwined his fingers with Aiyana, holding her securely to his side. They followed the crowd from the stage to the beach, walking hand in hand towards the bonfire. Aiyana caught sight of Vivi next to Harold at the bonfire. Eva was ahead and hurried to catch up with Vivi, linking arms with her. A small group of local kids sat with acoustic instruments and they all sang an island song as the crowd gathered around the fire.\n\nAiyana looked back to see Lucas and Levi following behind them. Rosalind clung to Lucas, and Levi had his arm around another local girl. Caleb pulled Aiyana close as the breeze swept over her, making her shiver. Although Aiyana felt intimidated by how big and warm the fire was up close, she let her eyes travel beyond the fire to tourists mingling with a mixture of local Gullah and Esta-owey smoking pot, taking note of the SLED officers keeping an eye on the situation.\n\nAiyana remembered Adair’s assurance that the task force was only there to keep the peace, and were under orders to turn a blind eye to limited drug use. Aiyana turned back to the bonfire as Caleb found an open spot and took a seat, bringing Aiyana down with him. He pulled her into him and they listened to the music and soaked up the warmth from the fire.\n\n“Da fam’ly dat own dis i’lan resort come from African royalty.” A smooth bass voice said, laying on the Gullah accent for effect. She turned to see that Vivi’s skinny local friend with dreads, Harold, was telling the visitors a story. The music became more rhythmic. Soon Harold’s words seemed to fall in cadence with her own heartbeat. Vivi stood beside him, pantomiming and dancing to enhance Harold’s story.\n\n“They is pure of blood. An’ we cun trace dem all da way back the ancient African goddess, Mawu. Is way they get dem yellow eyes. From da energy of they goddess.”\n\n“Some goddess.” Aiyana heard Eva snort.\n\nAiyana was inclined to agree with Eva’s sentiment. What good was it to be descended from a mythical goddess if their supposed royal family was drenched in head-to-toe secrecy, death, and dysfunction? She looked over the group of locals listening to the tale with visitors as they passed a joint around, until her eyes locked back onto Caleb’s.\n\nShe took in the orange glow of the bonfire on his skin and reflected in his glasses. She watched as an appreciative smile spread across his face and he kissed her forehead. She turned away, looking intently at the bonfire that blazed before her. Its warmth and beauty made her smile and cast off the last of her cares. She turned from the bonfire and stood up, bringing Caleb to his feet as well. Eva looked at her. She leaned over to whisper.\n\n“Don’t wait up for me, okay?”\n\n“Where you going?”\n\n“I’m going to… be with Caleb.” Aiyana said as Lucas and Levi looked up from their spots towards them.\n\n“Aiyana, are you sure?” Eva asked earnestly.", "voices": [["“Alright, the beach part", "MC"], ["“Da fam’ly dat own dis i", "Harold"], ["“They is pure of blood. ", "Harold"], ["“Some goddess.” Aiyana h", "Eva"], ["“Don’t wait up for me, o", "Aiyana"], ["“Where you going?”", "Eva"], ["“I’m going to… be with C", "Aiyana"], ["“Aiyana, are you sure?” ", "Eva"]]}}, {"id": "ev16_2", "name": "NEW DRAFT: Are you sure", "text": "“Why?” Aiyana kept her voice under the music. “You see somethen?”\n\nEva’s eyes went to Caleb and came back. Whatever was in them, she folded it away.\n\n“No. Nothing like that.” She squeezed Aiyana’s fingers once, hard. “I just wanted to hear you say it.”", "choices": [{"label": "Continue", "to": "ev16_3"}], "voices": [["“Why?” Aiyana kept her v", "Aiyana"], ["“No. Nothing like that.”", "Eva"]], "alt": {"text": "“Why?” Aiyana kept her voice under the music. “You see somethen?”\n\nEva’s eyes went to Caleb and came back. Whatever was in them, she folded it away.\n\n“No. Nothing like that.” She squeezed Aiyana’s fingers once, hard. “I just wanted to hear you say it.”", "voices": [["“Why?” Aiyana kept her v", "Aiyana"], ["“No. Nothing like that.”", "Eva"]]}}, {"id": "ev16_3", "name": "Part 2", "text": "“Yes.”\n\n“Text me when you’re home.”\n\nAiyana pulled Caleb from the crowd to where the ocean tide met the sand.\n\n“So, the transition is in a few days. Do you know what to expect?”\n\n“Not really. There’s a stage ceremony on the final day of the festival at sunset.”\n\nShe turned to face him. As the moonlight hit her eyes, she let them glow bright yellow. She watched his head turn away.\n\n“I know, Aiyana.” He pressed her hands to his abdomen. “I’ve known there was something different about you since we were kids and I don’t care.”\n\n“May I kiss you now?”\n\n“You don’t have to ask.” Aiyana smiled, then tripped over a large object in the tide and fell hard, taking Caleb with her.\n\nThe object under her bare leg was clammy and soft, and she smelled blood. Aiyana turned her burning yellow eyes to it and let out a blood-curdling scream as she looked into the dead dilated eyes of William Rutledge, the third. Claw marks gashed over his upper chest. His right arm was missing entirely and his midsection looked as if he had exploded from the inside. His blood was washing away with the tide.", "choices": [], "voices": [["“Yes.”", "Aiyana"], ["“Text me when you’re hom", "Eva"], ["“So, the transition is i", "Caleb"], ["“Not really. There’s a s", "Aiyana"], ["“I know, Aiyana.” He pre", "Caleb"], ["“May I kiss you now?”", "Caleb"], ["“You don’t have to ask.”", "Aiyana"]], "alt": {"text": "“Yes.”\n\n“Text me when you’re home.”\n\n“I will.”\n\nAiyana stood and pulled Caleb from the crowd.\n\n“Dis here is our nex’ Sa’Fyre Island Gullah queen, Ms. Aiyana.” Harold proudly introduced her to the visitors in the group.\n\nAiyana waved to the visitors and pulled Caleb along. She felt warmth radiating from him as he leaned in and gave her a hug. His embrace was strong and sure.\n\nShe took him to where the ocean tide met the sand and they walked along it in silence for a moment. She enjoyed the way the water hit her feet and pulled back as if trying to pull her in. Caleb squeezed her closer to him so he could put an arm around her shoulders.\n\n“So, the transition is in a few days.” Caleb started.\n\n“It is.” Aiyana acknowledged.\n\n“Do you know what to expect?”\n\n“Not really. There’s a stage ceremony on the final day of the festival at sunset. My grandmother won’t be able to get out of bed, so my Uncle Max will officiate the transfer of power. I’ll sign a lot of legal documents in front of the witnessing residents and voila. I’m a queen.”\n\n“I thought the transition was more about a… physical change of some sort.”\n\n“There very well may be, Caleb. Everyone is hush-hush about the details. I just hope there won’t be any painful blood sacrificing by the light of the moon.”\n\n“And you don’t want to be queen.” Caleb filled in what was unspoken for her.\n\nShe turned to face him, pulling out of his arms. She continued to walk backwards. As the clouds shifted and the moonlight hit her eyes, she let them glow bright yellow. She watched his head turn away.\n\n“I know, Aiyana,” he assured her. “You don’t have to keep reminding me.” He pressed her hands to his abdomen reminding her of the handprints there. “I’ve known there was something different about you since we were kids and I don’t care.”\n\n“Maybe you should,” she offered.\n\n“Don’t do this, Aiyana.”\n\n“Do what?”\n\n“We are having such a great time together. I’m feeling you. You’re feeling me. We both snuck away so we could feel each other because we both know that we belong together. Now you want to give me reasons why I should stay away from you. Didn’t you like what happened between us last night?”\n\n“You know I did. I just don’t want you to ignore the obvious. We have no idea everythen the transition is gonna bring.”\n\n“Let’s cross that bridge when we come to it, together.” Caleb offered.\n\nHaving Caleb’s strength by her side truly made her feel as if she didn’t have to go through whatever was coming alone.\n\n“May I kiss you now?” He asked bringing her out of her thoughts.\n\n“You don’t have to ask.” Aiyana smiled, intending to take one more step before letting him kiss her. But, she found herself tripping over a large object in the tide and falling over, taking Caleb with her as he tried to keep her upright.\n\nShe fell hard on her backside. Caleb fell down next to her. She was still prepared to kiss him, except she noticed the clammy and squishy softness of the large object underneath her bare leg, along with the unmistakable smell of blood. Aiyana turned her burning yellow eyes to the object and let out a blood-curdling scream as she looked into the dead dilated eyes of William Rutledge, the third. Claw marks gashed over his upper chest. His right arm was missing entirely and his midsection looked as if he had exploded from the inside. A good deal of his blood was seeping out, washing away with the tide.", "voices": [["“Yes.”", "Aiyana"], ["“Text me when you’re hom", "Eva"], ["“I will.”", "Aiyana"], ["“Dis here is our nex’ Sa", "Harold"], ["“So, the transition is i", "Caleb"], ["“It is.” Aiyana acknowle", "Aiyana"], ["“Do you know what to exp", "Caleb"], ["“Not really. There’s a s", "Aiyana"], ["“I thought the transitio", "Caleb"], ["“There very well may be,", "Aiyana"], ["“And you don’t want to b", "Caleb"], ["“I know, Aiyana,” he ass", "Caleb"], ["“Maybe you should,” she ", "Aiyana"], ["“Don’t do this, Aiyana.”", "Caleb"], ["“Do what?”", "Aiyana"], ["“We are having such a gr", "Caleb"], ["“You know I did. I just ", "Aiyana"], ["“Let’s cross that bridge", "Caleb"], ["“May I kiss you now?” He", "Caleb"], ["“You don’t have to ask.”", "Aiyana"]]}}]}, {"id": "ev17", "title": "Chapter Seven, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev17_1", "name": "Part 1", "text": "Aiyana could instantly see the glowing eyes of her siblings as they ran towards her screams along with the rest of the crowd. She clung to Caleb’s arm, trying to get as far away from the dead man as possible.\n\n“It’s okay,” he said. “Security is coming.”\n\nCaleb explained to the SLED officers that they stumbled over the body during their walk. Levi pulled her from Caleb’s embrace into the shielded cluster formed by Eva, Vivi, and Lucas.\n\nRosalind’s eyes fell to her father’s dead face.\n\n“Daddy,” she breathed quietly. A SLED officer held her back. “That’s my father!”\n\nAdair arrived on the scene of what they presumed to be an accidental drowning followed by an animal mauling. Aiyana felt a chill as she realized this spot was not far from where she had wandered and passed out a few nights before with Vivi.\n\n“You should get back home and get some sleep,” Adair said.\n\n“I’ll walk you,” Caleb offered.\n\nLevi stepped between the two of them. “We’ll see her home.”", "choices": [{"label": "Let Levi take you home", "to": "ev17_3"}, {"label": "Ask for Caleb to walk you", "to": "ev17_2"}], "voices": [["“It’s okay,” he said. “S", "Caleb"], ["“Daddy,” she breathed qu", "Rosalind"], ["“You should get back hom", "Adair"], ["“I’ll walk you,” Caleb o", "Caleb"], ["Levi stepped between the", "Levi"]], "alt": {"text": "Aiyana could instantly see the glowing eyes of her siblings as they ran towards her screams and cries along with the rest of the crowd. She clung to Caleb’s arm in fear as he stood up, bringing her to her feet as well. She couldn’t help the tears that came to her eyes, cooling away their fiery yellow as she tried to get as far away from the dead man as possible.\n\nCaleb held her close as they backed away.\n\n“It’s okay,” he said. “Security is coming.”\n\nAiyana saw two of the two-wheeled stand up scooters issued to the SLED task force, with blaring blue and white lights headed for them. Caleb kept her close in his arms as security, followed by her brothers and sisters as well as the curious spectators, came their way.\n\nAiyana held onto Caleb, too much in shock to be crushed by the fact that any romantic ideas for the night were now out of the question. She pulled herself together as best she could, refusing to look at the corpse as security reached them, shining bright white torch lights in their direction and onto the body.\n\nCaleb did his best to explain that they stumbled over the body during their walk. Aiyana confirmed that neither of them had seen anyone else near the body. Levi was the first of her siblings to make it to Aiyana’s side, pulling her away from Caleb’s protective embrace and delivering her into the shielded cluster formed by Eva, Vivi, and Lucas.\n\nAiyana looked directly at Rosalind as her eyes fell to her father’s dead face, lit up by SLED torch lights. Rosalind looked her father’s body up and down in confusion several times until she accepted what the image meant.\n\n“Daddy,” she breathed quietly before trying to break through the small crowd to get to his body. A SLED officer held her back. “That’s my father!” She protested.\n\nLucas went to pull her back and she buried her head in his shoulder, crying. Caleb stayed close by as the first of security blocked off the area and called for emergency responders. It only took fifteen minutes for Adair to rise from sleep and arrive on the scene of what they presumed to be an accidental drowning followed by an animal mauling. As the yellow tape went up and the body was examined, Adair questioned both Aiyana and Caleb.\n\n“You walked directly from the bonfire to the shore line?” He confirmed, looking towards the fire that was beginning to die down. “That’s not more than a couple hundred yards away.”\n\nAiyana felt a chill run over her as she realized this spot was not too far from where she had wandered and passed out a few nights before with Vivi. She looked at Vivi who seemed to be just as spooked out.\n\n“I’ve called in the ferry to come and I will go with the body to the county morgue. The boys will gather the rest of his family and bring them by boat.”\n\n“What can I do?” Aiyana asked.\n\n“You should get back home and get some sleep. Tomorrow is going to be a busy day,” Adair advised.\n\n“I’ll take you.” Caleb offered.\n\n“It’s right over there.” Aiyana pointed over the lawn.\n\n“I’ll walk you,” he countered.\n\nLevi stepped between the two of them. “We’ll see her home.”", "voices": [["“It’s okay,” he said. “S", "Caleb"], ["“Daddy,” she breathed qu", "Rosalind"], ["“You walked directly fro", "Adair"], ["“I’ve called in the ferr", "Adair"], ["“What can I do?” Aiyana ", "Aiyana"], ["“You should get back hom", "Adair"], ["“I’ll take you.” Caleb o", "Caleb"], ["“It’s right over there.”", "Aiyana"], ["“I’ll walk you,” he coun", "Caleb"], ["Levi stepped between the", "Levi"]]}}, {"id": "ev17_2", "name": "NEW DRAFT: Tonight it’s family", "text": "“Levi, he can walk me.”\n\n“Not tonight.” Levi did not look at Caleb when he said it. “Tonight it’s family.”\n\nCaleb nodded once.", "choices": [{"label": "Continue", "to": "ev17_3"}], "voices": [["“Levi, he can walk me.”", "Aiyana"], ["“Not tonight.” Levi did ", "Levi"]], "alt": {"text": "“Levi, he can walk me.”\n\n“Not tonight.” Levi did not look at Caleb when he said it. He was looking at the yellow tape and what lay behind it. “Tonight it’s family.”\n\nCaleb heard it the way it was meant. He nodded once.", "voices": [["“Levi, he can walk me.”", "Aiyana"], ["“Not tonight.” Levi did ", "Levi"]]}}, {"id": "ev17_3", "name": "Part 2", "text": "Caleb’s calm, accepting expression was the same he’d had when she broke up with him before he left for college.\n\n“Can we talk tomorrow?” she asked.\n\n“Of course,” he assured her. He kissed her forehead. “I’m here for you, Aiyana.”\n\nAt the sea grass Harold, the skinny storyteller, let his eyes travel over Vivi as he thanked her for her help.\n\nThey walked back to the cottage in quiet. Levi led Aiyana to the door.\n\n“Bad juju?” he asked.\n\n“Your guess as good as mine.”", "choices": [], "voices": [["“Can we talk tomorrow?” ", "Aiyana"], ["“Of course,” he assured ", "Caleb"], ["“Bad juju?” he asked.", "Levi"], ["“Your guess as good as m", "Aiyana"]], "alt": {"text": "Aiyana looked into Caleb’s face lit up by police torch lights and took in his calm and accepting expression. It was the same expression he’d had when she broke up with him before he left for college.\n\n“Can we talk tomorrow?” She asked him with a sick half-hearted smile, hoping that he understood her need to end the night where it was and begin anew in the morning.\n\n“Of course,” he assured her. “Can I get a hug?”\n\nAiyana smiled and gave him a hug. He kissed her forehead.\n\n“I’m here for you, Aiyana.” He reminded her in a soft whisper.\n\nEva came to put Aiyana’s arm around her shoulders and provide a little support as they walked through the crowd. As they approached the sea grass, she took note of Harold, the skinny storyteller.\n\n“Great story,” Aiyana said. “Almost believe it.”\n\n“It’s all good entertainment,” he commented. “They’ll keep comen back for more.” He let his eyes pass from Aiyana and travel over Vivi. “Thank you for your help, Ms. Vivienne. How are you?”\n\nLevi and Lucas hurried them along, giving Harold a dismissive snort.\n\n“I’m great,” she replied with a half smile. “But, we need to get Aiyana home.”\n\n“I understand. Goodnight ma’am.” He said with a polite nod before turning away and heading back to dying embers of the bonfire.\n\n“This Island has some slim pickens,” Eva commented.\n\nAiyana and Vivi exchanged glances.\n\n“None of them are picken you,” Vivi finally retorted.\n\nThey all remained quiet on the short walk back to the cottage.\n\nLevi led Aiyana to the door.\n\n“Bad juju?” he asked.\n\n“Your guess as good as mine.” She answered.", "voices": [["“Can we talk tomorrow?” ", "Aiyana"], ["“Of course,” he assured ", "Caleb"], ["“I’m here for you, Aiyan", "Caleb"], ["“Great story,” Aiyana sa", "Aiyana"], ["“It’s all good entertain", "Harold"], ["“I’m great,” she replied", "Vivi"], ["“I understand. Goodnight", "Harold"], ["“This Island has some sl", "Eva"], ["“None of them are picken", "Vivi"], ["“Bad juju?” he asked.", "Levi"], ["“Your guess as good as m", "Aiyana"]]}}]}, {"id": "ev18", "title": "Chapter Eight, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev18_1", "name": "Part 1", "text": "Aiyana stood on the ferry dock, ready to cross from Sa’Fyre Island to the mainland. Adair had called at first light: the Coroner was unable to rule out murder in the drowning death of Mr. Rutledge.\n\nHer brothers and sisters had left at some point after she’d fallen asleep, and Levi did not answer his phone. Aunt Helen came to watch over her grandmother. Shaking at the prospect of facing the corpse alone, Aiyana called Caleb.\n\n“I’ll meet you at the ferry,” he said.\n\nAccording to Eva, her father may have been murdered too. Why would her aunts and uncles want to kill him?\n\nCaleb hurried to her from the gravel lot, hugging her immediately. Her thoughts turned to the transition. At sixteen it had seemed some great honor, but as her grandmother got weaker the prospect became darker, and no one would shed any light on it.\n\n“I wish we could get on that ferry, take it to the mainland, and disappear into the population,” Aiyana admitted.\n\nCaleb smiled. “Where would we go?”", "choices": [{"label": "Leave the wish where it is", "to": "ev18_3"}, {"label": "Name a place", "to": "ev18_2"}], "voices": [["“I’ll meet you at the fe", "Caleb"], ["“I wish we could get on ", "Aiyana"], ["Caleb smiled. “Where wou", "Caleb"]], "alt": {"text": "Aiyana stood on the ferry dock, ready to cross the distance between Sa’Fyre Island and the mainland with a knot working its way from her stomach to her throat. Adair had called at first light to tell her that the Coroner was unable to rule out the possibility of murder and foul play in the drowning death of Mr. Rutledge.\n\nThe blood in her veins seemed to turn ice cold at the prospect. She asked him to send the emergency ferry back for her and to meet her at the ferry on the mainland. When she got out of bed she realized that her brothers and sisters had left her alone at some point after she’d fallen asleep.\n\nShe called Levi immediately to have him join her on the way to the mainland but got no answer. She quickly showered and dressed in jeans and a T-shirt, calling Levi three more times at home and on his cell phone.\n\nShe slipped on her sneakers and called her Aunt Helen to come early to watch over her grandmother. Aunt Helen didn’t ask questions, she was at the house in ten minutes, still wearing her pajamas, and carrying an overnight bag. As Aiyana left the house she gave a look towards the portrait of Charii, steeling herself for the look of disapproval. Aiyana knew she deserved it, turning away to face the reality of Mr. Rutledge’s death.\n\nShe called Levi one last time on her walk to the ferry but he still did not answer. She thought about calling her other siblings but decided against it, not wanting them to carry the worry of a possible murder. She thought about the prospect of facing the corpse of William Rutledge alone and physically shook against it. Instead she called Caleb.\n\n“I’ll meet you at the ferry,” he said.\n\nShe watched the sunrise over the Atlantic horizon as it cast a beautiful orange hue over the peaceful island. The thought of murder on the island unsettled her. She felt a strange sense of déjà vu, but, she chalked it up to the sunrise being a daily sight on the island.\n\nShe let her thoughts turn to her father, reminding herself that according to Eva he may have been murdered too. She hadn’t allowed herself to think about it in the time she spent with Caleb. But now she tried to reason why her aunts and uncles would want to kill him. What had he done?\n\nThe sound of Caleb’s car pulling into the gravel parking lot of the ferry dock roused her from this train of thought. She stood as he got out of the car. He hurried to her, hugging her immediately, his body warmth alerting her to the fact that it was much colder on the dock than she’d realized. A layer of warmth engulfed her and she was at once strengthened by his comfort.\n\n“Are you alright?” he asked.\n\n“I don’t know,” Aiyana admitted.\n\nAiyana’s thoughts turned to the transition. When she’d first heard of it at sixteen, it seemed to be some great honor, but the more that things shifted, as her grandmother got weaker and her siblings had gotten older, the darker the prospect of the transition became. Aiyana remembered broaching the topic several months after being introduced to the idea. Her grandmother’s only response was that answers would come in time. When she asked her aunts or uncle, none of them were willing to shed any light on the subject.\n\n“I wish we could get on that ferry, take it to the mainland, and disappear into the population,” Aiyana admitted to Caleb.\n\nCaleb smiled. “Where would we go?”", "voices": [["“I’ll meet you at the fe", "Caleb"], ["“Are you alright?” he as", "Caleb"], ["“I don’t know,” Aiyana a", "Aiyana"], ["“I wish we could get on ", "Aiyana"], ["Caleb smiled. “Where wou", "Caleb"]]}}, {"id": "ev18_2", "name": "NEW DRAFT: Somewhere with no moon", "text": "“Somewhere with no moon,” Aiyana said.\n\n“Tall order. I know a basement apartment in Queens.”\n\nThen the ferry horn sounded across the water, and the wish went out of her like breath.", "choices": [{"label": "Continue", "to": "ev18_3"}], "voices": [["“Somewhere with no moon,", "Aiyana"], ["“Tall order. I know a ba", "Caleb"]], "alt": {"text": "“Somewhere with no moon,” Aiyana said.\n\n“Tall order.” He rubbed her arm against the cold. “I know a basement apartment in Queens.”\n\nShe almost laughed. Then the ferry horn sounded across the water, and the wish went out of her like breath.", "voices": [["“Somewhere with no moon,", "Aiyana"], ["“Tall order.” He rubbed ", "Caleb"]]}}, {"id": "ev18_3", "name": "Part 2", "text": "“Anywhere,” Aiyana said with a sigh.\n\nShe stood at the ferry railing beside Caleb, realizing it was the
