<!doctype html><html><head><meta name="robots" content="noindex"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>ThicketFiction Prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one app shell. A slim top bar switches between the reader-facing Store and the author-facing Studio;
   the store is a shelf of covers, the reader is a single narrow column, the studio is a two-column workbench. */
:root{
  --bg:#F2F0F7; --surface:#FFFFFF; --sunk:#E8E4F0; --line:#D5CEE2;
  --fg:#231532; --muted:#5F5270;
  --accent:#A81F5B; --on-accent:#FFFFFF;
  --teal:#0C6B66; --gold:#8A5A0B; --warn:#9A3412;
  --display:'Gloock',Georgia,serif; --read:'Literata',Georgia,serif; --ui:'Figtree',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17101F; --surface:#221830; --sunk:#1C1328; --line:#3A2C4D;
  --fg:#EFE8F6; --muted:#B3A6C4;
  --accent:#F2699F; --on-accent:#2A0A1A;
  --teal:#56CDC1; --gold:#E6B65C; --warn:#FDA172; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17101F; --surface:#221830; --sunk:#1C1328; --line:#3A2C4D;
  --fg:#EFE8F6; --muted:#B3A6C4;
  --accent:#F2699F; --on-accent:#2A0A1A;
  --teal:#56CDC1; --gold:#E6B65C; --warn:#FDA172; color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--ui)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:0 56px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.15;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:14px}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar-in{max-width:1120px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.brand{font-family:var(--display);font-size:24px;letter-spacing:.01em}
.brand i{color:var(--accent);font-style:normal}
.tabs{display:flex;gap:4px;background:var(--sunk);padding:4px;border-radius:999px}
.tab{border:0;background:none;padding:7px 16px;border-radius:999px;font-weight:600;cursor:pointer}
.tab[aria-pressed="true"]{background:var(--surface);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.spacer{flex:1}
.note{background:var(--sunk);border-bottom:1px solid var(--line);font-size:14px;color:var(--muted)}
.note div{max-width:1120px;margin:0 auto;padding:6px 16px}

.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:8px;font-weight:600;cursor:pointer}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.quiet{background:none}
.btn.sm{padding:5px 10px;font-size:14px}
.pill{display:inline-block;font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1.5px solid currentColor;white-space:nowrap}
.pill.free{color:var(--teal)} .pill.pass{color:var(--accent)} .pill.paid{color:var(--gold)} .pill.own{color:var(--teal);background:var(--sunk)}

/* store */
.lede{display:grid;grid-template-columns:1.4fr 1fr;gap:24px;align-items:center;padding-block:32px 28px}
.lede h1{font-size:clamp(32px,5vw,50px)}
.lede p{margin-top:12px;font-size:18px;color:var(--muted);max-width:52ch}
.passcard{border:1.5px solid var(--accent);border-radius:14px;padding:18px;background:var(--surface);display:grid;gap:10px}
.passcard b{font-family:var(--display);font-weight:400;font-size:26px}
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:26px 22px}
.book{display:grid;gap:10px;text-align:left;border:0;background:none;padding:0;cursor:pointer;align-content:start}
.cover{aspect-ratio:2/3;max-width:100%;border-radius:6px;padding:16px;display:flex;flex-direction:column;justify-content:space-between;color:#fff;
  background:linear-gradient(160deg,hsl(var(--h) 55% 32%),hsl(calc(var(--h) + 45) 60% 14%));box-shadow:0 6px 18px rgba(20,8,35,.28);position:relative;overflow:hidden}
.cover::before{content:"";position:absolute;inset:8px;border:1px solid rgba(255,255,255,.35);border-radius:3px}
.cover span{position:relative}
.cover .ct{font-family:var(--display);font-size:24px;line-height:1.1;overflow-wrap:anywhere}
.cover .cg{font-size:12px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.cover .ca{font-size:14px;opacity:.9}
.book:hover .cover{transform:translateY(-3px)} .cover{transition:transform .15s}
@media (prefers-reduced-motion:reduce){.cover{transition:none}}
.book h3{font-size:19px;font-family:var(--ui);font-weight:700}
.sect{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:0 0 14px}

/* story page */
.story{display:grid;grid-template-columns:240px 1fr;gap:32px;padding-block:28px}
.story>div{min-width:0}
.story h1{font-size:clamp(30px,4.5vw,44px)}
.story .blurb{font-family:var(--read);font-size:19px;line-height:1.6;margin-block:14px 18px;max-width:60ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.eps{list-style:none;margin:22px 0 0;padding:0;border-top:1px solid var(--line)}
.eps li{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.eps .n{font-family:var(--display);font-size:22px;width:34px;color:var(--muted)}
.eps .t{flex:1;min-width:150px;font-weight:600;font-size:17px}

/* reader */
.reader{max-width:680px;margin:0 auto;padding-block:22px}
.reader .crumb{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center;margin-bottom:22px}
.reader h2{font-size:32px;margin-bottom:6px}
.reader #now{scroll-margin-top:84px}
.tts{display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;margin:10px 0 20px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.tts select{width:auto;padding:5px 8px;font-size:14px}
.tts details{flex-basis:100%}.tts summary{cursor:pointer;color:var(--muted)}
.tts .vrow{display:grid;grid-template-columns:minmax(90px,130px) 1fr;gap:8px;align-items:center;margin-top:6px;font-size:14px;color:var(--fg)}
.tts .vrow select{width:100%}
.prose p.speaking{background:var(--sunk);box-shadow:-8px 0 0 var(--sunk),8px 0 0 var(--sunk);border-radius:3px}
.edrow{display:grid;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.spk summary{cursor:pointer;color:var(--muted);font-weight:600}
.spk-list{display:grid;gap:6px;margin-top:8px}
.spk-row{display:grid;grid-template-columns:1fr minmax(130px,190px);gap:10px;align-items:center;color:var(--fg);font-weight:400}
.spk-q{font-family:var(--read);font-size:16px;min-width:0}
.spk-row select{padding:5px 8px;font-size:15px}
@media (max-width:560px){.spk-row{grid-template-columns:1fr}}
.took{font-size:15px;color:var(--muted);border-left:3px solid var(--accent);padding-left:12px;margin-block:18px}
.prose p{font-family:var(--read);font-size:20px;line-height:1.7;margin-bottom:1em}
.choices{display:grid;gap:10px;margin-top:26px}
.choice{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:14px 16px;font-size:18px;font-weight:600;cursor:pointer}
.choice[disabled]{border-style:dashed;color:var(--muted);cursor:not-allowed}
.choice:not([disabled]):hover{border-color:var(--accent);color:var(--accent)}
.endcard{margin-top:30px;border-top:1px solid var(--line);padding-top:22px;display:grid;gap:12px;justify-items:start}

/* studio */
.studio{display:grid;grid-template-columns:290px 1fr;gap:26px;padding-block:24px;align-items:start}
.studio>*{min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px}
.side{display:grid;gap:16px}
label{display:grid;gap:4px;font-size:14px;font-weight:600;color:var(--muted)}
input[type=text],input[type=email],input[type=number],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;font-size:16px;color:var(--fg)}
textarea{font-family:var(--read);font-size:18px;line-height:1.55;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.eplist{display:grid;gap:6px}
.epbtn{display:flex;gap:8px;justify-content:space-between;align-items:center;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;cursor:pointer;font-weight:600}
.epbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.epbtn span:first-child{min-width:0;overflow-wrap:anywhere}
.work{display:grid;gap:16px}
.scene{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:16px;display:grid;gap:12px}
.scene-h{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.scene-h input{flex:1;min-width:140px;font-weight:700}
.tag{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--teal)}
.ch{display:grid;grid-template-columns:1fr minmax(130px,200px) auto;gap:8px;align-items:center}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px;font-size:15px}
.checks li{padding-left:22px;position:relative}
.checks li::before{content:"";position:absolute;left:2px;top:.45em;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.checks li.ok::before{background:var(--teal)}
.checks li.info::before{background:var(--muted)}

/* modal + toast */
.modal{position:fixed;inset:0;background:rgba(15,6,25,.6);display:grid;place-items:center;padding:16px;z-index:20}
.sheet{background:var(--surface);border-radius:14px;padding:22px;max-width:440px;width:100%;display:grid;gap:12px;border:1px solid var(--line)}
.sheet h2{font-size:26px}
.opt{display:flex;justify-content:space-between;gap:12px;align-items:center;width:100%;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;cursor:pointer;font-weight:600}
.opt:hover{border-color:var(--accent)}
.opt small{display:block;font-weight:400;color:var(--muted);font-size:14px}
.opt b{white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:600;z-index:30;max-width:90vw}

@media (max-width:760px){
  .lede,.story,.studio{grid-template-columns:1fr}
  .story .cover{max-width:200px}
  .ch{grid-template-columns:1fr}
  .prose p{font-size:19px}
}
.pals{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin-right:8px}
.sw{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 10px 3px 4px;font-size:13px;font-weight:600;cursor:pointer;color:var(--fg)}
.sw i{width:16px;height:16px;border-radius:50%;background:linear-gradient(90deg,var(--a) 50%,var(--b) 50%);border:1px solid var(--line)}
.sw[aria-pressed="true"]{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
</style>

  <div class="spacer"></div>

</div></header>

<script>
const PENS=['E.J. Talon','Krystal Silvers','Rasheedah Prioleau','Julia Dove'];
const KEY='turnleaf-v1';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money=n=>'$'+Number(n||0).toFixed(2);
const uid=()=>'x'+Math.random().toString(36).slice(2,9);

const EVER={"id": "ever", "title": "The Everlasting", "author": "Rasheedah Prioleau", "genre": "Paranormal · 18+", "hue": 18, "seasonPrice": 0, "blurb": "On Sa’Fyre Island, off the South Carolina coast, Aiyana is one week from the transition that will make her the next leader of the island’s Gullah people. She has started sleepwalking with her eyes burning yellow, and her four siblings are showing signs of their own. No one will tell them what the transition is.", "episodes": [{"id": "ev1", "title": "Chapter One, Part 1", "access": "free", "price": 0, "scenes": [{"id": "ev1_1", "name": "Part 1", "text": "Aiyana felt the chill of the cool night air around her. Reaching for her blanket, she found herself instead gripping cool, dry beach sand. She opened her eyes beneath a crystal clear midnight sky and blinked to cool the burning yellow glow of her fiery eyes.\n\nYet another sleepwalking episode. They had begun three months previously, when her grandmother’s health took a turn for the worse, each time bringing her closer to Sa’Fyre Island’s eastern shore; each time, her eyes burning with their golden yellow light.\n\nLaughter carried from a bonfire a few hundred yards away. Young tourists had arrived early for the first annual five-day festival, a celebration that would end with her twenty-first birthday, and her supposed succession into the matriarch status of the Gullah on the island in place of her grandmother. The elders had resisted. But after last year’s miserable summer season, Aiyana and her brother, Levi, had decided to open their property to younger people looking for a party.\n\nAmong them were young adults from the island’s Esta-owey tribe. Relations between the Gullah and the Native American tribe had been strained since the plantation days, and came to a head when her mother became involved with an Esta-owey successor. The affair had resulted in Aiyana and her siblings. With the death of her parents, the rift had widened into an uncharitable chasm among the elders.\n\nAiyana had hired Niara Isi, an Esta-owey event planner, secretly hoping to build a better relationship between their two sides of the island. The festival had also caught the eyes of developers like Mr. William Rutledge, the third.\n\n“You okay?” her sister’s nervous and shaky voice asked.\n\nAiyana turned around alarmed, but was relieved to see her sister, Vivienne or Vivi for short, sitting amongst the sea grass.\n\n“I don’t remember going to sleep.”\n\n“Because you didn’t. We were talken, and you kinda zoned out and began walken to the beach. Your eyes were burnen bright yellow.”\n\n“Did anyone see?”\n\n“No. You came through the back.” Vivi sighed. “Your sleepwalken could be somethen to do with the transition.”\n\n“Maybe.”", "choices": [{"label": "Cut through the back, out of sight", "to": "ev1_3"}, {"label": "Walk past the bonfire", "to": "ev1_2"}], "voices": [["“You okay?” her sister’s", "Vivi"], ["“I don’t remember going ", "Aiyana"], ["“Because you didn’t. We ", "Vivi"], ["“Did anyone see?”", "Aiyana"], ["“No. You came through th", "Vivi"], ["“Maybe.”", "Aiyana"]], "alt": {"text": "Aiyana felt the chill of the cool night air around her. Automatically reaching for her blanket, she found herself instead gripping cool, dry beach sand. Confused, she opened her eyes to find herself beneath a crystal clear midnight sky. The moon, large and bright white, seemed to wink and nod at her as she blinked several times to cool the burning yellow glow of her fiery eyes.\n\nListening to the crash of waves and inhaling the salty air, she allowed her eyes to travel across the sky. She tried to remember how she’d wound up on her back on the beach underneath the moon and stars.\n\nIt did not take long for her to realize that she had experienced yet another sleepwalking episode. They had begun three months previously, when her grandmother’s health took a turn for the worse. She would wake up, finding herself outdoors in the middle of the night; each time getting closer and closer to Sa’Fyre Island’s eastern shore; each time, her eyes burning with their golden yellow light.\n\nShe blinked, letting her eyes cool as she turned her head towards the sound of laughter and took note of the bonfire lit a few hundred yards from where she lay. She remembered the early arrival of young tourists to the island for the commencement of the first annual five-day festival. A celebration that would end with her twenty-first birthday, and her supposed succession into the matriarch status of the Gullah on the island in place of her grandmother.\n\nThe Gullah elders, including her aunts and uncle, had put up a resistance to holding such a long, public event. Inviting a markedly different brand of young tourists and strangers onto their side of the island was seen as a slap at tradition. But the economy on the island as a whole had dwindled in response to the US recession that had been going on for nearly five years. There was a stark lack of a regular stream of family or business oriented vacations and sabbaticals being sought on the Gullah side of the island.\n\nAfter last year’s miserable summer season, Aiyana, along with her brother, Levi, had decided that opening their property to younger people looking for a party would give them enough money to sustain the Gullah residents through the next few years. Planning had taken almost another year, with the festival starting with the end of the stifling summer heat which blended into a mixture of the island’s warm and cool fall weather sprinkled in with a few days of Indian summer.\n\nShe turned her head to the side, looking towards the bonfire and could make out the presence of young adults from the island’s Esta-owey tribe. She was certain that they were swapping island ghost stories and marijuana for expensive mainland alcohol. Aiyana smiled, even as a twinge of jealousy hit her. What it must be like to be young and free on the island, unburdened by the worry and responsibilities Aiyana juggled on a daily basis. At the same time, she noted their presence marked a possible turning point in relations with the Gullah and Esta-owey on the Island.\n\nAiyana sat up, brushing the sand from her thick wooly hair and the dark flesh of her arms and shoulders. She looked over the mostly undeveloped land that was a trademark of the Gullah property to see the bright lights of the Esta-owey casinos in the distance. Even from thirty miles away, the lights were beacons that marked the vast difference between how the Gullah and the Native American tribe had gotten on since gaming became legal on the Esta-owey property. Although they could not build casinos, Aiyana’s family ran a large and respectable scenic vacation resort that had always managed to take care of everyone.\n\nAiyana had hired Niara Isi, an Esta-owey tribe member who also worked as an event planner in the Esta-owey casinos, bringing large acts to attract tourists and visitors. Aiyana had secretly hoped it would go towards building a better relationship between their two sides of the island. Relations between them had been strained since the plantation days, and somehow came to a head when her mother had become involved with an Esta-owey successor. The affair had resulted in Aiyana and her siblings. But the rift between the Gullah and the Esta-owey had remained and, with the death of her parents, it had widened into an uncharitable chasm among the elders.\n\nThe gesture of asking Niara to plan Sa’Fyre Island’s first large-scale Gullah event was political as well as practical. Niara managed to map out a five day music festival featuring both big name talent and indie artists, sponsored by the hottest music television station, Thump TV. The sponsorship had gained the festival a viral following that would employ nearly eighty percent of the island Gullah. It had also caught the eyes of several developers who called Niara non-stop about setting up a meeting with the island’s Gullah royalty.\n\nAiyana gave Niara credit for her creative dodging of these inquiries. However, one Mr. William Rutledge, the third, had bought one of the most expensive presidential suites on the resort in exchange for a lunch meeting. It was an offer too good to refuse, that was followed by several of his investor friends doing the same.\n\nAs Aiyana sat on the beach in the dark, she wondered what route she had taken in her sleepwalking to get from her cottage behind the main resort all the way down to the beach, and how many people had seen her.\n\n“You okay?” her sister’s nervous and shaky voice asked.\n\nAiyana turned around alarmed, but was quickly relieved to see her sister, Vivienne or Vivi for short, sitting amongst the sea grass. Her wild hair and tiny frame were the only features Aiyana recognized in the moonlight.\n\n“Vivi, how long have we been on the beach?” Aiyana asked as she stood and brushed as much beach sand from her hair and clothes as possible.\n\n“’Bout twenty minutes,” Vivi said, standing as well and walking towards Aiyana.\n\n“I don’t remember going to sleep,” Aiyana mused aloud.\n\n“Because you didn’t. We were talken, and you kinda zoned out and began walken to the beach. Your eyes were burnen bright yellow.”\n\n“Oh.” Aiyana felt more alarmed at that. “Did anyone see?”\n\n“No. You came through the back.”\n\n“Wow. Thanks for followen me.”\n\n“Sure.” Vivi sighed, and Aiyana could imagine the intensely pensive and worried look that would be on her sister’s face.\n\n“What time is it?”\n\nVivi opened the cell phone she carried. The light from the screen illuminated her face for a moment as she read the time.\n\n“Nearly eleven thirty.” She closed the phone and sighed again. “Your sleepwalken could be somethen to do with the transition,” Vivi suggested.\n\n“Maybe,” Aiyana said as she met Vivi next to the willowy sea grass that swayed in the cool breeze as a gush of air whipped past them.", "voices": [["“You okay?” her sister’s", "Vivi"], ["“Vivi, how long have we ", "Aiyana"], ["“’Bout twenty minutes,” ", "Vivi"], ["“I don’t remember going ", "Aiyana"], ["“Because you didn’t. We ", "Vivi"], ["“Oh.” Aiyana felt more a", "Aiyana"], ["“No. You came through th", "Vivi"], ["“Wow. Thanks for followe", "Aiyana"], ["“Sure.” Vivi sighed, and", "Vivi"], ["“What time is it?”", "Aiyana"], ["“Nearly eleven thirty.” ", "Vivi"], ["“Maybe,” Aiyana said as ", "Aiyana"]]}}, {"id": "ev1_2", "name": "NEW DRAFT: By the bonfire", "text": "For one night Aiyana wanted to walk through her own festival like anyone else.\n\n“Let’s go by the fire.”\n\nThey had not gone fifty yards when a girl at the edge of the firelight lifted her phone. Aiyana felt her eyes begin to warm and dropped her gaze to the sand.\n\n“Told you.” Vivi tugged her back to the sea grass.", "choices": [{"label": "Continue", "to": "ev1_3"}], "voices": [["“Let’s go by the fire.”", "Aiyana"], ["“Told you.” Vivi tugged ", "Vivi"]], "alt": {"text": "The fire was close enough to hear. For one night Aiyana wanted to walk through her own festival like anyone else.\n\n“Let’s go by the fire.”\n\n“Looken like that?” Vivi asked, but she followed.\n\nThey had not gone fifty yards when a girl at the edge of the firelight turned and lifted her phone. The screen lit her face blue. Someone beside her laughed and pointed up the beach at the two figures coming out of the dark.\n\nAiyana felt her eyes begin to warm. She dropped her gaze to the sand before they could glow.\n\n“Told you.” Vivi tugged her by the wrist, back to the sea grass.", "voices": [["“Let’s go by the fire.”", "Aiyana"], ["“Looken like that?” Vivi", "Vivi"], ["“Told you.” Vivi tugged ", "Vivi"]]}}, {"id": "ev1_3", "name": "Part 2", "text": "She looked towards the bonfire, but didn’t want to encounter anyone else on her way back home. “Let’s cut through the back.”", "choices": [], "voices": [["She looked towards the b", "Aiyana"]], "alt": {"text": "She looked towards the bonfire, but didn’t want to encounter anyone else on her way back home. “Let’s cut through the back.”", "voices": [["She looked towards the b", "Aiyana"]]}}]}, {"id": "ev2", "title": "Chapter One, Part 2", "access": "free", "price": 0, "scenes": [{"id": "ev2_1", "name": "Part 1", "text": "They cut behind the resort, nearly every light on, to Aiyana’s cottage, tucked away just behind the back gardens.\n\nAiyana was the only one of her mother’s five children to come live with her grandmother on the resort grounds when she turned thirteen, to learn to take things over. Her grandmother never showed much affection towards any of the children, who had been split up as babies after their mother’s death and left with two aunts and an uncle.\n\nInside, all remained quiet. She turned, catching a glimpse of the portrait that hung just next to the door, a painting of their ancestor Charii, an African Princess who came to America as a slave and rose up to own half of Sa’Fyre Island. Although the artist had captured a light in her eye, there was no smile. The painting gave a perpetual feeling that Charii was always watching and always judging.", "choices": [{"label": "Turn away from the painting", "to": "ev2_3"}, {"label": "Hold Charii’s gaze", "to": "ev2_2"}], "alt": {"text": "As they cut behind the resort’s backyard landscape, in the tall overgrown grass that slapped their legs as they walked, Aiyana looked up to see that nearly every light in the resort was on. She took a moment to smile with pride at that. The resort was made up of six villa style hotels surrounding two fourteen-story towers, all painted bright white and glowing against the dark night sky. The light from the outdoor pool, which closed after ten o’clock, fell into the unkempt foliage and helped light their way back to the cottage. The backyard was empty, she imagined that the bulk of early arrivers had decided to head over to the Esta-owey casinos on the night before the festival. She wondered if the chief would send a thank you for the extra business.\n\nVivi and Aiyana made their way around the resort’s campus back to Aiyana’s cottage which was a mid-sized, three-bedroom house, tucked away just behind the resort’s back gardens. They emerged from the overgrowth behind the house onto the well manicured lawn. They walked past a small bed of fall flowers including knockout roses and snapdragons that had just been planted on either side of the house.\n\nAiyana was the only one of her mother’s five children to come live with her grandmother on the resort grounds when she turned thirteen, in order to learn the skills necessary to take things over. It was a strange arrangement. Her grandmother never showed much grandmotherly love or affection towards Aiyana or any of the other children, who had been split up after their mother’s death as babies, and left to live among the Gullah residents with two aunts and an uncle.\n\nShe walked into the house, which was mostly furnished with small but heavy antiques that had been passed down from generation to generation, hand crafted by one of their ancestors long ago. Entering the foyer that led directly into a rectangular living room in the front of the house. A hallway to the left led to the bedrooms, while the dining room and kitchen were paired together just to the right.\n\nShe tilted her head, pausing for a moment to listen for evidence that her grandmother was alert and wondering where she was. But all remained quiet. She turned, catching a glimpse of the portrait that hung on the wall just next to the door. The portrait was a painting of their ancestor Charii, an African Princess who came to America as a slave and rose up to own half of Sa’Fyre Island. Her hair was braided back and her petite frame was clothed in corsets and cream colored silk. Although the artist had captured a light in her eye, there was no smile. The painting gave a perpetual feeling that Charii was always watching and always judging.", "voices": []}, "voices": []}, {"id": "ev2_2", "name": "NEW DRAFT: Charii’s portrait", "text": "Aiyana did not look away this time.\n\n“I’m doing the best I can,” she said under her breath.\n\nThe longer Aiyana looked, the less it felt like judgment and the more it felt like waiting. A chill moved over her arms.\n\n“Who you talken to?” Vivi whispered behind her.\n\n“Nobody.”", "choices": [{"label": "Continue", "to": "ev2_3"}], "voices": [["“I’m doing the best I ca", "Aiyana"], ["“Who you talken to?” Viv", "Vivi"], ["“Nobody.”", "Aiyana"]], "alt": {"text": "Aiyana did not look away this time. She stood in the doorway with sand still in her hair and let the painted eyes take her in.\n\n“I’m doing the best I can,” she said under her breath.\n\nThe light in Charii’s eye did not change. But the longer Aiyana looked, the less it felt like judgment and the more it felt like waiting. A chill that had nothing to do with the night air moved over her arms.\n\n“Who you talken to?” Vivi whispered behind her.\n\n“Nobody.”", "voices": [["“I’m doing the best I ca", "Aiyana"], ["“Who you talken to?” Viv", "Vivi"], ["“Nobody.”", "Aiyana"]]}}, {"id": "ev2_3", "name": "Part 2", "text": "She closed the door, turning from the painting, and led Vivi down the hallway, tiptoeing past their grandmother’s bedroom door. When her grandmother had first turned ill, two years prior, she’d insisted on Aiyana taking over the master room.\n\nVivi closed the door behind them and bounced onto the bed. As the youngest of the five children, Vivi was the furthest removed from the burden of being the next leader.\n\n“What were we talken ‘bout… before?” Aiyana asked her younger sister.\n\n“’Bout the burnout potheads that just got in.” Vivi reminded her. “I understand be’en all natural and one with the earth, but that is no excuse for poor hygiene. Sho’ly!”\n\nAiyana laughed as her sister slipped into their childhood Gullah tongue.\n\nThe worst of the drawbacks had been the necessity of hiring mainland police for the week, a special task force assembled by the South Carolina Law Enforcement Division, or SLED. Its Chief, Douglas Adair, had insisted on being the lead officer in charge. The Gullah police chief, Thomas Sharp, had taken exception to being trumped by Adair and put in for vacation leave.\n\nAdair was close to twice her age, with sharp brown eyes. He’d remarked on her youth at their first meeting, but it had not prevented him from calling her ma’am or Ms. Gamelle, and deferring to her right to make the final call on his security measures.", "choices": [], "voices": [["“What were we talken ‘bo", "Aiyana"], ["“’Bout the burnout pothe", "Vivi"]], "alt": {"text": "She closed the door, turning from the painting, and led Vivi through the living room to the left, both stepping lightly into the hallway and tiptoeing as they passed their grandmother’s bedroom door. Aiyana paused again to listen for signs of life left in the sleeping old woman. When she heard the familiar sigh of her grandmother’s restless sleep she felt a wave of relief. Vivi nudged her along until they reached Aiyana’s master bedroom at the end of the hallway. When her grandmother had first turned ill, two years prior, she’d insisted on Aiyana taking over the master room, as it was too big for her to maintain.\n\nBy the time her grandmother became confined to the bed in the guest room, Aiyana had modernized the antique feel of her room with new paint, furniture, satellite television, and Wi-Fi Internet, which made stepping into the room seem like stepping through time in comparison to the rest of the house.\n\nAiyana flipped on her bedside lamp as Vivi closed the door behind them and bounced onto the bed. Aiyana admired the way Vivi’s wild hair flopped around with her every carefree movement. She let her usual feelings of loneliness and sacrifice that came along with the work and worry of being the next leader wash over her and then recede, much like an ocean tide.\n\nAs the youngest of the five children, Vivi was the furthest removed from the burden of it all. But she was more than happy to lend an empathetic ear to Aiyana’s troubles when she needed it.\n\n“What were we talken ‘bout… before?” Aiyana asked her younger sister.\n\n“’Bout the burnout potheads that just got in.” Vivi reminded her. “I understand be’en all natural and one with the earth, but that is no excuse for poor hygiene. Sho’ly!”\n\nAiyana laughed as her sister slipped into their childhood Gullah tongue. The eclectic groups of young visitors for the festival had encouraged an array of responses from local residents. The elders of course being the most opposed to the entire lot of them.\n\n“I think we can survive some B.O., Vivi.” Aiyana reasoned.\n\n“You may wanna delouse their rooms though. I think they are sleeping like ten to a room.”\n\n“They’re renten out five rooms at five hundred a night.”\n\nVivi shrugged, her large golden eyes sparkling along with the dimpled smile of her full lips set against her cinnamon skin. Not needing to know or understand the value of a dollar, these figures were lost on Vivi. But, according to Aiyana’s calculations, the twelve hundred rooms, two hundred suites, and four penthouses would bring in close to twenty four million dollars over the course of the week in room rentals alone. Add to that the food, souvenirs, clothing and beach necessities, the spa services, local tours, and scheduled events, and the week’s revenue for the island would be well worth the drawbacks of the few less than desirable visitors and attendees.\n\nIn Aiyana’s opinion, the worst of the drawbacks had been the necessity of hiring mainland police services for the week. With the island being just off of the coast of South Carolina, the police invasion had included a special task force assembled by the South Carolina Law Enforcement Division, or SLED. The current Chief, Douglas Adair, had insisted on being the lead officer in charge of the task force that included thirty other officers in addition to the island’s twenty-five officers; he had also set up a plan for the week alternating on four twelve hour shifts patrolling their side of the island, enforcing the law, and being present during events.\n\nThe Gullah police chief, Thomas Sharp, had taken exception to being trumped by Adair and put in for vacation leave during the week’s festival. Aiyana had given serious thought to firing him. However, she thought the collateral damage to morale resulting from a move like that would do too much harm. Their property was vast, and had never been open to policing by outsiders. Gullah police always handled crimes committed on their side of the island. Other than petty thefts, limited drug use, and public drunkenness, they’d had very little crime. Sharp, with his twenty years of experience and the intense pride he took in his job, was a major part of that.\n\nAiyana thought on her first meeting with Adair nearly nine months prior to the festival. He was close to twice her age and size, and nearly a head taller than she was, with black hair tinted on the edges by gray, sun weathered tan skin, and sharp brown eyes. He’d remarked on her age at that first meeting, but Aiyana was glad that his observation of her youth had not prevented him from treating her like an adult, calling her ma’am or Ms. Gamelle, and deferring to her right to make the final call on his security measures.", "voices": [["“What were we talken ‘bo", "Aiyana"], ["“’Bout the burnout pothe", "Vivi"], ["“I think we can survive ", "Aiyana"], ["“You may wanna delouse t", "Vivi"], ["“They’re renten out five", "Aiyana"]]}}]}, {"id": "ev3", "title": "Chapter One, Part 3", "access": "free", "price": 0, "scenes": [{"id": "ev3_1", "name": "Part 1", "text": "Vivi’s cell phone chimed. She checked it and looked to Aiyana apologetically.\n\n“I sent a message to the others when you went to the beach.”\n\n“No. I told you I sometimes do that.”\n\n“They’re here. Don’t wanna knock and risk waken her.”\n\nThe strangest of the folklore surrounded their mother, Imala. She was said to have been in labor for nearly an entire week, with Aiyana the first born of quintuplets, each born on five different days. This is how she was said to have perished. Their father, an Esta-owey successor, was shunned and cast out when he claimed to be Imala’s lover, and the father of her children. After her death, he disappeared.\n\nAs a child, hoping to learn more, Aiyana had sneaked into an Esta-owey boardroom with her school friend Caleb Ware and hidden under the table. When she heard her family’s name she gasped. A young watchman named Sakima, with piercing green eyes and a biting grip, dragged her into the open. Sakima never spared more than a passing dismissive glance in her direction until he’d been voted the next Chief.\n\n“Okay, grab the bottle of brandy from the fridge.” Aiyana told Vivi. “Whose house we headed to?”\n\n“Levi’s of course. We should talk about the transition. You ain’t the only one with signs.”\n\nShe walked outside to find her brother, Levi, leaning against the house next to the door.\n\n“Sleepwalken, Aiyana?” Levi’s baritone voice rumbled even though it was low. His yellow eyes glowed, as did the outline of his midnight black skin.\n\nShe gave her big little brother a hug. Vivi hurried with the brandy to Levi’s SUV, where their brother, Lucas, and sister, Eva, dubbed the twins, waited in the back seat.\n\n“You coulda told me,” Levi’s rumble turned into a low-key growl as he walked her to the SUV.", "choices": [{"label": "Say as little as you can", "to": "ev3_3"}, {"label": "Tell him how long it has been", "to": "ev3_2"}], "voices": [["“I sent a message to the", "Vivi"], ["“No. I told you I someti", "Aiyana"], ["“They’re here. Don’t wan", "Vivi"], ["“Okay, grab the bottle o", "Aiyana"], ["“Levi’s of course. We sh", "Vivi"], ["“Sleepwalken, Aiyana?” L", "Levi"], ["“You coulda told me,” Le", "Levi"]], "alt": {"text": "Vivi’s cell phone chimed, pulling Aiyana back to the present. She checked the phone and looked to Aiyana apologetically.\n\n“What?”\n\n“I sent a message to the others when you went to the beach.”\n\n“No.” Aiyana felt betrayed and embarrassed. “I told you I sometimes do that.”\n\n“Come on, Aiyana. I didn’t know how long you’d be passed out on the beach. With the visitors here it’s a problem.” Vivi defended herself.\n\n“They comen?”\n\n“They’re here. Don’t wanna knock and risk waken her.”\n\nAiyana nodded and exhaled. She thought it was a little sad that her siblings were so distant from their grandmother. Then again, she realized that had been her grandmother’s fault. When Aiyana had moved into the house, her grandmother had been little more than a myth to her, a phantom with many stories surrounding her and her nearly sixty years of leadership.\n\nHowever, the strangest of the folklore surrounded that of her mother, Imala. She was said to have been in labor for nearly an entire week, with Aiyana being the first born of quintuplets, each born on five different days. Of course, this is how she was said to have perished.\n\nThe only true mystery Aiyana cared to solve was that of who their father had been and how he had died. No one seemed interested in filling her in on the truth, leaving her with only the most obscure rumors or clues. Her father had been an Esta-owey successor. He was shunned and cast out when he claimed to be Imala’s lover, and the father of her children. After her mother’s death, he disappeared.\n\nAs a child, Aiyana had spied on an Esta-owey meeting with her friend Caleb Ware, hoping to get more insight to the story of her parents. She had met Caleb in the island’s public school, located within the three-mile midpoint between the Gullah and Esta-owey sides of the island. It was within this plot of real estate that the Gullah and the Esta-owey shared public services, such as the island schools, municipal administration, urgent medical care center, water treatment, electricity, wireless and Internet services, trash collection and burning, etc.\n\nAiyana had come to the Esta-owey casino with her Aunt Fey and run into Caleb. Aunt Fey had left her to play with Caleb and they’d managed to sneak into a boardroom. When people entered, they’d hidden under the table. When Aiyana heard her family’s name she gasped in shock. A young watchman named Sakima had then caught sight of them and pulled them from under the table. His piercing green eyes had matched the biting grip he placed on Aiyana when he’d caught her, dragging her into the open with Caleb trying but failing to pry her away.\n\nLarge, well groomed men in sharp suits and shiny shoes surrounded them. The old chief at the time had put Caleb through a battery of questions in their native language before they were allowed to go. Caleb told her later that the chief wanted to be sure they hadn’t heard anything damaging and she’d been let go when he was satisfied that no secrets had gotten out.\n\nSoon after, she was sent to live with her grandmother. There was one thing she understood about their unique island community—that with Gullah and Esta-owey alike, general gossip could run amuck, but if there was an understanding of secrecy, especially among the elders, they were extremely loyal to it. She saw Sakima from time to time over the years, when the Esta-owey and her grandmother had a reason to meet. But he never spared more than a passing dismissive glance in her direction until he’d been voted the next Chief. Aiyana pushed the memories away as she prepared herself to see her other brothers and sisters.\n\n“Okay, grab the bottle of brandy from the fridge.” Aiyana told Vivi. “Whose house we headed to?”\n\n“Levi’s of course. We should talk about the transition. You ain’t the only one with signs.”\n\nIt worried her a little bit that it was already after midnight. She was due to meet the vendors and musicians at six o’clock in the morning. She turned to take in her rumpled appearance, but she shrugged her vanity aside, picking up her cell phone and pocketbook. She pointed Vivi to the door.\n\nThey made their way back up the hallway. She paused once again to listen for her grandmother’s sleep induced sigh and then went to the front door as Vivi popped into the kitchen for the liqueur. She passed the painted portrait of Charii, not looking in her direction but still nodding to acknowledge her justified disapproval at how Aiyana was handling things as she walked outside to find her brother, Levi, leaning against the house next to the door.\n\n“Sleepwalken, Aiyana?” Levi’s baritone voice rumbled even though it was low. His yellow eyes glowed, as did the outline of his midnight black skin.\n\nShe turned to give her big little brother a hug. At six foot one, he was tall enough for her to rest her head on his chest and listen to his heartbeat, strong and thunderous, as she hugged him. She listened to it calm down to a smooth pace as he hugged her back.\n\nVivi exited the house juggling a bottle of strawberry brandy and five shot glasses. She hurried to Levi’s SUV, where their brother, Lucas, and sister, Eva, dubbed the twins because they were very similar in size, with lean figures and feisty, bored temperaments, waited in the back seat. Music spilled out of the car as Eva opened the back door for Vivi and was silenced again as she shut the door behind herself.\n\n“You coulda told me,” Levi’s rumble turned into a low-key growl as he walked her to the SUV.", "voices": [["“What?”", "Aiyana"], ["“I sent a message to the", "Vivi"], ["“No.” Aiyana felt betray", "Aiyana"], ["“Come on, Aiyana. I didn", "Vivi"], ["“They comen?”", "Aiyana"], ["“They’re here. Don’t wan", "Vivi"], ["“Okay, grab the bottle o", "Aiyana"], ["“Levi’s of course. We sh", "Vivi"], ["“Sleepwalken, Aiyana?” L", "Levi"], ["“You coulda told me,” Le", "Levi"]]}}, {"id": "ev3_2", "name": "NEW DRAFT: Telling Levi", "text": "“It’s been three months,” Aiyana admitted. “Every time, I wake up closer to the water.”\n\nLevi stopped walking.\n\n“Three months.” He let out a slow breath. “And you been out there alone.”", "choices": [{"label": "Continue", "to": "ev3_3"}], "voices": [["“It’s been three months,", "Aiyana"], ["“Three months.” He let o", "Levi"]], "alt": {"text": "“It’s been three months,” Aiyana admitted. “Every time, I wake up closer to the water.”\n\nLevi stopped walking. For a moment the only sound was the music thumping behind the SUV’s closed doors.\n\n“Three months.” He let out a slow breath. “And you been out there alone.”", "voices": [["“It’s been three months,", "Aiyana"], ["“Three months.” He let o", "Levi"]]}}, {"id": "ev3_3", "name": "Part 2", "text": "“I didn’t want anyone to worry,” Aiyana said. “I thought it’d just go away.”\n\nAiyana took the front passenger seat and accepted a shot glass held out by Vivi.\n\n“How’s grandmother?” Levi asked as he backed out of the driveway.\n\n“She’s sleepen. I guess she’s comfortable. But—”\n\n“I don’t know how you live in that house with her, dyen like that.” Eva cut in.\n\n“Well, one day it’ll be me in that house, dy’en alone.” Aiyana predicted.\n\n“Never!” Vivi exclaimed.\n\nAiyana exchanged looks with Levi, who turned back to the road silently. As far as they knew, all of Sa’Fyre Island’s Gullah rulers had lived and died alone. It was tradition.", "choices": [], "voices": [["“I didn’t want anyone to", "Aiyana"], ["“How’s grandmother?” Lev", "Levi"], ["“She’s sleepen. I guess ", "Aiyana"], ["“I don’t know how you li", "Eva"], ["“Well, one day it’ll be ", "Aiyana"], ["“Never!” Vivi exclaimed.", "Vivi"]], "alt": {"text": "“I didn’t want anyone to worry,” Aiyana said. “I thought it’d just go away.”\n\nLevi shook his head, opening the driver side door to the smooth beat of his music and the scent of strawberry brandy. Aiyana took the front passenger seat and accepted a shot glass held out by Vivi. She threw it back before closing her door and putting on her seat belt.\n\n“You a’right, sistuh?” Lucas asked. He and Vivi were the only ones that slipped into Gullah when they were all together. It was a way of speaking that most people on the island outgrew after going through school, studying a state mandated curriculum and taking federally mandated tests.\n\n“I s’pose so, brudduh,” Aiyana answered, relaxing into the Gullah tongue as well.\n\n“You think it has to do with the transition?” Eva jumped on the obvious.\n\n“I dun’t kno,” Aiyana answered honestly.\n\n“How’s grandmother?” Levi asked as he put the SUV in reverse and backed out of the driveway.\n\n“I honestly don’t know.” Aiyana said. She knew how much he and Eva hated speaking and hearing Gullah. It was an attitude they’d developed from their Uncle Max who’d spent the better part of his life, as he put it, between Los Angeles, New York, and Chicago. “She’s sleepen. I guess she’s comfortable. But—”\n\n“I don’t know how you live in that house with her, dyen like that.” Eva cut in, letting the chilliness of her feelings toward their grandmother show.\n\n“Well, one day it’ll be me in that house, dy’en alone.” Aiyana predicted.\n\n“Never!” Vivi exclaimed.\n\nAiyana exchanged looks with Levi who turned back to the road silently. They both knew that even if it were a hundred years away, it was the truth. As far as they knew, all of Sa’Fyre Island’s Gullah rulers had lived and died alone. It was tradition.", "voices": [["“I didn’t want anyone to", "Aiyana"], ["“You a’right, sistuh?” L", "Lucas"], ["“I s’pose so, brudduh,” ", "Aiyana"], ["“You think it has to do ", "Eva"], ["“I dun’t kno,” Aiyana an", "Aiyana"], ["“How’s grandmother?” Lev", "Levi"], ["“I honestly don’t know.”", "Aiyana"], ["“I don’t know how you li", "Eva"], ["“Well, one day it’ll be ", "Aiyana"], ["“Never!” Vivi exclaimed.", "Vivi"]]}}]}, {"id": "ev4", "title": "Chapter Two, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev4_1", "name": "Part 1", "text": "Levi’s house was located near the waterfall cove on the southern side of the island. Levi drove on the road alongside the beach, and Aiyana kept her eyes on the lighthouse in the distance. She’d only gone there a few times as a teenager with her friend, Caleb. Caleb had lost his parents to a strange fever and felt like a complete outsider in the tribe, more so once Sakima became chief.\n\nThey’d finished off half of the bottle of brandy by the time Levi got home.\n\nThe siblings rarely just hung out, even as children. Her brothers had been raised by their philandering Uncle Max, Eva and Vivi by their religiously zealous Aunt Helen. Aiyana had been raised alone by their Aunt Fey until the day she’d been sent to live on the resort with her grandmother.\n\nHer grandmother, aunts and uncle seemed reluctantly bound to each other. They would meet on a monthly basis, talking in hushed and usually angry whispers. Then they would go to a separate meeting place that Aiyana was never invited to. She assumed she would learn more after the transition.\n\nAiyana got out of the car and spotted the walking path that led to Levi’s private beach. She lifted her head to look into the sky. Levi’s security lights challenged her view of the stars, but the large white moon broke through to let Aiyana know it had followed her there.", "choices": [{"label": "Go inside with the others", "to": "ev4_3"}, {"label": "Stay a moment under the moon", "to": "ev4_2"}], "voices": [], "alt": {"text": "Levi’s house was located near the waterfall cove on the southern side of the island. As opposed to taking the shortcut through the Gullah neighborhoods, Levi drove on the road alongside the beach. It was too dark to see the ocean from the car, so Aiyana kept her eyes on the lighthouse in the distance. She’d only gone there a few times as a teenager with her friend, Caleb, when they’d had the guts to sneak away from home in the middle of the night.\n\nCaleb had lost his parents as a teenager to a strange fever. He often talked about feeling like a complete outsider in the tribe because of it, but, she assumed it was made worse due to his friendship with her. The isolation from his tribe became unbearable when the elder chief died and Sakima became chief.\n\nShe received the bottle of brandy from Vivi, who had given up pouring shot glasses in the moving car, as she tried to remember the first time he’d taken her to the lighthouse at sixteen and they’d failed to go through with making love. It brought a nostalgic smile to her face as she passed the brandy back to the others. They maintained a pleasant silence in the car, listening to the radio and sipping brandy. They’d managed to finish off half of the bottle in the fifteen minutes it took Levi to get home.\n\n“When da las’ time we jus hung out?” Vivi asked, slurring her words a little as she took a swig of the brandy and opened her door.\n\n“Been a while. Aiyana’s been plannen da festival.” Lucas commented.\n\nAiyana agreed. The festival had consumed most of her time. But they rarely just hung out as siblings, even as children. Her brothers had been paired together as babies and raised by their philandering Uncle Max. Eva and Vivi had been paired together and raised by their religiously zealous Aunt Helen. Aiyana had been raised alone by their Aunt Fey, who made it a point to keep Aiyana as seen but not heard as possible. Making sure she was squeaky clean and trouble free until the day she’d been sent to live on the resort with her grandmother.\n\nIt didn’t take long for the children to understand that the relationship between their grandmother, aunts and uncle was strained to say the least. The children were only allowed together as children when they were in school. But, as they were not raised as siblings they did not feel a need to gravitate towards each other in that way until they reached puberty and realized they had the same questions and feelings about who they were.\n\nWhen Aiyana moved into training with her grandmother, she witnessed a strained loyalty between her grandmother, aunts and uncle. They seemed reluctantly bound to each other. They would meet on a monthly basis, talking in hushed and usually angry whispers. Then they would go to a separate meeting place that Aiyana was never invited to.\n\nWhen her grandmother returned from these meetings she never spoke about where they went or why. She hardly ever mentioned her aunts and uncle unless she had to. Aiyana equated their relationship to a sort of bondage to the traditions of ruling the island. She assumed she would learn more after the transition.\n\nLevi’s house was large but still managed to be modest. It was secluded on one of the highest points of the island with only one way in or out by road. He still kept an electric fence around the property to deter anyone with ideas of petty theft and had a motion sensitive security system on the inside of the house in case the fence didn’t work. He paid their police department extra to come out and patrol the area three times throughout the night.\n\nAs they neared his house, Levi opened the fence remotely with the touch of a button on the SUV dashboard. The front yard lit up with security lights that highlighted the two-story house influenced by Frank Lloyd Wright’s indoor-outdoor style. When Levi had it built, he planned a separate wing upstairs for each of his siblings as well as a central area for parties and gatherings. As Aiyana and the others were already inebriated, she was certain that no one would make it to their room that night.\n\nHe had a swimming pool placed in the backyard in hopes of their having a small army of children one day to make use of it.\n\nAiyana got out of the car and spotted the partial walking path that led nearly three hundred yards from the house to what equated to Levi’s private beach. She took a moment to listen to the crashing of the waves and then lifted her head to look into the sky. Levi’s security lights challenged her view of the stars, but the large white moon broke through to let Aiyana know it had followed her there.", "voices": [["“When da las’ time we ju", "Vivi"], ["“Been a while. Aiyana’s ", "Lucas"]]}}, {"id": "ev4_2", "name": "NEW DRAFT: Under the moon", "text": "Aiyana let the others go ahead. She had taken three steps toward the beach path before she noticed she was walking.\n\nHer eyes prickled with heat. The moon hung where it had hung over the resort.\n\n“Aiyana.” Levi’s voice came from the doorway, quiet and careful. “House is this way.”", "choices": [{"label": "Continue", "to": "ev4_3"}], "voices": [["“Aiyana.” Levi’s voice c", "Levi"]], "alt": {"text": "Aiyana let the others go ahead. The path to the beach ran pale through the grass, and beyond it the water kept up its slow breathing.\n\nShe had taken three steps toward it before she noticed she was walking.\n\nHer eyes prickled with heat. The moon hung where it had hung over the resort, as if the island had turned beneath it to keep her in view.\n\n“Aiyana.” Levi’s voice came from the doorway, quiet and careful. “House is this way.”", "voices": [["“Aiyana.” Levi’s voice c", "Levi"]]}}, {"id": "ev4_3", "name": "Part 2", "text": "She quickly turned and walked into the house, where Levi opened a jar of marijuana cigarettes.\n\n“Sleepwalken.” Levi’s voice reminded Aiyana why she was there.\n\n“How long?”\n\n“About three months.”\n\n“Vivi said you all experiencen some strange things. What’s going on?”\n\n“I think I’m having visions,” Eva volunteered first.\n\n“I think in the past I see our grandmother with our aunts and uncle. She is much younger but the Aunts and Uncle Max look the same. They are in a dark place lit up by firelight. I see strangers with them, three men and two women. Sometimes there is blood everywhere.”\n\n“And the future?”\n\n“I see us. We’re older but it’s us.”\n\n“All of us?”\n\n“Sometimes,” she answered quietly.\n\n“I write and speak words I dun understand.”\n\n“Nothing. I’m the only one without a sign. But, Vivi, tell her what’s going on with you.”\n\nVivi inhaled a puff of her joint and held it out. As she released it, the joint floated in the air. She exhaled a line of smoke and it surrounded the joint in a strange circular dance.", "choices": [], "voices": [["“Sleepwalken.” Levi’s vo", "Levi"], ["“How long?”", "Eva"], ["“About three months.”", "Aiyana"], ["“Vivi said you all exper", "Aiyana"], ["“I think I’m having visi", "Eva"], ["“I think in the past I s", "Eva"], ["“And the future?”", "Aiyana"], ["“I see us. We’re older b", "Eva"], ["“All of us?”", "Aiyana"], ["“Sometimes,” she answere", "Eva"], ["“I write and speak words", "Lucas"], ["“Nothing. I’m the only o", "Levi"]], "alt": {"text": "She quickly turned and walked into the house. They all made a beeline for the central living room area and found their favorite spots on the sectional sofa in front of the large screen television. Levi turned to Thump Television, the festival’s headlining sponsor, and opened a jar filled with marijuana cigarettes. He took one and offered the jar to Lucas, who also took one and passed it to Vivi.\n\nVivi took one for herself and tucked into the far right corner of the sectional sofa next to Aiyana on the right side chaise. Aiyana declined the jar before Vivi offered it back to Levi. Levi knew better than to offer the jar to Eva who stretched out on the sofa with her feet ending where Vivi’s hips sat. Lucas sat on the floor close to Eva and lit up his joint. Levi lit his own before lighting Vivi’s as well.\n\nAiyana lay on her left side and let the alcohol from the brandy take effect, relaxing her to a state of calm she had not felt in nearly nine months. She closed her eyes as slow jams from Thump Television filled the room in surround sound.\n\n“Sleepwalken.” Levi’s voice reminded Aiyana why she was there.\n\nShe opened her eyes to see that Lucas was stretched out on the floor with one arm behind his head as the other brought his joint to his lips.\n\n“How long?” Eva’s voice was uncharacteristically soft and worried.\n\n“About three months,” Aiyana answered. “I thought it was stress but, the festival planned is over. I had three episodes this week.”\n\n“Mus be da transition.” Lucas offered.\n\n“Why it got ta be soooo damn dramatic?” Vivi said with more venom than necessary. Everyone turned to give her their full attention. “Our whole lives we be in one long fucked transition.”\n\n“Vivi said you all experiencen some strange things.” Aiyana remembered. “What’s going on?”\n\n“I think I’m having visions,” Eva volunteered first. “I don’t know what they are or what they mean. But, I fall asleep and I don’t think I’m dreaming. I think I’m visiting either the past or the future, or both.”\n\n“What’d you see?” Aiyana asked.\n\n“I think in the past I see our grandmother with our aunts and uncle. She is much younger but the Aunts and Uncle Max look the same. They are in a dark place lit up by firelight. I see strangers with them, three men and two women. Sometimes there is blood everywhere.”\n\nAiyana shook her head in confusion. “And the future?”\n\n“I see us. We’re older but it’s us.”\n\n“All of us?” Aiyana asked.\n\n“Sometimes,” she answered quietly.\n\n“What ‘bout you, Lucas?” Aiyana asked.\n\n“I write and speak words I dun understand. I cun read’em, but I dun know da language or what dey mean. I try to search online but nothen turn up.”\n\nAiyana looked to Levi. “And you?”\n\n“Nothing.” He answered with a shrug. “I’m the only one without a sign. But, Vivi, tell her what’s going on with you.”\n\nAiyana and the others looked at Vivi, who inhaled a puff of her joint before extending her hand to hold it out. As she released it, the joint floated in the air. She exhaled a line of smoke and it surrounded the joint in a strange circular dance. Vivi retrieved the joint and the smoke wafted away.", "voices": [["“Sleepwalken.” Levi’s vo", "Levi"], ["“How long?” Eva’s voice ", "Eva"], ["“About three months,” Ai", "Aiyana"], ["“Mus be da transition.” ", "Lucas"], ["“Why it got ta be soooo ", "Vivi"], ["“Vivi said you all exper", "Aiyana"], ["“I think I’m having visi", "Eva"], ["“What’d you see?” Aiyana", "Aiyana"], ["“I think in the past I s", "Eva"], ["Aiyana shook her head in", "Aiyana"], ["“I see us. We’re older b", "Eva"], ["“All of us?” Aiyana aske", "Aiyana"], ["“Sometimes,” she answere", "Eva"], ["“What ‘bout you, Lucas?”", "Aiyana"], ["“I write and speak words", "Lucas"], ["Aiyana looked to Levi. “", "Aiyana"], ["“Nothing.” He answered w", "Levi"]]}}]}, {"id": "ev5", "title": "Chapter Two, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev5_1", "name": "Part 1", "text": "“How long this been go’en on?”\n\n“Three months.”\n\n“They’ll be meeten again sometime this month.”\n\n“We should follow ‘em.”\n\n“Not all of us. Me and Lucas should go.”\n\n“No, Vivi and I are the smallest and less likely to be seen followen them.”", "choices": [{"label": "Keep everyone together", "to": "ev5_3"}, {"label": "Offer to go alone", "to": "ev5_2"}], "voices": [["“How long this been go’e", "Aiyana"], ["“Three months.”", "Vivi"], ["“They’ll be meeten again", "Lucas"], ["“We should follow ‘em.”", "Vivi"], ["“Not all of us. Me and L", "Levi"], ["“No, Vivi and I are the ", "Eva"]], "alt": {"text": "“How long this been go’en on?” Aiyana was sure she already knew the answer.\n\n“Three months.” Vivi provided.\n\n“I wanna know more ‘bout this transition,” Levi grumbled. “I hate just waiten for it to happen to us.”\n\n“I know what you mean,” Lucas said shaking his head. “I dun wanna be blindsided by what’s gonna happen next. D’you see how miserable dey all are? I don’t wan us to be like dem.”\n\n“There’s only a week left,” Eva reminded them.\n\n“They’ll be meeten again sometime this month.”\n\n“We should follow ‘em.” Vivi said, picking up on Aiyana’s train of thought.\n\n“Not all of us.” Levi said. “Me and Lucas should go.”\n\n“No, Vivi and I are the smallest and less likely to be seen followen them.” Eva countered.", "voices": [["“How long this been go’e", "Aiyana"], ["“Three months.” Vivi pro", "Vivi"], ["“I wanna know more ‘bout", "Levi"], ["“I know what you mean,” ", "Lucas"], ["“There’s only a week lef", "Eva"], ["“They’ll be meeten again", "Lucas"], ["“We should follow ‘em.” ", "Vivi"], ["“Not all of us.” Levi sa", "Levi"], ["“No, Vivi and I are the ", "Eva"]]}}, {"id": "ev5_2", "name": "NEW DRAFT: Going alone", "text": "“I should go alone. They meet at my house.”\n\n“No.” Levi did not raise his voice.\n\n“You already walken round at night by yourself. That’s enough alone.”\n\nEva and Lucas started in again, each louder than the other.", "choices": [{"label": "Continue", "to": "ev5_3"}], "voices": [["“I should go alone. They", "Aiyana"], ["“No.” Levi did not raise", "Levi"], ["“You already walken roun", "Vivi"]], "alt": {"text": "“I should go alone,” Aiyana said. “They meet at my house. I can follow without anybody wonderen why I’m there.”\n\n“No.” Levi did not raise his voice. He did not need to.\n\n“You already walken round at night by yourself,” Vivi said. “That’s enough alone.”\n\nEva and Lucas started in again, each louder than the other.", "voices": [["“I should go alone,” Aiy", "Aiyana"], ["“No.” Levi did not raise", "Levi"], ["“You already walken roun", "Vivi"]]}}, {"id": "ev5_3", "name": "Part 2", "text": "“Why can’t we all go?”\n\n“Good idea. If we don’t like what we learn we refuse the transition.”\n\n“I don’t think that’s an option. It’ll happen.”\n\nAiyana closed her eyes and slept. The sounds of Eva crying in her own sleep woke her close to dawn.\n\nEva sat up, and her eyes, fiery yellow, locked onto Aiyana.\n\n“They killed him,” she said.\n\n“Who?”\n\n“Our father.”\n\n“Who killed him?”\n\n“Aunt Helen, Uncle Max, and Aunt Fey.”\n\n“Why?”\n\n“He was… one…” Her eyes cooled and she began to cry.\n\n“What the hell are we?” The early morning sky was a blue haze, and Aiyana had to get home to meet Niara and Adair for set up.\n\n“I’ll drive you home.”", "choices": [{"label": "Go with Aiyana", "to": "ev5_5"}, {"label": "Follow Eva: stay at the house", "to": "ev5_4"}], "voices": [["“Why can’t we all go?”", "Aiyana"], ["“Good idea. If we don’t ", "Lucas"], ["“I don’t think that’s an", "Vivi"], ["“They killed him,” she s", "Eva"], ["“Who?”", "Aiyana"], ["“Our father.”", "Eva"], ["“Who killed him?”", "Levi"], ["“Aunt Helen, Uncle Max, ", "Eva"], ["“Why?”", "Aiyana"], ["“He was… one…” Her eyes ", "Eva"], ["“What the hell are we?” ", "Aiyana"], ["“I’ll drive you home.”", "Levi"]], "alt": {"text": "“Why can’t we all go?” Aiyana stepped in.\n\n“Good idea,” Lucas said. “If we don’t like what we learn we refuse the transition.”\n\n“I don’t think that’s an option,” Vivi said, exhaling. “It’ll happen.”\n\n“Right.” Aiyana decided to lie back down and closed her eyes once again, yawning. “We shoulda done this a long time ago.”\n\nThose were her last words as the pull of the alcohol on her brain and the smooth rhythm of the music on the television sent her into a dreamless sleep. The sounds of Eva crying in her own sleep woke Aiyana up close to dawn.\n\n“No…” Eva murmured. “Don’t do it! Help him! Help him, please!”\n\nLucas woke up stretched out on the floor near the sofa just under Eva. He reached a calm hand up and shook her arm until she woke up.\n\nEva sat up with a start. Her eyes, fiery yellow, locked onto Aiyana.\n\n“They killed him,” She said.\n\n“Who?” Aiyana asked.\n\n“Our father.” She breathed as her eyes cooled and returned to normal. Aiyana turned to see Vivi curled up in a ball with her head on her knees.\n\n“Who killed him?” Levi asked.\n\n“Aunt Helen, Uncle Max, and Aunt Fey.”\n\n“Why?” Aiyana inquired as the thudding heart in her chest echoed in her ears.\n\n“He was… one…” Eva said but as her eyes cooled she shook her head as if confused.\n\n“He was one what?” Lucas probed.\n\n“I don’t know.” Eva said and began to cry. “It was awful.”\n\nAiyana had never witnessed Eva the least bit upset by anything. She had certainly never seen her cry before. Vivi put an arm around Eva as Aiyana, Lucas and Levi sat around absorbing the limited information Eva had supplied.\n\n“What the hell are we?” Aiyana asked aloud. She looked towards a window and noted the blue haze of the early morning sky. “I have to get home and get cleaned up to meet Niara and Adair at the cul-de-sac on Main Street for vendor and stage set up.”\n\n“I’ll drive you home,” Levi offered.", "voices": [["“Why can’t we all go?” A", "Aiyana"], ["“Good idea,” Lucas said.", "Lucas"], ["“I don’t think that’s an", "Vivi"], ["“Right.” Aiyana decided ", "Aiyana"], ["“No…” Eva murmured. “Don", "Eva"], ["“They killed him,” She s", "Eva"], ["“Who?” Aiyana asked.", "Aiyana"], ["“Our father.” She breath", "Eva"], ["“Who killed him?” Levi a", "Levi"], ["“Aunt Helen, Uncle Max, ", "Eva"], ["“Why?” Aiyana inquired a", "Aiyana"], ["“He was… one…” Eva said ", "Eva"], ["“He was one what?” Lucas", "Lucas"], ["“I don’t know.” Eva said", "Eva"], ["“What the hell are we?” ", "Aiyana"], ["“I’ll drive you home,” L", "Levi"]]}}, {"id": "ev5_4", "name": "NEW DRAFT: Eva at dawn (sibling episode)", "text": "The door closed behind Aiyana and Levi. Eva hated that they had seen.\n\nShe closed her eyes and tried to walk back into it. Firelight. Uncle Max with his back to her. A man she almost knew.\n\nHe was one—\n\n“It’s gone. I had it and it’s gone.”\n\nLucas was writing on the back of a festival flyer, not watching his own hand.\n\n“What does it say?”\n\n“I dun know.” He kept writing.\n\nShe had seen the five of them in the other dreams, the ones that came from further ahead. Older. Standing together.\n\nSometimes.\n\nShe did not tell them which ones were missing.", "choices": [{"label": "Return to Aiyana", "to": "ev5_5"}], "voices": [["“It’s gone. I had it and", "Eva"], ["“What does it say?”", "Eva"], ["“I dun know.” He kept wr", "Lucas"]], "alt": {"text": "The door closed behind Aiyana and Levi, and the house was too quiet.\n\nEva wiped her face with the heel of her hand. She hated that they had seen. She hated more that she could not stop.\n\n“You wan’ some water?” Lucas asked.\n\n“I want you to quit looking at me like that.”\n\nHe looked at the floor instead. Vivi stayed where she was, one arm still around Eva’s shoulders, small and warm and saying nothing. For once Eva did not shrug her off.\n\nShe closed her eyes and tried to walk back into it. Firelight. A dark place. Uncle Max with his back to her. A man she almost knew.\n\nHe was one—\n\nIt was there, the rest of it, the way a word sits on the tongue. Then it thinned out like the smoke from one of Levi’s joints and she was left holding nothing.\n\n“It’s gone,” she said. “I had it and it’s gone.”\n\n“Maybe that’s a mercy,” Vivi said.\n\n“Don’t you start sounding like Aunt Helen.”\n\nVivi almost smiled. She lifted two fingers, and an empty shot glass on the table rose an inch, turned once in the air, and set itself down closer to Eva’s hand. “Den drink somethen.”\n\nLucas had found a pen. He was writing on the back of a festival flyer, quick and slanted, not watching his own hand. Eva leaned over to see. The marks meant nothing to her. They did not look like they meant anything to him either.\n\n“What does it say?”\n\n“I dun know.” He kept writing.\n\nOutside, Levi’s SUV turned over and pulled away down the hill. Eva listened until she could not hear it anymore.\n\nShe had seen the five of them in the other dreams, the ones that came from further ahead. Older. Standing together.\n\nSometimes.\n\nShe did not tell them which ones were missing.", "voices": [["“You wan’ some water?” L", "Lucas"], ["“I want you to quit look", "Eva"], ["“It’s gone,” she said. “", "Eva"], ["“Maybe that’s a mercy,” ", "Vivi"], ["“Don’t you start soundin", "Eva"], ["Vivi almost smiled. She ", "Vivi"], ["“What does it say?”", "Eva"], ["“I dun know.” He kept wr", "Lucas"]]}}, {"id": "ev5_5", "name": "Part 3", "text": "Aiyana stepped from Levi’s house into the early morning air.\n\n“Do you think we can stop the transition?”\n\n“We can sure as hell try. We’ve been messed up for long enough.”\n\n“If Eva is right, they killed our father. What if they kill us too?”\n\n“We won’t be slaves to whatever this is. Even if we can’t stop the transition, we can make sure it doesn’t do to us what it did to them.”\n\nHer cell phone rang. It was Niara. Aiyana sniffed back her tears and answered in her most official voice.\n\n“Good morning, Niara. Everything still set? We’re going to meet at six by the cul-de-sac?”\n\n“Yes, ma’am!”\n\nAiyana envied the residents and the tourists, who had little to do besides enjoy the festival.\n\nThey all would have that week. The same week that would call an end to life as Aiyana knew it.", "choices": [], "voices": [["“Do you think we can sto", "Aiyana"], ["“We can sure as hell try", "Levi"], ["“If Eva is right, they k", "Aiyana"], ["“We won’t be slaves to w", "Levi"], ["“Good morning, Niara. Ev", "Aiyana"], ["“Yes, ma’am!”", "Niara"]], "alt": {"text": "When Aiyana stepped from Levi’s house into the early morning air she took in a deep breath. Levi unlocked the SUV and they both climbed inside of it.\n\n“Do you think we can stop the transition?” She asked him.\n\n“We can sure as hell try,” he said. “We’ve been messed up for long enough.”\n\n“If Eva is right, they killed our father. What if they kill us too?”\n\n“We’ll figure this out. We won’t be slaves to whatever this is. Even if we can’t stop the transition, we can make sure it doesn’t do to us what it did to them.”\n\n“How can you be sure? We don’t even know what really happened to them.” Aiyana felt tears of frustration prick her eyes.\n\nShe looked at the clock on the dash and saw that she only had forty-five minutes to get home, dressed and meet Adair and Niara in time for set-up. Her cell phone rang. She looked to see that it was Niara. She cleared her throat and sniffed back her tears before answering in her most official voice possible.\n\n“Good morning, Niara. Everything still set? We’re going to meet at six by the cul-de-sac?”\n\n“Yes, ma’am!” She answered with her chipper can-do attitude, as if she’d been up for hours already. “The morning’s event at the cul-de-sac is good to go. The vendors will set up from six to eight, the MC and Thump TV will set up the stage at the same time and the opening ceremony will commence at nine o’clock sharp. I just wanted to give you a call to see if you wanted me to bring a coffee for you.”\n\n“Yes.” Aiyana was grateful for the timeliness of her call as well as the forethought that she may need coffee. “Please, get me a large caramel mocha from Ruby’s.”\n\n“You got it,” she said before hanging up.\n\nAiyana let a strange feeling wash over her and then fade away. She looked out of her window and watched the ocean waves in the distance. Once again, she envied the residents of the island who had little to do that day besides enjoy the festival. She envied the tourists who would come onto the island for the first time and discover all of the beauty and nature the island had to offer.\n\nThe crowd would be young and carefree. They would party to live music during the day, and mellow out by the bonfire at night. They would eat every variety of island food, from fresh fruit to the catch of the day. Some would surf the waves, others would tan in the sun, and many would kindle or rekindle romances that may or may not last once they get back home.\n\nBut, they all would have that week. The same week that would call an end to life as Aiyana knew it. While she and her siblings worked behind the scenes to ensure the near future of the island, and worried about what they would lose in the final days of the transition, the residents and visitors would have more fun than she was sure she would ever experience.", "voices": [["“Do you think we can sto", "Aiyana"], ["“We can sure as hell try", "Levi"], ["“If Eva is right, they k", "Aiyana"], ["“We’ll figure this out. ", "Levi"], ["“How can you be sure? We", "Aiyana"], ["“Good morning, Niara. Ev", "Aiyana"], ["“Yes, ma’am!” She answer", "Niara"], ["“Yes.” Aiyana was gratef", "Aiyana"], ["“You got it,” she said b", "Niara"]]}}]}, {"id": "ev6", "title": "Chapter Three, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev6_1", "name": "Part 1", "text": "When she arrived at home, her Aunt Helen was waiting for her. “Everythen alright?” Aunt Helen pinched her crucifix.\n\n“Yeah, we all went to Levi’s for the evenen.” Aiyana said wondering about Aunt Helen’s part in her father’s death.\n\n“It’s almost over.”\n\n“I suppose,” Aunt Helen said, stealing a quick glance to Charii’s portrait before she turned to open her Bible.", "choices": [{"label": "Let it go and get ready", "to": "ev6_3"}, {"label": "Ask her about your father", "to": "ev6_2"}], "voices": [["When she arrived at home", "Aunt Helen"], ["“Yeah, we all went to Le", "Aiyana"], ["“It’s almost over.”", "Aiyana"], ["“I suppose,” Aunt Helen ", "Aunt Helen"]], "alt": {"text": "When she arrived at home, her Aunt Helen was sitting in the living room waiting for her. Aunt Helen was of average height, but a little too thin, which made her eyes seem slightly wider than normal. Her smooth, dark skin remained timeless. If it had not been for the generous amount of gray in her hair, there would have been nothing to point to her true age. “Everythen alright?” Aunt Helen pinched the crucifix hanging around her neck. Her face was pensive and she pursed her lips allowing the dimple in her chin to come through.\n\n“Yeah, we all went to Levi’s for the evenen.” Aiyana said wondering about Aunt Helen’s part in her father’s death. “You check on grandma?”\n\n“Yes, she ate a bit.” Aunt Helen let out a sigh.\n\n“It’s almost over.” Aiyana broached the topic of the transition hoping for a little information.\n\n“I suppose,” Aunt Helen said, stealing a quick glance to Charii’s portrait before she turned to open her Bible.", "voices": [["When she arrived at home", "Aunt Helen"], ["“Yeah, we all went to Le", "Aiyana"], ["“Yes, she ate a bit.” Au", "Aunt Helen"], ["“It’s almost over.” Aiya", "Aiyana"], ["“I suppose,” Aunt Helen ", "Aunt Helen"]]}}, {"id": "ev6_2", "name": "NEW DRAFT: Asking Aunt Helen", "text": "“Aunt Helen. What was my father like?”\n\nAunt Helen’s fingers found her crucifix and stayed there.\n\n“I didn’t know him well,” she said to the Bible. “Go on, now. You gonna be late.”\n\nIt was the same not-answer Aiyana had been given her whole life, and this morning she could hear the fear in it.", "choices": [{"label": "Continue", "to": "ev6_3"}], "voices": [["“Aunt Helen. What was my", "Aiyana"], ["“I didn’t know him well,", "Aunt Helen"]], "alt": {"text": "“Aunt Helen.” Aiyana kept her voice light. “What was my father like?”\n\nThe pages stopped turning. Aunt Helen’s fingers found her crucifix and stayed there.\n\n“I didn’t know him well,” she said to the Bible. “Go on, now. You gonna be late.”\n\nIt was not an answer. It was the same not-answer Aiyana had been given her whole life, and this morning she could hear the fear in it.", "voices": [["“Aunt Helen.” Aiyana kep", "Aiyana"], ["“I didn’t know him well,", "Aunt Helen"]]}}, {"id": "ev6_3", "name": "Part 2", "text": "“I’m gonna get ready. Thanks for stayen with her.”\n\n“You’re welcome.” Aunt Helen didn’t look up from the book.\n\nAiyana stepped into the shower, hoping that in some way, like a baptism, the hot water would cleanse her. In the mirror her bright yellow eyes focused on the one tooth that turned slightly inward.\n\nShe gave Aunt Helen a quick kiss and winked at the portrait of her ancestor Charii. She met Niara and Adair with five minutes to spare at the end of the Main Street cul-de-sac, and paused to take pictures with a few people that believed in her royal lineage.\n\nThe first Gullah Resort ferry came to the island at nine o’clock sharp, filled to the brim.\n\n“You did it, Ms. Gamelle. Your event is off and running without a hitch.”\n\nNiara handed Aiyana a clipboard with the week’s schedule and a walkie-talkie. “So far, the crowd seems tame, but we’ll see how things progress in the evening.”\n\nChief Adair used Niara’s exit to speak confidentially to Aiyana.\n\n“I’ve instructed the boys to ignore petty marijuana and drug use this week.”\n\nAiyana smiled. “Good idea. Otherwise we’d be arresten half of the island.”\n\n“Well, you should try to enjoy some of this festival, Ms. Gamelle.”\n\n“I’ll try,” she promised, and he turned to walk away.", "choices": [], "voices": [["“I’m gonna get ready. Th", "Aiyana"], ["“You’re welcome.” Aunt H", "Aunt Helen"], ["“You did it, Ms. Gamelle", "Niara"], ["Niara handed Aiyana a cl", "Niara"], ["“I’ve instructed the boy", "Adair"], ["Aiyana smiled. “Good ide", "Aiyana"], ["“Well, you should try to", "Adair"], ["“I’ll try,” she promised", "Aiyana"]], "alt": {"text": "“I’m gonna get ready. Thanks for stayen with her.”\n\n“You’re welcome.” Aunt Helen didn’t look up from the book.\n\nAiyana stepped into the shower and let the hot water singe away any remnants of last night’s weed smoke, alcohol and beach sand. She washed with her favorite coconut and vanilla body cleanser and shampoo. She let the conditioner rest in her hair for ten minutes as she scrubbed with a sugar and sand concoction that her Aunt Fey swore by to stay young and fresh.\n\nShe rinsed off and felt the heat of the water absorb into her skin. She inhaled the moist heat into her lungs holding the warmth inside, hoping that in some way, like a baptism, it would cleanse her. She exhaled the warmth and stepped from the shower, wrapping herself in her bathrobe and tying a towel around her head.\n\nWiping off the mirror over the sink, she began brushing her teeth. In the process, her bright yellow eyes focused on her front left tooth that turned slightly inward, the only flaw in an otherwise perfect set of pearly white teeth. She rinsed twice with mouthwash and unwrapped her hair. She sprayed a generous amount of mousse in her hands and worked it through her hair, allowing her wooly curl pattern to set and organically crown her head. Having decided to wear her royal purple sundress and matching sandals, she highlighted her rich mahogany skin with purple eye shadow, touching her lips wi
