et herself drift to sleep.\n\nOn the morning of the funeral Caleb drove her to the cemetery. Nearly the entire island had shown up; the demon only allowed them to see what she wanted them to see.\n\nHer legs went weak as her eyes rested on Levi’s face and she endured a memory flash of Vivi’s skeletal monster stabbing him through the chest.\n\nAcross the front row Lucas, Eva, and Vivi huddled together, refusing to look at her. Vivi had lost a good bit of her body weight, her eyes sunken in, her lips cracked dry.\n\n“She needs a hospital,” Aiyana demanded.\n\nEva stood to block her way. “She does not want to talk to you,” she grumbled. “And neither do we. Go sit with them.”\n\nAiyana knew they would be back within a week to bury Vivi too.\n\n“Call an ambulance,” Aiyana ordered, making her eyes glow fiery yellow. Eva stepped back and Lucas stood to defend her.\n\n“Get the hell out of here,” he said in a voice that Aiyana did not recognize. “We don’t want you here. Go away.”\n\nShe sat down next to Uncle Max and nodded to the minister to continue.\n\nAiyana wished it were she in Levi’s place. When the coffins were lowered into the ground she bowed her head. As she fell asleep that night, she wondered if there was a God, why he had so utterly forsaken them.", "choices": [], "voices": [["“Do you know… what actua", "Aiyana"], ["“I do know,” he whispere", "Caleb"], ["“Why aren’t you afraid?”", "Aiyana"], ["“Because I love you. I w", "Caleb"], ["“She needs a hospital,” ", "Aiyana"], ["Eva stood to block her w", "Eva"], ["“Call an ambulance,” Aiy", "Aiyana"], ["“Get the hell out of her", "Lucas"]], "alt": {"text": "“Do you know… what actually happened, Caleb?” She asked him.\n\n“I do know,” he whispered. “Sakima… explained it to me when I confronted him about being at the hospital. He says I can’t remember, because I wasn’t chosen to. I don’t care. I don’t believe in being chosen. I choose to be here, right now with you. And unlike Sakima, it’s not a burden to me. I wish I could remember. I am not afraid. I will be right here by your side because that is where I belong.”\n\n“Why aren’t you afraid? Why don’t you run? Why don’t you get away from me and off of this cursed island!”\n\nShe watched a tear form in his eye. “Because I love you. I will not leave this island without you.”\n\nShe turned away remembering what had happened in the lighthouse, afraid it could happen again. He lay in the bed next to her anyway and pulled her into his arms.\n\n“I love you,” he repeated. “I love you, Aiyana.”\n\nAiyana didn’t speak. She didn’t move. She remembered his terrified face when the demon had dragged him across the resort and thrown him into the chair at the cottage. But, she also remembered that he’d tried to get her and help while she was on the stage. She remembered looking at those terrible handprints on his body and the way he’d held her hand to him, unflinching afterwards.\n\nHis arms were peaceful and soothing. She believed him, that he loved her. She didn’t want to break the magic spell that his words formed around them. She didn’t want to think about the island, or the curse, or her family or the demon. She didn’t want to think about the day it would end with everyone leaving her alone. The day she became a true slave to the curse.\n\nShe let herself drift to sleep in his arms. She welcomed the quiet. She welcomed the void as she floated in the chasm between bliss and reality.\n\nHer Aunts and Uncle called her the morning of the funeral to ask if she needed help getting there. Caleb had offered to give her a ride there and back, so she was relieved that she didn’t have to go alone, or with the family that she didn’t trust.\n\nHe wore a simple black suit and she put on a plain black dress that covered her from shoulder to ankle. She added a hat, gloves, and large sunglasses to hide her face.\n\n“Thank you,” she said to Caleb with genuine gratitude as he drove to the cemetery.\n\nShe was surprised to see that the funeral gathering was very large. It seemed as if nearly the entire island had shown up to say goodbye to her brother and grandmother. It confused Aiyana until she remembered that they didn’t know what really happened. It made sense why they stayed loyal to her family and the island if the demon only allowed them to see what she wanted them to see.\n\nAiyana took a step from the car and allowed Caleb to escort her through the crowd. As she walked through the gathering she took note of the two caskets lining the front. She felt her legs begin to go weak as her eyes rested on Levi’s face and she endured a memory flash of Vivi’s skeletal monster stabbing him through the chest.\n\nShe turned her head away, trying to shake the memory clear. As she did she saw a healthy representation of Esta-owey. She looked for Sakima but he wasn’t there. Caleb helped her continue to the front where a seat waited for her next to her Uncle Max.\n\nAiyana looked across the front row to where her siblings Lucas, Eva, and Vivi seemed to huddle together refusing to look in her direction. The rejection stung until she allowed herself to look closer at Vivi who seemed to have lost a good bit of her body weight since the last time she’d seen her. Her eyes were sunken in with a pinkish grey ring around them. It was obvious that she had a hard time keeping them open. Her lips were cracked dry. Her hands shook as she wrung them in her lap.\n\n“Vivi?” Aiyana whispered.\n\nVivi shut her eyes tight and turned away from Aiyana.\n\n“She needs a hospital,” Aiyana demanded as Lucas and Eva turned their eyes on her.\n\n“What the hell can they do for her!” Eva demanded.\n\nAiyana took a step towards them and Eva stood to block her way.\n\n“Get out of my way.”\n\n“She does not want to talk to you,” Eva grumbled. “And neither do we. Go sit with them.”\n\nEva pointed a stern finger towards the Aunts and Uncle Max.\n\nAiyana knew that they were there to put Levi and her grandmother to rest, but one look at Vivi and she knew that they would be back in less than a week to put her with them.\n\n“Call an ambulance,” Aiyana ordered, making her eyes glow fiery yellow. It was not truly meant to frighten Eva, but that is exactly what it did, even though they had flared eyes at each other more than a few times since childhood. She took several steps back and Lucas stood to defend her.\n\n“Get the hell out of here,” he said in a voice that Aiyana did not recognize.\n\nThe crowd gasped at the burst of family anger.\n\n“We don’t want you here. We don’t need you here. Go away.” Lucas was extremely serious.\n\nHis words were like a punch in the gut. Sadness and anger surged through Aiyana, but she knew there was nothing she could do to change the way they felt about her right now.\n\nShe took a seat next to her uncle and Caleb took the seat directly behind her. She looked to the minister and nodded that he could continue with the funeral.\n\nShe heard the murmurs and whispers behind them, but ignored them. Every so often a tear trickled down her cheek as the minister spoke words of praise and comfort. Aiyana wished it were she in Levi’s place. Of all of them, he had been the strongest. If he were here instead of her, he would have certainly been able to defeat this demon.\n\nWhen the coffins were closed and lowered into the ground, Aiyana bowed her head for the final prayer, and then allowed Caleb to take her back to the hotel. As she fell asleep that night, she wondered if there was a God, why he had so utterly forsaken them.", "voices": [["“Do you know… what actua", "Aiyana"], ["“I do know,” he whispere", "Caleb"], ["“Why aren’t you afraid? ", "Aiyana"], ["She watched a tear form ", "Caleb"], ["“I love you,” he repeate", "Caleb"], ["“Thank you,” she said to", "Aiyana"], ["“Vivi?” Aiyana whispered", "Aiyana"], ["“She needs a hospital,” ", "Aiyana"], ["“What the hell can they ", "Eva"], ["“Get out of my way.”", "Aiyana"], ["“She does not want to ta", "Eva"], ["“Call an ambulance,” Aiy", "Aiyana"], ["“Get the hell out of her", "Lucas"], ["“We don’t want you here.", "Lucas"]]}}]}, {"id": "ev38", "title": "Chapter Fourteen, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev38_1", "name": "Part 1", "text": "With the horror of the festival several days behind her and Levi and her grandmother laid to rest, Aiyana had little time to get her brother and sisters back on her side before the demon returned. But, first she needed to talk with Chief Sakima about the demon and her mother’s plan to stop it.\n\nShe took Levi’s car to the Esta-owey property. Niara, a familiar and friendly face, led her through Sakima’s large, plain house to the patio. He did not scowl at her.\n\nHe raised an eyebrow at her hesitance. “I will not hurt you.”\n\n“At least not yet,” she answered.\n\nFor the first time since he’d caught her and Caleb spying on their secret meeting as a child, he smiled at her.\n\n“I feel very honored that you accepted our gesture to dress your grandmother.”\n\n“I got an earful of a story from my Aunts and Uncle. Then I got a personal show from this demon.”\n\n“Tell me first what they told you and I will correct as necessary. Would you like a drink? I have bottled water in case you are worried about… contaminants.”", "choices": [{"label": "Accept the water", "to": "ev38_3"}, {"label": "Question it", "to": "ev38_2"}], "voices": [["He raised an eyebrow at ", "Sakima"], ["“At least not yet,” she ", "Aiyana"], ["“I feel very honored tha", "Sakima"], ["“I got an earful of a st", "Aiyana"], ["“Tell me first what they", "Sakima"]], "alt": {"text": "With the horror of the festival several days behind her and Levi and her grandmother laid to rest, Aiyana knew she had little time to get her brother and sisters back on her side before the demon returned. But, first she needed to talk with Chief Sakima to see what he knew about the demon and her mother’s plan to stop it. Caleb had objected to her going alone, but she knew that was the way it had to be.\n\nShe appropriated Levi’s car, which had been left at the cottage since the day of the attack. She took several moments to sit in the driver’s side seat trying to feel his presence. When that failed, she adjusted the seat to fit her smaller frame and pointed the car in the direction of the Esta-owey property. As she drove onto their property she remembered riding through the Esta-owey streets on the parade float. How happy she had been, how hopeful.\n\nDuring the daylight she could see that many of the homes were large, modern, and beautiful. They had not sectioned their land into neighborhoods, but kept the development ranch style, allowing the families to raise animals and farm crops.\n\nSakima’s house was large, but plain. Several guards came out of the house, dressed in the usual expensive suits, minus the coats and ties. Their sleeves were rolled up and collars opened. Aiyana wondered why they didn’t just wear jeans and t-shirts like normal people.\n\n“Are they going to frisk me?” She muttered to herself, looking at their serious expressions.\n\nBut, they merely waited by the door until she was out of the car and walking towards the house. Niara came to the door and she was happy to see a familiar and friendly face.\n\n“Hey,” Niara said with a smile. “Come on in. He’s waiting on the patio. I’ll take you there,” she said before turning to lead the way.\n\nNiara led her through a series of hallways until they reached the rear of the house. When they stepped out onto the patio her eyes instantly locked on his and she noted that he did not scowl at her. Nor did his expression darken. To her surprise he was dressed down in slacks and polo shirt with soft leather shoes. He gestured to a patio table with fresh cut fruit and drinks. Aiyana wondered if she should sit and be civil or simply ask him to tell everything he knew.\n\nHe raised an eyebrow at her hesitance. “I will not hurt you.”\n\n“At least not yet,” she answered.\n\nFor the first time since he’d caught her and Caleb spying on their secret meeting as a child, he smiled at her.\n\n“I’m not going to hurt you,” he repeated. “I feel very honored that you accepted our gesture to dress your grandmother. And I am so sorry about your brother and your sister. We know the pain of losing people to this curse. I am pleased that you have asked for this meeting. It means more to me than you can know.”\n\n“Why is that?” Aiyana asked.\n\n“Please, have a seat.” He gestured again and pulled out a chair for her.\n\nShe took the seat, crossing her legs and folding her hands into her lap. “I got an earful of a story from my Aunts and Uncle. Then I got a personal show from this demon. I’m sure you’ve known about all of this for some time. I’m just finding out.”\n\nSakima nodded as if he understood.\n\n“I’m sure you got their version of the story,” he muttered. “I think I know why they withheld the information from you and your siblings until it was almost too late.”\n\n“So, what is your version of the story? Why do you think they didn’t tell us?”\n\n“Tell me first what they told you and I will correct as necessary. Would you like a drink? I have bottled water in case you are worried about… contaminants.”", "voices": [["“Are they going to frisk", "Aiyana"], ["“Hey,” Niara said with a", "Niara"], ["He raised an eyebrow at ", "Sakima"], ["“At least not yet,” she ", "Aiyana"], ["“I’m not going to hurt y", "Sakima"], ["“Why is that?” Aiyana as", "Aiyana"], ["“Please, have a seat.” H", "Sakima"], ["She took the seat, cross", "Aiyana"], ["“I’m sure you got their ", "Sakima"], ["“So, what is your versio", "Aiyana"], ["“Tell me first what they", "Sakima"]]}}, {"id": "ev38_2", "name": "NEW DRAFT: A sealed bottle", "text": "“From you?” Aiyana said. “I’d be a fool.”\n\n“A sealed bottle you can check yourself.” He did not seem offended, and that unsettled her more than a scowl would have.", "choices": [{"label": "Continue", "to": "ev38_3"}], "voices": [["“From you?” Aiyana said.", "Aiyana"], ["“A sealed bottle you can", "Sakima"]], "alt": {"text": "“From you?” Aiyana said. “I’d be a fool.”\n\n“You would be a fool to take an open glass,” he agreed. “A sealed bottle you can check yourself.”\n\nHe waited. He did not seem offended, and that unsettled her more than a scowl would have.", "voices": [["“From you?” Aiyana said.", "Aiyana"], ["“You would be a fool to ", "Sakima"]]}}, {"id": "ev38_3", "name": "Part 2", "text": "“Yes, thank you.”\n\n“Please, tell me what you know.”\n\nSince he was not scowling at her, she could see that he was handsome. She relayed as much of the story as she understood.\n\n“I honestly do not know.” Sakima admitted when she came to the end. “I suspect we both know that each side only tells a story so they look like the good guys in the end.”", "choices": [], "voices": [["“Yes, thank you.”", "Aiyana"], ["“Please, tell me what yo", "Sakima"], ["“I honestly do not know.", "Sakima"]], "alt": {"text": "“Yes, thank you.” Aiyana said. He smiled and retrieved a bottle from an ice bucket. “I am impressed you were prepared for that.”\n\n“There is over a hundred years of animosity between us. Mistrust is only to be expected. Please, tell me what you know.”\n\nAiyana was surprised by his calm manners. She took a sip of water and looked at him as if for the first time. Since he was not scowling at her, she could see that he was handsome, and she wondered what he thought of her.\n\nShe took a swig of water before taking in a deep breath. She tried to relay as much of the story as she understood to Sakima. He listened, politely nodding to what he agreed with and squinting at the parts he seemed skeptical of.\n\n“So, how much of it is right?” Aiyana asked when she came to the end of what she knew.\n\nSakima continued to look confused. “I honestly do not know.” Sakima admitted and opened a bottle of water for himself. “Like you, I only know what I have been told, but I suspect we both know that each side only tells a story so they look like the good guys in the end. We weren’t there,  to get to know who she was and eventually he fell in love with her. He kept it a secret. Our Chief at the time died not knowing that she’d become pregnant with his son’s child.\n\n“When her pregnancy became known, he asked the elders what to do in order to protect the child from the demon and all we could think to do was have Charii move to this side of the island, which is protected. When he asked her to marry him and move here, she refused. She dismissed talk of a demon, thinking she was strong enough to resist it.\n\n“When she refused to move, he begged the elders for another solution. They sent a handmaid to serve her and try to protect the baby. One day he went to visit with her but something happened. Somehow the demon was able to possess the handmaiden. She killed our chief, killed Charii. Somehow the baby survived, and I believe one of Charii’s children killed the handmaiden.\n\n“However, when the child reached adult age she became possessed by the demon, our people became monsters and Charii’s children became their immortal masters. Everyone on Sa’Fyre Island has been forced to reckon with this for more than one hundred years.”\n\n“The story doesn’t get out because witnesses are either killed, or they don’t remember what they really saw,” Aiyana pieced together. “You said my mother had a plan. What was it?”\n\n“When the demon took possession of Charii’s child, it also took control of the ancient shamans’ bloodlines that bound the evil spirit in the first place. There were four of them. We believe the four young people she curses when she returns are directly descended from those shamans. We also believe that a fresh merger of all the bloodlines with Charii’s would work.”\n\n“Why do you think that would work?”\n\n“We believe that if all of these bloodlines ran in one vessel, that vessel would contain and control the same power that bound the demon and would be able to defeat the demon once again, if they knew how to access that power.”\n\n“But how could we …” Vivi’s eyes looked far off and sad. “It was a nice funeral. Levi looked good. I can’t wait to see him again.”\n\nA fresh wave of tears hit Aiyana.\n\n“It was me,” Vivi stated. “With Mr. Rutledge, the handprints. I know he was old and married. But once we started, we couldn’t stop. Then I killed all of those people.”", "voices": [["“Who is there?” Lucas as", "Lucas"], ["“It’s me, Aiyana.”", "Aiyana"], ["“Go away!” Eva shouted.", "Eva"], ["“What the hell!” Aiyana ", "Aiyana"], ["“Get out!” Lucas yelled ", "Lucas"], ["“No!” Aiyana lifted her ", "Aiyana"], ["“What are you doing?” Ev", "Eva"], ["“I’m calling an ambulanc", "Aiyana"], ["“No!” Vivi began to cry.", "Vivi"], ["“This is what she wants!", "Lucas"], ["“Stay back!” She lifted ", "Aiyana"], ["“I’m so sorry, Vivi.” Ai", "Aiyana"], ["Vivi took in several dee", "Vivi"], ["Aiyana nodded as tears s", "Aiyana"], ["“Nine-one-one, what is y", "Dispatcher"], ["She described the situat", "Aiyana"], ["“Wait,” Vivi said, halti", "Vivi"], ["“It was me,” Vivi stated", "Vivi"]]}}, {"id": "ev40_4", "name": "NEW DRAFT: Her hand", "text": "Aiyana could not find a word big enough. She took Vivi’s hand and held it against her own chest, where her heart was going like a fist on a door.", "choices": [{"label": "Continue", "to": "ev40_5"}], "alt": {"text": "Aiyana could not find a single word that was big enough. She took Vivi’s hand, all bone now, and held it against her own chest, where her heart was going like a fist on a door.", "voices": []}, "voices": []}, {"id": "ev40_5", "name": "Part 3", "text": "“That wasn’t you, that was the curse.”\n\nVivi’s eyes rolled into the back of her head. Aiyana forced herself to lift her once more. She emerged from the woods to find the paramedics rushing toward her and fell to her knees. Her heart sank to see her sister’s eyes closed.\n\nEva and Lucas emerged from the woods as the paramedics tried to bring her back. Finally, one turned his eyes to his watch.\n\n“Time of death…” he began. Eva’s scream took away the rest.\n\nThey had Vivi cremated and rowed her ashes out to the ocean. The Aunts and Uncle Max were not permitted to come.\n\n“She didn’t want to be in a box,” Eva said when the canister was empty.\n\nOn the beach, Aiyana grabbed Eva’s hand as if it were a lifesaver and began to cry.\n\n“You and Lucas need to get off of this island. The curse needs me. It won’t kill me. I’ll work with Sakima to figure out a way to break it.”\n\n“Either leave or die.”\n\nA few days later Aiyana saw Eva and Lucas to the ferry with Caleb. He promised to stay with them in New York, and to be back long before the blood moon.\n\n“When I get back, we’ll kick this demon’s ass to kingdom come.”\n\n“Yes,” Aiyana said, with more confidence than she felt. “We will.”", "choices": [], "voices": [["“That wasn’t you, that w", "Aiyana"], ["“Time of death…” he bega", "Paramedic"], ["“She didn’t want to be i", "Eva"], ["“You and Lucas need to g", "Aiyana"], ["“Either leave or die.”", "Eva"], ["“When I get back, we’ll ", "Caleb"], ["“Yes,” Aiyana said, with", "Aiyana"]], "alt": {"text": "“That wasn’t you, that was the curse.”\n\n“I remember all of those bodies. I saw Levi on the ground. I knew something was wrong but…” Vivi’s eyes rolled into the back of her head.\n\n“No…” Aiyana forced herself to lift Vivi in her arms once more. Through blurry eyes, she continued up the path. She heard the ambulance in the distance and was overjoyed when she emerged from the woods to find the paramedics rushing in her direction. She fell to her knees in relief cradling Vivi to her.\n\n“We made it, Vivi. You’re going to be okay.”\n\nShe looked down at her sister’s peaceful face. Her heart sank to see her eyes closed.\n\n“Vivi?”\n\nThe paramedics pulled Vivi from her arms and laid her on the ground. She stood up as Eva and Lucas finally emerged from the woods. They all stood back as the team of paramedics tried to bring her back again. Aiyana forced herself to watch Vivi’s tiny body convulse over and over with each defibrillation attempted. If there were any sign of life, even the faintest glimmer, she didn’t want to miss it.\n\nFinally, a paramedic stood up straight. He looked to Aiyana, Eva and Lucas before turning his eyes to his watch.\n\n“Time of death…” he began.\n\nBut in the next space Eva’s scream took away the rest of what he was going to say.\n\n“Jesus,” Aiyana exhaled as she took a seat on the ground. “Jesus,” she repeated as she dropped her head in her hands and tried to fight the tears. “I can’t do this,” she moaned.\n\nShe lifted her head and looked to Eva and Lucas through her tears as they hugged and comforted each other. She didn’t know what would happen next, but she did know that they were all she had left. And she could not stand to lose anyone else.\n\nThey decided to keep Vivi’s funeral quiet and private. They’d had her cremated and rowed her ashes out to the ocean. Caleb was there and so was Vivi’s friend Harold. The Aunts and Uncle Max were not permitted to come. Harold was allowed to do the honors of pouring the ashes into the sea.\n\n“She didn’t want to be in a box,” Eva said when the canister was empty.\n\n“She wanted to be free,” Lucas confirmed.\n\nThey all said a few words about her, and then rowed back to shore. As they stood on the beach looking outward, Eva put a hand on Aiyana’s shoulder.\n\nAiyana grabbed that hand as if it were a lifesaver and began to cry. “You should leave,” Aiyana whispered.\n\n“What?” Eva asked.\n\n“You and Lucas need to get off of this island. Save yourselves. The curse needs me. It won’t kill me. I’ll work with Sakima to figure out a way to break it. Caleb can help you two get someplace safe.”\n\n“What about you?” Eva asked.\n\n“I was always meant to end up here alone.” She turned to Eva. “We all knew that, didn’t we?”\n\nEva wiped a tear away. “I didn’t know it would be like this. I always thought it would feel like I had a choice. But I don’t. Either leave or die.”\n\n“Exactly.”\n\nIt took a few days for them to pack and get ready. They didn’t tell the Aunts or Uncle Max. They hadn’t even seen them since the funeral. Aiyana saw Eva and Lucas to the ferry with Caleb. She’d set up an account for them with enough money to live out their lives. Caleb promised to stay with them at his New York apartment until they were able to find a place of their own and take care of themselves. He also promised to be back long before the blood moon. Aiyana hugged him tight, grateful for what he was doing for them.\n\n“When I get back, we’ll kick this demon’s ass to kingdom come.”\n\n“Yes,” Aiyana said, with more confidence than she felt. “We will.”", "voices": [["“That wasn’t you, that w", "Aiyana"], ["“I remember all of those", "Vivi"], ["“No…” Aiyana forced hers", "Aiyana"], ["“We made it, Vivi. You’r", "Aiyana"], ["“Vivi?”", "Aiyana"], ["“Time of death…” he bega", "Paramedic"], ["“Jesus,” Aiyana exhaled ", "Aiyana"], ["“She didn’t want to be i", "Eva"], ["“She wanted to be free,”", "Lucas"], ["Aiyana grabbed that hand", "Aiyana"], ["“What?” Eva asked.", "Eva"], ["“You and Lucas need to g", "Aiyana"], ["“What about you?” Eva as", "Eva"], ["“I was always meant to e", "Aiyana"], ["Eva wiped a tear away. “", "Eva"], ["“Exactly.”", "Aiyana"], ["“When I get back, we’ll ", "Caleb"], ["“Yes,” Aiyana said, with", "Aiyana"]]}}]}, {"id": "ev41", "title": "Chapter Sixteen, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev41_1", "name": "Part 1", "text": "Lucas left samples of his writings with Aiyana. She noticed a pattern that resembled the calligraphy in her grandmother’s diary, so she scanned both and e-mailed them to Sakima. Then she read the diary.\n\nIt began with Charii’s great granddaughter, Malinda, twenty when she learned of the curse. She described feeling the demon’s wrath, thinking that it was Charii, and being completely immobilized while the demon freed her creatures from the dungeon. No one ever seemed to know that it was the demon and not Charii, or to remember episodes with Malinda while she was possessed.\n\nThe demon always gravitated towards the Esta-owey, but couldn’t cross the property lines. Malinda’s blood moon possessions took place two times a year for seven years, and then ceased. When she decided to marry, the Esta-owey chief told her that there was a way to stop the curse. But it would take several generations. On that same page were several lines of calligraphy.\n\nThe writing picked up with her eldest daughter, Dove. At twenty-one, the age of transition, the demon came back with a vengeance, first killing both of her parents. Dove tried to convince her Aunts and Uncle that it was time to destroy the demon, but they wouldn’t listen. She went crazy and finally set the plantation house on fire, perishing within it.\n\nAiyana had to take a break. She walked to the beach. She was cursed. The island was cursed.\n\nShe felt that she probably could stand seven years of possessions twice a year. But the demon’s plan was to make it permanent. At the shoreline she wondered why the demon never tried to possess Charii or any of the Gullah directly. She thought about the goddess her Uncle Max had mentioned.\n\n“…the African Moon and Sun goddess, Mawu.” She heard it in Harold’s storyteller voice. How had he known that name?", "choices": [{"label": "Say the name to the water", "to": "ev41_3"}, {"label": "Ask it for one thing", "to": "ev41_2"}], "voices": [["“…the African Moon and S", "Harold"]], "alt": {"text": "Lucas left samples of his writings with Aiyana. As she looked them over, she noticed a pattern that resembled the calligraphy in her grandmother’s diary. She decided to scan those pages from the diary and Lucas’ writing into an e-mail and sent them to Sakima. She then settled on her hotel room sofa and began to read the diary.\n\nIt began with Charii’s great granddaughter, Malinda. She was twenty and, along with her brothers and sisters, had just found out the details of the curse. They had just begun to isolate her in the plantation house, which was beginning to show signs of disrepair. She was terrified of what was to come. She wanted to kill herself to avoid it.\n\nHowever, her Aunts and Uncles convinced her that it was her destiny, so she waited until the blood moon. She described feeling the demon’s wrath, thinking that it was Charii, and being completely immobilized while the demon did what it wanted with or to whom it wanted in Malinda’s body. She wrote about the demon freeing her creatures from the dungeon and that first night of horror. Her siblings had quickly packed up and left the island for good. From that time on, no one ever seemed to really know that it was the demon and not Charii they were engaging with. Then no one seemed to remember episodes with Malinda while she was possessed.\n\nMalinda left a few clues with each possession and blood moon terror in the diary. The demon always seemed to gravitate towards the Esta-owey, but couldn’t cross the property lines. She would pace back and forth waiting, but Malinda could never glean what it was that she was waiting for.\n\nMalinda’s blood moon possessions took place two times a year for seven years, and then ceased. She lost track of the body count over the years but she marked the names of family and friends. It drove her crazy that none of the residents knew what was going on. When she finally decided to fall in love and marry, she got a visit from the Esta-owey chief who told her that there was a way to stop the curse. But it would take several generations.\n\nOn that same page were several lines of calligraphy. Malinda’s writing dropped off during her first pregnancy. The writing picked up with her eldest daughter, Dove. Dove found out about the curse when she was eighteen but didn’t find out about the diary until she was close to twenty-one, the age of transition. Her siblings had already pulled away from her. She stayed alone on the plantation with her parents until the first blood moon of her transition and she noted that the demon came back with a vengeance, first killing both of her parents.\n\nThroughout her seven years of possessions, Dove tried to convince her Aunts and Uncle that it was time to destroy the demon, but they wouldn’t listen, even as the demon had released her cursed monsters on the island every time it showed up. She’d tried to take them to the Esta-owey lands but none of them could cross over. The cursed were driven back to the Gullah population by their hunger for blood.\n\nAt the end of her seven years, Dove stopped writing in the journal. The writing picked up again with Dove’s granddaughter. She relayed the story of her grandmother Dove going crazy. She’d been institutionalized off and on for ten years. While she did have one child no one knew who the father was. Finally she’d set the plantation house on fire, perishing within it.\n\nAiyana had to take a break from reading at that point. The tragedy was heartbreaking and demoralizing. She left her hotel room and walked to the beach. She tried to give herself space to clear her mind. It truly disturbed her to learn the truth about her family. She wished she could just deny it or pretend it wasn’t true, but it was. She was cursed. The island was cursed.\n\nShe thought about the carnage at the festival and took what relief she could in knowing that the festival insurance had paid the full cost of damages that Thump TV and surviving families were asking.\n\nThanks to Niara and their lawyers, Aiyana had not had to go off of the island during the hardest time in her life to deal with the courts and legal issues of liability. Other than paying the lawyers and the assurance that another festival would never be insurable, the island had survived the incident without facing financial ruin. That was also due to the demon crushing all of the cameras and altering witness perceptions.\n\nThe state of South Carolina had sent several squads of Animal Control officers to search high and low for the wild dogs but every day they returned to the mainland confused.\n\nAs she walked along the beach, she passed a few of the island residents. They still gave condolences and made sure to tell her what a great job she was doing so far. When she made it to a long stretch of solitary beach, Aiyana let her thoughts drift. She felt that she probably could stand seven years of possessions if they were only twice a year. But, she knew that the demon’s plan was to make it permanent. She just wished she knew how, so she could stop it.\n\nShe walked to the shoreline and looked towards the horizon. Her thoughts turned to Charii, and she wondered why the demon never tried to possess Charii or any of the Gullah directly. She had only been able to possess the handmaiden and then the child of the Chief’s son. Aiyana thought about the goddess that her Uncle Max mentioned the night after her grandmother died. She tried to remember her name.\n\n“…the African Moon and Sun goddess, Mawu.” She heard it in Harold’s storyteller voice. How had he known that name?", "voices": [["“…the African Moon and S", "Harold"]]}}, {"id": "ev41_2", "name": "NEW DRAFT: One day", "text": "“If you’re there,” Aiyana said to the horizon, “I’m not asken for a miracle. I’m asken for one day where nobody I love dies.”\n\nIt sounded foolish out loud. She said the name anyway.", "choices": [{"label": "Continue", "to": "ev41_3"}], "voices": [["“If you’re there,” Aiyan", "Aiyana"]], "alt": {"text": "“If you’re there,” Aiyana said to the horizon, “I’m not asken for a miracle. I’m asken for one day where nobody I love dies.”\n\nIt sounded foolish out loud. She said the name anyway.", "voices": [["“If you’re there,” Aiyan", "Aiyana"]]}}, {"id": "ev41_3", "name": "Part 2", "text": "“Mawu…” she whispered. She felt the air wisp around her ever so slightly. She took in a deep breath and closed her eyes. “Mawu.”", "choices": [], "voices": [["“Mawu…” she whispered. S", "Aiyana"]], "alt": {"text": "“Mawu…” she whispered. She felt the air wisp around her ever so slightly. She took in a deep breath and closed her eyes. “Mawu.”", "voices": [["“Mawu…” she whispered. S", "Aiyana"]]}}]}, {"id": "ev42", "title": "Chapter Sixteen, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev42_1", "name": "Part 1", "text": "She opened her eyes, disappointed that nothing happened. As she turned back to the resort, a figure headed purposefully her way. It was SLED Chief Adair, his expression grim.\n\n“I need to tell you some disturbing news concerning Mr. Rutledge, all the victims of the wild dog attack, and your sister, Vivienne.”\n\n“They all had the same strange toxins in their blood.”\n\n“Wow, really?” Aiyana feigned confusion.\n\n“Don’t do that,” Adair said calmly. “Be straight with me or else you’ll find the state of South Carolina, SLED, the FBI and the Federal Government all over this island looking for some exotic new narcotic that may have the potential to influence mass hysteria and hypnosis in order to cover up mass murder.”\n\n“Help me,” Chief Adair said calmly.\n\n“I can’t,” she answered.\n\n“I came to you with this information as a… friend. Once I leave here it’s only going to get harder on you.”\n\nIn the hotel, the receptionist flagged her down.\n\n“You’ve had several calls from Chief Sakima. He says it’s urgent that you come see him.”\n\nThe written message said to come to his house, alone.\n\nAiyana weighed the wisdom of that, with her brother, sister, and Caleb headed to New York. She pulled out her cell phone.", "choices": [{"label": "Call Adair", "to": "ev42_3"}, {"label": "Call Caleb first", "to": "ev42_2"}], "voices": [["“I need to tell you some", "Adair"], ["“They all had the same s", "Adair"], ["“Wow, really?” Aiyana fe", "Aiyana"], ["“Don’t do that,” Adair s", "Adair"], ["“Help me,” Chief Adair s", "Adair"], ["“I can’t,” she answered.", "Aiyana"], ["“I came to you with this", "Adair"], ["“You’ve had several call", "Receptionist"]], "alt": {"text": "She opened her eyes and while she didn’t really expect anything, she was disappointed that nothing happened. She quickly turned back to the resort. She needed to talk to Harold and see what else he knew about Charii and the goddess. As she retraced her steps along the shoreline back to the resort she noted a figure purposefully headed her way. As the figure got closer to her, she was surprised to see that it was SLED Chief Adair. The closer they came to each other the easier it was for her to see how grim his expression was.\n\n“We need to talk,” he said as soon as he was within earshot of her.\n\n“Walk me back to the hotel,” Aiyana said. “We can talk along the way.”\n\n“I need to tell you some disturbing news concerning Mr. Rutledge, all the victims of the wild dog attack, and your sister, Vivienne.”\n\nAiyana’s breath became shallow but she worked hard to keep her expression clear.\n\n“They all had the same strange toxins in their blood. It came up during the autopsy screenings.”\n\n“Wow, really?” Aiyana feigned confusion.\n\n“Don’t do that,” Adair said calmly. “Be straight with me or else you’ll find the state of South Carolina, SLED, the FBI and the Federal Government all over this island looking for some exotic new narcotic that may have the potential to influence mass hysteria and hypnosis in order to cover up mass murder.”\n\n“What!” Aiyana decided to push the act harder. “That is crazy!”\n\n“Where the hell did wild dogs come from? Where the hell did they go? There were no animal tracks large enough to fit the witness descriptions going to or coming from the scene.”\n\n“I don’t know what to tell you, Chief.” Aiyana shrugged.\n\n“I can get a warrant.”\n\n“If you feel you should.”\n\n“I could take you into custody right now on suspicion of obstruction.”\n\n“You and I both know that would come out as an abuse of power.”\n\n“Would it?”\n\n“Yes, it would.”\n\n“Don’t you want to know if drugs caused your sister’s death? Don’t you want to know what really happened during that supposed animal attack?”\n\n“I already know what happened. I was there, Chief, along with several hundred witnesses. Maybe there are drugs that we need to investigate, but I can’t tell you where you should start.”\n\nHe looked at her for several moments, as they got closer to the hotel.\n\n“If you’re involved in this…”\n\n“My only involvement has been to lose a brother and a sister long before their time. I want the same answers. I wish I could find someone to put the blame on so I don’t feel guilty myself. If I’d never planned that damned festival…” Aiyana bit her lip. She turned away, blinking back tears.\n\n“Help me,” Chief Adair said calmly.\n\n“I can’t,” she answered.\n\n“I came to you with this information as a… friend. I’m very concerned and I’m worried about you, Aiyana. Once I leave here it’s only going to get harder on you.”\n\n“I don’t see how things could get harder. But, my family has endured far worse than a drug raid. Good luck with your investigation.”\n\n“Good luck to you, too,” he said and turned away to leave. She watched his retreat. Before he cleared the parking lot, he turned back to see if she was still there. She nodded and he continued on his way.\n\nShe turned to go back into the hotel. The receptionist flagged her down as she entered.\n\n“What’s wrong?” Aiyana asked her.\n\n“You’ve had several calls from Chief Sakima. He says it’s urgent that you come see him.”\n\nThe receptionist handed over the written message. He wanted her to come to his house and to call when she was on the way. The note said to come alone.\n\nAiyana weighed the wisdom of going back there alone, especially with her brother, sister, and Caleb headed to New York. She pulled out her cell phone and made a quick call.", "voices": [["“We need to talk,” he sa", "Adair"], ["“Walk me back to the hot", "Aiyana"], ["“I need to tell you some", "Adair"], ["“They all had the same s", "Adair"], ["“Wow, really?” Aiyana fe", "Aiyana"], ["“Don’t do that,” Adair s", "Adair"], ["“What!” Aiyana decided t", "Aiyana"], ["“Where the hell did wild", "Adair"], ["“I don’t know what to te", "Aiyana"], ["“I can get a warrant.”", "Adair"], ["“If you feel you should.", "Aiyana"], ["“I could take you into c", "Adair"], ["“You and I both know tha", "Aiyana"], ["“Would it?”", "Adair"], ["“Yes, it would.”", "Aiyana"], ["“Don’t you want to know ", "Adair"], ["“I already know what hap", "Aiyana"], ["“If you’re involved in t", "Adair"], ["“My only involvement has", "Aiyana"], ["“Help me,” Chief Adair s", "Adair"], ["“I can’t,” she answered.", "Aiyana"], ["“I came to you with this", "Adair"], ["“I don’t see how things ", "Aiyana"], ["“Good luck to you, too,”", "Adair"], ["“What’s wrong?” Aiyana a", "Aiyana"], ["“You’ve had several call", "Receptionist"]]}}, {"id": "ev42_2", "name": "NEW DRAFT: Voicemail", "text": "It was Caleb’s number she dialed. It rang through to his voicemail, his recorded voice cheerful and far away.\n\nShe hung up without leaving a message and dialed again.", "choices": [{"label": "Continue", "to": "ev42_3"}], "alt": {"text": "It was Caleb’s number she dialed. It rang through to his voicemail, his recorded voice cheerful and far away, a man with nothing worse to worry about than a missed call. He was somewhere between here and New York with her brother and sister beside him.\n\nShe hung up without leaving a message and dialed again.", "voices": []}, "voices": []}, {"id": "ev42_3", "name": "Part 2", "text": "“I do need your help,” she admitted.\n\nHe met her at Ruby’s and they took a booth in the back.\n\n“Our family is cursed.”\n\n“That curse is in our blood. I didn’t realize that my touch contained that toxin. Neither did Vivi when she went to meet with Mr. Rutledge.”\n\nHe exhaled and she knew she’d confirmed a suspicion.\n\n“Every blood moon for seven years after my twenty first birthday, I can expect to be possessed by a demon hell-bent on a vengeance of some kind.”\n\n“Call the Chief and tell him that you will have to meet with him tomorrow.”\n\n“Are you arresting me?”\n\n“No, but I am taking you off the island for your own safety.”\n\nShe was relieved to have a friend in Adair. She called Sakima, and his voice seemed strained.\n\n“Aiyana, the writing you sent me is nearly ancient Esta-owey text. I think it tells about how the evil woman was originally bound? But, it’s not the whole story.”\n\n“I won’t be able to see you until tomorrow.”\n\n“Don’t tell him anything.” Sakima warned. “People outside of the curse can only see what the demon allows them to. Even if he really wants to help you, he can’t.”", "choices": [], "voices": [["“I do need your help,” s", "Aiyana"], ["“Our family is cursed.”", "Aiyana"], ["“That curse is in our bl", "Aiyana"], ["“Every blood moon for se", "Aiyana"], ["“Call the Chief and tell", "Adair"], ["“Are you arresting me?”", "Aiyana"], ["“No, but I am taking you", "Adair"], ["“Aiyana, the writing you", "Sakima"], ["“I won’t be able to see ", "Aiyana"], ["“Don’t tell him anything", "Sakima"]], "alt": {"text": "“Hello?” Adair answered on the second ring.\n\n“I do need your help,” she admitted.\n\nAdair seemed to think about that for a moment.\n\n“Where do you want to talk?”\n\nChief Adair met her at Ruby’s and they took a booth in the back. He ordered sweet tea and she asked for water with lemon.\n\nThey remained quiet while Aiyana thought about where to start. The drinks were brought and Aiyana took a long sip.\n\n“My mother died in childbirth.” She started. “My brothers, sisters and I were raised by our Aunts and Uncle. They tried to keep us apart. But, we eventually gravitated towards each other. I guess I always wondered why they had done that, but now I feel maybe it was to spare us the pain of eventually losing each other. I guess I was raised alone so that I would be prepared to live out the rest of my life alone.”\n\n“I’m not following you,” Adair said, shaking his head. “What does that have to do with the toxin and what happened at the cul-de-sac?”\n\n“Our family is cursed.”\n\nAiyana watched and waited for a reaction but got none. Adair simply nodded for her to continue.\n\n“Strange things happen beyond our control that make the same tragedies occur over, and over, and over again with each new generation. That curse is in our blood. I didn’t realize that the first time I tried to be with my boyfriend. I didn’t realize that my touch contained that toxin.” She looked up at Adair. “Neither did Vivi when she went to meet with Mr. Rutledge.”\n\nHe exhaled and she knew she’d confirmed a suspicion.\n\n“You have this toxin in your blood as well?”\n\nAiyana nodded. “But, that’s not all. This thing in our blood is part of a curse that has been handed down for more than one hundred years. Every blood moon for seven years after my twenty first birthday, I can expect to be possessed by a demon hell-bent on a vengeance of some kind. It has something to do with the Esta-owey. I’ve heard two variations of the same story so far. I honestly don’t know who to believe. I don’t know why the curse started. I don’t know how to end it. I think there may be an African goddess in the mix somewhere but I sent my brother and sister away to keep them safe. I’m here alone.”\n\nAdair used the long pause in Aiyana’s story to take his first long sip of the sweet tea.\n\n“Call the Chief and tell him that you will have to meet with him tomorrow. That you are caught up with SLED and can’t get away. I’ll take you to the mainland station where we can talk in safety.”\n\n“Are you arresting me?”\n\n“No, but I am taking you off the island for your own safety.” Chief Adair said seriously. “Once we get to headquarters we will discuss a surveillance strategy. The best way to find out the truth is to eavesdrop on everyone.”\n\nAiyana nodded.\n\n“Drink your water. Make the call and then we can go.”\n\n“Thank you,” Aiyana said, not certain if this was a great idea. But she was willing to at least try. She was relieved to have a friend in Adair.\n\nShe called Sakima, and his voice seemed strained.\n\n“Aiyana, the writing you sent me is nearly ancient Esta-owey text. I think it tells about how the evil woman was originally bound? But, it’s not the whole story. Has he written more?”\n\n“I don’t know.” Aiyana was caught off guard. “I will have him call you,” she said. “I won’t be able to see you until tomorrow. SLED is asking more questions about the attack and Adair wants to take me in for more questions.”\n\n“Don’t tell him anything.” Sakima warned. “People outside of the curse can only see what the demon allows them to. Even if he really wants to help you, he can’t.”\n\n“Okay, he’s here now and I have to go. But, I’ll contact you first thing tomorrow.”\n\n“Alright, Aiyana.” Sakima still seemed agitated. “I’ll be here. Be careful. If your brother has written the entire story it could say exactly how this spirit was bound in the first place. It will make it easier for us to bind it once again and this will all be over.”", "voices": [["“Hello?” Adair answered ", "Adair"], ["“I do need your help,” s", "Aiyana"], ["“Where do you want to ta", "Adair"], ["“My mother died in child", "Aiyana"], ["“I’m not following you,”", "Adair"], ["“Our family is cursed.”", "Aiyana"], ["“Strange things happen b", "Aiyana"], ["“You have this toxin in ", "Adair"], ["Aiyana nodded. “But, tha", "Aiyana"], ["“Call the Chief and tell", "Adair"], ["“Are you arresting me?”", "Aiyana"], ["“No, but I am taking you", "Adair"], ["“Drink your water. Make ", "Adair"], ["“Thank you,” Aiyana said", "Aiyana"], ["“Aiyana, the writing you", "Sakima"], ["“I don’t know.” Aiyana w", "Aiyana"], ["“Don’t tell him anything", "Sakima"], ["“Okay, he’s here now and", "Aiyana"], ["“Alright, Aiyana.” Sakim", "Sakima"]]}}]}, {"id": "ev43", "title": "Chapter Seventeen, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev43_1", "name": "Part 1", "text": "Chief Adair was quiet on the entire journey to SLED headquarters. His office was neat, the walls bare, no photographs of children or a wife.\n\n“I need to be honest.” He began, “I’ve been turning a lot of what you said over and over again in my head and all I can rationally conclude is that there are, or were, strange narcotics involved.”\n\n“I would like to set up extensive surveillance on the island. Including on the Esta-owey lands.”\n\n“But the Esta-owey own their own land. I can’t give you permission to do surveillance there.”\n\n“We’ll work around that,” He assured her and sat up straighter. “Now I would like you to take a polygraph test.”\n\n“Off the record. I need to know that you are being honest with me.”", "choices": [{"label": "Agree to the test", "to": "ev43_3"}, {"label": "Refuse the test", "to": "ev43_2"}], "voices": [["“I need to be honest.” H", "Adair"], ["“I would like to set up ", "Adair"], ["“But the Esta-owey own t", "Aiyana"], ["“We’ll work around that,", "Adair"], ["“Off the record. I need ", "Adair"]], "alt": {"text": "Chief Adair was quiet on the entire journey from the island to SLED headquarters. She was a little nervous about not knowing what he was thinking. When they got to headquarters, he led her through a series of stark white halls illuminated by fluorescent lights. He walked her to a door with his name and title on it. She was surprised to see that his office was extremely neat and tidy. Pointing her to a sofa along the wall, he headed to his computer and woke it up.\n\nShe listened to a series of keyboard strokes and then all went silent. She took the space of time he used to do whatever he was doing to look around. His walls were completely bare. She scanned the desk and noted there were no photographs of children or a wife. It occurred to her that in the nine months they’d spent together planning the festival, she hadn’t learned much of anything about his personal life. Now that he was extending himself to possibly save her and her island, she felt bad about that. She heard another series of harsh keystrokes and looked up as he stood, walking around his desk. He sat in one of two chairs across from the sofa and looked at her.\n\n“I need to be honest.” He began, “I’ve been turning a lot of what you said over and over again in my head and all I can rationally conclude is that there are, or were, strange narcotics involved.”\n\nShe shifted in her seat.\n\n“I want you to trust me. Okay?” He asked, searching her face.\n\n“Trust you to do what?”\n\n“I would like to set up extensive surveillance on the island. Including on the Esta-owey lands.”\n\nAiyana was quiet for a moment.\n\n“What does extensive mean? How much surveillance would it be?”\n\n“We would start with the key people you say you don’t trust. Your Aunts, Uncle and Chief Sakima. We would need you to carry surveillance into their spaces and leave them there. Do you think you can do that?”\n\n“I think so.” Aiyana said. “But the Esta-owey own their own land. I can’t give you permission to do surveillance there.”\n\n“We’ll work around that,” He assured her and sat up straighter. “Now I would like you to take a polygraph test.”\n\n“What?” Aiyana was taken by surprise.\n\n“Off the record. I need to know that you are being honest with me.”", "voices": [["“I need to be honest.” H", "Adair"], ["“I want you to trust me.", "Adair"], ["“Trust you to do what?”", "Aiyana"], ["“I would like to set up ", "Adair"], ["“What does extensive mea", "Aiyana"], ["“We would start with the", "Adair"], ["“I think so.” Aiyana sai", "Aiyana"], ["“We’ll work around that,", "Adair"], ["“What?” Aiyana was taken", "Aiyana"], ["“Off the record. I need ", "Adair"]]}}, {"id": "ev43_2", "name": "NEW DRAFT: One honest hour", "text": "“No,” Aiyana said. “I came to you for help, not to be tested like a suspect.”\n\n“Then walk out.” “But I can’t put officers on that island on the word of a woman who won’t sit for one honest hour.”\n\nShe thought of the blood moon, one week off, and of meeting it alone.", "choices": [{"label": "Continue", "to": "ev43_3"}], "voices": [["“No,” Aiyana said. “I ca", "Aiyana"], ["“Then walk out.” “But I ", "Adair"]], "alt": {"text": "“No,” Aiyana said. “I came to you for help, not to be tested like a suspect.”\n\n“Then walk out.” Adair opened his hands. “Nobody’s stopping you. But I can’t put officers on that island on the word of a woman who won’t sit for one honest hour.”\n\nShe thought of the blood moon, one week off, and of meeting it alone.", "voices": [["“No,” Aiyana said. “I ca", "Aiyana"], ["“Then walk out.” Adair o", "Adair"]]}}, {"id": "ev43_3", "name": "Part 2", "text": "“Okay, I can do that, sure.”\n\nAdair led her to an interrogation area with a polygraph machine already set up. Aiyana noted the two-way mirror and the camera.\n\n“Turn on the light in the other room, please.”\n\nHe flipped a switch. The observation room was indeed empty.\n\n“Turn the camera off and push it to face the wall, please.”\n\nAdair did as she asked and she relaxed just a little bit more.\n\n“Okay, you may proceed.”", "choices": [], "voices": [["“Okay, I can do that, su", "Aiyana"], ["“Turn on the light in th", "Aiyana"], ["“Turn the camera off and", "Aiyana"], ["“Okay, you may proceed.”", "Aiyana"]], "alt": {"text": "“Okay, I can do that, sure.”\n\n“Wonderful. Then, we will procure some equipment and teach you how to use it. I will set up a tiny, off the grid operation out of the hotel with an officer that I trust. From now on when I appear on the island it will officially be to continue an inquiry into the festival’s animal attack.”\n\n“Sure. But, this officer has to know that they can’t take anything they hear and learn back to the public.”\n\n“Of course.” Adair smiled and stood up.\n\nThey left the room and Adair led her to an interrogation area with a polygraph machine already set up. Aiyana noted the two-way mirror and the camera in the corner and wondered if anyone was watching.\n\n“No, no one is in there. You are not under arrest. This is just a question and answer session for my own benefit.”\n\n“Turn on the light in the other room, please.”\n\nAdair seemed taken aback by the request. “You don’t trust me.”\n\n“I’m the one taking a polygraph because you’re not sure if you should believe me. Prove it. Turn on the light.”\n\nHe walked across the room and flipped a switch that turned on the light in the observation room. Aiyana stood and walked to the mirror; looking into the other room she saw that it was indeed empty.\n\n“I’m going to administer the test myself and then I will hand the results to you for safe keeping.”\n\nAiyana went to the table and took a seat.\n\n“Turn the camera off and push it to face the wall, please.”\n\nAdair did as she asked and she relaxed just a little bit more.\n\n“Okay, you may proceed.”", "voices": [["“Okay, I can do that, su", "Aiyana"], ["“Wonderful. Then, we wil", "Adair"], ["“Sure. But, this officer", "Aiyana"], ["“Of course.” Adair smile", "Adair"], ["“No, no one is in there.", "Adair"], ["“Turn on the light in th", "Aiyana"], ["Adair seemed taken aback", "Adair"], ["“I’m the one taking a po", "Aiyana"], ["“I’m going to administer", "Adair"], ["“Turn the camera off and", "Aiyana"], ["“Okay, you may proceed.”", "Aiyana"]]}}]}, {"id": "ev44", "title": "Chapter Seventeen, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev44_1", "name": "Part 1", "text": "“Yes, your majesty.” Adair rolled his eyes, fitted her with the equipment and turned on the machine.\n\n“Have you ever taken drugs?”\n\n“No.”\n\nHe paused as the needles moved.\n\n“Weed, I’ve smoked weed.”\n\n“Do you believe yourself to be in danger?”\n\n“Yes.”\n\n“Do you know anyone that had anything to do with the animal attack on Sa’Fyre Island?”\n\nOf course she knew that it was Charii. But, saying it in the middle of SLED headquarters could prove to be a one-way ticket to an institution.\n\n“No.”\n\n“Do you believe yourself to be possessed?” It was another question she was not prepared to admit to there.", "choices": [{"label": "Lie: say no", "to": "ev44_3"}, {"label": "Start to say yes", "to": "ev44_2"}], "voices": [["“Yes, your majesty.” Ada", "Adair"], ["“Have you ever taken dru", "Adair"], ["“No.”", "Aiyana"], ["“Weed, I’ve smoked weed.", "Aiyana"], ["“Do you believe yourself", "Adair"], ["“Yes.”", "Aiyana"], ["“Do you know anyone that", "Adair"], ["“No.”", "Aiyana"], ["“Do you believe yourself", "Adair"]], "alt": {"text": "“Yes, your majesty.” Adair rolled his eyes and took a seat. She sat quietly while he fitted her with the equipment and turned on the machine. “Okay, we can start.” He finally announced. “I will ask you a series of questions, you may answer yes, no, or I don’t know. Do you understand?”\n\n“Yes.” Aiyana felt her heart leap as she watched the machine needles move. The squiggly lines it created worried her because she didn’t know what they meant. Adair placed a mark on the paper then looked at her.\n\n“Is your name Aiyana Gamelle?”\n\n“Yes.” She took a deep breath and looked at the machine. Again the needles moved and Adair placed another mark on the page.\n\n“Do you live on Sa’Fyre Island?”\n\n“Yes.”\n\n“Are you planning to lie to me?”\n\n“No.”\n\n“Have you ever taken drugs?”\n\n“No.”\n\nHe paused as the needles moved and looked at her as if for clarification.\n\n“Weed, I’ve smoked weed.”\n\n“Other than weed, have you ever done drugs?”\n\n“No.”\n\n“Other than weed, have you ever sold or distributed drugs?”\n\n“No.”\n\n“Do you believe yourself to be in danger?”\n\nAt that moment Aiyana remembered Sakima’s warning that people outside of the curse only saw what their minds wanted them to see. She decided to plunge ahead.\n\n“Yes.”\n\n“Do you plan to cooperate with me?”\n\n“Yes.”\n\n“Other than weed have you ever taken drugs?”\n\nShe looked at him confused by the repeat question.\n\n“No.”\n\n“Have you ever sold or distributed drugs on Sa’Fyre Island?”\n\n“No.”\n\n“Do you know of anyone that has distributed or sold drugs on Sa’Fyre Island?”\n\n“No.”\n\n“Did you have anything to do with the animal attack during the festival on Sa’Fyre Island?”\n\n“No.”\n\n“Do you know anyone who did?”\n\nAiyana looked at him curiously. Of course she knew that it was Charii. But, she was not going to say it in the middle of SLED headquarters. It could prove to be a one-way ticket to an institution.\n\n“No.”\n\nHe looked back at her curiously.\n\n“Do you know anyone that had anything to do with the animal attack on Sa’Fyre Island?”\n\n“No.” She repeated.\n\n“Do you feel as if you are in danger?”\n\n“Yes.”\n\n“Do you believe yourself to be possessed?” It was another question she was not prepared to admit to there.", "voices": [["“Yes, your majesty.” Ada", "Adair"], ["“Yes.” Aiyana felt her h", "Aiyana"], ["“Is your name Aiyana Gam", "Adair"], ["“Yes.” She took a deep b", "Aiyana"], ["“Do you live on Sa’Fyre ", "Adair"], ["“Yes.”", "Aiyana"], ["“Are you planning to lie", "Adair"], ["“No.”", "Aiyana"], ["“Have you ever taken dru", "Adair"], ["“No.”", "Aiyana"], ["“Weed, I’ve smoked weed.", "Aiyana"], ["“Other than weed, have y", "Adair"], ["“No.”", "Aiyana"], ["“Other than weed, have y", "Adair"], ["“No.”", "Aiyana"], ["“Do you believe yourself", "Adair"], ["“Yes.”", "Aiyana"], ["“Do you plan to cooperat", "Adair"], ["“Yes.”", "Aiyana"], ["“Other than weed have yo", "Adair"], ["“No.”", "Aiyana"], ["“Have you ever sold or d", "Adair"], ["“No.”", "Aiyana"], ["“Do you know of anyone t", "Adair"], ["“No.”", "Aiyana"], ["“Did you have anything t", "Adair"], ["“No.”", "Aiyana"], ["“Do you know anyone who ", "Adair"], ["“No.”", "Aiyana"], ["“Do you know anyone that", "Adair"], ["“No.” She repeated.", "Aiyana"], ["“Do you feel as if you a", "Adair"], ["“Yes.”", "Aiyana"], ["“Do you believe yourself", "Adair"]]}}, {"id": "ev44_2", "name": "NEW DRAFT: Halfway out", "text": "“Y—”\n\nThe word was halfway out. She saw the white halls outside this room, the doors she had passed on the way in, and swallowed it.", "choices": [{"label": "Continue", "to": "ev44_3"}], "voices": [["“Y—”", "Aiyana"]], "alt": {"text": "“Y—”\n\nThe word was halfway out. She saw the white halls outside this room, the doors she had passed on the way in, and swallowed it.", "voices": [["“Y—”", "Aiyana"]]}}, {"id": "ev44_3", "name": "Part 2", "text": "“No,” she answered but she could tell the machine signaled that it was a lie.\n\n“Do you believe your Aunts and Uncle have something to do with the danger you feel?”\n\n“Yes.”\n\nAiyana remained honest about everything except for anything that would make her seem insane.\n\n“Go on back to the Island. The officer should already be there. She was on the special task force during the festival. She witnessed the animal attack and survived.”\n\n“She was the only officer to survive?”\n\n“Yes, she was.”\n\nBack at the hotel she sent Lucas a text, and he called immediately.\n\n“We are doing really well. Caleb is taking very good care of us.” There was a little bit of a pause. “Do you need us to come back?”\n\n“I wanted you to call because Chief Sakima thinks that your writing could be the key to ending the curse.”\n\n“He knows the language?”\n\n“Ancient Esta-owey.”\n\n“Can I do a little more research? I will call him but I would like to see if I can get a translation on my own, now that we know what it is.”\n\nAiyana smiled as she hung up.", "choices": [{"label": "Stay with Aiyana", "to": "END"}, {"label": "Follow Lucas: New York", "to": "ev44_4"}], "voices": [["“No,” she answered but s", "Aiyana"], ["“Do you believe your Aun", "Adair"], ["“Yes.”", "Aiyana"], ["“Go on back to the Islan", "Adair"], ["“She was the only office", "Aiyana"], ["“Yes, she was.”", "Adair"], ["“We are doing really wel", "Lucas"], ["“I wanted you to call be", "Aiyana"], ["“He knows the language?”", "Lucas"], ["“Ancient Esta-owey.”", "Aiyana"], ["“Can I do a little more ", "Lucas"]], "alt": {"text": "“No,” she answered but she could tell the machine signaled that it was a lie.\n\nAdair paused and took in a deep breath. He tried to read her, but it was clear that her answers and the results confused him.\n\n“Have you ever done drugs, other than weed?”\n\n“No.”\n\n“Have you ever sold or distributed drugs?”\n\n“No.”\n\n“Will you help me investigate this matter on Sa’Fyre Island?”\n\n“Yes.”\n\n“Will you do anything to hinder our investigation?”\n\n“No.”\n\n“Do you believe yourself to be in danger?”\n\n“Yes.”\n\n“Do you believe your Aunts and Uncle have something to do with the danger you feel?”\n\n“Yes.”\n\n“Do you believe the Esta-owey Chief has something to do with the danger that you are in?”\n\n“I don’t know.”\n\nThe questions went on for more than an hour. Aiyana remained honest about everything except for anything that would make her seem insane. She was not sure if the exercise had made Adair less likely or more likely to believe her and help.\n\nHe turned off the machine and tore off the paper results, handing them to Aiyana.\n\n“As promised,” he said and set to disconnecting her from the machine.\n\n“I…”\n\n“It’s okay.” He assured her. “Something is going on. You feel as if you are in danger. You’re going to help us with the investigation.”\n\nAiyana nodded, grateful that that much was apparent to him.\n\n“But, you don’t trust me, do you?”\n\n“I do. I trust you.”\n\nHe pushed up a half smile and tucked the machines’ pieces away.\n\n“Go on back to the Island. The officer should already be there. I’ll reintroduce you in the morning.”\n\n“Reintroduce?”\n\n“She was on the special task force during the festival. She witnessed the animal attack and survived. She was able to get others to the safety of the hotel.”\n\nAiyana remembered the officer he was talking about.\n\n“I see.” Aiyana said at length, remembering that there had been five officers there that day. “She was the only officer to survive?”\n\n“Yes, she was. And she wants answers too.”\n\n“Right.”\n\nAiyana returned to the hotel and went directly to her room. She sent Lucas a text asking him to call as soon as he could. He called back immediately.\n\n“What’s up?” he asked.\n\n“Hey, how are you?” She was happy to hear his voice. He seemed to be in a wonderful mood.\n\n“We are doing really well. Caleb is taking very good care of us. We’ve hired a real estate agent and have been looking at apartments.”\n\n“That’s great! How is Eva?”\n\n“She’s… getting better. We both are. She stepped out with Caleb to get some dinner.” There was a little bit of a pause. “Do you need us to come back?”\n\nThe question surprised her but she could hear his reluctance to ask it.\n\n“No, no, not at all. I wanted you to call because Chief Sakima thinks that your writing could be the key to ending the curse. He wanted to know if you had any more writings. If you do, would you mind giving him a call?”\n\nThere was another pause while he seemed to think about it.\n\n“He knows the language?”\n\n“Ancient Esta-owey.”\n\n“Can I do a little more research? I will call him but I would like to see if I can get a translation on my own, now that we know what it is.”\n\n“Yes, of course.” Aiyana smiled at Lucas’ willingness to do that. “Great thinking.”\n\n“Thanks. I’ll let them know you called. I want to get on the computer and see what I can find.”\n\n“Okay. I’ll talk to you soon.”\n\nAiyana smiled as she hung up. Lucas had sounded very good. She was certain that Caleb was helping Eva adjust as well. She wished that she could join them. But she knew that it wouldn’t be impossible to take a flight up for a day or so after they found a place and got settled.", "voices": [["“No,” she answered but s", "Aiyana"], ["“Have you ever done drug", "Adair"], ["“No.”", "Aiyana"], ["“Have you ever sold or d", "Adair"], ["“No.”", "Aiyana"], ["“Will you help me invest", "Adair"], ["“Yes.”", "Aiyana"], ["“Will you do anything to", "Adair"], ["“No.”", "Aiyana"], ["“Do you believe yourself", "Adair"], ["“Yes.”", "Aiyana"], ["“Do you believe your Aun", "Adair"], ["“Yes.”", "Aiyana"], ["“Do you believe the Esta", "Adair"], ["“I don’t know.”", "Aiyana"], ["“As promised,” he said a", "Adair"], ["“I…”", "Aiyana"], ["“It’s okay.” He assured ", "Adair"], ["“But, you don’t trust me", "Adair"], ["“I do. I trust you.”", "Aiyana"], ["“Go on back to the Islan", "Adair"], ["“Reintroduce?”", "Aiyana"], ["“She was on the special ", "Adair"], ["“I see.” Aiyana said at ", "Aiyana"], ["“Yes, she was. And she w", "Adair"], ["“Right.”", "Aiyana"], ["“What’s up?” he asked.", "Lucas"], ["“Hey, how are you?” She ", "Aiyana"], ["“We are doing really wel", "Lucas"], ["“That’s great! How is Ev", "Aiyana"], ["“She’s… getting better. ", "Lucas"], ["“No, no, not at all. I w", "Aiyana"], ["“He knows the language?”", "Lucas"], ["“Ancient Esta-owey.”", "Aiyana"], ["“Can I do a little more ", "Lucas"], ["“Yes, of course.” Aiyana", "Aiyana"], ["“Thanks. I’ll let them k", "Lucas"], ["“Okay. I’ll talk to you ", "Aiyana"]]}}, {"id": "ev44_4", "name": "NEW DRAFT: Lucas in New York (sibling episode)", "text": "Caleb’s apartment was four flights up. Lucas had the laptop Caleb had lent him and every page he had written since the night Eva woke up crying.\n\nAncient Esta-owey. This hooked mark was woman. This one, doubled, was bound, or tied, or promised. Woman. Bound. Four. Four what?\n\nThe key turned in the lock, and he heard Eva laughing, the first since the beach.\n\nThere was a word near the bottom he had written eleven times. He was three marks from knowing what it said.", "choices": [{"label": "Return to Aiyana", "to": "END"}], "alt": {"text": "Caleb’s apartment was four flights up and the size of Levi’s kitchen. Lucas had the fold-out table by the window, the laptop Caleb had lent him, and every page he had written since the night Eva woke up crying.\n\nAncient Esta-owey. Now that it had a name, he could go looking for it. A museum had scanned a missionary’s word list from the 1800s. A graduate student somewhere had posted forty pages on verb endings.\n\nHe matched shapes until his eyes ached. This hooked mark was woman. This one, doubled, was bound, or tied, or promised; the word list could not make up its mind.\n\nDown in the street a siren went by and nobody on the sidewalk looked up. He still was not used to that. On the island a siren meant somebody you knew.\n\nHe thought about Rose. He had not called her. What was there to say to a girl whose father—\n\nHe wrote it down instead. Woman. Bound. Four. Four what? He went back to the list.\n\nLevi would have told him to eat something. Vivi would have floated the pen out of his hand to make him laugh.\n\nThe key turned in the lock, and he heard Eva laughing at something Caleb said, a small rusty sound, the first since the beach. Lucas slid the next page under the lamp.\n\nThere was a word near the bottom he had written eleven times. He was three marks from knowing what it said.", "voices": []}, "voices": []}]}, {"id": "ev45", "title": "Chapter Eighteen, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev45_1", "name": "Part 1", "text": "The next morning Adair met her in the hotel lobby, where a young woman waited. Aiyana recognized the officer from the day of the attack.\n\n“This is Officer Winterton.”\n\nA large white van marked “Animal Control” sat in the parking lot, gutted and fitted with surveillance equipment. A map of the island had pins stuck in odd areas; one on the cul-de-sac, another on Sakima’s house.\n\nWinterton helped her weave a wire-thin microphone in the hair behind her ear and clasp a camera in the form of a necklace around her throat.\n\n“If at anytime you feel you need us say ‘pineapple,’ and Winterton and I will be there in two minutes.”\n\nHe told her to give them half an hour before heading to Sakima’s house.", "choices": [{"label": "Walk up and knock", "to": "ev45_3"}, {"label": "Reach for the necklace", "to": "ev45_2"}], "voices": [["“This is Officer Wintert", "Adair"], ["A large white van marked", "Narrator"], ["“If at anytime you feel ", "Adair"]], "alt": {"text": "Aiyana headed over to the Esta-owey side of the island just before ten o’clock the next morning. Adair had called before sunrise to wake Aiyana up and tell her that he was on his way to the island.\n\nShe quickly showered and dressed and was ready to meet him in the lobby when he arrived. As she entered the lobby, her eyes landed on Adair leaning against the wall across from the elevator.\n\n“Good morning Ms. Gamelle,” he said as she walked closer.\n\nHe led her to the lobby seat where a young woman waited.\n\nShe recognized the young woman from the day of the attack. The officer was smaller than Aiyana remembered, average height but slim. Aiyana presumed that she could have lost weight in the preceding weeks. But, those large blue eyes were unforgettable. She remembered the officer’s determined face as she led as many people to the hotel doors as possible. Aiyana suddenly felt tense, not sure what to say to her, not sure what she knew or believed about that day.\n\n“This is Officer Winterton.” Adair said as the woman extended her hand.\n\n“I am so sorry for your loss; your grandmother and brother and all the people at the festival.” Aiyana held her sincere gaze and nodded in thanks.\n\n“Thank you for coming back to help.”\n\n“My pleasure.”\n\n“Okay, so let’s get started,” Adair said.\n\nHe led the way to the parking lot where a large white van marked “Animal Control” sat, and opened the side door. Officer Winterton entered first, followed by Aiyana and then Adair. The van was gutted and fitted with surveillance equipment. Aiyana noticed a map of the island with pins stuck in odd areas. She noted one pin was on the cul-de-sac another was on Sakima’s house. She turned from the map and Winterton took her through a crash course on the equipment in the van and how each of them worked together.\n\nWhen that was done, Winterton helped her weave a wire-thin microphone in the hair behind her ear and helped her clasp a camera in the form of a necklace around her throat. Adair pointed to the map before she left the van.\n\n“We are going to park the van inside of this neighborhood, which is about three miles from the Esta-owey line. If at anytime you feel you need us say ‘pineapple,’ and Winterton and I will be there in two minutes.” He paused for a moment and looked at her. “Are you sure you don’t want to involve at least the island police?”\n\nAiyana shook her head. “I can’t.”\n\nAdair had patted her on the shoulder and sent her back up to her room, telling her to give them half an hour to get in place before calling Sakima and heading to his house.", "voices": [["“Good morning Ms. Gamell", "Adair"], ["“This is Officer Wintert", "Adair"], ["“I am so sorry for your ", "Winterton"], ["“Thank you for coming ba", "Aiyana"], ["“My pleasure.”", "Winterton"], ["“Okay, so let’s get star", "Adair"], ["He led the way to the pa", "Narrator"], ["“We are going to park th", "Adair"], ["Aiyana shook her head. “", "Aiyana"]]}}, {"id": "ev45_2", "name": "NEW DRAFT: The necklace", "text": "At the bottom of his steps she put her hand to the necklace. She could unclasp it.\n\nThen she thought of every time she had been told to trust and wait by people who said they loved her, and where that had put Levi and Vivi.\n\nShe left it on.", "choices": [{"label": "Continue", "to": "ev45_3"}], "alt": {"text": "At the bottom of his steps she put her hand to the necklace. She could unclasp it. Drop it in the grass and walk in with nothing on her but the truth. Sakima had warned her.\n\nThen she thought of every time she had been told to trust and wait by people who said they loved her, and where that had put Levi and Vivi.\n\nShe left it on.", "voices": []}, "voices": []}, {"id": "ev45_3", "name": "Part 2", "text": "As Aiyana approached Sakima’s door she noticed that the security guards were missing. Sakima himself answered.\n\n“I’ve been going over the pages you sent.” “What did you tell the police?”\n\n“Nothing. But, that’s not going to keep them away.”\n\n“They can look but they won’t be able to see.”\n\nShe fiddled with the camera necklace. “Do you know if this spirit was first a person?”\n\n“Yes, she was. But, I don’t know what she did.”\n\n“I even remember the last time the spirit arrived and how your mother fought it.” “I was just a child. I snuck out of bed and watched some type of ceremony in our backyard from the window. I remember her belly was very big. I saw the spirit try to enter her.”", "choices": [], "voices": [["“I’ve been going over th", "Sakima"], ["“Nothing. But, that’s no", "Aiyana"], ["“They can look but they ", "Sakima"], ["She fiddled with the cam", "Aiyana"], ["“Yes, she was. But, I do", "Sakima"], ["“I even remember the las", "Sakima"]], "alt": {"text": "As Aiyana approached Sakima’s door she noticed that the security guards were missing. She knocked on the door and Sakima himself answered it quickly.\n\n“Come on in,” he said. “I’ve been going over the pages you sent.”\n\nSakima exhaled heavily and took a seat in the living area. That is when Aiyana noticed the spread out copies of the pages she scanned and sent to him. He pointed Aiyana to a chair across from him.\n\n“Would you like something to eat or drink?”\n\n“No thank you.”\n\n“What did you tell the police?”\n\n“Nothing. But, that’s not going to keep them away. They want real answers.”\n\n“They can look but they won’t be able to see.” He reminded her.\n\n“Like the witnesses at the stage?”\n\n“Yes,” he nodded, looking up from the pages on the table. Aiyana was sure that he was trying to read her.\n\n“Chief Sakima.” She broke eye contact and subconsciously fiddled with the camera necklace. “You said my brother’s writings tell the story of how the spirit was bound. Do you know if this spirit was first a person?”\n\n“Yes, she was. But, I don’t know what she did. Were you able to talk to your brother?” He looked hopeful.\n\n“I left him a message. My brother and sister left the island a few days ago.”\n\n“Oh. Where did they go?”\n\n“New York?”\n\n“They’re not coming back?”\n\n“I don’t think so.”\n\nHe nodded. “It usually happens like that. Everyone that can leave, does. This is a burden that I have carried for most of my life. I envy you that you grew up not knowing.” He looked at her again. “I envy people that are spared from seeing it or remembering. But, I remember. I even remember the last time the spirit arrived and how your mother fought it.”\n\nAiyana held her breath, hoping that he would tell her something new. Something that would help her figure a way out of this.\n\n“I was just a child. I was supposed to be in the house asleep. But, I knew that something important was happening. I snuck out of bed and watched some type of ceremony in our backyard from the window. I could see her very clearly. Your mother was dressed in Esta-owey clothes. She was lying on the ground. I remember her belly was very big. I saw the spirit try to enter her.”", "voices": [["“Come on in,” he said. “", "Sakima"], ["“Would you like somethin", "Sakima"], ["“No thank you.”", "Aiyana"], ["“What did you tell the p", "Sakima"], ["“Nothing. But, that’s no", "Aiyana"], ["“They can look but they ", "Sakima"], ["“Like the witnesses at t", "Aiyana"], ["“Yes,” he nodded, lookin", "Sakima"], ["“Chief Sakima.” She brok", "Aiyana"], ["“Yes, she was. But, I do", "Sakima"], ["“I left him a message. M", "Aiyana"], ["“Oh. Where did they go?”", "Sakima"], ["“New York?”", "Aiyana"], ["“They’re not coming back", "Sakima"], ["“I don’t think so.”", "Aiyana"], ["He nodded. “It usually h", "Sakima"], ["“I was just a child. I w", "Sakima"]]}}]}, {"id": "ev46", "title": "Chapter Eighteen, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev46_1", "name": "Part 1", "text": "“Don’t be afraid.” He touched Aiyana’s cheek. In an instant the air escaped her lungs. “Don’t fight it.”\n\nShe began to see herself through Sakima’s eyes. Then he forced himself to remember being five years old, watching her mother on the ground, face-to-face with a ghoulish spirit.", "choices": [{"label": "Let him take you through", "to": "ev46_3"}, {"label": "Hold on to yourself", "to": "ev46_2"}], "voices": [["“Don’t be afraid.” He to", "Sakima"]], "alt": {"text": "He stood up and walked around the table. He took a seat directly in front of her and looked her in the eye.\n\n“Don’t be afraid.” He carefully reached out and touched Aiyana’s cheek. In an instant the air escaped her lungs and she became breathless. She felt herself begin to black out but fought against it. She tried to move, but Sakima held her in place.\n\n“Don’t fight it,” he said calmly.\n\n“Stop,” she felt tears come to her eyes but felt powerless to push him away. Suddenly she began to see herself through Sakima’s eyes. He blinked several times then he forced himself to remember being five years old, watching a secret ceremony with her mother laying on the ground, face-to-face with a ghoulish spirit that was hovering over her.", "voices": [["“Don’t be afraid.” He ca", "Sakima"], ["“Don’t fight it,” he sai", "Sakima"], ["“Stop,” she felt tears c", "Aiyana"]]}}, {"id": "ev46_2", "name": "NEW DRAFT: Holding on", "text": "She dug in. She would not be carried anywhere by anyone ever again.\n\nThe memory blurred at its edges like breath on glass, and the child at the window began to fade.", "choices": [{"label": "Continue", "to": "ev46_3"}], "alt": {"text": "She dug in. She would not be carried anywhere by anyone ever again.\n\nThe memory blurred at its edges like breath on glass, and the child at the window began to fade.", "voices": []}, "voices": []}, {"id": "ev46_3", "name": "Part 2", "text": "“Push.”\n\nShe pushed herself past five-year-old Sakima’s vantage point to her mother, crying out in labor under the first blood moon, and was sucked into her.\n\n“Save my children.”\n\nAiyana reached out to push the spirit away but was sucked inside of it, and could truly feel her fear, her pain, her anguish. Again and again the spirit tried to enter her mother; she blocked it each time, until the blood moon eclipse ended and the spirit screeched and disappeared.\n\nThen she was back in her own body, her lungs burning.\n\n“I saw the ceremony, and i
