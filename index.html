y were free to live out their lives, starting with appointing a new chief. We were angry, of course. But we tried to put it behind us, enforcing the boundaries between them and us as much as possible. Charii’s spirit still visits from time to time.\n\n“A whole generation passed before the curse revealed itself. Charii’s spirit had somehow become dark and dangerous and she possessed her own daughter. She appeared every blood moon bringing forth demons to reign down terror and destruction on the island. We try to find the demons before they do too much harm.”\n\nUncle Max stood up, taking a torch from the wall and walking over to the cells. Aiyana and the others followed. Her breath caught in her throat. All three of them were occupied by young Esta-owey men; they looked at her with the same hatred that she usually felt from Sakima.\n\n“Why are they here?” Aiyana asked.\n\n“The demons come for people of the Esta-owey tribe chosen at random by Charii. A monster emerges from them during each blood moon, then they return to normal. They are the ones that killed those people on the island this week. Once they are identified, the Esta-owey bring them to us to keep everyone safe until the blood moon passes.”\n\n“One of the prison cells is empty,” Levi observed.\n\n“Yes, there is one that has not yet been identified.”", "voices": [["“Mawu,” Aiyana repeated ", "Aiyana"], ["“It didn’t take long for", "Uncle Max"], ["“One day the Esta-owey c", "Uncle Max"], ["“But the pregnancy weake", "Aunt Fey"], ["“What happened?” Aiyana ", "Aiyana"], ["“Rumors,” Aunt Helen rep", "Aunt Helen"], ["“As her pregnancy progre", "Aunt Helen"], ["“But, one night, Charii ", "Aunt Fey"], ["“The Elders placed the b", "Aunt Helen"], ["“Several weeks after we ", "Uncle Max"], ["“A whole generation pass", "Uncle Max"], ["“Why are they here?” Aiy", "Aiyana"], ["“The demons come for peo", "Uncle Max"], ["“One of the prison cells", "Levi"], ["“Yes, there is one that ", "Uncle Max"]]}}]}, {"id": "ev29", "title": "Chapter Ten, Part 3", "access": "pass", "price": 0, "scenes": [{"id": "ev29_1", "name": "Part 1", "text": "“Charii is going to return through me, isn’t she?” Aiyana asked.\n\n“Yes. For the duration of the next blood moon, and for every blood moon during the next seven years. The next blood moon is in two weeks.”\n\nAiyana asked about the signs the others were having. “Vivi can move small objects through the air. Eva is having visions. Lucas is writing some kind of foreign language.”\n\n“What kind of visions are you having, Eva?”", "choices": [{"label": "Shake your head", "to": "ev29_3"}, {"label": "Nod: let her tell them", "to": "ev29_2"}], "voices": [["“Charii is going to retu", "Aiyana"], ["“Yes. For the duration o", "Aunt Fey"], ["Aiyana asked about the s", "Levi"], ["“What kind of visions ar", "Aunt Fey"]], "alt": {"text": "A quiet fell over the pit that was deafening. Aiyana had a hard time soaking in the entirety of the story. “Charii is going to return through me, isn’t she?” She asked breaking the silence.\n\n“Yes,” Aunt Fey answered.\n\n“For how long?” Eva asked.\n\n“For the duration of the next blood moon, and for every blood moon during the next seven years.” Aunt Fey answered.\n\n“When is the next blood moon? How long will it last?” Levi asked impatiently.\n\n“Watch your tone,” Aunt Fey warned him sharply. “The next blood moon is in two weeks. The entire possession may last up to three hours.”\n\n“What happened to our mother?” Vivi took the opportunity to ask. Aiyana hoped to hear the full truth.\n\n“She died in child birth,” Aunt Fey repeated the same story.\n\n“What happened to our father?” Eva tested.\n\n“He left the island and never came back,” Uncle Max said.\n\n“What about the signs that the others are having?” Aiyana asked.\n\nThe Aunts and Uncle Max all looked confused.\n\n“What signs?” Aunt Helen asked.\n\n“Vivi can move small objects through the air. Eva is having visions. Lucas is writing some kind of foreign language,” Levi said.\n\n“What about you, Levi?” Uncle Max asked.\n\n“Nothing yet,” Levi answered.\n\n“What kind of visions are you having, Eva?” Aunt Fey asked.", "voices": [["A quiet fell over the pi", "Aiyana"], ["“Yes,” Aunt Fey answered", "Aunt Fey"], ["“For how long?” Eva aske", "Eva"], ["“For the duration of the", "Aunt Fey"], ["“When is the next blood ", "Levi"], ["“Watch your tone,” Aunt ", "Aunt Fey"], ["“What happened to our mo", "Vivi"], ["“She died in child birth", "Aunt Fey"], ["“What happened to our fa", "Eva"], ["“He left the island and ", "Uncle Max"], ["“What about the signs th", "Aiyana"], ["“What signs?” Aunt Helen", "Aunt Helen"], ["“Vivi can move small obj", "Levi"], ["“What about you, Levi?” ", "Uncle Max"], ["“Nothing yet,” Levi answ", "Levi"], ["“What kind of visions ar", "Aunt Fey"]]}}, {"id": "ev29_2", "name": "NEW DRAFT: Almost", "text": "Aiyana started to nod. Maybe it was time somebody said it out loud in this room.\n\nThen she saw how still Aunt Fey had gone, how she leaned toward Eva, hungry.", "choices": [{"label": "Continue", "to": "ev29_3"}], "alt": {"text": "Aiyana started to nod. Maybe it was time somebody said it out loud in this room.\n\nThen she saw how still Aunt Fey had gone, how she leaned toward Eva, hungry.", "voices": []}, "voices": []}, {"id": "ev29_3", "name": "Part 2", "text": "Eva looked to Aiyana, who intuitively gave her head a slight shake.\n\n“Just people and images,” Eva said evasively.\n\n“We do not know anything about these other signs. Have you told anyone else outside of yourselves about them?”\n\nAiyana could not help looking guilty. “I told Caleb, the night of Levi’s house party.”\n\n“We cannot trust any of them, Aiyana. It was their actions against Charii that have cursed us all.”\n\n“But, it is your mother that controls the curse. I’m going to talk to the Chief as soon as possible.”\n\n“Please Aiyana, don’t. Your mother tried and she ended up dying.”\n\n“Don’t worry. I won’t go alone.” She looked to Levi, who quickly nodded, and grabbed a torch from the wall. “Is there anything else you think that I should know?”\n\n“Your grandmother left you a diary,” Aunt Helen blurted. “It is in her bedside table.”\n\nAunt Fey’s expression registered shock.\n\n“Thank you,” Aiyana said and headed back up the stone staircase. She had a name for the person that was calling to her and needing to possess her.", "choices": [{"label": "Leave with Aiyana", "to": "END"}, {"label": "Follow Levi: stay in the pit", "to": "ev29_4"}], "voices": [["“Just people and images,", "Eva"], ["“We do not know anything", "Uncle Max"], ["Aiyana could not help lo", "Aiyana"], ["“We cannot trust any of ", "Aunt Fey"], ["“But, it is your mother ", "Aiyana"], ["“Please Aiyana, don’t. Y", "Aunt Fey"], ["“Don’t worry. I won’t go", "Aiyana"], ["“Your grandmother left y", "Aunt Helen"], ["“Thank you,” Aiyana said", "Aiyana"]], "alt": {"text": "Eva looked to Aiyana, who intuitively gave her head a slight shake.\n\n“Just people and images,” Eva said evasively. “I can’t really make it out.”\n\n“We do not know anything about these other signs,” Uncle Max said. He and the Aunts took a moment to think and look between each other.\n\n“Have you told anyone else outside of yourselves about them?” They looked at each other, shaking their heads. Aiyana could not help looking guilty.\n\n“What is it?” Levi jumped on her facial reaction.\n\n“I told Caleb, the night of Levi’s house party.”\n\n“And now the Esta-owey want an alliance,” Levi shook his head angrily.\n\n“Caleb doesn’t know anything about any of this,” Aiyana said. “He wouldn’t have said anything to the Esta-owey.”\n\n“If he did, do you really think he would tell you?” Aunt Fey asked.\n\n“If he knew anything about any of this, he’d get as far away as possible from this island and me. He would have never come back from New York,” Aiyana said.\n\n“We cannot trust any of them, Aiyana.” Aunt Fey tried to drive the point home. “It was their actions against Charii that have cursed us all.”\n\n“But, it is your mother that controls the curse.” Aiyana shook her head. “It seems to me that we have had this problem in common for far too long. I’m going to talk to the Chief as soon as possible.”\n\n“Don’t do it.” Aunt Fey said. “He’s just going to mislead you with lies and their version of what they think happened.”\n\n“Unlike you?” Aiyana countered.\n\n“Please Aiyana, don’t. Your mother tried and she ended up dying.”\n\n“In childbirth.” Levi said.\n\n“It was a result of the curse.” Aunt Fey tried to convince them. But Aiyana couldn’t see the logic in not talking to the people they were linked to by this curse.\n\n“Don’t worry. I won’t go alone.” She looked to Levi, who quickly nodded. “We only have until the blood moon to figure all of this out. We have to at least ask the Esta-owey what they know.”\n\n“Don’t go, we can figure this out as a family!” Aunt Fey said desperately. It was her desperation that made Aiyana want to go all the more. She looked to her Aunt Helen who turned away, pinching her crucifix. She looked at Uncle Max whose expression showed that he didn’t know what to say. “I love you, Aunt Fey. But, if we could have done this as a family, we would have by now.” Aiyana grabbed a torch from the wall. “Is there anything else you think that I should know?”\n\n“Your grandmother left you a diary,” Aunt Helen blurted. “It is in her bedside table.”\n\nAiyana looked to Aunt Fey whose expression registered shock. Aiyana wasn’t sure if Aunt Fey didn’t know about this diary, or knew about it but didn’t want Aiyana to know.\n\n“Thank you,” Aiyana said and headed back up the stone staircase. She got to the door and knocked.\n\nThe old woman answered it for her. Aiyana handed the old woman her torch and found her way to the path of solar lights. She was glad for the solitary walk back to the cottage. It had been much worse than she expected. But, still she didn’t feel surprised. She had a name for the person that was calling to her and needing to possess her.", "voices": [["“Just people and images,", "Eva"], ["“We do not know anything", "Uncle Max"], ["“Have you told anyone el", "Uncle Max"], ["“What is it?” Levi jumpe", "Levi"], ["“I told Caleb, the night", "Aiyana"], ["“And now the Esta-owey w", "Levi"], ["“Caleb doesn’t know anyt", "Aiyana"], ["“If he did, do you reall", "Aunt Fey"], ["“If he knew anything abo", "Aiyana"], ["“We cannot trust any of ", "Aunt Fey"], ["“But, it is your mother ", "Aiyana"], ["“Don’t do it.” Aunt Fey ", "Aunt Fey"], ["“Unlike you?” Aiyana cou", "Aiyana"], ["“Please Aiyana, don’t. Y", "Aunt Fey"], ["“In childbirth.” Levi sa", "Levi"], ["“It was a result of the ", "Aunt Fey"], ["“Don’t worry. I won’t go", "Aiyana"], ["“Don’t go, we can figure", "Aunt Fey|Aiyana|Aiyana"], ["“Your grandmother left y", "Aunt Helen"], ["“Thank you,” Aiyana said", "Aiyana"]]}}, {"id": "ev29_4", "name": "NEW DRAFT: Levi in the pit (sibling episode)", "text": "Aiyana had looked at Levi before she went, and the look had said stay and hear the rest.\n\nIt came out of Uncle Max in pieces.\n\n“And then five babies, one a day. And no mother at the end of it.”\n\nThen Levi saw Vivi, standing in front of the fourth cell, the open one, with her hand resting on the bars as if she were leaning on a gate at home.\n\n“Vivi. Come away from there.”\n\n“It’s cold,” she said, not moving. “Feel that? It’s colder right here.”\n\nLevi took his little sister by the shoulders and turned her around. He told himself that was all it took.", "choices": [{"label": "Return to Aiyana", "to": "END"}], "voices": [["“And then five babies, o", "Aunt Helen"], ["“Vivi. Come away from th", "Levi"], ["“It’s cold,” she said, n", "Vivi"]], "alt": {"text": "The door at the top of the stairs opened and closed. Aiyana’s footsteps went with it.\n\nLevi almost followed. He had followed her his whole life, a half step behind, where he could get between her and whatever was coming. But she had looked at him before she went, and the look had said stay and hear the rest.\n\n“Sit,” Aunt Fey said.\n\nNobody sat.\n\n“Our parents,” Eva said. “All of it.”\n\nIt came out of Uncle Max in pieces, like something he had to cough up. Imala and the Esta-owey boy had meant to run. Then she was pregnant. His people put him out. He went to the mainland to find work and came back when she was too far along to leave her bed.\n\n“And then?”\n\n“And then five babies, one a day.” Aunt Helen’s thumb worked at her crucifix. “And no mother at the end of it.”\n\n“And him?” Lucas asked.\n\n“Gone,” said Uncle Max.\n\nLevi watched Eva’s face. She had gone the color of the ash in the fire pit. She knew something about gone. She kept it behind her teeth, and he loved her for that, and it scared him.\n\nHe looked away from her, and that was when he saw Vivi.\n\nShe had drifted to the cells. Three young men stared out at her from three of them. She was not looking at the men. She stood in front of the fourth door, the open one, with her hand resting on the bars as if she were leaning on a gate at home.\n\n“Vivi. Come away from there.”\n\n“It’s cold,” she said, not moving. “Feel that? It’s colder right here.”\n\nLevi crossed the pit in four strides, took his little sister by the shoulders, and turned her around. He told himself that was all it took.", "voices": [["“Sit,” Aunt Fey said.", "Aunt Fey"], ["“Our parents,” Eva said.", "Eva"], ["“And then?”", "Eva"], ["“And then five babies, o", "Aunt Helen"], ["“And him?” Lucas asked.", "Lucas"], ["“Gone,” said Uncle Max.", "Uncle Max"], ["“Vivi. Come away from th", "Levi"], ["“It’s cold,” she said, n", "Vivi"]]}}]}, {"id": "ev30", "title": "Chapter Ten, Part 4", "access": "pass", "price": 0, "scenes": [{"id": "ev30_1", "name": "Part 1", "text": "She walked into the house and packed more clothes for the hotel, weighing a few options. She could lock herself in that pit. But a spirit powerful enough to return from the afterlife would figure a way. She could end her own life. But, what would stop Charii from using her sisters or her brothers? She could run away with Caleb. But the curse could end up killing people on the mainland.\n\nShe went to her grandmother’s room. In the side table drawer she found an old and flimsy journal. On the final pages was her mother’s name, in beautiful calligraphy.\n\nShe didn’t realize she was crying until a tear fell onto the cover. She wiped her eyes, zipped the diary into her suitcase, and carried it to the front where Levi waited for her.", "choices": [{"label": "Carry the case out yourself", "to": "ev30_3"}, {"label": "Show Levi the diary", "to": "ev30_2"}], "alt": {"text": "She walked into the house, bypassing her grandmother’s room and the diary Aunt Helen had finally told her about. She did not want to get her hopes up. The diary would most likely only rehash what she’d just heard.\n\nShe decided to pack more clothes for the hotel. She couldn’t see moving back into the cottage, ever. As she packed, she weighed a few options. She could lock herself in that pit. Let Charii wake up in the dungeon and spend the blood moon alone in the dark with her cursed ones. But, she had a feeling it wouldn’t matter. A spirit powerful enough to return from the afterlife would figure a way to do what she’d been doing for more than a century.\n\nShe could end her own life. But, what would stop Charii from using her sisters or her brothers? She could run away with Caleb. But, they would be out in the world when Charii came and the curse could end up killing people on the mainland. Then what if Caleb was the last one Charii decided to curse? What if after all of these years Caleb had known more than he let on?\n\nShe paused in the middle of her packing to think about that. Could Caleb look at her the way he did if he knew? Would he have been willing to wait for her to return for him at Levi’s after the handprints and the incident at the lighthouse? She picked up her cell phone and looked at the time. It was nearly three in the morning. It was then that she realized she hadn’t stayed long enough to ask about the handprints on Caleb and Mr. Rutledge. But, she was sure any new details would have only darkened her mood, making her more sad or angry.\n\nShe shut off those thoughts, getting up to go to her grandmother’s room. The body was gone but the scent of the Esta-owey flowers remained strong. She went to the side table and opened the drawer finding an old and flimsy journal. She thumbed through it noting a variation in writing styles as she turned the pages. Some pages contained beautiful drawings and calligraphy. She paused when she came to the final pages and noted her mother’s name, written in beautiful calligraphy on top. She swallowed, shutting the diary.\n\nShe closed the drawer to the side table and returned to her room. She sat back on the edge of the bed and placed the diary in her lap. She didn’t realize she was crying until a tear fell onto the cover and ran down the length of it.\n\nShe picked up her cell phone again and thought about calling Caleb. She heard the door to the cottage open and close. She wiped the remainder of the tears from her eyes, sniffed and cleared her throat as she placed the diary in her suitcase and zipped it up. She carried it to the front where Levi waited for her.", "voices": []}, "voices": []}, {"id": "ev30_2", "name": "NEW DRAFT: Mama’s name", "text": "“Aunt Helen told the truth about one thing,” Aiyana said, and unzipped the case for him to see the worn cover. “Mama’s name is in the back.”\n\nLevi did not reach for it. “Zip it up,” he said. “Don’t let them see you carry it out.”", "choices": [{"label": "Continue", "to": "ev30_3"}], "voices": [["“Aunt Helen told the tru", "Aiyana"], ["Levi did not reach for i", "Levi"]], "alt": {"text": "“Aunt Helen told the truth about one thing,” Aiyana said, and unzipped the case far enough for him to see the worn cover. “Mama’s name is in the back.”\n\nLevi looked at it for a long moment and did not reach for it.\n\n“Zip it up,” he said quietly. “Don’t let them see you carry it out.”", "voices": [["“Aunt Helen told the tru", "Aiyana"], ["“Zip it up,” he said qui", "Levi"]]}}, {"id": "ev30_3", "name": "Part 2", "text": "“Did they say more?”\n\n“Just about our parents. They were planning to run away, she became pregnant. He was banned from the tribe and went to the mainland to find work. She died in childbirth. Then he disappeared.”\n\n“Do you think they are lying?”\n\n“They’re obviously holding something back. It has to be to protect us.”\n\n“Or themselves.” Aiyana turned on the porch light, closing and locking the door behind them.", "choices": [], "voices": [["“Did they say more?”", "Aiyana"], ["“Just about our parents.", "Levi"], ["“Do you think they are l", "Aiyana"], ["“They’re obviously holdi", "Levi"], ["“Or themselves.” Aiyana ", "Aiyana"]], "alt": {"text": "“Are you okay?” He asked her as he took the case from her.\n\n“No,” she said honestly. “Did they say more?”\n\n“Just about our parents.” He shrugged. “They were planning to run away, she became pregnant. He was banned from the tribe and went to the mainland to find work. He didn’t come back until she was too far along to get out of bed. She died in childbirth. Then he disappeared. They still claimed not to know what happened to our father. Eva said nothing specific about her visions.”\n\n“Did you all mention the handprints?” Aiyana asked.\n\n“No, we didn’t,” he confessed. “I know I wasn’t even thinking about them.”\n\n“Me neither, honestly. How can you think of anything else when you hear a story like that?” She paused for a moment and looked at Levi intently. “Do you think they are lying?”\n\n“They’re obviously holding something back.” Levi conceded. “It has to be to protect us.”\n\n“Or themselves.” Aiyana turned on the porch light, closing and locking the door behind them.", "voices": [["“Are you okay?” He asked", "Levi"], ["“No,” she said honestly.", "Aiyana"], ["“Just about our parents.", "Levi"], ["“Did you all mention the", "Aiyana"], ["“No, we didn’t,” he conf", "Levi"], ["“Me neither, honestly. H", "Aiyana"], ["“They’re obviously holdi", "Levi"], ["“Or themselves.” Aiyana ", "Aiyana"]]}}]}, {"id": "ev31", "title": "Chapter Eleven, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev31_1", "name": "Part 1", "text": "The deaths on the island had put a definite cloud over the last day of the festival, but contractual obligations required Aiyana to be on the stage for Thump TV’s live broadcast of the crowning ceremony.\n\nHer brothers and sisters stood with her. Uncle Max was there, but Aunt Fey and Aunt Helen refused to give up their boycott, and Sakima and the Esta-owey elders had decided to forego the ceremony. Niara and Caleb were up front, and she took special note of a small group of young adults from the tribe.\n\nAiyana sat on a throne in one of Charii’s dresses, black silk with gold fibers. When Uncle Max placed the ceremonial crown on her head, she felt a strange sensation, much like the release of a long held breath. He announced her title, Queen Aiyana Nevaeh Gamelle of Sa’Fyre Island, and she stood to speak.\n\n“Today is a day of great joy as well as great sorrow…”\n\nThose were the only words she got out before a new voice took over.\n\n“Great sorrow…” The voice was low and creaky.\n\nAiyana tried to step back, to call for help, but could not move a muscle or utter a single word. She felt Charii’s exhilaration at finding herself at home inside of her.", "choices": [{"label": "Fight to step back", "to": "ev31_3"}, {"label": "Try to scream", "to": "ev31_3"}], "voices": [["“Today is a day of great", "Aiyana"], ["“Great sorrow…” The voic", "Charii"]], "alt": {"text": "The weather was near perfect for the last day of the festival. However, the deaths on the island had put a definite cloud over the event, making even the live performances seem like a chore as crowd numbers had dwindled by more than half. Niara did her best to fill in for Aiyana as much as possible, however contractual obligations required her to be on the stage for Thump TV’s live broadcast of the closing crowning ceremony. Niara assured her there was no way out of it without a large legal battle that would render the efforts of the festival completely in vain.\n\nHer brothers and sisters stood on the stage with her. Although Uncle Max was there, Aunt Fey and Aunt Helen refused to give up their boycott of the festival as a whole. When Aiyana took the stage for the last time, she looked out into the crowd and connected with the worried local faces among the somber visitors to the island. She let her eyes travel even further, deliberately looking for Sakima and the Esta-owey elders.\n\nBut, it seemed as if they had decided to forego the ceremony. Aiyana noted that Niara and Caleb were both up front and center. Other representation of the island’s Esta-owey tribe was scattered throughout the crowd. She felt a stronger bond with them now knowing what she knew about Charii and her curse. She took special note of a small group of young adults that hung out with the visiting burnouts. Two of Adair’s security guards stood in front of the stage facing the crowd as three more patrolled throughout the audience. Aiyana noted that Adair himself was not there as she went along with going through the motions of the ceremony.\n\nUncle Max performed his role somberly. Aiyana sat on a throne in what had once been one of Charii’s dresses, made of black silk with gold fibers; one of Niara’s ideas. Charii had been a smaller woman than Aiyana, so the dress had to be let out and altered to fit her. But there was something special about being encased in its historical beauty. Looking at her reflection earlier, she thought it just seemed right that she wear it.\n\nWhen Uncle Max lifted the ceremonial crown and placed it on top of her head, Aiyana felt a strange sensation flow through her. It was much like the release of a long held breath. He then turned to the audience and announced her full name and official title, Queen Aiyana Nevaeh Gamelle of Sa’Fyre Island. Aiyana knew that the ceremony was little more than pomp and circumstance for publicity on Thump TV, but she felt more pride in hearing the title with her name spoken aloud than she had expected.\n\nWhen Uncle Max gave her the cue to stand and give her first official address as the Queen of the Island, she stood at the podium with just a few words on her mind.\n\n“Today is a day of great joy as well as great sorrow…”\n\nThose were the only words of the short speech she had prepared that made it past her lips before her breath seemed to get caught up in her throat. She felt her control of her voice falter as a new voice took over.\n\n“Great sorrow…” The voice was low and creaky.\n\nAiyana tried to take a step back from the podium, but found that she was unable to move a muscle. Ice-cold terror began to fill the pit of her stomach as she tried to call for help but could not utter a single word. Her body began to move, seemingly on its own. A very self assured presence made itself known in her mind and she felt Charii’s exhilaration at finding herself at home inside of her.", "voices": [["“Today is a day of great", "Aiyana"], ["“Great sorrow…” The voic", "Charii"]]}}, {"id": "ev31_3", "name": "Part 2", "text": "But, she was early… way too early. Aiyana could see everything Charii saw, and the vengeance she had in mind.\n\n“I was going to wait until the blood moon as usual, but I heard that there is…” She breathed deep. “… new blood for my creatures to sample today and I decided to give my would-be averters a true taste of what is to come!”\n\nLightning struck near the stage, and the Thump TV cameras and every camera phone crushed in on themselves.\n\n“Now that it is just us,” Charii said smugly, “It is time for me to anoint the final cursed one.” She focused on the young adults from the Esta-owey tribe. “I can smell the blood of those five that tried and failed to end me!”  “I can feel all of that traitorous blood in your veins, my dear Aiyana, and in your brothers and sisters as well.”\n\nShe turned on Uncle Max, who cowered.\n\n“Never realizing that the power I gave is and always will be the power I control!”\n\nCharii stretched a hand out, but to Aiyana’s horror, not at him. At Vivi. Her tiny body rose in the air, screaming, as Levi and Lucas reached for her.\n\nEveryone around the stage backed off, including Niara, but no one thought to run.", "choices": [], "voices": [["“I was going to wait unt", "Charii"], ["“Now that it is just us,", "Charii"], ["“Never realizing that th", "Charii"]], "alt": {"text": "But, she was early… way too early. Charii felt a great sense of pleasure as she stretched her arms and her legs, as if seeking to banish a phantom rigor mortis.\n\n“Oh yes!” Charii murmured, “That is so nice! I haven’t stretched like that in a long, long time.” Her laugh was terrifying and shrill.\n\nAiyana struggled against the feeling of paralysis. She could see everything that Charii saw and feel everything that Charii felt. She could even read snippets of Charii’s thoughts and emotions, seeing the vengeance she had in mind.\n\n“Thank you, ladies and gentlemen for attending this very momentous occasion. Blah… blah… blah… So forth and so on and etcetera.” Charii had no need for the podium and microphone to project her shrew-like cackle over the audience. “I was going to wait until the blood moon as usual, but I heard that there is…” She took in a long deep breath. “… new blood for my creatures to sample today and I decided to give my would-be averters a true taste of what is to come!”\n\nAiyana felt mentally sick, as if stuck in a nightmare, as Charii shared her evil bloodthirsty thoughts and visions. Charii lifted her hands in the air once again and began to mumble in a language that was becoming more familiar to Aiyana as she recognized from the few times she’d locked eyes with Sakima and the words Aunt Helen had chanted the day before at the pit. From the corner of her eye Aiyana could see Niara and Caleb watching in the same confusion as the rest of the crowd. She desperately tried to break free of Charii’s hold, wanting to scream at everyone to run, but she couldn’t.\n\n“Allow me to introduce myself!” Charii shouted as the clouds over the Island began to darken and rumble. “They call me Charii. I am the one and only Queen of this island!”\n\nLightning struck an electrical pole near the stage as Charii drew her hands back towards her body and pumped them up once again. Aiyana felt an overwhelming energy course through her limbs and in the next moment the cameras held up by the Thump TV crew, as well as small cameras and camera phones, crushed in on themselves. At the same time the winds around the island picked up.\n\n“Now that it is just us,” Charii said smugly, “It is time for me to anoint the final cursed one.” She smoothed her hands over the silk dress moaning with more pleasure than normal. “I’ve always loved this dress.” It seemed to be a comment directed to Aiyana but she couldn’t be certain. Aiyana could feel the near erotic pleasure that Charii felt at the thought of what she was about to do.\n\n“I can smell that Esta-owey blood.” Charii focused on the group of young adults from the Esta-owey tribe. “I can smell the blood of those five that tried and failed to end me!” Charii moved her hands over Aiyana’s body. “I can feel all of that traitorous blood in your veins, my dear Aiyana, and in your brothers and sisters as well.”\n\nIt scared her that Charii was, in fact, talking directly to her. But the information that she relayed was even more frightening and confusing.\n\n“Yes. It’s so much fun to always be the bearer of the truth to my progeny’s progeny. Oh, these wayward humans with their half-truths. Will they ever learn?” Charii clicked her tongue several times as she turned her eyes on Uncle Max. He seemed to shrink as he cowered in her presence. “Never realizing that the power I gave is and always will be the power I control!”\n\nCharii stretched a hand out, but to Aiyana’s horror her energy was not directed at Uncle Max but Vivi. Her tiny body began to rise in the air. Aiyana tried harder to fight against Charii’s hold but didn’t know how. She watched as Levi reached for Vivi, trying to bring her back to the ground as she screamed in terror. Lucas began to do the same as Eva looked on in shock.\n\nEveryone around the stage backed off, including Niara, but no one thought to run.", "voices": [["“Oh yes!” Charii murmure", "Charii"], ["“Thank you, ladies and g", "Charii"], ["“Allow me to introduce m", "Charii"], ["“Now that it is just us,", "Charii"], ["“I can smell that Esta-o", "Charii"], ["“Yes. It’s so much fun t", "Charii"]]}}]}, {"id": "ev32", "title": "Chapter Eleven, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev32_1", "name": "Part 1", "text": "“Aiyana?” Caleb headed towards the stage. Charii flung her arm and slammed him onto the ground, pinned.\n\n“Be with you in just a minute, lover boy,” Charii said sweetly.\n\nLevi stood on a chair, reaching around Vivi’s waist in vain. Charii chanted, and Aiyana, still frozen, watched her tiny sister convulse, screaming in pain.", "choices": [{"label": "Push against her", "to": "ev32_3"}, {"label": "Reach for Vivi", "to": "ev32_3"}], "voices": [["“Aiyana?” Caleb headed t", "Caleb"], ["“Be with you in just a m", "Charii"]], "alt": {"text": "“Aiyana?” Charii turned to see Caleb headed towards the stage. She flung her arm and he was thrown up, then slammed down hard onto the ground. He tried to get up but somehow Charii kept him pinned into place.\n\n“Be with you in just a minute, lover boy,” Charii said sweetly then turned to look once again in Vivi’s distinct direction. Levi stood on a chair reaching around Vivi’s waist in order to get her back to the ground, but all of his efforts were in vain.\n\nAiyana continued to try breaking free of Charii’s possession, but still found that she was frozen in place. Again Charii chanted her foreign spell and Aiyana watched as Vivi began to twist and convulse. Charii forced Aiyana to watch as her tiny sister flayed in the air, screaming in pain. Aiyana could hear one security guard speaking into his walkie talkie, but it was apparent that nothing was getting through.", "voices": [["“Aiyana?” Charii turned ", "Caleb"], ["“Be with you in just a m", "Charii"]]}}, {"id": "ev32_3", "name": "Part 2", "text": "Vivi’s skin began to melt from her body. The crowd finally panicked. Uncle Max pulled Lucas and Eva off stage towards the cottage. Niara struggled to help Caleb to his feet, then ran for her life.\n\nThe skin sizzled from Vivi’s body and dripped onto Levi, who refused to let her go. Her skeletal frame elongated, producing four extra limbs with razor sharp tips. One jettisoned through Levi’s upper torso, forcing him to finally let go. He stumbled backwards, reaching towards Aiyana. With the wave of a hand, Charii flung him off of the stage. Aiyana heard a sickening thud as he fell onto his neck, blood pooling around him.\n\nBullets ricocheted from Vivi’s arachnid skeleton. A lone security officer hit Charii in the arm; Aiyana felt the white hot pain. Charii snapped her fingers and the guard’s body snapped into two jagged pieces.\n\nThe Vivi creature let Charii pet its head while chanting as if giving a blessing. Then it turned on the stragglers gridlocked in the parking lot, ripping and chewing through flesh and bone.\n\n“Now, to adjust the power structure here!” Charii shouted and walked towards the cottage, her unseen force dragging Caleb along the ground behind her. She passed Levi’s body without a second glance. Didn’t she care that she’d cursed one of her descendants and that curse had killed another?\n\n“Mortality is weakness,” Charii answered coldly.", "choices": [{"label": "Stay with Aiyana", "to": "END"}, {"label": "Follow Levi: on the stage", "to": "ev32_4"}, {"label": "Follow Vivi: inside the change", "to": "ev32_5"}, {"label": "Follow Eva: off the stage", "to": "ev32_6"}], "voices": [["“Now, to adjust the powe", "Charii"], ["“Mortality is weakness,”", "Charii"]], "alt": {"text": "Suddenly, Vivi’s skin began to melt from her body. Charii turned with delight, looking into the crowd as they finally began to panic and disperse. One officer, a woman with large, determined blue eyes, calmly guided the majority of the crowd to the safety of the resort tower. Aiyana noted that she returned again and again to help break up pushing and encourage an orderly retreat. Two other officers tried to help the fallen get to their feet as quickly as possible to avoid being trampled. The fourth continued to try and hail Adair on the radio with no luck.\n\nUncle Max took Lucas, who was in shock, firmly by the hand and grabbed Eva, who screamed in terror, and pulled them off stage. Aiyana noted that they ran in the direction of the cottage. As Charii turned to track their movements, Aiyana noted the crowd as it fought to get away. However, their efforts turned into a mob, mercilessly trampling over each other, slowing their own progress, and making the fate of those weakest among them inevitable. Aiyana could see Niara struggling to help Caleb to his feet, but it was useless.\n\n“Go!” He finally screamed at her. She staggered away from him looking towards Aiyana and the stage. Her eyes fell on Vivi’s morphing body, then she turned and ran for her life.\n\nCharii turned in time to allow Aiyana to watch as the skin sizzled from Vivi’s body and drip onto Levi, who refused to let her go. Her skin oozed over him, falling to the ground as her skeletal frame elongated producing four extra limbs with razor sharp tips, as her original hands and feet became claws. Levi cried out in disbelief and pain as one of those limbs jettisoned through his upper torso forcing him to finally let go of the creature that had come from Vivi. The horrific screech that came from the animal was deafening.\n\nLevi stumbled backwards and turned, reaching towards Aiyana who desperately wanted to catch him in her arms and stop the bleeding. With the wave of a hand, Charii flung him far off of the stage. Aiyana could hear a sickening thud as Levi fell awkwardly from the stage onto his neck. She watched in pain and grief as a puddle of blood formed around him. Her resolve to fight against Charii began to wane as she realized there was nothing she could do to stop her.\n\nAiyana heard the gunfire and watched bullets ricochet from Vivi’s arachnid skeleton. Charii turned to see a lone security officer aiming at her. He squeezed off three more shots, hitting Charii in the arm. Aiyana felt the white hot pain shoot through her limb. Charii recovered quickly from the pain and snapped her fingers. In response the security guard’s body snapped into two jagged pieces, twisting to the ground.\n\nCharii turned away from the security guard as the Vivi creature lowered to the ground and made its way towards her, allowing her to pet her head while chanting as if giving her a blessing. Aiyana got a good look into the face of the creature no more than a breath from her own face. Her sister’s eyes were set ablaze in yellow with a freakish green tint. Her giant arachnid skeletal form seemed to have a near metallic feel.\n\nAiyana doubled down and once again tried to force Charii out of her body to no avail. She then tried to will her sister to break free but in the next instant, the creature turned to attack the crowd. Aiyana feared for Caleb who was stuck to the ground. But the animal didn’t seem interested in him.\n\nA good portion of the crowd had managed to make it into the hotel. However, the stragglers were in a gridlock running through the parking lot. The creature made its way to them, stepping, clawing, ripping and chewing through flesh and bone that was much too fragile to put up a resistance.\n\n“Now, to adjust the power structure here!” Charii shouted and walked purposefully from the stage towards the cottage. She waved a hand in Caleb’s direction and her unseen force dragged him along the ground behind her. Aiyana took note of Levi’s fallen bloody body as Charii passed him without a second glance. Didn’t she care that she’d cursed one of her descendants and that curse had killed another?\n\n“Mortality is weakness,” Charii answered coldly.", "voices": [["“Go!” He finally screame", "Caleb"], ["“Now, to adjust the powe", "Charii"], ["“Mortality is weakness,”", "Charii"]]}}, {"id": "ev32_4", "name": "NEW DRAFT: Levi’s last minute (sibling episode)", "text": "Vivi weighed nothing, and he could not pull her down an inch.\n\n“I got you, Vivi. I’m not letting go.”\n\nHeat came through her dress. Then it was not her dress he was holding. He thought, very clearly: this is what I am for.\n\nSomething struck him below the collarbone and went on through. He reached for Aiyana, wanting to tell her it was not her.\n\nShe lifted her hand, and it was not her hand, and the stage went out from under him.\n\nLevi’s path ends here.", "choices": [{"label": "Return to Aiyana", "to": "END"}], "voices": [["“I got you, Vivi. I’m no", "Levi"]], "alt": {"text": "Vivi weighed nothing. That was the first wrong thing. Levi had picked his little sister up a hundred times, to tease her, to lift her out of his way, and she had always been solid and kicking. Now she hung in the air above the stage like something on a string, and when he climbed the chair and locked his arms around her waist he could not pull her down an inch.\n\n“I got you,” he said into her back. “I got you, Vivi. I’m not letting go.”\n\nShe was screaming. Under the scream he could hear Aiyana’s voice saying words that were not Aiyana’s, and under that, Lucas shouting his name.\n\nHeat came through Vivi’s dress. Then it was not her dress he was holding.\n\nHe did not let go. He thought, very clearly, the way he thought when he was checking the locks at night: this is what I am for. Not visions. Not writing. Not things that floated. Somebody had to be the one with his arms around them.\n\nSomething struck him below the collarbone and went on through. His arms opened without his say.\n\nHe stumbled back and turned, and found his sister at the podium in the black and gold dress. Aiyana. He reached for her. He wanted to tell her it was all right. He wanted to tell her it was not her.\n\nShe lifted her hand, and it was not her hand, and the stage went out from under him.\n\nLevi’s path ends here.", "voices": [["“I got you,” he said int", "Levi"]]}}, {"id": "ev32_5", "name": "NEW DRAFT: Vivi inside the change (sibling episode)", "text": "Up. Then the burning, and then no Vivi to burn.\n\nWhat was left was hunger and a great many legs. A voice out of its sister’s mouth said something like a blessing. Go.\n\nIt went.\n\nLater there was a street, and the taste. Vivi stood on her own two feet again.\n\n“Aiyana?” Her mouth was full. She swallowed. “What happened?”", "choices": [{"label": "Return to Aiyana", "to": "END"}], "voices": [["“Aiyana?” Her mouth was ", "Vivi"]], "alt": {"text": "Up. That was all there was at first. The stage dropping away, and Levi’s arms around her middle, and her own voice going on and on somewhere outside her.\n\nThen the burning, and then no Vivi to burn.\n\nWhat was left was hunger and a great many legs. It knew the smell of the crowd the way a body knows water. It did not know the man who would not let go, only that he was in the way, and then that he was not.\n\nA hand came down on its head. A voice it had always known, speaking out of its sister’s mouth, said something that felt like a blessing. Go.\n\nIt went.\n\nLater there was a street, and quiet, and the taste. Vivi stood on her own two feet again with nothing on and the evening air on her skin, and saw a shape she knew kneeling over a shape she knew.\n\n“Aiyana?” Her mouth was full. She swallowed. “What happened?”", "voices": [["“Aiyana?” Her mouth was ", "Vivi"]]}}, {"id": "ev32_6", "name": "NEW DRAFT: Eva running (sibling episode)", "text": "“Don’t look back,” Uncle Max said.\n\nShe looked back. Aiyana stood at the podium with her hands lifted like a preacher’s, and she was smiling. That was what Eva carried away.\n\nAt the cottage Aunt Fey shut her and Lucas in Aiyana’s room.\n\nShe heard her sister’s voice in the living room, sweet and pleased and old, saying, “My children.”\n\nShe had seen this, weeks ago, and called it a dream.", "choices": [{"label": "Return to Aiyana", "to": "END"}], "voices": [["“Don’t look back,” Uncle", "Uncle Max"], ["She heard her sister’s v", "Charii"]], "alt": {"text": "Uncle Max’s hand closed on her arm hard enough to bruise. Eva was still screaming when he dragged her off the stage, Lucas stumbling on his other side with his mouth open and no sound in it.\n\n“Don’t look back,” Uncle Max said. “You hear me? You don’t look back.”\n\nShe looked back. Vivi was in the air. Levi was on a chair with his arms around her. Aiyana stood at the podium in the black and gold dress with her hands lifted like a preacher’s, and she was smiling.\n\nThat was what Eva carried away with her. Not the thing Vivi was turning into. The smile.\n\nThey ran for the cottage with the crowd breaking around them. Aunt Helen had the door open. Aunt Fey pushed them down the hall and into Aiyana’s room and said, “Not a sound. Whatever you hear,” and shut them in.\n\nLucas slid down the wall with his hands over his ears. Eva stood at the door.\n\nShe heard the front door open. She heard her sister’s voice in the living room, sweet and pleased and old, saying, “My children.”\n\nShe had seen this. Weeks ago, in the dark, with her eyes shut. She had seen it and called it a dream.", "voices": [["“Don’t look back,” Uncle", "Uncle Max"], ["They ran for the cottage", "Aunt Fey"], ["She heard the front door", "Charii"]]}}]}, {"id": "ev33", "title": "Chapter Eleven, Part 3", "access": "pass", "price": 0, "scenes": [{"id": "ev33_1", "name": "Part 1", "text": "Charii stepped into the cottage calmly, flinging Caleb into a chair as she faced the Aunts and Uncle Max. All of them bowed to her in Aiyana’s body.\n\n“My children.”\n\n“You are early.”\n\n“Yes, I am,” Charii acknowledged, “But I had to see for myself what all of the festival and talk of meeting with the Esta-owey chief was about. Not another betrayal?”\n\n“Please, Mother, there was nothing we could do. By the time we knew what was happening Imala was already dying. It was either kill the children and end your existence or raise them and salvage what we could for your return.”\n\nThey had willingly set them up for this. But, why?\n\nAunt Helen pinched her crucifix.\n\n“Are you now a Christian, my child?” Charii waved a hand, dragging Aunt Helen across the floor and lifting her until she hung choking from the chain of the cross.\n\n“Thou shalt have no…”", "choices": [{"label": "Push with everything you have", "to": "ev33_3"}, {"label": "Feel for where she ends", "to": "ev33_2"}], "voices": [["“My children.”", "Charii"], ["“You are early.”", "Uncle Max"], ["“Yes, I am,” Charii ackn", "Charii"], ["“Please, Mother, there w", "Aunt Fey"], ["“Are you now a Christian", "Charii"], ["“Thou shalt have no…”", "Charii"]], "alt": {"text": "Charii seemed to sense that her children had all congregated in the cottage, waiting for her arrival. Aiyana could read anger and anguish in Charii’s thoughts as she approached the house. Memories flashing through Charii’s mind reached Aiyana in broken fragments giving her a vivid view of the death and destruction Charii had caused on the island for so many years.\n\nCharii opened the door with a calmness that Aiyana had not expected. She stepped into the house, bringing Caleb to his feet and flinging him into a chair as she faced the Aunts and Uncle Max. All of them bowed to her in Aiyana’s body.\n\n“My children.” Charii took a breath in and out as if trying to decide what to say next.\n\n“You are early.” Uncle Max was the first to address her.\n\n“Yes, I am,” Charii acknowledged, “But I had to see for myself what all of the festival and talk of meeting with the Esta-owey chief was about. Not another betrayal?”\n\n“No, mother,” Aunt Helen pleaded. “We would not allow such a thing.”\n\n“That is what you said last time, but now I see that this flesh is coursing with the blood of the ones that tried to kill me!”\n\nAiyana could see Caleb, eyes wide with fear sitting frozen in the chair, his clothes smudged with dirt. He looked from her Aunts and Uncle and then back to her again as he tried to catch up with the conversation.\n\nAunt Fey stood tall and faced Charii bravely. “We played no part in her mother’s union with the Esta-owey.”\n\n“That is not good enough!”\n\nAunt Fey flinched as if she had been struck.\n\nCharii pointed to Caleb and Aiyana wished a prayer for her not to hurt him. She tried to let Charii know that she would do anything. But Charii ignored her.\n\n“Please, Mother, there was nothing we could do. By the time we knew what was happening Imala was already dying. It was either kill the children and end your existence or raise them and salvage what we could for your return.”\n\nAiyana’s disbelief was beyond words. They had willingly set them up for this, working to ensure Charii’s return. But, why?\n\n“What of the Esta-owey?” Charii asked, looking at Caleb. “How have you punished them?”\n\n“Their plan failed, Mother.” Aunt Helen pinched her crucifix. Aiyana caught Charii’s emotional reaction to this.\n\n“Are you now a Christian, my child?” The question was both genuine and ridiculing. Charii really wanted to know if Aunt Helen worshiped a being more than herself.\n\nAiyana could see the indecision on Aunt Helen’s face. Would she admit to being devoted to Jesus and risk Charii’s wrath or would she lie?\n\n“Aiyana seems to think that you are very devoted to Jesus.”\n\n“Mother, please.” Charii waved a hand pushing Aunt Helen to the floor. She twisted and jerked as the same hand dragged Aunt Helen across the space between them. She lifted the hand bringing Aunt Helen to her feet and then to her tiptoes as she hung and began to choke from the chain of the cross.\n\n“Thou shalt have no…”", "voices": [["“My children.” Charii to", "Charii"], ["“You are early.” Uncle M", "Uncle Max"], ["“Yes, I am,” Charii ackn", "Charii"], ["“No, mother,” Aunt Helen", "Aunt Helen"], ["“That is what you said l", "Charii"], ["Aunt Fey stood tall and ", "Aunt Fey"], ["“That is not good enough", "Charii"], ["“Please, Mother, there w", "Aunt Fey"], ["“What of the Esta-owey?”", "Charii"], ["“Their plan failed, Moth", "Aunt Helen"], ["“Are you now a Christian", "Charii"], ["“Aiyana seems to think t", "Charii"], ["“Mother, please.” Charii", "Aunt Helen"], ["“Thou shalt have no…”", "Charii"]]}}, {"id": "ev33_2", "name": "NEW DRAFT: Edges", "text": "Aiyana quit fighting the hands and went looking for the edges of her instead, the place where Charii stopped and she began. It was like feeling along a wall in the dark for a door.", "choices": [{"label": "Continue", "to": "ev33_3"}], "alt": {"text": "Aiyana quit fighting the hands and went looking for the edges of her instead, the place where Charii stopped and she began. It was like feeling along a wall in the dark for a door.", "voices": []}, "voices": []}, {"id": "ev33_3", "name": "Part 2", "text": "Charii stopped midsentence and Aunt Helen dropped to the floor. Aiyana gave a strong mental push and felt Charii’s spirit drift from her body: for a split second an angry demon with a woman’s face, nothing like the portrait. Then it disappeared.\n\nAiyana looked to her Aunts and Uncle in clear mistrust. Caleb rocked back and forth in fear.\n\n“Levi!” She ran back to the stage.\n\nHis body lay in a twisted heap on a pool of blood. She rocked him, sobbing. He was gone.\n\n“Aiyana?” Vivi stood naked on the street behind her, covered in blood from head-to-toe. She licked her trembling lips, swallowing the last of the blood. “What happened?”", "choices": [], "voices": [["“Levi!” She ran back to ", "Aiyana"], ["“Aiyana?” Vivi stood nak", "Vivi"]], "alt": {"text": "Charii stopped midsentence and Aunt Helen dropped to the floor. Aiyana could feel Charii’s control weakening and her strength return. Aiyana gave a strong mental push and felt Charii’s spirit drift from her body. Her legs gave way underneath her and she crumpled to the floor. Aiyana looked up and for a split second the spirit took on a ghoulish form of a very angry demon with a woman’s face and physique. But the face was long and slim with features that looked nothing like the portrait of the woman. The demon’s eyes turned on Aiyana and she felt as if it was about to try to reenter her, but instead it simply disappeared.\n\nAiyana looked to her Aunts and Uncle in clear mistrust and disbelief for a moment then she turned to see Caleb rocking back and forth in fear. Everyone remained frozen until she remembered her brother’s fallen body outside.\n\n“Levi!” She gasped and backed out of the cottage, running back to the cul-de-sac stage, eyes blazing, tears burning, and heart breaking.\n\nHis body was still there, lying in a twisted heap on top of a pool of blood. Aiyana fell next to him, placing her hand over his wound and cradling his neck on her arm. His strong and handsome face was ashen and sagging with the loss of blood. His skin was cool to the touch.\n\n“Levi,” She whispered bringing his body closer to her. “Please, Levi, no…” she felt sobs raking through her body and she rocked Levi’s remains, willing him to come back. “No!” She screamed with all of the grief she felt from the core of her own soul. He was gone and no amount of wishing or praying would bring him back.\n\n“Aiyana?” Vivi’s trembling voice came from behind her. Aiyana clutched Levi protectively not sure what form her sister would be in. She turned quickly to see her sister standing naked on the street, covered in blood from head-to-toe, with blood still flowing from her mouth. Vivi licked her trembling lips, swallowing the last of the blood. “What happened?”", "voices": [["“Levi!” She gasped and b", "Aiyana"], ["“Levi,” She whispered br", "Aiyana"], ["“Aiyana?” Vivi’s trembli", "Vivi"]]}}]}, {"id": "ev34", "title": "Chapter Twelve, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev34_1", "name": "Part 1", "text": "Aiyana left Vivi with her Aunts and Uncle, who promised to take her, Lucas and Eva to the cave for safety, and headed back to the bodies and blood on Main Street.\n\nAdair left Levi’s body to give her a hug.\n\n“Yes, the witnesses said that a pack of wild dogs came out of nowhere and attacked the crowd. They said your brother was killed trying to wrestle one to the ground after it tore into Officer Lane.”\n\nHe tied a handkerchief above the bullet wound in her arm and led her to the ferry.\n\nChief Sakima stood among the Esta-owey covering the bodies, his eyes searching the crowd. Somehow she knew that he was looking for her. She let her eyes glow yellow and he broke into a run. The gate to the ferry was about to close.", "choices": [{"label": "Hold the ferry for Sakima", "to": "ev34_3"}, {"label": "Let the gate close", "to": "ev34_2"}], "voices": [["“Yes, the witnesses said", "Adair"]], "alt": {"text": "Aiyana helped Vivi to the cottage where her Aunts and Uncle promised that they would take her, Lucas and Eva to the cave for safety. Caleb had already left and she was certain that he was now packing for New York. Aiyana did not know if she should trust her siblings to their care, but she also knew that there was a mess of bodies and blood on Main Street that she had to see to.\n\nShe grabbed an armload of sheets from the linen closet and headed back to the cul-de-sac. By the time she got there, the scene was crawling with Adair’s men. Aiyana felt a mixture of relief and anxiety when her eyes landed on Adair squatting over Levi’s body.\n\nHe caught sight of her as she approached and she took note of his obvious relief at seeing her alive. He quickly came to her and gave her a hug. She’d never in her life known a father’s love but was certain it would have been very close to the emotions that spilled from Adair.\n\n“I am so glad that you are okay,” he began. “It appears those wild animals were a lot more dangerous than we anticipated.”\n\n“Wild animals?” Aiyana asked, confused.\n\n“Yes, the witnesses said that a pack of wild dogs came out of nowhere and attacked the crowd. They said your brother was killed trying to wrestle one to the ground after it tore into Officer Lane.”\n\n“Oh,” Aiyana blinked several times, unsure of what to say. Adair gave her a comforting squeeze and she winced.\n\nHe pulled back and looked her over noting the bullet wound in her arm. He quickly took a handkerchief from his pocket and tied it around her arm, above the wound.\n\n“You need to get to the hospital,” he said urgently.\n\n“What about..?”\n\nAiyana looked at the scene, trying to find life among the bodies that littered the street. When she found none, tears welled up in her eyes and she began to sob again. There was nothing but death. She’d felt the demon’s blood thirst and knew that this was only a fraction of the destruction she’d had planned for the day.\n\nShe let Adair lead her from the scene to the ferry. As they walked, Aiyana took note of a group of Esta-owey who, along with the elders, were helping to cover up the bodies, chanting the same solemn funeral call. She noted that Chief Sakima was on the scene as well, looking over the horror in what appeared to Aiyana to be a solemn understanding of what had happened. His eyes traveled over the crowd then towards the dock. Somehow she knew that he was looking for her. She did the only thing that she could think of to let him know where she was.\n\nShe let her eyes glow yellow and he immediately started towards her, breaking into a run as Adair got her onto the ferry that was already crammed with the day’s survivors. The gate to the ferry was about to close.", "voices": [["“I am so glad that you a", "Adair"], ["“Wild animals?” Aiyana a", "Aiyana"], ["“Yes, the witnesses said", "Adair"], ["“Oh,” Aiyana blinked sev", "Aiyana"], ["“You need to get to the ", "Adair"], ["“What about..?”", "Aiyana"]]}}, {"id": "ev34_2", "name": "NEW DRAFT: Old grudges", "text": "Aiyana said nothing. Let the gate close. Let him stand on the dock.\n\nThen her arm throbbed and her sight grayed at the edges, and she understood that she did not have the luxury of old grudges.", "choices": [{"label": "Continue", "to": "ev34_3"}], "alt": {"text": "Aiyana said nothing. Let the gate close. Let him stand on the dock with the rest of them.\n\nThen her arm throbbed and her sight grayed at the edges, and she understood that she did not have the luxury of old grudges.", "voices": []}, "voices": []}, {"id": "ev34_3", "name": "Part 2", "text": "“Wait!” Aiyana shouted, halting the ferry conductor. “Let him on,” she ordered.\n\nSakima took her hand and began to chant. A wave of bliss flowed from his hand over her body and took the pain away. “How did you…?”\n\nThen she blacked out.", "choices": [{"label": "Stay with Aiyana", "to": "END"}, {"label": "Follow Lucas: three days in the pit", "to": "ev34_4"}], "voices": [["“Wait!” Aiyana shouted, ", "Aiyana"], ["Sakima took her hand and", "Aiyana"]], "alt": {"text": "“Wait!” Aiyana shouted, halting the ferry conductor long enough for Sakima to make it to the ferry. “Let him on,” she ordered when it seemed the conductor was about to refuse him. Adair cleared a space for them on a bench. People moved quickly when they noted the stream of blood coming from Aiyana’s arm.\n\nShe could feel herself begin to get lightheaded and welcomed the pressure of Adair’s hands on her arm. Sakima sat next to her and took her by the other hand. She could hear him begin to chant and at his touch she began to feel an amazing sense of euphoria that took the pain of the wound away. A wave of bliss flowed from his hand through her arm and over her body. As it washed over her she managed to form the words, “How did you…?”\n\nThen she blacked out.", "voices": [["“Wait!” Aiyana shouted, ", "Aiyana"], ["She could feel herself b", "Aiyana"]]}}, {"id": "ev34_4", "name": "NEW DRAFT: Lucas in the pit (sibling episode)", "text": "They told Vivi on the first night.\n\n“You killed your brother,” Aunt Fey said.\n\nVivi folded, slow, like paper in water, and walked into the fourth cell herself.\n\nEach time Lucas climbed out of the pit his phone lit with Aiyana’s name, until Eva turned it face down on the stone.\n\n“She was smiling, Lucas.”\n\n“Dat wasn’t her.”\n\nHe sat against Vivi’s bars and wrote on the old Gullah woman’s brown paper, because his hand would not stop: shapes he could not read. Vivi pushed her plate back out, untouched.\n\n“It ain’t me that’s hungry,” she whispered. “I won’t feed it.”", "choices": [{"label": "Return to Aiyana", "to": "END"}], "voices": [["“You killed your brother", "Aunt Fey"], ["“She was smiling, Lucas.", "Eva"], ["“Dat wasn’t her.”", "Lucas"], ["“It ain’t me that’s hung", "Vivi"]], "alt": {"text": "They told Vivi on the first night. Lucas would have waited. Aunt Fey did not believe in waiting.\n\n“You killed your brother,” she said, the way you would tell somebody the time. “And more besides. It was not you and it was you. Both those things gonna be true the rest of your life.”\n\nVivi did not scream. That came later. First she just folded, slow, like paper in water.\n\nThey put her in the fourth cell. She walked into it herself.\n\nThere was no signal down in the pit. Every time Lucas climbed up for air his phone lit with the same name. Aiyana. Aiyana. Aiyana. The third time, Eva took it out of his hand and turned it face down on the stone.\n\n“She dun even know what she did,” Lucas said.\n\n“I know what she did. I watched her do it.” Eva’s voice shook. “She was smiling, Lucas.”\n\n“Dat wasn’t her.”\n\n“Then who do we bury Levi for? Who do I get to hate?”\n\nHe had no answer. He sat down with his back against Vivi’s bars and wrote, because his hand would not stop: row after row across a sheet of brown paper the old Gullah woman had given him, shapes he could not read, faster than he had ever written anything.\n\nBehind him Vivi pushed the plate back out under the door, untouched.\n\n“Eat somethen,” he said.\n\n“It ain’t me that’s hungry,” she whispered. “I won’t feed it.”\n\nHe kept writing. It was the only thing in that hole that felt like it was for something.", "voices": [["“You killed your brother", "Aunt Fey"], ["“She dun even know what ", "Lucas"], ["“I know what she did. I ", "Eva"], ["“Dat wasn’t her.”", "Lucas"], ["“Then who do we bury Lev", "Eva"], ["“Eat somethen,” he said.", "Lucas"], ["“It ain’t me that’s hung", "Vivi"]]}}]}, {"id": "ev35", "title": "Chapter Twelve, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev35_1", "name": "Part 1", "text": "She awoke in a hospital bed with Caleb at her side.\n\n“I don’t know what happened. I must have been on my way and blacked out on the road or I fell…”\n\nThe only word that came out her mouth was a name, and it wasn’t Caleb’s. “Sakima,” she rasped.\n\nDisappointment showed in his eyes. “He’s in the hallway.”\n\nShe had gone into cardiac arrest in the ambulance and lain there three days. The demon would be back in less than two weeks. When the doctor left, Sakima entered.\n\n“You know what really happened at the stage?”\n\n“Yes, she came earlier than expected, and in daylight. She is stronger now.”\n\n“Who?”\n\n“The demon you call Charii,” he all but growled.\n\nThe face she had seen looked nothing like the portrait of Charii in the cottage living room.\n\n“It’s not Charii,” Aiyana said. “I felt her get weak and pushed her out, and then I saw her. But, she’s coming back.”\n\n“Should I kill myself?”\n\nSakima flinched. “You did not know she was coming? You did not welcome her?”\n\n“Of course not.”\n\n“They have always known. Your mother knew and she wanted to stop her.”\n\n“How was she going to stop her?”\n\n“I cannot tell you here.” He turned his head towards the door. “Your Aunt is in the hallway.”", "choices": [{"label": "Take his hand", "to": "ev35_3"}, {"label": "Ask why you should trust him", "to": "ev35_2"}], "voices": [["“I don’t know what happe", "Caleb"], ["The only word that came ", "Aiyana"], ["Disappointment showed in", "Caleb"], ["“You know what really ha", "Aiyana"], ["“Yes, she came earlier t", "Sakima"], ["“Who?”", "Aiyana"], ["“The demon you call Char", "Sakima"], ["“It’s not Charii,” Aiyan", "Aiyana"], ["“Should I kill myself?”", "Aiyana"], ["Sakima flinched. “You di", "Sakima"], ["“Of course not.”", "Aiyana"], ["“They have always known.", "Sakima"], ["“How was she going to st", "Aiyana"], ["“I cannot tell you here.", "Sakima"]], "alt": {"text": "She awoke in a hospital bed, connected to an IV with her arm bandaged tight. She tried to lift her head but it was impossible. A low grunt escaped her throat and she soon found Caleb standing by her side.\n\n“Aiyana?” His voice was knotted with worry. “Can you hear me? I’m so sorry I wasn’t able to make it to the festival. I don’t know what happened. I must have been on my way and blacked out on the road or I fell…” he trailed off, trying to remember what had happened.\n\nAiyana swallowed as she shifted her eyes to him. She wanted to tell him to not worry, that everything would be just fine. But the only word that came out her mouth was a name, and it wasn’t Caleb’s.\n\n“Sakima,” she rasped, closing her eyes against the pain of a dry mouth and a sore throat.\n\nShe could see the shock and disappointment in Caleb’s eyes, but she didn’t have the time or energy to explain why she needed to see him.\n\n“Please…” she continued.\n\n“He’s in the hallway.” Caleb nodded. “He wants to talk to you, too. But, I’ll get your doctor to look at you first.”\n\nAiyana smiled grimly as Caleb left her side, exiting the room. She wondered how long she had been out. She tried to remember anything beyond getting onto the ferry and taking Sakima’s hand, but she couldn’t. She did remember the horror of the demon’s surprise return. Then she remembered Vivi being cursed and Levi’s fallen body.\n\nBy the time the doctor entered Aiyana had begun to cry.\n\n“Now, now,” his calm voice tried to soothe her. “The worst of it is over.” He took her hand and squeezed reassuringly. “I’m going to adjust your bed so that you are sitting up. Then I’ll give you a quick exam, okay?”\n\n“Okay,” Aiyana croaked.\n\n“Yeah, your voice will be a little strained,” he said as he adjusted the bed. “You went into cardiac arrest in the ambulance and stopped breathing. We had to take you into the ER and put you on a respirator.”\n\nWhen she was seated up completely, she saw that a nurse stood just to the side ready to take notes.\n\n“How long have I been here?” She asked, feeling the fog of their drugs beginning to lift.\n\n“You’ve been here for three days, young lady,” he informed. She felt a bit of panic and it was reflected in her monitors. “Calm down, you’re okay now.”\n\nAiyana wished that she could tell him just how wrong he was about that. It seemed like yesterday, she’d had two weeks to prepare for Charii’s return. But, she had just slammed into her. And as horrible as it had been, the demon would be back in less than two weeks. She was anything but okay. She lay quietly as the doctor examined her and called out his notes to the nurse.\n\n“We did have to give you a little bit of blood.” He informed her when the exam was over. “I want to keep you here for one more night and if all is well tomorrow morning, I will release you.”\n\nAiyana smiled and thanked him. He left the room and soon after Sakima entered.\n\n“What did you do to me?” She asked immediately.\n\n“I slowed your heart rate to decrease the blood loss.”\n\n“How did you do it?”\n\n“Magic,” he said without missing a beat.\n\n“Esta-owey magic?”\n\nHe shrugged. “Magic is magic.”\n\n“You know what really happened at the stage?” Aiyana asked.\n\n“Yes, she came earlier than expected, and in daylight. She is stronger now.”\n\n“Who?”\n\nSakima looked her deep in the eye, allowing his long held hatred to finally show.\n\n“The demon you call Charii,” he all but growled.\n\nAiyana remembered looking at the demon face-to-face. The slim face with straight nose and high cheekbones had looked nothing like the cherished portrait of Charii that hung in the cottage living room.\n\n“It’s not Charii,” Aiyana said.\n\nSakima looked at her sharply. “How do you know?”\n\n“I… I saw her… it.” Aiyana explained.\n\n“How?”\n\nAiyana shrugged and shook her head. “I felt her get weak and pushed her out, and then I saw her. But, she’s coming back.”\n\nSakima seemed to struggle a little bit with this information.\n\n“I know,” he finally replied.\n\n“Should I kill myself?”\n\nAiyana watched Sakima flinch in response.\n\n“You did not know she was coming? You did not welcome her?”\n\n“Of course not.” Aiyana scoffed. “Why would I?”\n\nSakima seemed to take his time answering her. He took in a deep breath and looked at her.\n\n“They have always known. Your mother knew and she wanted to stop her.”\n\n“How?” Aiyana felt a surge of desperate hope. “How was she going to stop her?”\n\n“I cannot tell you here.” He turned his head towards the door. “Your Aunt is in the hallway.”", "voices": [["“Aiyana?” His voice was ", "Caleb"], ["“Sakima,” she rasped, cl", "Aiyana"], ["“Please…” she continued.", "Aiyana"], ["“He’s in the hallway.” C", "Caleb"], ["“Now, now,” his calm voi", "Doctor"], ["“Okay,” Aiyana croaked.", "Aiyana"], ["“Yeah, your voice will b", "Doctor"], ["“How long have I been he", "Aiyana"], ["“You’ve been here for th", "Doctor"], ["“We did have to give you", "Doctor"], ["“What did you do to me?”", "Aiyana"], ["“I slowed your heart rat", "Sakima"], ["“How did you do it?”", "Aiyana"], ["“Magic,” he said without", "Sakima"], ["“Esta-owey magic?”", "Aiyana"], ["He shrugged. “Magic is m", "Sakima"], ["“You know what really ha", "Aiyana"], ["“Yes, she came earlier t", "Sakima"], ["“Who?”", "Aiyana"], ["“The demon you call Char", "Sakima"], ["“It’s not Charii,” Aiyan", "Aiyana"], ["Sakima looked at her sha", "Sakima"], ["“I… I saw her… it.” Aiya", "Aiyana"], ["“How?”", "Sakima"], ["Aiyana shrugged and shoo", "Aiyana"], ["“I know,” he finally rep", "Sakima"], ["“Should I kill myself?”", "Aiyana"], ["“You did not know she wa", "Sakima"], ["“Of course not.” Aiyana ", "Aiyana"], ["“They have always known.", "Sakima"], ["“How?” Aiyana felt a sur", "Aiyana"], ["“I cannot tell you here.", "Sakima"]]}}, {"id": "ev35_2", "name": "NEW DRAFT: Why now", "text": "“You grabbed me when I was a child,” Aiyana said. “You have looked at me like poison my whole life. Why would you help me now?”\n\n“Because I was wrong about what you were. And because nobody else on this island can.”", "choices": [{"label": "Continue", "to": "ev35_3"}], "voices": [["“You grabbed me when I w", "Aiyana"], ["“Because I was wrong abo", "Sakima"]], "alt": {"text": "“You grabbed me when I was a child,” Aiyana said. “You have looked at me like poison my whole life. Why would you help me now?”\n\n“Because I was wrong about what you were.” He said it without flinching. “And because nobody else on this island can.”", "voices": [["“You grabbed me when I w", "Aiyana"], ["“Because I was wrong abo", "Sakima"]]}}, {"id": "ev35_3", "name": "Part 2", "text": "“Help me,” it took all her strength to lift her hand and take his.\n\n“Killing yourself isn’t the answer. If you want to stop her, come to my family home on the Esta-owey lands. I will show you what I can and tell you what I know of your parents and how they thought they could stop… the demon forever.”\n\n“Thank you, Sakima.”", "choices": [], "voices": [["“Help me,” it took all h", "Aiyana"], ["“Killing yourself isn’t ", "Sakima"], ["“Thank you, Sakima.”", "Aiyana"]], "alt": {"text": "“Help me,” it took an insane amount of strength for her to lift her hand and take his. “I cannot go through that again. I cannot powerlessly watch her blood vengeance. I’d rather be dead.”\n\n“Killing yourself isn’t the answer. If you want to stop her, come to my family home on the Esta-owey lands. I will show you what I can and tell you what I know of your parents and how they thought they could stop… the demon forever. I will go home and prepare for you.”\n\n“Thank you, Sakima.”", "voices": [["“Help me,” it took an in", "Aiyana"], ["“Killing yourself isn’t ", "Sakima"], ["“Thank you, Sakima.”", "Aiyana"]]}}]}, {"id": "ev36", "title": "Chapter Twelve, Part 3", "access": "pass", "price": 0, "scenes": [{"id": "ev36_1", "name": "Part 1", "text": "He nodded and left. Aunt Helen came quickly to Aiyana’s side.\n\n“How much did she show you?”\n\n“She didn’t show me anything, Aunt Helen.”\n\n“Jesus,” Aunt Helen kissed her cross. “He saved me from her. I should have told you the truth long ago. I thought there would be more time… please forgive me.”", "choices": [{"label": "Demand the truth", "to": "ev36_3"}, {"label": "Tell her what forgiveness costs", "to": "ev36_2"}], "voices": [["“How much did she show y", "Aunt Helen"], ["“She didn’t show me anyt", "Aiyana"], ["“Jesus,” Aunt Helen kiss", "Aunt Helen"]], "alt": {"text": "He nodded in response then left the room. Aunt Helen, who quickly came to Aiyana’s side, followed his exit.\n\n“What do you know? What did he say? How much did she show you?” Aunt Helen asked desperately.\n\n“She didn’t show me anything, Aunt Helen.”\n\n“Jesus,” Aunt Helen pinched her cross and kissed it. “He saved me from her. I should have told you the truth long ago. I thought there would be more time… please forgive me.”", "voices": [["“What do you know? What ", "Aunt Helen"], ["“She didn’t show me anyt", "Aiyana"], ["“Jesus,” Aunt Helen pinc", "Aunt Helen"]]}}, {"id": "ev36_2", "name": "NEW DRAFT: Forgiveness", "text": "“I can’t forgive what I don’t know,” Aiyana said.\n\nAunt Helen flinched as though that were worse than anger.", "choices": [{"label": "Continue", "to": "ev36_3"}], "voices": [["“I can’t forgive what I ", "Aiyana"]], "alt": {"text": "“I can’t forgive what I don’t know,” Aiyana said.\n\nAunt Helen flinched as though that were worse than anger.", "voices": [["“I can’t forgive what I ", "Aiyana"]]}}, {"id": "ev36_3", "name": "Part 2", "text": "“Tell me everything you know,” Aiyana demanded.\n\n“Charii, she’s my mother.” Tears sprung into her eyes. “When I saw her in bed, gutted and bloodied… God help me, I wanted vengeance. So, when it first happened I thought it was justice. It’s happening to you, Vivi and poor Levi. It needs to end.”\n\n“How do we end it?”\n\n“In the diary…”\n\nThe door opened, cutting her off. Aunt Fey and Uncle Max entered. Aiyana asked about Vivi.\n\n“She is safe. She refuses to eat. She is in the… cell now. We’ll keep her there until the funeral.”\n\n“That demon was hell bent on a lot more destruction. Something… stopped her.”\n\nAunt Fey looked worried. Aiyana sat back, certain the true answers would be with the Esta-owey.", "choices": [], "voices": [["“Tell me everything you ", "Aiyana"], ["“Charii, she’s my mother", "Aunt Helen"], ["“How do we end it?”", "Aiyana"], ["“In the diary…”", "Aunt Helen"], ["“She is safe. She refuse", "Aunt Fey"], ["“That demon was hell ben", "Aiyana"]], "alt": {"text": "“Tell me everything you know,” Aiyana demanded.\n\n“Charii, she’s my mother.” Aiyana watched as tears sprung into her eyes. “She came all the way across the ocean to be with us… such a terrible place. I was so young. When I saw her in bed, gutted and bloodied… God help me, I wanted vengeance. I wanted to see the people responsible suffer. So, when it first happened I thought it was justice. They were getting what they deserved.”\n\nAunt Helen paused to cross herself. “I never thought she was… I mean I knew she was angry and the curse was terrible. I thought it was temporary, but then it happened again, and again, and again. It’s happening to the innocent. It’s happening to you, Vivi and poor Levi. It needs to end.” Tears ran down her face as Aunt Helen began to sob.\n\n“How?” Aiyana asked. “How do we end it?”\n\n“In the diary…”\n\nThe door to Aiyana’s room opened cutting off Aunt Helen’s confession. Aunt Fey and Uncle Max entered.\n\n“Hello,” Aunt Fey said sharply looking from Aunt Helen to Aiyana. “How are you feeling?”\n\n“I’m fine. How is Vivi?” Aiyana asked.\n\n“She is safe. She refuses to eat.” Aunt Fey relayed. “We told her what happened and she went hysterical. She is in the… cell now. We’ll keep her there until the funeral. But, she’ll have to go back directly afterwards.”\n\n“She’s in that dungeon!” Aiyana felt her blood pressure rise.\n\n“Calm down,” Aunt Fey ordered. “That is the safest place for her until after the blood moon and you know it.”\n\n“Where is Levi?” Aiyana was beyond angry with them. She knew deep inside that they could have stopped this curse long ago if they’d wanted to. But, they hadn’t. It was shameful and disgusting.\n\n“Levi’s body is at the funeral home with your grandmother now. We plan to bury them at the same time.”\n\nAiyana gave a curt nod.\n\n“Something stopped her.” Aiyana blurted out.\n\n“Excuse me?” Aunt Fey looked confused.\n\n“That demon was hell bent on a lot more destruction. Something… stopped her.”\n\nAunt Fey looked to Aunt Helen and Uncle Max who both seemed just as surprised by the news. Aiyana was satisfied with Aunt Fey’s worried look. Aunt Helen’s words and behavior made it clear that all she had ever gotten from them were half-truths and possibly lies. She sat back, certain the true answers would be with the Esta-owey.", "voices": [["“Tell me everything you ", "Aiyana"], ["“Charii, she’s my mother", "Aunt Helen"], ["Aunt Helen paused to cro", "Aunt Helen"], ["“How?” Aiyana asked. “Ho", "Aiyana"], ["“In the diary…”", "Aunt Helen"], ["“Hello,” Aunt Fey said s", "Aunt Fey"], ["“I’m fine. How is Vivi?”", "Aiyana"], ["“She is safe. She refuse", "Aunt Fey"], ["“She’s in that dungeon!”", "Aiyana"], ["“Calm down,” Aunt Fey or", "Aunt Fey"], ["“Where is Levi?” Aiyana ", "Aiyana"], ["“Levi’s body is at the f", "Aunt Fey"], ["“Something stopped her.”", "Aiyana"], ["“Excuse me?” Aunt Fey lo", "Aunt Fey"], ["“That demon was hell ben", "Aiyana"]]}}]}, {"id": "ev37", "title": "Chapter Thirteen", "access": "pass", "price": 0, "scenes": [{"id": "ev37_1", "name": "Part 1", "text": "Aiyana was released the following morning, and Caleb saw her back to the hotel.\n\nEva and Lucas did not answer her calls. When the last one went unanswered she threw the phone into the television.\n\nShe was the demon’s chosen vessel, an enemy to everyone on the island. She wanted to die. But, she believed Sakima when he said that would not help.\n\nWhen Caleb offered to sleep next to her, Aiyana shook her head sadly.", "choices": [{"label": "Ask what he knows", "to": "ev37_3"}, {"label": "Tell him to go home", "to": "ev37_2"}], "alt": {"text": "Aiyana was released from the hospital the following morning. Caleb came to see her back to her room at the hotel. She did not trust her Aunts or Uncle, nor did she want to go back to the cottage or Levi’s house.\n\nShe wished that she could see Eva and Lucas, but they had not come to visit her in the hospital. She reasoned that was due to them having seen her doing such terrible things while being possessed by Charii. She needed them to help her get Vivi out of that prison pit. She called several times, but they did not answer. She left messages trying to explain, but her messages were not returned. It hurt her to think that her siblings would not answer her call. That they let her mourn Levi and worry about Vivi alone crushed her heart. When the last call went unanswered she threw the phone across the room into the television.\n\nShe began to cry as she remembered predicting dying in the cottage alone. Eva had sworn it would never happen. Aiyana had wanted to believe that, but now she couldn’t see a way to bridge the gap between them. She was the demon’s chosen vessel and she knew that made her an enemy to everyone on the island, including her family.\n\nCaleb cleaned up the pieces of phone and television as best he could, and then called the desk to ask for her to be moved into another room. Aiyana was so very grateful for his help even as she felt undeserving. She wanted to just end it all. She wanted to die. But, she believed Sakima when he said that would not help.\n\nCaleb helped her to her new room and then helped her into bed. When he offered to sleep next to her, Aiyana shook her head sadly.", "voices": []}, "voices": []}, {"id": "ev37_2", "name": "NEW DRAFT: Go home", "text": "“Go home, Caleb. Go back to New York while you still can.”\n\n“No.”\n\n“You don’t even remember what it did to you.”\n\n“Then tell me.” He sat on the edge of the bed. “Tell me, or ask me what I know. But I’m not going.”", "choices": [{"label": "Continue", "to": "ev37_3"}], "voices": [["“Go home, Caleb. Go back", "Aiyana"], ["“No.”", "Caleb"], ["“You don’t even remember", "Aiyana"], ["“Then tell me.” He sat o", "Caleb"]], "alt": {"text": "“Go home, Caleb. Go back to New York while you still can.”\n\n“No.”\n\n“You don’t even remember what it did to you.”\n\n“Then tell me.” He sat down on the edge of the bed, out of reach, the way she had asked. “Tell me, or ask me what I know. But I’m not going.”", "voices": [["“Go home, Caleb. Go back", "Aiyana"], ["“No.”", "Caleb"], ["“You don’t even remember", "Aiyana"], ["“Then tell me.” He sat d", "Caleb"]]}}, {"id": "ev37_3", "name": "Part 2", "text": "“Do you know… what actually happened, Caleb?”\n\n“I do know,” he whispered. “Sakima… explained it to me when I confronted him about being at the hospital. He says I can’t remember, because I wasn’t chosen to. I choose to be here, right now with you.”\n\n“Why aren’t you afraid?”\n\n“Because I love you. I will not leave this island without you.”\n\nShe turned away, remembering the lighthouse. He pulled her into his arms anyway. She believed him, and l
