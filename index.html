t was you that pushed Charii away, wasn’t it?”\n\n“Don’t tell anyone what you saw.” He pointed to Lucas’ writing. “As I read what we have so far, there is a word that can be read as binding, but it can also mean blood sacrifice.”\n\n“If this is a spirit that was bound and has escaped, the spirit needs to be exorcised. If it was a blood sacrifice, an unwilling blood sacrifice, then there needs to be an atonement.” “If you are the vessel, then they planned to either exorcise the spirit from you or they plan to use you to spill the four bloodlines as the atonement.”\n\n“I need to teach you how to access your power, but not now. Can you come back later tonight?”\n\n“Of course. And just so you know, either way I’m willing to fight, and I’m willing to be the atonement if it means getting rid of this spirit forever.”\n\nSakima’s face showed that he didn’t like the thought of that.", "choices": [], "voices": [["“Push.”", "Sakima"], ["“Save my children.”", "Imala"], ["“I saw the ceremony, and", "Sakima"], ["“Don’t tell anyone what ", "Sakima"], ["“If this is a spirit tha", "Sakima"], ["“I need to teach you how", "Sakima"], ["“Of course. And just so ", "Aiyana"]], "alt": {"text": "“Push.” She heard Sakima’s voice echo and knew exactly what he meant.\n\nShe pushed herself past five-year-old Sakima’s vantage point. She felt herself gliding across the distance to her mother. She was crying out in pain. It was obvious to Aiyana that she was in labor. Aiyana knelt next to her mother and tried to comfort her. She looked up and saw the spirit’s agitated expression as the hours ticked on during the transition’s first blood moon. Aiyana tried to shield her mother from it. But as she reached out to touch her, she found that she was sucked into her and could see everything from her mother’s vantage point.\n\n“Charii?” She could feel rather than hear her mother’s terrified question.\n\n“No, I am here to protect you.”\n\n“Save my children,” her mother requested.\n\nAiyana could see the terrifying spirit over her mother. She reached out to push the spirit away but found she was once again sucked inside of the spirit looking down from her vantage point.\n\nThe spirit could feel her, but Aiyana could truly feel the spirit, too; her fear, her pain, her anguish. The spirit pushed Aiyana out. She felt the world spin around herself and found that she was once again looking at the spirit’s ghoulish face through her mother’s eyes. The spirit tried to enter again, but Aiyana reached out and this time focused on pushing her away. She did it. Again and again, the spirit tried to enter her mother. She blocked it each time. The spirit looked up to the moon and Aiyana could see the blood moon eclipse was ending.\n\nThe spirit screeched and disappeared. Aiyana felt herself being pulled back to young Sakima’s point of view. He looked at her and she looked at him. Then she was looking at herself again through Sakima’s eyes. Flashes of his memories came to her. She saw memories of learning of the curse, learning Esta-owey magic, being made chief.\n\nHe blinked and she opened her eyes. She was back in her own body. Her lungs were burning for oxygen. She fell back as Sakima removed his hand. She took in several ragged breaths.\n\n“What the hell was that?” She asked as she licked her now dry lips, then swallowed as she felt parched.\n\n“Spirit walk, of sorts,” he hurried out of the room and returned quickly with a bottle of water. He opened it and handed it to her and rubbed her back.\n\nAiyana took in big gulps of the water, grateful that it was cool and refreshing.\n\n“Did you see?” she asked him.\n\n“I saw the ceremony, and it was you that pushed Charii away, wasn’t it?”\n\n“I was really there.” Aiyana swallowed.\n\n“Don’t tell anyone what you saw.”\n\n“Why not?”\n\n“I think that first we need to get the rest of this story.” He said pointing to Lucas’ writing. “As I read what we have so far, there is a word that can be read as binding, but it can also mean blood sacrifice.”\n\n“Oh.”\n\n“Which needs to be handled completely different.”\n\n“What is the difference?”\n\n“If this is a spirit that was bound and has escaped, the spirit needs to be exorcised. If it was a blood sacrifice, an unwilling blood sacrifice, then there needs to be an atonement.”\n\nSakima took a breath in and out.\n\n“There is something you are holding back.” Aiyana said.\n\n“If you are the vessel, then they planned to either exorcise the spirit from you or they plan to use you to spill the four bloodlines as the atonement.”\n\n“They?”\n\n“The plan originated with our elders.” Sakima pointed out.\n\n“Right, and according to the journal this plan has been in motion since close to the curse’s beginning. One of your early Esta-oweys visited Charii’s great granddaughter and said something about merging the bloodlines.”\n\nSakima shook his head as Aiyana took on the full weight of the alternatives. She would have to fight the evil spirit or sacrifice herself to it.\n\n“We only have a week,” she murmured.\n\n“Right, okay. I need to teach you how to access your power, but not now. Can you come back later tonight?”\n\n“Of course.” She stood up to leave and he showed her to the door. “And just so you know, either way I’m willing to fight, and I’m willing to be the atonement if it means getting rid of this spirit forever.”\n\nSakima’s face showed that he didn’t like the thought of that.", "voices": [["“Push.” She heard Sakima", "Sakima"], ["“Charii?” She could feel", "Imala"], ["“No, I am here to protec", "Aiyana"], ["“Save my children,” her ", "Imala"], ["“What the hell was that?", "Aiyana"], ["“Spirit walk, of sorts,”", "Sakima"], ["“Did you see?” she asked", "Aiyana"], ["“I saw the ceremony, and", "Sakima"], ["“I was really there.” Ai", "Aiyana"], ["“Don’t tell anyone what ", "Sakima"], ["“Why not?”", "Aiyana"], ["“I think that first we n", "Sakima"], ["“Oh.”", "Aiyana"], ["“Which needs to be handl", "Sakima"], ["“What is the difference?", "Aiyana"], ["“If this is a spirit tha", "Sakima"], ["“There is something you ", "Aiyana"], ["“If you are the vessel, ", "Sakima"], ["“They?”", "Aiyana"], ["“The plan originated wit", "Sakima"], ["“Right, and according to", "Aiyana"], ["“We only have a week,” s", "Aiyana"], ["“Right, okay. I need to ", "Sakima"], ["“Of course.” She stood u", "Aiyana"]]}}]}, {"id": "ev47", "title": "Chapter Nineteen, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev47_1", "name": "Part 1", "text": "When Aiyana pulled into the resort parking lot she was confused to see that the van was already there. Adair opened the door and pulled her inside.\n\n“Aiyana, you entered the house and then started talking to yourself.”\n\n“What?” She shook her head “No, Sakima was there.”\n\n“We recorded it.”\n\nAiyana watched the video feed from the camera on her necklace. There was no one else there. Even the papers on the table were missing.\n\n“I want to take you to a facility.”\n\n“No, please. I have to meet Sakima tonight. There is only a week left.”\n\nAdair produced a pair of handcuffs and Aiyana tried to get out and run, but Winterton forced her to the ground.\n\n“We’ll inform your Aunts and Uncle. Is there anyone else you want me to call?”", "choices": [{"label": "Ask for your brother and sister", "to": "ev47_3"}, {"label": "Ask for Sakima", "to": "ev47_2"}], "voices": [["“Aiyana, you entered the", "Adair"], ["“What?” She shook her he", "Aiyana"], ["“We recorded it.”", "Adair"], ["“I want to take you to a", "Adair"], ["“No, please. I have to m", "Aiyana"], ["“We’ll inform your Aunts", "Adair"]], "alt": {"text": "As Aiyana drove back to the resort, she wondered how long it would take Adair to get back to the parking lot. When she pulled in she was confused to see that they were already there. She got out of the car and headed over to the van, knocking on the door.\n\nAdair opened it with a grim face and pulled her inside.\n\n“How did you get back so quickly?”\n\n“Aiyana, you entered the house and then started talking to yourself,” Adair informed her.\n\n“What?” She shook her head “No, Sakima was there. We were talking about the… curse.”\n\n“You were talking about a curse, but there was no one else with you.”\n\n“No. He was there with a print out of writings that came from my brother.”\n\n“Aiyana you were alone, talking to yourself,” Adair repeated. “We recorded it.”\n\n“Let me see.”\n\nAiyana felt agitated as she watched the video feed from the camera on her necklace. It was true. She opened the door and began talking, but there was no one else there. Even the papers on the table were missing.\n\n“I don’t understand,” she whispered.\n\nWinterton unclasped her necklace and helped unwind the camera from her hair.\n\n“I don’t know what’s going on.” Aiyana began to cry.\n\nWinterton handed Aiyana a tablet.\n\n“Do you remember sleepwalking the first night of the festival?” Adair asked.\n\n“How did you know about that?” Aiyana asked feeling as if she were indeed going crazy.\n\n“It was posted over the internet by people that were there.”\n\nWinterton pulled up a website with the streaming footage of her outside of Levi’s home sleepwalking and seeming to talk to herself.\n\n“I was sleepwalking then, but I swear… Sakima was…” she trailed off, no longer certain of anything.\n\n“Aiyana, I really believe this is the effect of drugs.”\n\n“But, I’m not doing drugs,” she insisted.\n\n“Or it could be the result of a psychotic break.”\n\n“I’m not crazy!” Aiyana cried harder.\n\n“I want to take you to a facility.”\n\n“No, please. I have to meet Sakima tonight. There is only a week left.”\n\n“You need to get some help.” Winterton placed a hand on top of Aiyana’s. “I know what I thought I saw at the festival, but there is no evidence to back it up. Here you can see that what you think you saw wasn’t there.”\n\nAdair produced a pair of handcuffs and Aiyana tried to get out and run, but Winterton stopped her.\n\n“I’m so sorry, Ms. Gamelle.”\n\nAiyana fell to her knees and Winterton forced her to the ground.\n\n“This is for your own safety,” Adair assured her.\n\nAiyana kicked herself for trusting Adair. She should have listened when Sakima said that they would be unable to see. The curse seemed to have an answer for everything, even video.\n\n“We’ll inform your Aunts and Uncle. Is there anyone else you want me to call?”", "voices": [["“How did you get back so", "Aiyana"], ["“Aiyana, you entered the", "Adair"], ["“What?” She shook her he", "Aiyana"], ["“You were talking about ", "Adair"], ["“No. He was there with a", "Aiyana"], ["“Aiyana you were alone, ", "Adair"], ["“Let me see.”", "Aiyana"], ["“I don’t understand,” sh", "Aiyana"], ["“I don’t know what’s goi", "Aiyana"], ["“Do you remember sleepwa", "Adair"], ["“How did you know about ", "Aiyana"], ["“It was posted over the ", "Adair"], ["“I was sleepwalking then", "Aiyana"], ["“Aiyana, I really believ", "Adair"], ["“But, I’m not doing drug", "Aiyana"], ["“Or it could be the resu", "Adair"], ["“I’m not crazy!” Aiyana ", "Aiyana"], ["“I want to take you to a", "Adair"], ["“No, please. I have to m", "Aiyana"], ["“You need to get some he", "Winterton"], ["“I’m so sorry, Ms. Gamel", "Winterton"], ["“This is for your own sa", "Adair"], ["“We’ll inform your Aunts", "Adair"]]}}, {"id": "ev47_2", "name": "NEW DRAFT: An empty room", "text": "“Sakima,” she said.\n\nAdair and Winterton looked at each other over her head. It was the look people give each other across a sickbed.\n\n“Aiyana,” Adair said gently, “that’s who you were talking to in an empty room.”", "choices": [{"label": "Continue", "to": "ev47_3"}], "voices": [["“Sakima,” she said.", "Aiyana"], ["“Aiyana,” Adair said gen", "Adair"]], "alt": {"text": "“Sakima,” she said.\n\nAdair and Winterton looked at each other over her head. It was the look people give each other across a sickbed.\n\n“Aiyana,” Adair said gently, “that’s who you were talking to in an empty room.”", "voices": [["“Sakima,” she said.", "Aiyana"], ["“Aiyana,” Adair said gen", "Adair"]]}}, {"id": "ev47_3", "name": "Part 2", "text": "“My brother and sister,” she said. “Please let them know where I am.”\n\n“Remember that I’m telling you now, if nothing is done, then there will be more bodies on the island in one week.”\n\nShe thought of the evil spirit waking up in a mental facility full of innocent people and using her body to do whatever to whomever. Then she thought of Eva and felt sick.", "choices": [], "voices": [["“My brother and sister,”", "Aiyana"], ["“Remember that I’m telli", "Aiyana"]], "alt": {"text": "“My brother and sister,” she said. “Please let them know where I am.”\n\nAdair called the emergency ferry to meet them at the dock.\n\n“I’m very sorry about this, Aiyana. I wanted to believe what you were saying.”\n\n“You still should. Remember that the carnage at the scene was too horrific to be as simple as a dog attack. Remember that I’m telling you now, if nothing is done, then there will be more bodies on the island in one week.”\n\nAdair was quiet.\n\n“Why would Sakima want to meet you at the family house, if he lives at the casino?” Winterton asked.\n\n“Because that is where my mother tried to fight this same evil.”\n\n“Aiyana,” Adair started. “You have been through a lot. You have lost three family members back-to-back and have been asked to take on a huge responsibility. It’s not uncommon for people to… lose touch with reality, especially if there is some drug use involved.”\n\nAiyana gave up trying to convince him. She feared what might happen if she were off of the island when the blood moon came. She thought of the evil spirit waking up in a mental facility full of innocent people and using her body to do whatever to whomever, as one of the journal entries had put it. Then she thought of Eva and felt sick. She couldn’t stand the thought of her sister having to deal with the evil spirit’s crazy possession.", "voices": [["“My brother and sister,”", "Aiyana"], ["“I’m very sorry about th", "Adair"], ["“You still should. Remem", "Aiyana"], ["“Why would Sakima want t", "Winterton"], ["“Because that is where m", "Aiyana"], ["“Aiyana,” Adair started.", "Adair"]]}}]}, {"id": "ev48", "title": "Chapter Nineteen, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev48_1", "name": "Part 1", "text": "She cooperated with Adair as he checked her in to the mental facility. After several days of tests they shifted her to therapy with a clinical psychologist, Dr. Howard. Aiyana smiled for him, knowing that her freedom depended on appearing sane.\n\n“Adair said you have some delusions about the eclipse that is coming up. I’d like to keep you here until after that.”\n\n“I will release you to go home tomorrow morning. But, now you have a visitor in the visitor’s garden. Sakima. Do you feel up to seeing him?”\n\nSakima looked sick with worry when a nurse escorted her to him.\n\n“Good news, Lucas called. I know the exact curse. It won’t require you to spill any blood.”\n\n“We need to perform the same ceremony your mother tried with a slight adjustment. This time you will have to allow the spirit to enter you. But, you’ll have to fight to keep her from taking hold.”\n\n“They aren’t going to let me out of here until after the blood moon, in order to help cure my delusion.”\n\n“It’s not exactly Fort Knox. I’ll come to get you, so be ready.”\n\n“You have to spirit walk again, and experience the learning through my memories.”\n\nShe held her hands out and he took them, but there was no reaction to his touch like before.\n\n“They said there was some… toxin. But, it’s gone from my blood now.”\n\n“It’s like adrenaline.”\n\nHe placed his hand behind her neck and kissed her. She started to object but she felt herself awaken, the way she had when Caleb came back to the island, only stronger. She kissed him back and saw the flashes of memory that he wanted her to see. Sakima slowly pulled his head back.\n\n“Aiyana?”\n\nCaleb stood halfway to the visitor garden, sick and pale, betrayal apparent in his eyes. Her legs were weak and Sakima had to catch her. Caleb doubled over as if in pain. She pulled away and started towards him.\n\n“Stay back,” he said, halting her. “Anyone but him.” He pointed straight at Sakima with a hate in his eyes that Aiyana had never seen before. “I should never have come back here.” He turned and left them standing in the garden, speechless.", "choices": [{"label": "Let him go", "to": "ev48_3"}, {"label": "Call after Caleb", "to": "ev48_2"}], "voices": [["“Adair said you have som", "Dr. Howard"], ["“I will release you to g", "Dr. Howard"], ["“Good news, Lucas called", "Sakima"], ["“We need to perform the ", "Sakima"], ["“They aren’t going to le", "Aiyana"], ["“It’s not exactly Fort K", "Sakima"], ["“You have to spirit walk", "Sakima"], ["“They said there was som", "Aiyana"], ["“It’s like adrenaline.”", "Sakima"], ["“Aiyana?”", "Caleb"], ["“Stay back,” he said, ha", "Caleb"]], "alt": {"text": "She cooperated with Adair as he pulled up to the mental facility and checked her in. The next several days were hell as she went through more tests than she knew were possible. She was certain that they left no stone unturned short of cutting her open or giving her a lobotomy.\n\nIt was then that they shifted her to therapy with a clinical psychologist, Dr. Howard. He was in his early to mid fifties and seemed warm and friendly enough.\n\n“How are you today?” He asked on the morning of their second meeting; his light brown eyes were sincere, kind, and searching.\n\n“I’m doing well.” Aiyana smiled, knowing that her freedom depended on appearing sane. “I guess I just needed to get rest and to get away.”\n\nDr. Howard smiled, liking that answer.\n\n“Okay, I’d like to discuss the conclusion of our battery of tests. I know that you have been through a lot, but we are coming to end of it. It appears that there were toxins in your blood when you first arrived. It took two days for the levels to fall and then leave your system completely.”\n\n“Oh?” Aiyana tried to remain as calm as possible.\n\n“Yes, we’ve tested the water and continue to bring in samples of wild life and vegetation from the island but so far we haven’t been able to locate a source. Which most likely means it is a man made concoction.”\n\n“I see.” Aiyana said nodding as if she agreed with that prognosis.\n\n“Someone may have slipped it into a drink or a food and given it to you.”\n\n“Okay. So what should I do until we locate the source?”\n\n“Just be aware of how you are feeling. If at anytime you feel uncertain or start seeing or hearing anything about an evil spirit, reach out to us. Adair said you have some delusions about the eclipse that is coming up. I’d like to keep you here until after that. I’m going to prescribe a mild sedative to help you get through the nights.”\n\nAiyana fought hard to smile and nod.\n\n“If you think that is best.” She said.\n\nHe smiled broadly.\n\n“Wonderful. I will release you to go home tomorrow morning. But, now you have a visitor in the visitor’s garden.” He flipped through his notes. “Sakima. Do you feel up to seeing him?”\n\n“Yes, that would be great!” Aiyana allowed her relief and excitement to show.\n\nHe looked sick with worry when she exited the facility, led by a nurse who escorted her to him.\n\nWhen the nurse left them alone, Aiyana began to cry in relief.\n\n“I tried to warn you that you couldn’t trust the police,” Sakima scolded.\n\n“I’m sorry, I just… I don’t know! I thought they could help.”\n\n“I understand,” he assured her. “Good news, Lucas called. I know the exact curse. It won’t require you to spill any blood.”\n\n“Are you sure?”\n\n“Yes, I can’t go into details about what happened, but I can say that after this blood moon your family and my tribe will be rid of the curse.”\n\n“That is a relief.” She smiled. “So what do I need to do?”\n\n“We need to perform the same ceremony your mother tried with a slight adjustment. Your mother blocked the spirit, somehow.”\n\nAiyana didn’t bother to explain to Sakima that it was in fact she who had protected her mother from the spirit. She focused on the task at hand.\n\n“Since the spirit couldn’t enter her, it simply went away. But, then it came back again, waiting until you all came of age. This time you will have to allow the spirit to enter you. But, you’ll have to fight to keep her from taking hold.”\n\n“They aren’t going to let me out of here until after the blood moon, in order to help cure my delusion.”\n\n“It’s not exactly Fort Knox. I’ll come to get you, so be ready.”\n\nAiyana took in a sharp breath, remembering the last time that spirit was in her body.\n\n“Okay, but I’m not sure I know how to keep her from taking hold.”\n\n“You need to know what I know. But there is no way for me to teach you. You have to spirit walk again, and experience the learning through my memories.”\n\nAiyana held her hands out and he took them. There was no immediate reaction to his touch like before. He rubbed her knuckles but nothing seemed to be happening. His brows furrowed as he looked at her and reached out to touch her cheek, but still nothing happened.\n\n“Something is different,” Sakima said.\n\n“They gave me some medicine. They said there was some… toxin. But, it’s gone from my blood now.”\n\nSakima looked at her, confused.\n\n“There was something in my blood when I left the island. It’s not there anymore. I produced it somehow but, I don’t know…”\n\nSakima seemed to understand. “It’s like adrenaline.”\n\nHe placed his hand behind her neck and stepped closer to her. He took a moment to look her in the eyes then without another word he leaned in and kissed her. The touch of his lips on hers was electric. He pulled her closer and kissed her deeper. She started to object but she felt herself awaken, much the same way she had when Caleb came back to the island. But the feeling was stronger. Like she had waited a lifetime to truly wake up. She began to kiss him back and as he moaned she felt that familiar wave of pleasure that his touch produced in her. The air slowly escaped her lungs and she saw the flashes of memory that he wanted her to see.\n\nShe felt herself in two places at once. Learning with Sakima in the past and kissing him in the present. She felt one with him, not knowing where she ended and he began. It was a connection so strong and so thorough she wasn’t sure if she could or even wanted to break it. But, Sakima remained in control. He slowly loosened his hold and pulled his head back.\n\nHe looked in her eyes and she saw how hard it was for him to take a step back from her. She had to take several deep breaths but she smiled at Sakima as if he were a long lost friend.\n\n“Aiyana?”\n\nThey turned to see Caleb halfway between the door to the facility and the visitor garden. He looked sick and pale. His eyes went from Aiyana to Sakima, his feeling of betrayal apparent in them.\n\n“Caleb.” Aiyana’s heart sank. She tried to take a step towards him but her legs were weak. Sakima had to catch her and help her keep balance.\n\nThe movement affected Caleb physically. He doubled over as if in pain. Aiyana pulled away from Sakima and started towards Caleb.\n\n“Stay back,” he said, halting her. “Anyone but him.” He pointed straight at Sakima with a hate in his eyes that Aiyana had never seen before. “I should never have come back here.” He turned and left them standing in the garden, speechless.", "voices": [["“How are you today?” He ", "Dr. Howard"], ["“I’m doing well.” Aiyana", "Aiyana"], ["“Okay, I’d like to discu", "Dr. Howard"], ["“Oh?” Aiyana tried to re", "Aiyana"], ["“Yes, we’ve tested the w", "Dr. Howard"], ["“I see.” Aiyana said nod", "Aiyana"], ["“Someone may have slippe", "Dr. Howard"], ["“Okay. So what should I ", "Aiyana"], ["“Just be aware of how yo", "Dr. Howard"], ["“If you think that is be", "Aiyana"], ["“Wonderful. I will relea", "Dr. Howard"], ["“Yes, that would be grea", "Aiyana"], ["“I tried to warn you tha", "Sakima"], ["“I’m sorry, I just… I do", "Aiyana"], ["“I understand,” he assur", "Sakima"], ["“Are you sure?”", "Aiyana"], ["“Yes, I can’t go into de", "Sakima"], ["“That is a relief.” She ", "Aiyana"], ["“We need to perform the ", "Sakima"], ["“Since the spirit couldn", "Sakima"], ["“They aren’t going to le", "Aiyana"], ["“It’s not exactly Fort K", "Sakima"], ["“Okay, but I’m not sure ", "Aiyana"], ["“You need to know what I", "Sakima"], ["“Something is different,", "Sakima"], ["“They gave me some medic", "Aiyana"], ["“There was something in ", "Aiyana"], ["Sakima seemed to underst", "Sakima"], ["“Aiyana?”", "Caleb"], ["“Caleb.” Aiyana’s heart ", "Aiyana"], ["“Stay back,” he said, ha", "Caleb"]]}}, {"id": "ev48_2", "name": "NEW DRAFT: Calling after him", "text": "“Caleb!”\n\nIt came out cracked. He did not slow. The door swung shut behind him, and a nurse on the other side glanced through the glass, counting patients.", "choices": [{"label": "Continue", "to": "ev48_3"}], "voices": [["“Caleb!”", "Aiyana"]], "alt": {"text": "“Caleb!”\n\nIt came out cracked. He did not slow. The door swung shut behind him, and a nurse on the other side glanced through the glass, counting patients.", "voices": [["“Caleb!”", "Aiyana"]]}}, {"id": "ev48_3", "name": "Part 2", "text": "Aiyana wanted to run after him. But, Sakima put a hand on her shoulder.\n\n“Give him some space. He’ll be okay. You can explain after we do what needs to be done.”\n\n“Right. Thanks.”", "choices": [], "voices": [["“Give him some space. He", "Sakima"], ["“Right. Thanks.”", "Aiyana"]], "alt": {"text": "Aiyana wanted to run after him. But, Sakima put a hand on her shoulder.\n\n“Give him some space. He’ll be okay. He can’t see the truth for himself. So, the safest thing for him to do is stay away. You can explain after we do what needs to be done.”\n\n“Right. Thanks.”", "voices": [["“Give him some space. He", "Sakima"], ["“Right. Thanks.”", "Aiyana"]]}}]}, {"id": "ev49", "title": "Chapter Nineteen, Part 3", "access": "pass", "price": 0, "scenes": [{"id": "ev49_1", "name": "Part 1", "text": "The next few days felt extremely slow. From her window she could see the moon, and she remembered Harold’s heavily accented Gullah voice:\n\n“An’ we cun trace dem all da way back the ancient African goddess, Mawu.”\n\nShe tried to prepare herself for the worst, that the spirit would take over and she would become a prisoner in her own body forever.\n\nThe morning before the eclipse Dr. Howard came to visit her.\n\n“Would you like me to prescribe a stronger sleep aid for tonight? I know it’s the eclipse.”", "choices": [{"label": "Accept the sedative", "to": "ev49_3"}, {"label": "Refuse the sedative", "to": "ev49_2"}], "voices": [["“An’ we cun trace dem al", "Harold"], ["“Would you like me to pr", "Dr. Howard"]], "alt": {"text": "The next few days felt extremely slow. She was grateful for the sedative she took at night. She began to feel nervous as the days passed and she heard nothing from anyone. But, from the window in her room she could see the moon.\n\nAs she looked onto the moon she let her thoughts travel backwards until the moment before Adair intercepted her on the beach and she decided to trust him. She remembered that she had been wondering about Charii’s African goddess, Mawu. She heard Harold’s heavily accented Gullah voice:\n\n“They is pure of blood. An’ we cun trace dem all da way back the ancient African goddess, Mawu. Is way they get dem yellow eyes. From da energy of they goddess.”\n\nWhy hadn’t she gone directly to see Harold after Adair left? She had so many questions but time was running out. She tried to prepare herself for the worst-case scenario, that the spirit would take over and she would become a prisoner in her own body forever.\n\nThe night before the eclipse Dr. Howard came to visit her in the morning.\n\n“How are you sleeping?” He asked.\n\n“Fine, I think,” she admitted.\n\n“Would you like me to prescribe a stronger sleep aid for tonight? I know it’s the eclipse.”\n\n“I don’t know,” she said honestly. “I think I should… tough it out.”\n\n“I know that facing a delusion can be hard. You don’t have to tough it out. We want you to feel relaxed and comfortable. It will just help you sleep even better and you’ll wake up in the morning safe and sound, ready for us to release you.”", "voices": [["“They is pure of blood. ", "Harold"], ["“How are you sleeping?” ", "Dr. Howard"], ["“Fine, I think,” she adm", "Aiyana"], ["“Would you like me to pr", "Dr. Howard"], ["“I don’t know,” she said", "Aiyana"], ["“I know that facing a de", "Dr. Howard"]]}}, {"id": "ev49_2", "name": "NEW DRAFT: Part of the delusion", "text": "“No sedative,” Aiyana said. “Please. I want to be awake.”\n\n“Wanting to keep watch for it is part of the delusion, Aiyana. Let’s not feed that.”\n\nShe had made it worse. She could see it in the patient way he smiled.", "choices": [{"label": "Continue", "to": "ev49_3"}], "voices": [["“No sedative,” Aiyana sa", "Aiyana"], ["“Wanting to keep watch f", "Dr. Howard"]], "alt": {"text": "“No sedative,” Aiyana said. “Please. I want to be awake.”\n\nDr. Howard’s pen stopped. She watched him write something longer than no.\n\n“Wanting to keep watch for it is part of the delusion, Aiyana. Let’s not feed that.”\n\nShe had made it worse. She could see it in the patient way he smiled.", "voices": [["“No sedative,” Aiyana sa", "Aiyana"], ["“Wanting to keep watch f", "Dr. Howard"]]}}, {"id": "ev49_3", "name": "Part 2", "text": "“That sounds like a good plan.”\n\n“Okay, I will order the sedative for you. I’ll also order some fluids and vitamins as well.”\n\nAs the day turned into evening a nurse wheeled in a hanging IV bag, started it, and placed a pill cup in Aiyana’s hand. Aiyana pretended to take them, but held them under her tongue. When the nurse left, she spit out the pills and placed them under her pillow. The nurse returned carrying a syringe and stuck the needle into her IV line.\n\n“What is that?”\n\nThe nurse pushed in the entire contents of the syringe.\n\n“It’s your sedative.”\n\n“I thought… the pills…” Aiyana felt her eyelids get heavy. “Those were vitamins,” the nurse informed her. “See you in the morning.”\n\n“No… wait.”\n\nTo her horror, Aiyana felt herself falling to sleep.", "choices": [{"label": "Stay with Aiyana", "to": "END"}, {"label": "Follow Eva: the way back", "to": "ev49_4"}], "voices": [["“That sounds like a good", "Aiyana"], ["“Okay, I will order the ", "Dr. Howard"], ["“What is that?”", "Aiyana"], ["“It’s your sedative.”", "Nurse"], ["“I thought… the pills…” ", "Aiyana|Nurse|Nurse"], ["“No… wait.”", "Aiyana"]], "alt": {"text": "“That sounds like a good plan.”\n\nAiyana weighed the pros and cons and nodded. It wouldn’t hurt to have the pills on hand after the eclipse passed, if she survived, she was certain that she would want to do nothing but sleep for a very long time.\n\n“Okay, I will order the sedative for you. I’ll also order some fluids and vitamins as well.” He scribbled on a note pad then tucked it away to look at her. “Other than the pending eclipse, how are you feeling?”\n\n“I’m okay. I wish I’d had more visitors this week.”\n\n“Does it upset you that you didn’t?”\n\n“Is that normal?”\n\n“Yes, it is.” He smiled.\n\n“Then yes.” She laughed nervously.\n\n“I know you’ve been through a lot in the last few weeks, and you have been under a little bit of a microscope this week. But, just relax and think about going home.”\n\nAiyana felt her smile falter. She didn’t want to go back home.\n\n“Are you okay?” He asked.\n\n“I am but I think when I go home a lot is going to have to change.”\n\n“That is the first step to recovery. You can’t keep doing the same thing and expect a different result.”\n\n“Exactly,” Aiyana agreed.\n\n“Feel free to call me anytime if you feel you need a little help. You don’t have to tough out the rough times. You’re not alone.”\n\n“Thank you Dr. Howard.”\n\nAs the day turned into evening Aiyana spotted the moon a little lower than the night before in the sky. The door to her room opened and a nurse wheeled in a hanging IV bag.\n\n“Okay, Dr. Howard ordered you fluids, vitamins, and a stronger sedative.” She informed Aiyana.\n\nAiyana sat still on the edge of her bed as the nurse started the IV.\n\n“This is your last night with us. Might as well get some good rest so you can enjoy the first day of your new life.” Aiyana smiled but didn’t comment. The nurse placed a pill cup in Aiyana’s hand. Aiyana pretended to take them, but held them under her tongue.\n\n“I’ll be right back.”\n\nWhen the nurse left, Aiyana spit out the pills not sure which ones were vitamins and which was the sedative, she placed them all under her pillow. She lay back and waited for the nurse to return. When she did she carried a syringe. Aiyana watched as she removed the cap and stuck the needle into her IV line.\n\n“What is that?” Aiyana asked.\n\nThe nurse pushed in the entire contents of the syringe.\n\n“This should help you sleep like a baby.”\n\n“What?”\n\n“It’s your sedative.”\n\n“I thought… the pills…” Aiyana felt her eyelids get heavy. “Those were vitamins,” the nurse informed her. “See you in the morning.”\n\n“No… wait.”\n\nTo her horror, Aiyana felt herself falling to sleep.", "voices": [["“That sounds like a good", "Aiyana"], ["“Okay, I will order the ", "Dr. Howard"], ["“I’m okay. I wish I’d ha", "Aiyana"], ["“Does it upset you that ", "Dr. Howard"], ["“Is that normal?”", "Aiyana"], ["“Yes, it is.” He smiled.", "Dr. Howard"], ["“Then yes.” She laughed ", "Aiyana"], ["“I know you’ve been thro", "Dr. Howard"], ["“Are you okay?” He asked", "Dr. Howard"], ["“I am but I think when I", "Aiyana"], ["“That is the first step ", "Dr. Howard"], ["“Exactly,” Aiyana agreed", "Aiyana"], ["“Feel free to call me an", "Dr. Howard"], ["“Thank you Dr. Howard.”", "Aiyana"], ["“Okay, Dr. Howard ordere", "Nurse"], ["“This is your last night", "Nurse"], ["“I’ll be right back.”", "Nurse"], ["“What is that?” Aiyana a", "Aiyana"], ["“This should help you sl", "Nurse"], ["“What?”", "Aiyana"], ["“It’s your sedative.”", "Nurse"], ["“I thought… the pills…” ", "Aiyana|Nurse|Nurse"], ["“No… wait.”", "Aiyana"]]}}, {"id": "ev49_4", "name": "NEW DRAFT: Eva comes back (sibling episode)", "text": "The officer’s message had sat on Lucas’s phone. Your sister is in a facility on the mainland. She is safe.\n\n“Safe,” Eva said. “On a blood moon.”\n\n“He say he can end it. Sakima. He say he know how now, ’cause of what I wrote. But he need us dere.”\n\nEva had seen the next part already. A backyard. Two posts. Her sister tied between them. A knife. She had not seen whose blood.\n\n“Hurry,” she said.", "choices": [{"label": "Return to Aiyana", "to": "END"}], "voices": [["“Safe,” Eva said. “On a ", "Eva"], ["“He say he can end it. S", "Lucas"], ["“Hurry,” she said.", "Eva"]], "alt": {"text": "The officer’s message had sat on Lucas’s phone for two days before either of them could say it out loud. Your sister is in a facility on the mainland. She is safe. She asked us to tell you.\n\n“Safe,” Eva said. “On a blood moon.”\n\nCaleb had flown down and come back gray, and would not tell them what he had seen. He would not go again.\n\nIt was Lucas who bought the tickets. “He say he can end it,” Lucas told her, holding the phone against his chest. “Sakima. He say he know how now, ’cause of what I wrote. But he need us dere.”\n\n“And you believe him.”\n\n“I believe my own hand.”\n\nEva looked at the moon over the airport parking deck, fat and yellow and a night from full. She had seen the next part already. A backyard. Two posts. Her sister tied between them with her head hanging. A knife.\n\nShe had not seen whose blood.\n\n“If we go and it’s her he cuts,” she said.\n\n“Den we in arm’s reach when he try.”\n\nThat was Levi’s kind of answer. She almost told him so. Instead she picked up her bag.\n\nShe had spent a week hating a smile. Walking toward the gate, she let herself remember that Aiyana had been in there behind it the whole time, watching, the same way Eva watched her dreams. Unable to move. Unable to wake up.\n\n“Hurry,” she said.", "voices": [["“Safe,” Eva said. “On a ", "Eva"], ["It was Lucas who bought ", "Lucas"], ["“And you believe him.”", "Eva"], ["“I believe my own hand.”", "Lucas"], ["“If we go and it’s her h", "Eva"], ["“Den we in arm’s reach w", "Lucas"], ["“Hurry,” she said.", "Eva"]]}}]}, {"id": "ev50", "title": "Chapter Twenty, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev50_1", "name": "Part 1", "text": "Aiyana felt her eyes open in the dead of night.\n\n“She’s drugged.” Eva’s voice echoed in Aiyana’s ears. Lucas was there too. They’d both come back to help her.\n\nSakima sent a guard for a wheelchair and rubbed her hands.\n\n“Aiyana, I know it’s tough, but you have to fight it. You can push it out of you.”", "choices": [{"label": "Try to tell him you hear him", "to": "ev50_3"}, {"label": "Try to ask where Caleb is", "to": "ev50_3"}], "voices": [["“She’s drugged.” Eva’s v", "Eva"], ["“Aiyana, I know it’s tou", "Sakima"]], "alt": {"text": "Aiyana felt her eyes open in the dead of night.\n\n“Aiyana…” Sakima’s voice seemed as if it traveled through water to get to her.\n\n“She’s drugged.” Eva’s voice was high pitched and echoed in Aiyana’s ears. She was so happy to hear it. She wanted to jump up and hug her sister.\n\n“Get the guard. Tell him we need his help. There’s another thousand dollars,” Sakima said.\n\n“We don’t have much time. We waited too long.” Aiyana heard Lucas say and her heart soared to hear his voice as well. They’d both come back to help her.\n\n“We have time.” Sakima took her hand.\n\n“What do you need?” A new deep voice asked.\n\nAiyana turned her head slowly to see the guard by the door.\n\n“A wheelchair.” Sakima said. “And help getting her out of here.”\n\n“Be right back.” The guard left.\n\nAiyana felt Sakima rubbing her hands.\n\n“Aiyana, I know it’s tough, but you have to fight it. Whatever they gave you. You can push it out of you.”", "voices": [["“Aiyana…” Sakima’s voice", "Sakima"], ["“She’s drugged.” Eva’s v", "Eva"], ["“Get the guard. Tell him", "Sakima"], ["“We don’t have much time", "Lucas"], ["“We have time.” Sakima t", "Sakima"], ["“What do you need?” A ne", "Guard"], ["“A wheelchair.” Sakima s", "Sakima"], ["“Be right back.” The gua", "Guard"], ["“Aiyana, I know it’s tou", "Sakima"]]}}, {"id": "ev50_3", "name": "Part 2", "text": "Aiyana opened her mouth to respond, but only an unintelligible moan and a pool of drool came out.\n\nThe guard strapped her into the wheelchair and pushed it quickly to an awaiting car.\n\n“Look at the moon,” Eva moaned. “It’s almost time.”\n\n“We’ll make it!” Sakima shouted.\n\nWhen the ferry docked, Sakima carried her himself, and she could feel the panicked tattoo of his heartbeat. He laid her on her back in the backyard of his family home, the blood moon large and clear overhead.\n\nAiyana felt a prick in her thigh, then hot fluid through her veins. The hold of the sedative began to lift as her heart began to race.\n\n“Stand her up,” Sakima ordered.\n\nStrong arms stood Aiyana to her feet, then tied her arms to two posts in front of some sort of ceremonial altar. The Four Elders of the Esta-owey stood just behind Sakima, who smiled weakly at her as strong hands moved to bind her feet.\n\n“What’s going on?”\n\n“Just remain calm.” There was definite worry and sadness in his eyes. “Please, trust me, and just let her in, Aiyana. Fight her as best you can. It will be over soon.”", "choices": [], "voices": [["“Look at the moon,” Eva ", "Eva"], ["“We’ll make it!” Sakima ", "Sakima"], ["“Stand her up,” Sakima o", "Sakima"], ["“What’s going on?”", "Aiyana"], ["“Just remain calm.” Ther", "Sakima"]], "alt": {"text": "Aiyana opened her mouth to respond, but only an unintelligible moan and a pool of drool came out. Sakima produced a handkerchief and wiped her chin clean of the mess.\n\n“Okay, it’s okay. We have some drugs at the casino that will do the trick.”\n\nAiyana wanted to protest, but again the only thing to escape her was drool and a groan.\n\n“Jesus!” Lucas said. “What the hell did they give her?”\n\nThe guard returned with the wheelchair and helped them put Aiyana in it. They had to strap her arms and legs in place to keep her from falling out. But, like a pro the guard took charge of the chair, leaning it back and pushing it quickly to the side door and an awaiting car. He helped Aiyana from the chair and into the car.\n\n“Thank you,” Sakima said, pausing to take out a wad of cash from his wallet. “We’ll bring the chair back.”\n\n“Sure,” The guard said.\n\nAiyana wondered what the guard knew about the night. Sakima drove the car with Lucas in front. Eva stayed in the back holding Aiyana secure as Sakima drove through the streets to get to the highway.\n\n“Look at the moon,” Eva moaned. “It’s almost time.”\n\n“We’ll make it!” Sakima shouted, but Aiyana wasn’t sure if he believed it.\n\nThey got to the ferry and drove on. Aiyana could feel the rocking of the ferry as it sped as fast as possible over what must have been choppy waters. The closer they got to the island, the more the air began to smell like rain.\n\n“Yes, I need you to administer some drugs at my family home.” Aiyana heard Sakima’s voice again. “An adrenaline of some type… Yes, that’s perfect…. In ten minutes. Hang on Aiyana.”\n\nAiyana tried to move but couldn’t. She felt the ferry dock and Sakima came to get her from the car as Eva and Lucas wrestled with the wheelchair. But, he didn’t stop to put her down. He held her close to him and she could feel the panicked tattoo of his heartbeat.\n\nHe hurried across the property and to the backyard. He laid Aiyana on her back and she saw the blood moon large and clear overhead. Lucas kneeled on one side of her, taking her hand. Eva kneeled on the other side taking her other hand. There was commotion all around. Aiyana tried to move, but again all she managed was a moan.\n\n“I’m here.” She heard a young harried voice say.\n\n“Hurry.” Sakima responded.\n\nThere was more commotion and Aiyana felt a prick in her thigh.\n\n“This may burn a little.” He warned.\n\nThe prick was followed by hot fluid that made its way through her veins, dispersing through her entire body and through her brain. The hold of the sedative began to lift as Aiyana’s heart began to race.\n\n“It should only take a moment.” The young voice assured them. “How you feeling?”\n\nAiyana moved her head from side to side.\n\n“Mmmore…” She said.\n\n“No, sweetie… that is enough juice. Just let it do its job.”\n\nAiyana began to move her limbs.\n\n“Stand her up,” Sakima ordered.\n\nStrong arms stood Aiyana to her feet. Then they pulled her arms out and tied them to two posts. She’d assumed that she would be lying down for this like her mother, but she found that she was standing in front of some sort of ceremonial altar. The Four Elders of the Esta-owey stood just behind and on either side of Sakima, who smiled weakly at her as strong hands finished binding her arms and moved to do the same to her feet. Aiyana felt her heart thunder even harder than the adrenaline’s effect and she looked around confused.\n\n“What’s going on?”\n\n“Just remain calm.” Sakima touched her cheek softly. There was definite worry and sadness in his eyes. “Please, trust me, and just let her in, Aiyana. Fight her as best you can. It will be over soon.”", "voices": [["“Okay, it’s okay. We hav", "Sakima"], ["“Jesus!” Lucas said. “Wh", "Lucas"], ["“Thank you,” Sakima said", "Sakima"], ["“Sure,” The guard said.", "Guard"], ["“Look at the moon,” Eva ", "Eva"], ["“We’ll make it!” Sakima ", "Sakima"], ["“Yes, I need you to admi", "Sakima"], ["“I’m here.” She heard a ", "Medic"], ["“Hurry.” Sakima responde", "Sakima"], ["“This may burn a little.", "Medic"], ["“It should only take a m", "Medic"], ["“Mmmore…” She said.", "Aiyana"], ["“No, sweetie… that is en", "Medic"], ["“Stand her up,” Sakima o", "Sakima"], ["“What’s going on?”", "Aiyana"], ["“Just remain calm.” Saki", "Sakima"]]}}]}, {"id": "ev51", "title": "Chapter Twenty, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev51_1", "name": "Part 1", "text": "Aiyana turned to see her Aunt Fey, Aunt Helen and Uncle Max, their hands restrained behind them.\n\n“Everything ends tonight.” Sakima said his eyes turning dark and menacing. “Don’t worry, just let her in and fight.”\n\nAiyana felt the evil presence invade her. The moon was bathed in complete red, and her limbs were no longer her own.\n\n“Well, well, well!” The spirit exclaimed. “Thank you, your highness, for busting us out of there.”\n\nSakima and the Elders began to chant.", "choices": [{"label": "Push", "to": "ev51_3"}, {"label": "Speak to her", "to": "ev51_2"}], "voices": [["“Everything ends tonight", "Sakima"], ["“Well, well, well!” The ", "Charii"]], "alt": {"text": "“What is going on here?” Aiyana heard her Aunt Fey’s shrill voice and turned to see her, as well as her Aunt Helen and Uncle Max, with their hands restrained behind their backs.\n\n“What’s going on?” Aiyana asked.\n\n“Everything ends tonight.” Sakima said his eyes turning dark and menacing. “Don’t worry, just let her in and fight.”\n\nAiyana wanted to say more but she felt the evil presence invade her. She looked to the moon and saw that it was bathed in complete red. Then her limbs were no longer under her own control. Her body went rigid. Her eyes began to blaze as they fell upon the blood moon. She heard the evil laugh but found herself disconnected from any emotion. The evil spirit turned her head from side to side.\n\n“Well, well, well!” The spirit exclaimed. “Thank you, your highness, for busting us out of there. I wasn’t sure what I was going to do.”\n\nSakima and the Elders began to chant. Aiyana could see that Aunt Helen was praying as Aunt Fey fought against her restraints, and Uncle Max watched in confusion.", "voices": [["“What is going on here?”", "Aunt Fey"], ["“What’s going on?” Aiyan", "Aiyana"], ["“Everything ends tonight", "Sakima"], ["“Well, well, well!” The ", "Charii"]]}}, {"id": "ev51_2", "name": "NEW DRAFT: Somebody once", "text": "You were somebody once, Aiyana told the thing inside her. I was there the night you could not get in.\n\nFor an instant the rage faltered, and under it was something that had been afraid for a very long time.\n\nThen it came at her harder than before.", "choices": [{"label": "Continue", "to": "ev51_3"}], "alt": {"text": "You were somebody once, Aiyana told the thing inside her. I felt it. I was there the night you could not get in.\n\nFor an instant the rage faltered, and under it was something that had been afraid for a very long time.\n\nThen it came at her harder than before.", "voices": []}, "voices": []}, {"id": "ev51_3", "name": "Part 2", "text": "Aiyana pushed and felt the spirit flinch. She kept pushing even as she saw Sakima raise a large dagger, calm as she gave herself over to the reality of death.\n\n“I hereby spill this blood to atone for the pain and anguish that my ancestors caused.”\n\nAiyana braced herself, but Sakima sliced his own wrist, then the other. The spirit screamed as if on fire.\n\n“Find peace!” He brought the dagger down full force into his own abdomen and fell to his knees. “Be free Aiyana,” he commanded.\n\nAiyana gave one final push as the spirit let out one last blood-curdling scream and vacated her body through what felt like a thousand needle points.\n\nRain began to fall. Aunt Helen rocked in prayer, Aunt Fey struggled against her restraints, and Uncle Max cried into the sky.\n\n“Mother,” they moaned.\n\nSuddenly they all stopped. Their bodies seemed to burn from within, turning into pillars of ash that crumbled in the rain.\n\nStrong arms untied Aiyana and laid her down, Eva cradling her head. She could feel her own life beginning to slip away, and her mind turned to the name of the African sun and moon goddess.\n\n“Mawu,” she whispered and felt her eyes begin to burn fiery yellow.\n\nA white light touched her forehead, then Sakima’s, then hovered over the ashes. From them rose the spirits of three small children, and the light turned into a true likeness of Charii.\n\n“Mother?” A young voice asked.\n\n“Yes,” Charii responded, gathering the young spirits into her arms. “I’ve come to bring you home.”\n\nShe slowly vanished, taking them with her. A white crescent appeared on the edge of the moon. Aiyana looked to Sakima who did not open his eyes. She felt her own eyes getting heavy, and then all went dark.", "choices": [], "voices": [["“I hereby spill this blo", "Sakima"], ["“Find peace!” He brought", "Sakima"], ["“Mother,” they moaned.", "Uncle Max"], ["“Mawu,” she whispered an", "Aiyana"], ["“Mother?” A young voice ", "Child"], ["“Yes,” Charii responded,", "Charii"]], "alt": {"text": "Aiyana could feel the spirit’s worry as it tried to claim not only Aiyana’s body but also take over her consciousness. She pushed and felt the spirit flinch. She pushed again and again, not giving up any further space. She kept pushing even as she saw Sakima raise a large dagger.\n\nShe was calm as she realized this is what had to happen. She gave herself over to the reality of death. She continued to fight and push as Sakima and the Elders chanted, feeling the spirit’s worry at its imminent defeat.\n\nLucas and Eva would be free, Aiyana thought. The Esta-owey wouldn’t have to lose their children to the curse. She would be with Levi and Vivi again. She felt stronger with each passing moment and each uttered chant.\n\n“I hereby spill this blood to atone for the pain and anguish that my ancestors caused.”\n\nAiyana braced herself, but in the next instant, Sakima sliced his own wrist. Aiyana felt her body tighten as the spirit screamed as if on fire. Sakima quickly swapped the knife into his other hand and sliced his other wrist. The spirit twisted and raged in her body, pulling at the bindings on Aiyana’s arms.\n\n“Find peace!” Sakima raised the dagger once again and brought it down full force into his own abdomen. His movements were so quick that they took the Elders by surprise. It was apparent that they thought, as she had, that he would sacrifice her. Sakima pulled the dagger from his gut and dropped it to the ground as he fell to his knees.\n\n“Be free Aiyana,” he commanded.\n\nAiyana gave one final push as the spirit let out one last blood-curdling scream that froze everyone where they were before it vacated Aiyana’s body through what felt like a thousand needle points. The pain from the spirit’s exit was beyond excruciating. When Aiyana had control again she looked down at her own body and saw blood spilling from the pores impacted by the spirit’s exit.\n\nSakima’s eyes rolled into the back of his head and he fell over onto his side. The Elders rushed around him trying to bind and apply pressure to his wounds.\n\nEva screamed and so did Aunt Fey. Thunder began to roll and Aiyana felt the first drops of rain hit her body, beginning to wash away her blood. She turned her head towards her Aunts and Uncle. Aunt Helen rocked back and forth in prayer. Aunt Fey struggled wildly against her restraints. Uncle Max cried as he looked into the sky.\n\n“Mother,” they moaned with all the grief of brokenhearted mourning.\n\nSuddenly they all stopped, as the life in them seemed to come to an end. Aunt Helen with her head bowed in a prostrate prayer, Aunt Fey with her body twisted in fighting agony, and Uncle Max looking into the sky in sadness. Their bodies seemed to burn from within, turning into pillars of ash. As the rain came down harder the ash melted and crumbled to the ground.\n\n“Get her down,” Sakima moaned.\n\n“Get her down!” Lucas repeated, as he came to help the strong arms that had tied her up to now untie her and lay her down again.\n\nEva cradled Aiyana’s head in her lap the same way she had done for Vivi. Lucas took her hand.\n\n“Hang on Aiyana, I’ll call an ambulance.”\n\n“No…” Aiyana turned her head as she felt the relief of the cool rain washing over her. She saw Sakima lying on the ground near her. His eyes were closed. She watched as his blood spilled mixing with the rain and soaked into the ground. “You have to wait for the blood moon to pass,” she whispered.\n\nAiyana could feel her own life beginning to slip away. She wondered in her final moment why it had to be this way. She thought about the portrait of Charii hanging in the cottage, the woman who had left her homeland to accompany her children to the new world as a slave and ended up owning half of Sa’Fyre Island. Was it only so that Aiyana could die in the process of ending an evil spirit? She looked to Eva and Lucas. Wondering who would look after them. Her mind turned to the name of the African sun and moon goddess.\n\n“Mawu,” she whispered and felt her eyes begin to burn fiery yellow. “Mawu,” she repeated hoping the goddess would do a better job of protecting Lucas and Eva than she had done for Aiyana and their ancestors.\n\nA white light came towards her, touching her forehead, then moving on. She followed the light that no one else seemed to see as it touched Sakima’s forehead as well, then moved on. The spirit hovered over the ashes left by Aunt Helen, Aunt Fey and Uncle Max. From the ashes rose the spirits of three small children and the white light turned into a true likeness of Charii.\n\n“Mother?” A young voice asked. As the young spirits looked at their mother, Aiyana saw them as they always had been, lost souls desperate for their mother.\n\n“Yes,” Charii responded, gathering the young spirits into her arms. “I’ve come to bring you home.”\n\nThey hugged Charii and she slowly vanished, taking them with her. Aiyana’s eyes traveled back to the sky and landed on the moon. A white crescent appeared on the edge and Aiyana blinked away the fiery glow of her eyes. She looked to Sakima who did not open his eyes. She felt her own eyes getting heavy, and then all went dark.", "voices": [["“I hereby spill this blo", "Sakima"], ["“Find peace!” Sakima rai", "Sakima"], ["“Be free Aiyana,” he com", "Sakima"], ["“Mother,” they moaned wi", "Uncle Max"], ["“Get her down,” Sakima m", "Sakima"], ["“Get her down!” Lucas re", "Lucas"], ["“Hang on Aiyana, I’ll ca", "Lucas"], ["“No…” Aiyana turned her ", "Aiyana"], ["“Mawu,” she whispered an", "Aiyana"], ["“Mother?” A young voice ", "Child"], ["“Yes,” Charii responded,", "Charii"]]}}]}, {"id": "ev52", "title": "Chapter Twenty-One", "access": "pass", "price": 0, "scenes": [{"id": "ev52_1", "name": "Part 1", "text": "Aiyana opened her eyes back in her room at the mental facility. There was no blood, and no bruising from the night before. The doctor had discharged her, and Lucas and Eva were there to take her home.\n\n“Where do you want to go?” Lucas asked. She wanted to go to the last place she was happy and they were all together. “Levi’s house,” she said.\n\nShe turned the cottage into a historical museum, the picture of Charii still on the wall. She’d heard that Sakima survived his self-inflicted wounds and was on the mainland recovering, and figured it was for the best that they stay apart.\n\nNear Christmas the doorbell rang, and Caleb stood outside with a present for her. She asked Lucas and Eva to give them a minute.\n\n“I just wanted to say, I know the way that kiss looked… but it wasn’t what it looked like. He was trying to…”\n\n“Yeah, he told me.” Aiyana suppressed the urge to ask how Sakima was doing. “Aiyana, I believe what you say. But, I saw it with my own eyes. There is something between you.”\n\n“The curse.” Aiyana gasped. “That’s it. Only thing between us is something so horrible that I lost almost my entire family to it.”\n\nCaleb sighed and looked at her.", "choices": [{"label": "Tell him he is your choice", "to": "ev52_3"}, {"label": "Tell him you have to find out", "to": "ev52_2"}], "voices": [["“Where do you want to go", "Lucas|Aiyana"], ["“I just wanted to say, I", "Aiyana"], ["“Yeah, he told me.” Aiya", "Caleb"], ["“The curse.” Aiyana gasp", "Aiyana"]], "alt": {"text": "“Rise and shine.” The nurse’s familiar voice call     if(!String(s.text).trim())out.push('<li>'+nm+' has no text.</li>');
    s.choices.forEach(c=>{if(!c.label.trim())out.push('<li>'+nm+' has a choice with no wording. Readers will not see it.</li>');
      if(c.to!=='END'&&!ids.has(c.to))out.push('<li>'+nm+' has a choice that leads nowhere.</li>')});

  const ends=ep.scenes.filter(s=>!s.choices.length||s.choices.some(c=>c.to==='END')).length;
  if(!ends)out.push('<li>No scene ends the episode, so readers would loop forever.</li>');
  if(!out.length)out.push('<li class="ok">No problems found.</li>');
  out.push('<li class="info">'+ep.scenes.length+' scenes, '+ends+' ending'+(ends===1?'':'s')+', '+words(ep)+' words.</li>');

const spkFind=sid=>{const st=story(U.sStory),ep=epOf(st,U.sEp);return {st:st,sc:ep&&ep.scenes.find(s=>s.id===sid)}};
document.addEventListener('change',e=>{const t=e.target;
  if(t.classList&&t.classList.contains('spk-sel')){const f=spkFind(t.dataset.sid);if(f.sc){spkSet(f.sc,+t.dataset.p,+t.dataset.k,t.value);const b=document.getElementById('spkb-'+f.sc.id);if(b)b.innerHTML=spkRows(f.st,f.sc);toast('Speaker saved.')}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset&&t.dataset.bind==='scene'&&t.dataset.k==='text'){const f=spkFind(t.dataset.sid);const b=f.sc&&document.getElementById('spkb-'+f.sc.id);if(b){b.innerHTML=spkRows(f.st,f.sc);const d=document.getElementById('spk-'+f.sc.id);if(d)d.querySelector('summary').textContent='Who is speaking, for read-aloud ('+spkCount(f.sc)+' lines)'}}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-spkadd]');if(!b)return;const f=spkFind(b.dataset.spkadd),inp=document.getElementById('spkn-'+b.dataset.spkadd),n=inp&&inp.value.trim();
  if(!n||!f.st)return;f.st.cast=f.st.cast||[];if(!f.st.cast.includes(n))f.st.cast.push(n);save();SPK_OPEN[b.dataset.spkadd]=true;render();toast(n+' added to the speaker menus.')});
document.addEventListener('toggle',e=>{const t=e.target;if(t.classList&&t.classList.contains('spk')&&t.id)SPK_OPEN[t.id.slice(4)]=t.open},true);

applyPal(PAL);
render();
</script>
</body></html>
