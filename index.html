first time she’d left the island in close to a year. They watched it shrink to a jagged hump against the horizon.", "choices": [{"label": "Cross with Aiyana", "to": "END"}, {"label": "Follow Eva: back at the cottage", "to": "ev18_4"}], "voices": [["“Anywhere,” Aiyana said ", "Aiyana"]], "alt": {"text": "“Anywhere,” Aiyana said with a sigh.\n\nThey fell silent, waiting for the ferry to dock and the captain to allow them aboard. It was strange having the vessel all to themselves, speeding towards the mainland. She stood close to the railing with Caleb beside her, looking back towards the island, realizing that it was the first time she’d left the island in close to a year. The wind blew around them, isolating them in a cocoon of their own separate airflow. They watched the island get smaller and smaller until it was no more than a jagged hump against the horizon and they were docking on the South Carolina mainland coast.", "voices": [["“Anywhere,” Aiyana said ", "Aiyana"]]}}, {"id": "ev18_4", "name": "NEW DRAFT: Eva at the deathbed (sibling episode)", "text": "Aunt Helen did not say hello. “Come to the cottage. Bring your sister. Call the boys.”\n\nLevi came last, his phone dark in his hand.\n\n“Battery,” he said to nobody. “Where’s Aiyana?”\n\n“Mainland. With the police.”\n\nTheir grandmother lay small in the guest bed. The breathing stopped. For one second the old woman’s eyes opened, burning yellow. Then the light went out of them.\n\nOutside, before anybody had picked up a phone, voices rose in a language Eva did not know. Slow. Many. Coming closer across the lawn.\n\n“Who told them?” Vivi whispered.\n\nNobody had.", "choices": [{"label": "Return to Aiyana", "to": "END"}], "voices": [["Aunt Helen did not say h", "Aunt Helen"], ["“Battery,” he said to no", "Levi"], ["“Mainland. With the poli", "Aunt Helen"], ["“Who told them?” Vivi wh", "Vivi"]], "alt": {"text": "Aunt Helen did not say hello. “Come to the cottage. Bring your sister. Call the boys.”\n\n“Is she—”\n\n“Come now, Eva.”\n\nThe little living room had never held so many of them. Uncle Max stood by the window in yesterday’s shirt, and Eva could not remember ever seeing him inside this house in daylight. Aunt Fey had her arms crossed. Levi came last, unshaven, his phone dark in his hand.\n\n“Battery,” he said to nobody. “Where’s Aiyana?”\n\n“Mainland. With the police.”\n\n“Of course she is,” said Aunt Fey.\n\nThey went in two at a time because the room would not hold more. Their grandmother lay small in the guest bed with her hands outside the blanket. Eva had been afraid of her all her life, and now there was nothing there to be afraid of. Just an old woman breathing as if each breath had to be paid for.\n\nVivi took one of the hands. Eva could not make herself take the other.\n\nThe breathing stopped. It did not rattle or catch. It simply was not there anymore.\n\nFor one second the old woman’s eyes opened, burning yellow, bright as Eva had ever seen on any of them. Then the light went out of them like a wick pinched between two fingers.\n\nIn the front room, Uncle Max made a sound as if he had been struck.\n\nAunt Helen began to pray. And outside, before anybody had picked up a phone, before anybody had opened the door, voices rose in a language Eva did not know. Slow. Many. Coming closer across the lawn.\n\n“Who told them?” Vivi whispered.\n\nNobody had.", "voices": [["Aunt Helen did not say h", "Aunt Helen"], ["“Is she—”", "Eva"], ["“Come now, Eva.”", "Aunt Helen"], ["“Battery,” he said to no", "Levi"], ["“Mainland. With the poli", "Aunt Helen"], ["“Of course she is,” said", "Aunt Fey"], ["“Who told them?” Vivi wh", "Vivi"]]}}]}, {"id": "ev19", "title": "Chapter Eight, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev19_1", "name": "Part 1", "text": "Adair drove them to the mainland hospital morgue, where the Coroner pulled the sheet covering William Rutledge to just above the hole in his gut. Aiyana flinched at dozens of red-blue-purple handprints seared into his flesh amidst the claw marks.\n\n“Those were not there last night.”\n\nCaleb put an arm around her and shook his head, seeming to read her unasked question of whether she should tell them about the marks she’d left on him.\n\n“We believe the cold water kept the prints hidden. Once the body was transported and warmed up, the heat reacted to the toxin in these hand prints.”\n\n“What kind of drug?”\n\n“One that is precariously close to Rohypnol. But there is a mixture of what appears to be spider venom as well. It would appear that this victim was having sex or had just had sex before his death.”\n\n“Can you tell anything about the person who made those hand prints?” Caleb asked. Aiyana held her breath, waiting to hear a description close to hers.\n\n“A female, lightweight and petite, between five foot two and five foot four, maybe a hundred and ten pounds.”", "choices": [{"label": "Let yourself be relieved", "to": "ev19_3"}, {"label": "Think about who it could be", "to": "ev19_2"}], "voices": [["“Those were not there la", "Aiyana"], ["“We believe the cold wat", "The Coroner"], ["“What kind of drug?”", "Aiyana"], ["“One that is precariousl", "The Coroner"], ["“Can you tell anything a", "Caleb"], ["“A female, lightweight a", "The Coroner"]], "alt": {"text": "Adair waited for them at the dock. He drove them to the mainland hospital, and led the way in his quick efficient stride to the morgue. The Coroner paused his note taking after his inspection of the body as they walked in.\n\nAiyana found herself looking into the dead face of William Rutledge. His eyes were closed with dark circles around them. His lips were a strange shade of dark gray and slightly parted, revealing part of his perfect set of pearly white teeth and a bit of the inner pink in his mouth. A paper sheet covered him from shoulder to knee.\n\nThe Coroner put down his notepad and turned to Adair who nodded. The Coroner pulled the sheet covering Mr. Rutledge’s body to just above the hole in his gut. Aiyana flinched at the sight of what appeared to be dozens of red-blue-purple handprints seared into his flesh amidst the claw marks.\n\n“Those were not there last night.” Aiyana said feeling weak and lightheaded.\n\nCaleb quickly put an arm around her and held her steady. She looked at him and he shook his head, seeming to read her unasked question of whether she should tell them about the marks she’d left on him.\n\n“No, they were not.” The Coroner acknowledged. “They didn’t appear until we got the body here. We believe the cold water kept the prints hidden. Once the body was transported and warmed up, the heat reacted to the toxin in these hand prints.”\n\n“Toxin?” Aiyana looked to Adair, whose face indicated that there was more.\n\n“Yes, well, drugs may be a better word. A designer drug to be more specific,” The Coroner clarified.\n\nAiyana exhaled heavily. “What kind of drug?”\n\n“One that is precariously close to Rohypnol. But there is a mixture of what appears to be spider venom as well.” The Coroner informed her. “It would appear that this victim was having sex or had just had sex before his death. Upon examination it does appear that he climaxed.”\n\n“But, I thought Rohypnol made people black out. How would he…?”\n\n“There were also other drugs in his system. His blood work showed cocaine and an intense mixture of barbiturates.”\n\n“He wouldn’t have been able to travel with those kinds of drugs on him. He would have had to get them after arriving. Do you know of anyone on the island that sells these types of drugs and maybe has this type of mixture?”\n\n“The only time we have ever had problems with drugs on our side of the island has been because of some new mainland drug pusher hanging around the Esta-owey casino. We usually catch them pretty quickly though.”\n\nCaleb took a moment to send her an odd look then turned to the Coroner. “Without the cocaine and barbiturates, what kind of effect would the toxins from the handprints have?”\n\n“Well, it is possible that this substance could strictly be used as a sexual enhancer. A topical Viagra if you will.” The Coroner answered. “The number and position of the handprints as well as the evidence of climax indicate that he was with the other party for at least ten to fifteen minutes.”\n\n“The mixture would have soaked into the skin and affected the central nervous system. I would think the use of the near-Rohypnol compound would relax the person; it would create a sense of euphoria, or a high. The stimulant in the spider venom is more than likely to ensure arousal and erection. There is a good chance he didn’t even feel these wounds.”\n\n“Can you tell anything about the person who made those hand prints?” Caleb asked. Aiyana held her breath, waiting to hear a description close to hers.\n\n“A female, lightweight and petite, between five foot two and five foot four, maybe a hundred and ten pounds.”", "voices": [["“Those were not there la", "Aiyana"], ["“No, they were not.” The", "The Coroner"], ["“Toxin?” Aiyana looked t", "Aiyana"], ["“Yes, well, drugs may be", "The Coroner"], ["Aiyana exhaled heavily. ", "Aiyana"], ["“One that is precariousl", "The Coroner"], ["“But, I thought Rohypnol", "Aiyana"], ["“There were also other d", "The Coroner"], ["“He wouldn’t have been a", "Adair"], ["“The only time we have e", "Aiyana"], ["Caleb took a moment to s", "Caleb"], ["“Well, it is possible th", "The Coroner"], ["“The mixture would have ", "The Coroner"], ["“Can you tell anything a", "Caleb"], ["“A female, lightweight a", "The Coroner"]]}}, {"id": "ev19_2", "name": "NEW DRAFT: Five foot two", "text": "Five foot two. A hundred and ten pounds. Aiyana knew two women on the island built like that who also had yellow eyes, and she had shared a womb with both of them.", "choices": [{"label": "Continue", "to": "ev19_3"}], "alt": {"text": "Five foot two. A hundred and ten pounds. Aiyana knew two women on the island built like that who also had yellow eyes, and she had shared a womb with both of them.\n\nShe pushed the thought down before it could show on her face.", "voices": []}, "voices": []}, {"id": "ev19_3", "name": "Part 2", "text": "Being bigger in height and weight, Aiyana let out a sigh of relief. It had to be someone else.\n\n“Would this mixture have the same effect on the person applying it?”\n\n“In theory, unless the person that applied it is somehow resistant.”", "choices": [], "voices": [["“Would this mixture have", "Adair"], ["“In theory, unless the p", "The Coroner"]], "alt": {"text": "Being bigger in height and weight, Aiyana let out a sigh of relief. It had to be someone else.\n\n“The time the body spent in the salt water washed away and contaminated any DNA.” The Coroner pulled the sheet back up to Mr. Rutledge’s shoulders. “It is very possible that it was used as a consensual stimulant.” The Coroner said.\n\n“Would this mixture have the same effect on the person applying it?” Adair asked.\n\n“In theory, unless the person that applied it is somehow resistant,” the Coroner answered.\n\n“How does anyone build up a resistance to Rohypnol and spider venom?” Caleb questioned unconvinced.\n\nThe Coroner didn’t have an answer.", "voices": [["“The time the body spent", "The Coroner"], ["“Would this mixture have", "Adair"], ["“In theory, unless the p", "The Coroner"], ["“How does anyone build u", "Caleb"]]}}]}, {"id": "ev20", "title": "Chapter Eight, Part 3", "access": "pass", "price": 0, "scenes": [{"id": "ev20_1", "name": "Part 1", "text": "“Did the toxic mixture kill him?”\n\n“He suffered a massive heart attack, but with all of the drugs in his system we can’t say what if anything caused it. There was also water in his lungs so he appears to have drowned as well. But, I can not tell if he was dead or alive when whatever animal did this attacked him.”\n\n“If Mr. Rutledge fell into water, it most likely would have been from the pier and then was swept down the beach by the current.”\n\n“It may also be a good idea to check his personal effects for the drugs. If it can be found among his things murder can be eliminated right away.”\n\nAiyana knew his suggestion was an attempt to get Adair looking in the wrong direction.\n\n“I would not be comfortable ruling it as a murder, but the use of this toxin and drugs makes it hard to say that this was strictly an accident.”\n\nShe did not want a murderer running free on the island. But shutting down the festival and breaking the contract with Thump TV would be catastrophic.\n\n“We will try to keep this as quiet as possible,” Adair stated as they drove back to the ferry. “But, he is a multi-millionaire from California.”", "choices": [{"label": "Tell the public the truth", "to": "ev20_3"}, {"label": "Keep it quiet until the festival ends", "to": "ev20_2"}], "voices": [["“Did the toxic mixture k", "Aiyana"], ["“He suffered a massive h", "The Coroner"], ["“If Mr. Rutledge fell in", "Aiyana"], ["“It may also be a good i", "Caleb"], ["“I would not be comforta", "Adair"], ["“We will try to keep thi", "Adair"]], "alt": {"text": "“Did the toxic mixture kill him?” Aiyana wanted to know.\n\n“It appears that a lot of things happened at once. He suffered a massive heart attack, but with all of the drugs in his system we can’t say what if anything caused it. There was also water in his lungs so he appears to have drowned as well. I want to say the drowning killed him. But, I can not tell if he was dead or alive when whatever animal did this attacked him.”\n\n“The sex could have happened long before the attack, and maybe the effects of the drugs left him disoriented and he ended up near the water, somehow falling in.” Adair said.\n\n“The pier.” Aiyana whispered. “A few summers ago a child fell from the pier and was swept onto shore by the tide. She had on her floaters, so she survived. If Mr. Rutledge fell into water, it most likely would have been from the pier and then was swept down the beach by the current.”\n\n“I’ll get my men over to the pier to look for evidence.” Adair assured her.\n\n“It may also be a good idea to check his personal effects for the drugs.” Caleb said. “If it can be found among his things murder can be eliminated right away.”\n\n“Good thinking,” Adair said. “We should look for that toxic mixture too.”\n\nAdair turned to the Coroner, missing the look that passed between Aiyana and Caleb. She knew his suggestion was an attempt to get Adair looking in the wrong direction. She hoped he didn’t think she had anything to do with it.\n\n“Do you think this was an accident?” Aiyana asked, looking away from Caleb.\n\n“I would not be comfortable ruling it as a murder, but the use of this toxin and drugs makes it hard to say that this was strictly an accident.”\n\n“Who would want to kill Mr. Rutledge and why?” Aiyana wondered aloud. She was less than comforted by the Coroner’s unwillingness to commit to a ruling. She was even more disturbed by the handprints that were so similar to the ones she’d left on Caleb.\n\nShe did not want a murderer running free on the island. However, there was a lot of money on the line, if she shut down the festival to look for a phantom killer. She didn’t even want to think about how long it would take the island to recover. Refunding room rentals and breaking the contract she had with Thump TV would be catastrophic.\n\nShe looked to Adair uncertain what to do.\n\n“Where are his kids?” Aiyana asked.\n\n“They went to the mainland to get a new hotel room. They will head to the airport later to pick up their mother,” Adair said.\n\n“You know when she gets in?”\n\n“Her flight gets in at four this afternoon,” he said. “Hopefully we’ll be able to answer some questions for her by then.”\n\n“Will you be able to find the person he was with?”\n\n“We certainly will try.” Adair assured her.\n\nAiyana turned to look over the corpse that had once housed the spirit of William Rutledge, the third. His bedroom eyes were permanently closed in his graying, but still handsome, face. She thought maybe she should say a prayer for him, help him as best she could cross over into the afterlife. She’d read a little bit about a variety of religions. All seemed agreed there was a heavenly afterlife, but dissented on who would get there and how.\n\n“Rest in peace, Mr. Rutledge,” was all she managed to say before asking Adair to take her and Caleb back to the ferry.\n\n“We will try to keep this as quiet as possible,” Adair stated as they drove to the ferry. “But, he is a multi-millionaire from California. The best we can hope for in the short term is that the wife won’t want the public to get wind of him having an affair and being full of drugs while he’s supposed to be on business. We’ll take at least the day to look over the pier, and question his children and associates. We could even request that his home in California be searched for that toxic mixture.”", "voices": [["“Did the toxic mixture k", "Aiyana"], ["“It appears that a lot o", "The Coroner"], ["“The sex could have happ", "Adair"], ["“The pier.” Aiyana whisp", "Aiyana"], ["“I’ll get my men over to", "Adair"], ["“It may also be a good i", "Caleb"], ["“Good thinking,” Adair s", "Adair"], ["“Do you think this was a", "Aiyana"], ["“I would not be comforta", "Adair"], ["“Who would want to kill ", "Aiyana"], ["“Where are his kids?” Ai", "Aiyana"], ["“They went to the mainla", "Adair"], ["“You know when she gets ", "Aiyana"], ["“Her flight gets in at f", "Adair"], ["“Will you be able to fin", "Aiyana"], ["“We certainly will try.”", "Adair"], ["“Rest in peace, Mr. Rutl", "Aiyana"], ["“We will try to keep thi", "Adair"]]}}, {"id": "ev20_2", "name": "NEW DRAFT: Keep it quiet", "text": "“Keep it quiet,” Aiyana heard herself say. “Two more days. That’s all we need.”\n\nAdair nodded as if he had expected nothing else. That was what turned her stomach. She saw William Rutledge’s gray mouth again.\n\n“No. Wait.”", "choices": [{"label": "Continue", "to": "ev20_3"}], "voices": [["“Keep it quiet,” Aiyana ", "Aiyana"], ["“No. Wait.”", "Aiyana"]], "alt": {"text": "“Keep it quiet,” Aiyana heard herself say. “Two more days. That’s all we need.”\n\nAdair nodded as if he had expected nothing else. That was what turned her stomach: how easy it was, how ready he had been to hear it.\n\nShe saw William Rutledge’s gray mouth again. She saw his daughter trying to push past the officers.\n\n“No. Wait.”", "voices": [["“Keep it quiet,” Aiyana ", "Aiyana"], ["“No. Wait.”", "Aiyana"]]}}, {"id": "ev20_3", "name": "Part 2", "text": "“We can’t afford to shut down the festival, but we should tell the public as much of the truth as possible. No amount of money is worth risking anyone else’s life.”\n\nAdair’s cell phone rang. He listened, then hung up.\n\n“Two more bodies were found this morning. One washed up on the beach. The other found in the resort gardens.”", "choices": [], "voices": [["“We can’t afford to shut", "Aiyana"], ["“Two more bodies were fo", "Adair"]], "alt": {"text": "“I understand that would buy us some time. There are only a couple more days of the festival. But, I don’t want anyone else getten hurt or dy’en. We can’t afford to shut down the festival, but we should tell the public as much of the truth as possible. At least warn them about the animal attack. No amount of money is worth risking anyone else’s life.”\n\n“I have to apologize for assuming you’d want to cover this up and delay as long as possible. I’ve dealt with politicians wanting to preserve image and money over all else.”\n\nAiyana looked to Adair. “It’s okay. I’ll leave it up to the family to determine what matters they wish to remain private.”\n\nAdair’s cell phone rang and he answered.\n\n“Yes?” He paused to listen for a while. “We’re headed back right now.”\n\n“What’s wrong?” Aiyana asked as Adair hung up the phone.\n\n“Two more bodies were found this morning. One washed up on the beach. The other found in the resort gardens.”", "voices": [["“I understand that would", "Aiyana"], ["“I have to apologize for", "Adair"], ["Aiyana looked to Adair. ", "Aiyana"], ["“Yes?” He paused to list", "Adair"], ["“What’s wrong?” Aiyana a", "Aiyana"], ["“Two more bodies were fo", "Adair"]]}}]}, {"id": "ev21", "title": "Chapter Eight, Part 4", "access": "pass", "price": 0, "scenes": [{"id": "ev21_1", "name": "Part 1", "text": "Aiyana and Caleb followed Adair to another man washed up on shore, his body in much the same condition as Mr. Rutledge’s, except claw marks took over half of his face and it appeared as if something ate his midsection.\n\n“It’s another visitor.”\n\n“But there are no hand prints… yet.” Adair pointed to drag marks in the sand. “The body looks more like it was dragged onto shore than washed up.”\n\nThe other victim lay in the resort’s back yard in a hotel staff uniform, one of the bartenders from Levi’s party, almost completely dismembered, the midsection eaten out.\n\nOutside the cottage a group of Esta-owey stood chanting.\n\n“That is the funeral call for one of our own that has gone over to the spirit world.”\n\n“Why would they be in front of the cottage?”", "choices": [{"label": "Run to the cottage", "to": "ev21_3"}, {"label": "Ask Caleb what the chant means", "to": "ev21_2"}], "voices": [["“It’s another visitor.”", "Aiyana"], ["“But there are no hand p", "Adair"], ["“That is the funeral cal", "Caleb"], ["“Why would they be in fr", "Aiyana"]], "alt": {"text": "Aiyana and Caleb followed Adair to the scene of another man washed up on shore. His body was in much the same condition as Mr. Rutledge’s, except claw marks took over half of his face and it appeared as if something ate his midsection. He didn’t seem to be a Gullah or Esta-owey.\n\n“It’s another visitor.” Aiyana said out loud.\n\nAdair looked at her. “You think that is significant?”\n\nAiyana shrugged.\n\nAdair walked around the body taking in the details of the damage. “Claw marks on his inner arm look like they may be defensive wounds. But there are no hand prints… yet.” He looked at the area around the body and pointed to drag marks in the sand. “The body looks more like it was dragged onto shore than washed up.”\n\n“From the water?” Caleb asked.\n\nAdair nodded. “I’ll call animal control to come and take a look. Do you mind if they search through the water and over the island?”\n\n“Not at all,” Aiyana replied. “We should go see the other victim.”\n\nThey walked back towards the resort and into the back yard. As the body came into view, Aiyana recognized the uniform of the hotel staff.\n\n“Oh no…” Aiyana exhaled.\n\n“You know him?” Adair asked.\n\n“No, but that’s one of our uniforms. He’s an employee,” Aiyana supplied, shaking her head.\n\nThey got closer and Aiyana noted that he was one of the bartenders from Levi’s party. He was also fully clothed and almost completely dismembered. Again the midsection seemed to have been eaten out.\n\n“He was still fully clothed.” Caleb observed.\n\n“I’ll need to talk with the rest of the staff, see who found the body. We also need to make an announcement and post notices that there is a wild animal on the loose and anyone that knows or sees anything should contact us.”\n\n“I need to lie down.” Aiyana began to feel the beginnings of a tension headache.\n\nCaleb walked her away from the scene. As they approached the cottage, she was surprised to see that there was a group of Esta-owey outside of the house, chanting.\n\n“Oh no,” Caleb murmured.\n\n“What is it?” Aiyana asked, not sure what to make of it, but checking to see if Sakima were among them. He wasn’t and neither were the elders.\n\n“That is the funeral call for one of our own that has gone over to the spirit world.”\n\n“What?” Aiyana was confused. “Why would they be in front of the cottage?”", "voices": [["“It’s another visitor.” ", "Aiyana"], ["Adair looked at her. “Yo", "Adair"], ["Adair walked around the ", "Adair"], ["“From the water?” Caleb ", "Caleb"], ["Adair nodded. “I’ll call", "Adair"], ["“Not at all,” Aiyana rep", "Aiyana"], ["“Oh no…” Aiyana exhaled.", "Aiyana"], ["“You know him?” Adair as", "Adair"], ["“No, but that’s one of o", "Aiyana"], ["“He was still fully clot", "Caleb"], ["“I’ll need to talk with ", "Adair"], ["“I need to lie down.” Ai", "Aiyana"], ["“Oh no,” Caleb murmured.", "Caleb"], ["“What is it?” Aiyana ask", "Aiyana"], ["“That is the funeral cal", "Caleb"], ["“What?” Aiyana was confu", "Aiyana"]]}}, {"id": "ev21_2", "name": "NEW DRAFT: The funeral call", "text": "“What are they sayen?”\n\nCaleb listened. “They’re asking the ones who went before to open the door,” he said. “To come and walk her over.”\n\n“Her?”\n\nHe did not answer. He did not have to.", "choices": [{"label": "Continue", "to": "ev21_3"}], "voices": [["“What are they sayen?”", "Aiyana"], ["Caleb listened. “They’re", "Caleb"], ["“Her?”", "Aiyana"]], "alt": {"text": "“What are they sayen?”\n\nCaleb listened with his head bowed. “They’re asking the ones who went before to open the door,” he said at last. “To come and walk her over.”\n\n“Her?”\n\nHe did not answer. He did not have to.", "voices": [["“What are they sayen?”", "Aiyana"], ["Caleb listened with his ", "Caleb"], ["“Her?”", "Aiyana"]]}}, {"id": "ev21_3", "name": "Part 2", "text": "Her breath caught as her thoughts turned to her grandmother. She hurried to the cottage, while Caleb stayed to join the chant. Inside, her entire family waited deep in mourning, even Uncle Max, who seemed to be aging right in front of her eyes. She relayed what the coroner had said.\n\n“Murder?”\n\n“They can’t rule it out.” Aiyana repeated. “They found two more bodies as well.”\n\n“Your grandmother passed away while you were on the mainland,” Aunt Fey told her. “You are the new ruler.”", "choices": [], "voices": [["“Murder?”", "Vivi"], ["“They can’t rule it out.", "Aiyana"], ["“Your grandmother passed", "Aunt Fey"]], "alt": {"text": "Her breath suddenly caught as her thoughts turned to her grandmother. She hurried towards the cottage. Looking back as she got to the door, she saw that Caleb had paused to stand respectfully beside the chanters of his tribe. He began the chant himself. She entered the cottage where her entire family waited deep in mourning. As she stepped into the house, Aiyana felt a sense of claustrophobia, as the presence of so many people dwarfed the already modest living space.\n\nShe turned to see her Uncle Max, who never came to the house until their monthly meetings. His eyes seemed tight and bloodshot. He seemed to have aged in the time since she’d seen him, and in some ways seemed to be aging right in front of her eyes.\n\n“What did the Coroner say?” Levi’s baritone voice took over the space.\n\n“There’s no official cause of death, yet. But, the evidence could suggest that he was killed either accidentally or on purpose.” Aiyana relayed to them.\n\nShe took note of the looks that passed between her aunts and uncle. Aunt Helen clutched her Bible tighter and Uncle Max shrunk into himself sitting heavily on the antique sofa.\n\n“Murder?” Vivi was the first to speak the word.\n\n“They can’t rule it out.” Aiyana repeated. “They found two more bodies as well.”\n\nEveryone in the room shifted uncomfortably.\n\n“One was another visitor, but the other was a hotel employee. Adair is going to call in Animal Control.” Aiyana turned to face Levi. “Caleb is outside with the Esta-owey. They are chanting a funeral call.”\n\nAunt Fey came to her side and put an arm over her shoulder, leading her to a chair. “Your grandmother passed away while you were on the mainland,” Aunt Fey told her. “You are the new ruler.”", "voices": [["“What did the Coroner sa", "Levi"], ["“There’s no official cau", "Aiyana"], ["“Murder?” Vivi was the f", "Vivi"], ["“They can’t rule it out.", "Aiyana"], ["“One was another visitor", "Aiyana"], ["Aunt Fey came to her sid", "Aunt Fey"]]}}]}, {"id": "ev22", "title": "Chapter Nine, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev22_1", "name": "Part 1", "text": "Aiyana sat in a stupor beneath the portrait of Charii, which seemed to take in the family’s grief with calm patience. Aunt Helen opened the door to three Esta-owey women carrying traditional clothes and a washing basin.\n\n“We are here to clean and dress the body,” one said.\n\n“The Chief asked me to explain,” Niara said, stepping past Aunt Helen. “He wants to bury the past and look to the future. He wants your family to be our family.”\n\nHer father had been Esta-owey, and the chief might tell her more about him than her Aunts and Uncle had.\n\n“Like we care what your Chief wants.”\n\n“Please, at least accept our help to clean and dress the body for an honored burial.”", "choices": [{"label": "Allow it", "to": "ev22_3"}, {"label": "Refuse them", "to": "ev22_2"}], "voices": [["“We are here to clean an", "Esta-owey woman"], ["“The Chief asked me to e", "Niara"], ["“Like we care what your ", "Aunt Fey"], ["“Please, at least accept", "Niara"]], "alt": {"text": "Aiyana sat in the living room in a bit of a stupor caused by the whirlwind of death that had taken over the tiny island in the last twenty-four hours. She automatically looked up to see the portrait of Charii on the wall, which seemed to take in the family’s display of grief with calm patience as if waiting for them to accept it and move on. She was surprised to hear a soft knock on the door. Aunt Helen opened it to three Esta-owey women carrying traditional clothes and a washing basin.\n\n“We are here to clean and dress the body,” one of the women said respectfully.\n\n“Excuse me?” Aunt Fey said with a great deal of hostility in her voice. More than Aiyana thought necessary.\n\n“That won’t be necessary,” Aunt Helen said and nearly closed the door on them.\n\n“Aiyana,” Niara stepped through, ignoring Aunt Helen. “The Chief asked me to explain,” she started. “He wants to bury the past and look to the future. He wants your family to be our family.”\n\nAiyana thought about the fact that her father had been Esta-owey and tried to swallow her too-little-too-late reaction. Once again she remembered Sakima’s angry grip on her when she was just a child, and the way his face darkened when he looked at her during the festival.\n\n“My family is already your family,” she reminded Niara.\n\nNiara nodded. “Yes, he wants it… publicly.”\n\n“Oh, he does…” Aunt Fey scoffed. “Like we care what your Chief wants.”\n\nShe sighed as she wondered if there were a chance he would be able to tell her more about her father than her Aunts and Uncle had, should she accept his olive branch. There was just so much going on that she didn’t understand, and any additional clues could help her piece it all together.\n\n“Now’s no time for politics,” Levi’s voice rumbled with pain and confusion.\n\n“Please, at least accept our help to clean and dress the body for an honored burial. It is a great and humble act, to help build a bridge.”\n\nAiyana nodded, remembering that hiring Niara in the first place had been partially to that end. But, she was also certain that keeping her close would be an advantage.", "voices": [["“We are here to clean an", "Esta-owey woman"], ["“Excuse me?” Aunt Fey sa", "Aunt Fey"], ["“That won’t be necessary", "Aunt Helen"], ["“Aiyana,” Niara stepped ", "Niara"], ["“My family is already yo", "Aiyana"], ["Niara nodded. “Yes, he w", "Niara"], ["“Oh, he does…” Aunt Fey ", "Aunt Fey"], ["“Now’s no time for polit", "Levi"], ["“Please, at least accept", "Niara"]]}}, {"id": "ev22_2", "name": "NEW DRAFT: We take care of our own", "text": "“No,” Aiyana said. “We take care of our own.”\n\nAunt Fey’s mouth curved. It was the first time all morning she had looked pleased, and that stopped Aiyana cold. Whatever Aunt Fey wanted from this day, Aiyana did not want to be the one to give it to her.\n\n“Wait.”", "choices": [{"label": "Continue", "to": "ev22_3"}], "voices": [["“No,” Aiyana said. “We t", "Aiyana"], ["“Wait.”", "Aiyana"]], "alt": {"text": "“No,” Aiyana said. “We take care of our own.”\n\nAunt Fey’s mouth curved. It was the first time all morning she had looked pleased, and that was what stopped Aiyana cold. Whatever Aunt Fey wanted from this day, Aiyana did not want to be the one to give it to her.\n\nNiara waited with her hands folded, not pleading.\n\n“Wait.”", "voices": [["“No,” Aiyana said. “We t", "Aiyana"], ["“Wait.”", "Aiyana"]]}}, {"id": "ev22_3", "name": "Part 2", "text": "“They may. Please, thank Chief Sakima.”\n\nWhen the women emerged, she turned to Niara. “I would like a private meeting with Chief Sakima as soon as possible.”\n\n“Aiyana, you cannot make an alliance with the Esta-owey!”\n\n“I am now the Queen and own every scratch of land on this side of the Island. I can do whatever I like.”\n\n“Aiyana, we all need time to calm down and grieve, before we make any plans.”\n\n“We?”\n\nAiyana felt her own voice taken over by a deep and dark octave, her body paralyzed.\n\nAunt Helen fell to her knees. “Please, Jesus! Spare her.”\n\n“Jesus is far from you!” The words fell from Aiyana’s mouth, though she didn’t form them. “I am coming back!”\n\nAiyana noted the satisfaction on Aunt Fey’s face and the deep sadness that continued to age Uncle Max. The voice vanished and Aiyana fell to the floor.\n\n“The transition has begun.”\n\n“Begun? I thought it began months ago and would end tonight.”\n\n“No, it began with your grandmother’s passing and will end in seven years.” Aunt Fey smiled. “Welcome to the real world, Queen Aiyana.”", "choices": [], "voices": [["“They may. Please, thank", "Aiyana"], ["When the women emerged, ", "Aiyana"], ["“Aiyana, you cannot make", "Aunt Fey"], ["“I am now the Queen and ", "Aiyana"], ["“Aiyana, we all need tim", "Levi"], ["“We?”", "Charii"], ["Aunt Helen fell to her k", "Aunt Helen"], ["“Jesus is far from you!”", "Charii"], ["“The transition has begu", "Aunt Helen"], ["“Begun? I thought it beg", "Levi"], ["“No, it began with your ", "Aunt Fey"]], "alt": {"text": "“They may.” Aiyana gave her consent and heard the collective shock of her family members. “Please, thank Chief Sakima.” Aiyana said.\n\nHer family made way for the women to walk through the house. Aunt Helen followed closely behind and stayed in the room to watch over their work. Aiyana busied herself, preparing a glass of water. She drank it down and poured herself another. She tried to feel something about her grandmother. She wanted to feel anything but numb. But, the only feelings she had were about the tribe and their sudden interest in peace with her family. She figured now would be the best time to ask the chief to tell her everything he knew about her parents.\n\n“Is there anything else we can help you with?” Niara asked as they emerged from the room.\n\nAiyana looked towards her grandmother’s room. “I would like a private meeting with Chief Sakima as soon as possible.”\n\nAiyana was not surprised by the shock that came from her family members.\n\n“Why?” Aunt Fey demanded to know.\n\n“I want to know what he knows ‘bout my father,” Aiyana said.\n\n“We already told you what you need to know,” Aunt Fey interjected.\n\n“Yes, but ain’t everythen. Is it?” Aiyana watched her Aunt Fey wilt at the automatically authoritative tone Aiyana took on.\n\nThe women excused themselves, escaping the tension that began to build up in the house.\n\n“I will tell him,” Niara promised. “Do you want me to cancel the day’s activities?”\n\n“No, but please fill in where I’m needed. And call a press conference for tomorrow afternoon, Niara.” Niara nodded and followed the others, shutting the door behind her.\n\n“Aiyana, you cannot make an alliance with the Esta-owey!” Aunt Fey hissed.\n\n“I am now the Queen and own every scratch of land on this side of the Island. I can do whatever I like.” Aiyana sniffed.\n\n“Aiyana, you need time to assimilate to this new role,” Uncle Max began.\n\n“I’ve trained for nine years by myself for this new role.” Aiyana reminded them.\n\n“Okay,” Levi stepped in the middle of her, Aunt Fey, and Uncle Max. “Aiyana, we all need time to calm down and grieve, before we make any plans.”\n\n“We?”\n\nAiyana felt her own voice possessed and taken over by a deep and dark octave. It scared her and everyone in the room as well. She tried to move her arms to cover her mouth but felt paralyzed and stuck in place.\n\nAunt Helen crossed herself several times before falling to her knees and praying in earnest. “Please, Jesus! Spare her.”\n\n“Jesus is far from you!” Aiyana was spooked by the words that continued to fall from her mouth, as she didn’t form them on her own. “I am coming back!”\n\nAiyana noted the look of satisfaction that fell over her Aunt Fey’s face and the look of deep sadness that continued to age Uncle Max.\n\nThe voice vanished and Aiyana fell to the floor in complete confusion, as whatever force that had paralyzed her left with it.\n\n“What the hell was that?” Eva exclaimed.\n\n“The transition has begun,” Aunt Helen said rocking back and forth in her prayer pose.\n\n“Begun?” Levi said. “I thought it began months ago and would end tonight.”\n\n“No, it began with your grandmother’s passing and will end in seven years.” Aunt Fey smiled. “Welcome to the real world, Queen Aiyana.”\n\nAiyana swallowed the shock of that news and she picked herself up off of the floor.\n\n“So, this really is just the beginning?” Vivi groaned.", "voices": [["“They may.” Aiyana gave ", "Aiyana"], ["“Is there anything else ", "Niara"], ["Aiyana looked towards he", "Aiyana"], ["“Why?” Aunt Fey demanded", "Aunt Fey"], ["“I want to know what he ", "Aiyana"], ["“We already told you wha", "Aunt Fey"], ["“Yes, but ain’t everythe", "Aiyana"], ["“I will tell him,” Niara", "Niara"], ["“No, but please fill in ", "Aiyana"], ["“Aiyana, you cannot make", "Aunt Fey"], ["“I am now the Queen and ", "Aiyana"], ["“Aiyana, you need time t", "Uncle Max"], ["“I’ve trained for nine y", "Aiyana"], ["“Okay,” Levi stepped in ", "Levi"], ["“We?”", "Charii"], ["Aunt Helen crossed herse", "Aunt Helen"], ["“Jesus is far from you!”", "Charii"], ["“What the hell was that?", "Eva"], ["“The transition has begu", "Aunt Helen"], ["“Begun?” Levi said. “I t", "Levi"], ["“No, it began with your ", "Aunt Fey"], ["“So, this really is just", "Vivi"]]}}]}, {"id": "ev23", "title": "Chapter Nine, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev23_1", "name": "Part 1", "text": "“I need a minute,” Aiyana said, and walked to her grandmother’s room.\n\nHer grandmother looked peaceful and beautiful in the Esta-owey clothes. Aiyana wished for her mother to show her what to do and how to feel. She sat at her grandmother’s feet and wondered if she’d ever given her a hug. Regret flooded her, and her eyes began to burn with their fiery yellow glow.", "choices": [{"label": "Lie down beside her", "to": "ev23_3"}, {"label": "Say what you never said", "to": "ev23_2"}], "voices": [["“I need a minute,” Aiyan", "Aiyana"]], "alt": {"text": "“I need a minute,” Aiyana said. In the back of her mind she registered that the transition had always been about her grandmother dying. She walked from the living room to her grandmother’s room.\n\nAs she approached the door, she looked towards the remains that lay on the bed. She stepped inside and was surprised by the sweet smell of flowers the women had left behind.\n\nHer grandmother looked peaceful and beautiful in the Esta-owey clothes. In that moment, Aiyana wished for her mother. She wished her mother could take her by the hand and show her what to do and how to feel.\n\nAs she approached the bed she took a seat on the edge at her grandmother’s feet and wondered if she’d ever given her a hug. The thought brought on a flood of unexpected sadness and regret. She felt her eyes begin to burn with their fiery yellow glow.\n\nAiyana looked into the face of her grandmother and tried to temper her sadness with thoughts of her grandmother in heaven, no longer sick or in pain. She swallowed all of the resentment of unanswered questions for the time being, and tried to love her grandmother for doing the best she knew how.", "voices": [["“I need a minute,” Aiyan", "Aiyana"]]}}, {"id": "ev23_2", "name": "NEW DRAFT: One true thing", "text": "“You never once told me why,” Aiyana said to the still face. “Nine years in this house and you never told me one true thing.”\n\nNothing answered. Whatever her grandmother had known had gone where Aiyana could not follow, and the anger had nowhere to land.", "choices": [{"label": "Continue", "to": "ev23_3"}], "voices": [["“You never once told me ", "Aiyana"]], "alt": {"text": "“You never once told me why,” Aiyana said to the still face. “Nine years in this house and you never told me one true thing.”\n\nThe flowers the women had left were too sweet. Nothing answered. Whatever her grandmother had known had gone where Aiyana could not follow, and the anger had nowhere to land.", "voices": [["“You never once told me ", "Aiyana"]]}}, {"id": "ev23_3", "name": "Part 2", "text": "She lay next to her grandmother, an arm round her body, ignoring the stiffness already setting in.\n\n“Rest in peace, Grandma.”\n\nWhen she came out, the rest of her family stood in a circle with their eyes blazing, chanting.\n\n“We should meet back tomorrow at midnight,” Uncle Max said. “Then we can answer all of your final questions.”\n\nIt was a strange turn of phrase, her final questions. She took a suite in the resort tower and cried in Caleb’s arms for several hours.\n\nThat afternoon Adair texted that he would take a look around the Esta-owey casino. Then Mrs. Rutledge came up to her suite.\n\n“I understand that my husband was in the presence of a woman shortly before he died. And that narcotics of some kind might have been involved.” Mrs. Rutledge was calm. “I would like to ask that information be kept from the public. To spare the children the… embarrassment.”\n\n“Of course,” Aiyana responded.\n\n“I should have come out here with him. I was going to leave him anyway… before…” Mrs. Rutledge walked to the window and pressed her forehead against the glass.\n\nAnimal Control searched the woods and the water all the next day and returned with nothing. By sunset Aiyana stood on a stage facing the news cameras, Mr. Rutledge’s family to her left.\n\n“It pains me greatly to have to report that there appears to be a wild animal on the loose. We ask everyone visiting the island to please stay in groups, and avoid the water and woods at night.”\n\n“It also saddens me deeply to announce the passing of the island’s Gullah queen, my grandmother, Monique Celia Gamelle.”\n\nThe news crews gasped.\n\nShe didn’t realize she was searching the crowd for the Esta-owey chief until they made eye contact. The air seemed to be sucked from her lungs, and once again a strange voice in a strange language surrounded her. This time she clearly heard her name whispered, Aiyana. She tore her eyes away as the pain of not breathing became unbearable, quickly finished her statement and left the podium.", "choices": [], "voices": [["“Rest in peace, Grandma.", "Aiyana"], ["“We should meet back tom", "Uncle Max"], ["“I understand that my hu", "Mrs. Rutledge"], ["“Of course,” Aiyana resp", "Aiyana"], ["“I should have come out ", "Mrs. Rutledge"], ["“It pains me greatly to ", "Aiyana"], ["“It also saddens me deep", "Aiyana"]], "alt": {"text": "She lay next to her grandmother, placing an arm round her body, ignoring the stiffness already setting in.\n\n“Rest in peace, Grandma.” It was the same prayer she’d given to Mr. Rutledge, but it seemed just as appropriate.\n\nShe closed her eyes and tried to imagine the terrible thing that had fractured their family and their lives. Remembering the handprints on Mr. Rutledge and on Caleb she realized that it must have been horrible, that much she knew for certain.\n\nWhen Aiyana exited the room, the rest of her family stood in a circle with their eyes blazing. Aunt Helen sat to the side with her Bible open, praying. Aunt Helen looked up and their chanting became silent as she approached.\n\n“I will have the body taken to the funeral home and make the arrangements,” Aunt Helen assured her.\n\nAiyana nodded. “Please, be sure they redress her in the Esta-owey clothes.”\n\nAunt Helen smiled her agreement.\n\n“We should meet back tomorrow at midnight,” Uncle Max said. “Then we can answer all of your final questions.” He concluded.\n\nIt was a strange turn of phrase, her final questions. To her knowledge she hadn’t truly had her first questions answered. Everyone departed and she quickly grabbed a change of clothes and an overnight bag to take to the hotel. She couldn’t see staying at the house alone. She took note of portrait Charii’s disapproval at her flight, but didn’t care.\n\nBy the time she left the house all of the Esta-owey, except Caleb were gone. She walked the short distance to the resort tower holding Caleb’s hand. She checked into a business suite with an ocean view. She turned her phone off, crawled into bed, and cried in Caleb’s arms for several hours.\n\nIt wasn’t until late afternoon that she got out of bed to take a shower. When she got out, there was a note from Caleb stating that he went to buy groceries and would be back soon. She went into the adjoining office when she was dressed and turned her phone back on. Niara had e-mailed her a statement for the press conference that covered both the accidents and her grandmother’s passing. Adair had also sent her a text that he would head over to the Esta-owey casino to take a look around. Aiyana worked on the statements a little bit more, trying to sound more compassionate towards the victims and more loving towards her grandmother. She was surprised when her hotel phone rang.\n\n“Mrs. Rutledge is in the lobby to see you. Should I send her up?” The desk attendant asked.\n\n“Yes, please.”\n\nAiyana opened the door for Mrs. Rutledge and escorted her to the suite’s office.\n\n“I understand that my husband was in the presence of a woman shortly before he died. And that narcotics of some kind might have been involved.” Mrs. Rutledge cut to the reason for her visit. She was calm beyond measure with the exception of the white-knuckle grip she maintained on her monogrammed lace handkerchief.\n\nAiyana nodded in response to the statement.\n\n“I would like to ask that information be kept from the public. To spare the children the… embarrassment.”\n\n“Of course,” Aiyana responded.\n\n“I should have come out here with him.” Mrs. Rutledge continued on and took a dab at the corner of her eyes. “He asked me to. But, you know sometimes being the wife isn’t what it’s cracked up to be. I was going to leave him anyway… before…” Mrs. Rutledge walked to the office’s ocean view window and stared into the distance. She touched the glass of the window and leaned forward until her forehead pressed against the glass as well.\n\n“Oh well,” she whispered on to the window forcing a swift fog to roll over the window and disappear.\n\nAiyana took that moment to go to the woman and guide her to the office sofa.\n\n“Is there anythen that I can do for you, Mrs. Rutledge?”\n\nShe shook her head.\n\n“I know your children checked you into a hotel off the island, but you are more than welcome to stay here in a different penthouse suite, gratis.”\n\n“No, thank you. I just wanted to come and ask for that in person. I’ll see you at the press conference.”\n\nBy sunrise the next day, Animal Control had arrived on the island with a crew of eight officers. Four of them began the foot search for the animal at the gardens and then went into the woods. The other four set out in boat to dredge the water.\n\nBy early sunset they’d all returned with nothing. Aiyana found herself on the stage with more than half-a-dozen news cameras pointing to her. Niara had managed to get a podium with microphone and flags of the Island, South Carolina, and the United States arranged behind it. To her left stood Mr. Rutledge’s family, all still very shell shocked.\n\nIn the time between seeing her in the office and now on the stage, Aiyana was certain that Mrs. Rutledge had swallowed at least a handful of Xanax. Her blonde hair was pulled up in a bun. The sunglasses that covered her eyes also took up more than half of her face, and her red lipstick was vibrant set against the stark black of her pantsuit. Aiyana had yet to hear from or about the families of the other victims.\n\n“It pains me greatly to have to report that there appears to be a wild animal on the loose. Three people were found dead in the last two days, having been viciously attacked. One of which was a great friend of the island, Mr. William Rutledge, the third. He was a wonderful man and a great visionary. We were very proud to have him come to our small island and show an interest in its future development. We ask everyone visiting the island to please stay in groups, and avoid the water and woods at night.”\n\nAiyana took a moment to breathe in and out. She ignored the flood of cameras flashes and quick rise of questions.\n\n“It also saddens me deeply to announce the passing of the island’s Gullah queen, my grandmother, Monique Celia Gamelle. She was greatly loved and will be greatly missed.”\n\nShe heard a terrible collective gasp from the news crews and looked to the locals in the audience for their first reactions. The younger amongst them seemed to take the news with a grain of salt. However the older generations seemed more affected and alarmed by the news.\n\nShe didn’t realize that she was searching the crowd for the Esta-owey chief until they made eye contact. As they locked eyes, the air seemed to be sucked from her lungs, and once again a strange voice in a strange language surrounded her. But this time she clearly heard her name whispered, Aiyana. She tore her eyes away from him as the pain of not breathing became unbearable. Reminding herself to stay calm for the cameras, she took in a deep cleansing breath.\n\n“I will be available for further questions tomorrow by phone. If anyone has any information we ask you to please contact SLED Chief Officer Adair at the island police station. Thank you.” She quickly finished her statement and left the podium.", "voices": [["“Rest in peace, Grandma.", "Aiyana"], ["“I will have the body ta", "Aunt Helen"], ["Aiyana nodded. “Please, ", "Aiyana"], ["“We should meet back tom", "Uncle Max"], ["“Mrs. Rutledge is in the", "Desk attendant"], ["“Yes, please.”", "Aiyana"], ["“I understand that my hu", "Mrs. Rutledge"], ["“I would like to ask tha", "Mrs. Rutledge"], ["“Of course,” Aiyana resp", "Aiyana"], ["“I should have come out ", "Mrs. Rutledge"], ["“Oh well,” she whispered", "Mrs. Rutledge"], ["“Is there anythen that I", "Aiyana"], ["“I know your children ch", "Aiyana"], ["“No, thank you. I just w", "Mrs. Rutledge"], ["“It pains me greatly to ", "Aiyana"], ["“It also saddens me deep", "Aiyana"], ["“I will be available for", "Aiyana"]]}}]}, {"id": "ev24", "title": "Chapter Nine, Part 3", "access": "pass", "price": 0, "scenes": [{"id": "ev24_1", "name": "Part 1", "text": "Reporters continued to shout questions at her back as she left the stage. She didn’t feel her knees buckle, but found herself falling. Caleb lifted her from the floor. Her eyes began to glow yellow and he placed her head into his chest to hide the glow from the cameras.\n\nShe could hear Levi calling after her but didn’t pause. Caleb drove her away from the resort. When she opened her eyes again, she saw the lighthouse in view and smiled.\n\n“The good old days,” he said.\n\nAt the top of the tower Caleb pulled her into him. She felt his cool lips press against her neck and a wave of euphoria washed over her. He gently guided her to the floor.\n\n“I love you.”\n\n“I love you too, Caleb,” she responded.\n\n“Let’s leave. Let’s just take my car to the ferry and go.”", "choices": [{"label": "Tell him you can’t", "to": "ev24_3"}, {"label": "Go with him tonight", "to": "ev24_2"}], "voices": [["“The good old days,” he ", "Caleb"], ["“I love you.”", "Caleb"], ["“I love you too, Caleb,”", "Aiyana"], ["“Let’s leave. Let’s just", "Caleb"]], "alt": {"text": "Reporters continued to shout questions at her back as she left the stage. She didn’t feel her knees buckle, but found herself falling. The floor scratched her knees as they hit the stage, and she felt her hands sting as she slammed them down to avoid hitting her face. A strong pair of hands lifted her from the floor. She looked up to see Caleb and hugged him as he lifted her in his arms. Her eyes began to glow yellow and he held her to him, placing her head into his chest to hide the glow from the people and the cameras.\n\nHe placed her down when they were free from the crowd and she let him lead her away to his car. She could hear Levi calling after her but didn’t pause. Caleb sat her on the passenger side, strapping her in before getting in and driving away.\n\n“I’m so sorry,” Caleb said.\n\n“It’s okay.” Aiyana could feel the burning in her eyes begin to subside. “I just want to get away from here.”\n\n“Where do you want to go?”\n\n“Anywhere but right here,” she whispered.\n\nShe sat back with her eyes closed. Enjoying the smooth ride of Caleb’s car as it went away from the resort. When she opened her eyes again, she saw the lighthouse in view and smiled. She looked at Caleb who also smiled.\n\n“The good old days,” he said.\n\n“Yes.”\n\nShe was amazed at how he’d managed to think of the one perfect spot to take her. They entered the old building and the smell of mud and seawater washed over them. Caleb took the lead up the stairs into the tower where the glass looked out over the ocean. As they climbed higher the air became cool and crisp with the scent of the ocean’s saltiness. As she reached the top, Caleb pulled her into him.\n\nHe gave her a strong hug. She let her hands travel over his back as she hugged him tight in return. She felt his cool lips press against her neck and a wave of euphoria washed over her. She felt him kiss a trail from her neck to her lips and let him devour her mouth. Her knees became weak again and he gently guided her to the floor restin  said.", "choices": [{"label": "Let Levi handle it", "to": "ev26_3"}, {"label": "Ask Caleb to stay, for you", "to": "ev26_2"}], "voices": [["“It might not be safe… f", "Levi"], ["“I did that.” Aiyana sai", "Aiyana"], ["“Mr. Rutledge had the sa", "Caleb"], ["“There must be other peo", "Aiyana"], ["“Maybe it was Aunt Fey.”", "Levi"], ["“I want to leave the isl", "Aiyana"], ["“I saw a struggle that e", "Eva"], ["“None of you intend to k", "Aiyana"], ["“Of course not, but Uncl", "Eva"], ["“Let us hear what Uncle ", "Aiyana"], ["“Caleb can wait here unt", "Vivi"], ["“I’m coming,” Caleb said", "Caleb"]], "alt": {"text": "Caleb drove Aiyana to Levi’s house on the cove in silence. She was only slightly surprised to see Lucas and Eva’s cars there as well.\n\nLevi opened the door for her, but stonewalled Caleb’s entrance.\n\n“Why is he here?” Levi asked.\n\n“We need to talk to you.”\n\n“We?” Levi’s eyebrows rose up in objection.\n\n“Levi, don’t be like that. Let us talk to you, it’s important.”\n\n“The others are here. It might not be a good idea to talk in front of him. It might not be safe… for him.” Levi looked pointedly at Caleb.\n\n“I’ll take my chances,” Caleb spoke up.\n\nLevi shook his head and let out a heavy sigh. “The Rutledge girl is here too, so…” He stepped aside and they entered, going towards the comfort of the living room.\n\nLucas sat with his arm around Rosalind Rutledge who seemed to be in pieces.\n\n“You should take her to your room and let her sleep,” Vivi instructed Lucas.\n\n“I don’t want to be alone,” Rosalind sniffed.\n\n“He can stay with you. We’ll fill him in when he returns,” Eva’s words were curt and annoyed.\n\n“Come on.” Lucas helped Rosalind from the sofa and escorted her from the room. Aiyana and Caleb stood in front of the rest of her siblings.\n\n“We need to show you all something.” Aiyana said. “Take off your shirt, Caleb.”\n\nCaleb slowly peeled off his shirt. Vivi and Eva flinched at the bruising handprints on his body.\n\n“What happened?” Levi asked cautiously.\n\n“I did that.” Aiyana said flatly, holding up her hand to show it was a perfect match.\n\n“Okay?” Levi swallowed, looking confused.\n\n“Mr. Rutledge had the same kind of bruising on his body.” Caleb filled in and everyone’s look of confusion turned to mild understanding. Aiyana quickly described the incident.\n\n“When Aiyana touched me, it did something to me. I wasn’t in control,” Caleb said.\n\n“I had to forcefully push him away from me.”\n\n“Okay, so what now?” Eva said.\n\n“There must be other people on this island that this has happened to.”\n\nHer eyes fell to Eva. “Maybe someone with our special DNA.”\n\n“I never went anywhere near Mr. Rutledge.” Eva protested. “I spent that day here and then went to the parade. I was with Lucas the entire time.”\n\nAiyana looked to Vivi. Vivi shuddered. “Don’t even. He’s was old and gross. I was with Harold.”\n\n“Maybe it was Aunt Fey.” Levi was the first to name the next logical choice. “Anyway, we have our own problems to worry about right now. There is something else you wanted to talk about?” Levi asked.\n\n“I want to leave the island,” Aiyana said out loud. “I don’t want to be the next leader. I don’t want to know what comes next.”\n\n“I don’t think any of us have a choice.” Levi looked pained as he said it.\n\n“There is always a choice,” Aiyana said.\n\n“No.” Eva’s voice was strained as she piped up. “I’m having more dreams and visions of the past and future. They’re not good.”\n\n“What do you mean?” Aiyana asked.\n\n“I saw a struggle that ends with Uncle Max killing our father.”\n\nAiyana took a moment to let that set in.\n\n“I see another vision of blood everywhere.”\n\n“None of you intend to kill Caleb do you?”\n\n“Of course not, but Uncle Max was… he seemed to be… in a trance or possessed.”\n\nAiyana looked to Caleb as her mouth went dry.\n\n“We can go tonight,” Caleb said quickly. “We’ll just get away.”\n\n“Let us hear what Uncle Max, Aunt Fey, and Aunt Helen have to say. I think they want us to know the truth now that our grandmother has passed. If it is possible for us to leave with no consequences then they’ll tell us.” Aiyana looked to her siblings who didn’t seem convinced. “Did you hear Uncle Max yesterday? He wants us to know the truth and I’m sure he’ll help us if he can.”\n\n“Or maybe he will try to kill Caleb, too.” Eva countered as a loud thunderclap echoed around them. The sound of rain pouring again filled the immediate silence.\n\n“Just don’t do anything hasty,” Vivi said. “Caleb can wait here until we get back from our meeting with them at midnight.”\n\n“I’m coming,” Caleb said.", "voices": [["“Why is he here?” Levi a", "Levi"], ["“We need to talk to you.", "Aiyana"], ["“We?” Levi’s eyebrows ro", "Levi"], ["“Levi, don’t be like tha", "Aiyana"], ["“The others are here. It", "Levi"], ["“I’ll take my chances,” ", "Caleb"], ["Levi shook his head and ", "Levi"], ["“You should take her to ", "Vivi"], ["“I don’t want to be alon", "Rosalind"], ["“He can stay with you. W", "Eva"], ["“Come on.” Lucas helped ", "Lucas"], ["“We need to show you all", "Aiyana"], ["“What happened?” Levi as", "Levi"], ["“I did that.” Aiyana sai", "Aiyana"], ["“Okay?” Levi swallowed, ", "Levi"], ["“Mr. Rutledge had the sa", "Caleb"], ["“When Aiyana touched me,", "Caleb"], ["“I had to forcefully pus", "Aiyana"], ["“Okay, so what now?” Eva", "Eva"], ["“There must be other peo", "Aiyana"], ["Her eyes fell to Eva. “M", "Aiyana"], ["“I never went anywhere n", "Eva"], ["Aiyana looked to Vivi. V", "Aiyana"], ["“Maybe it was Aunt Fey.”", "Levi"], ["“I want to leave the isl", "Aiyana"], ["“I don’t think any of us", "Levi"], ["“There is always a choic", "Aiyana"], ["“No.” Eva’s voice was st", "Eva"], ["“What do you mean?” Aiya", "Aiyana"], ["“I saw a struggle that e", "Eva"], ["“I see another vision of", "Eva"], ["“None of you intend to k", "Aiyana"], ["“Of course not, but Uncl", "Eva"], ["“We can go tonight,” Cal", "Caleb"], ["“Let us hear what Uncle ", "Aiyana"], ["“Or maybe he will try to", "Eva"], ["“Just don’t do anything ", "Vivi"], ["“I’m coming,” Caleb said", "Caleb"]]}}, {"id": "ev26_2", "name": "NEW DRAFT: Please", "text": "“Caleb.” Aiyana took his hand. “If somethen happens to you in that house because of me, I won’t come back from it. Please.”\n\nHis jaw worked. He did not say yes.", "choices": [{"label": "Continue", "to": "ev26_3"}], "voices": [["“Caleb.” Aiyana took his", "Aiyana"]], "alt": {"text": "“Caleb.” Aiyana took his hand. “If somethen happens to you in that house because of me, I won’t come back from it. Please.”\n\nHis jaw worked. He did not say yes.", "voices": [["“Caleb.” Aiyana took his", "Aiyana"]]}}, {"id": "ev26_3", "name": "Part 2", "text": "Levi exhaled in frustration.\n\n“I understand you care about Aiyana,” Levi said patiently. “But I think we would all feel better if you would stay here out of harm’s way. We’ll come back and tell you what we’ve learned.”\n\n“Okay.” Caleb conceded.", "choices": [], "voices": [["“I understand you care a", "Levi"], ["“Okay.” Caleb conceded.", "Caleb"]], "alt": {"text": "Eva rolled her eyes and Levi exhaled in frustration.\n\n“I understand you care about Aiyana,” Levi said patiently. “But I think we would all feel better if you would stay here out of harm’s way. We’ll come back and tell you what we’ve learned.”\n\n“Okay.” Caleb conceded.", "voices": [["“I understand you care a", "Levi"], ["“Okay.” Caleb conceded.", "Caleb"]]}}]}, {"id": "ev27", "title": "Chapter Ten, Part 1", "access": "pass", "price": 0, "scenes": [{"id": "ev27_1", "name": "Part 1", "text": "The five siblings got to the cottage shortly before midnight. Uncle Max pointed to the portrait of Charii on the wall.\n\n“Her name was Charii, and she willingly came to this country as an African slave in order to remain with her children. There were three of us.”\n\n“We were born in Africa at the turn of the nineteenth century to a Prince and Princess of a wealthy village.”\n\n“That would mean that you are more than two hundred years old.”\n\n“Yes,” Uncle Max confirmed, heading to the door.\n\n“I want to move away from the island.”\n\n“We all want to leave, but we cannot.”\n\nAunt Fey led the way into the woods behind the resort and halted in front of two giant trees that seemed to form a doorway. She took Uncle Max and Aunt Helen’s hands and they began a chant. The words sounded very similar to the voice that surrounded Aiyana when she’d locked eyes with the Esta-owey chief, Sakima.\n\nA circle of torches ignited, revealing an actual doorway between the trees. An old Gullah woman that Aiyana thought she recognized, but could not name, emerged from it.\n\nUncle Max led the way through and the old woman slammed the door behind them. A loud metallic click locked them inside.", "choices": [{"label": "Keep walking down", "to": "ev27_3"}, {"label": "Try the door", "to": "ev27_2"}], "voices": [["“Her name was Charii, an", "Uncle Max"], ["“We were born in Africa ", "Uncle Max"], ["“That would mean that yo", "Aiyana"], ["“Yes,” Uncle Max confirm", "Uncle Max"], ["“I want to move away fro", "Aiyana"], ["“We all want to leave, b", "Uncle Max"]], "alt": {"text": "When the five siblings got to the cottage shortly before midnight, Levi led the way from his SUV to the front door. Aiyana felt her stomach tighten and her heart race as she followed him. Aunt Helen opened the door as they approached and they each filed in.\n\nLevi entered first, followed by Aiyana, Lucas, Eva, and Vivi brought up the rear. They filled the tiny living area and took seats. The flowers from their grandmother’s room still permeated the air.\n\nAunt Helen stood to one side of the room, clutching her crucifix, as Aunt Fey stood the other with her arms crossed tightly over her chest. Uncle Max stood in the center. He pointed to the portrait of Charii on the wall and began to tell his story.\n\n“Her name was Charii, and she willingly came to this country as an African slave in order to remain with her children.” Uncle Max began. “There were three of us.”\n\n“Wait… ” Lucas began.\n\n“What?” Eva asked. Aiyana and her siblings exchanged confused glances.\n\n“Yes. We were born in Africa at the turn of the nineteenth century to a Prince and Princess of a wealthy village. There was a war, our village was plundered and we were kidnapped then sold into slavery. Our father was killed while our mother, Charii, was spared. She found her way to the slave ships and traveled to the New World as Captain Patrick Gamelle’s slave and concubine to be with us.”\n\nOf all the ways Aiyana had imagined this tale would begin, this had never been one of them. “That would mean that you are more than two hundred years old.”\n\n“Yes,” Uncle Max confirmed, heading to the door. “We should take you to the meeting place for you to fully understand everything we are about to tell you.”\n\nAiyana remembered their plan to crash their meetings earlier in the week. All of them had wanted to go. But now that they were actually being invited, Aiyana was sure that like herself, none of them wanted to go. All she could feel was a sense of anticipation mixed with dread.\n\n“I want to leave, Uncle Max.” Aiyana said. “I want to move away from the island.”\n\n“We all want to leave, but we cannot.” Uncle Max shook his head in regret.\n\n“Why not?” Eva asked.\n\n“Come, let’s go,” he responded.\n\nAunt Fey led the way from the house towards the back yard and into the woods behind the resort. Aiyana had never thought to come this way on her own. Her grandmother had once told her a story of dangerous spiders that hid in the woods. It had always been enough to frighten her into staying out of them. Just as she wondered how they would find their way through the woods in the dark, they turned onto a path that was lit up by small solar lights.\n\nNo one spoke as they followed the path. The only noises that echoed along the trail were their footfalls on stone, dirt, mud, and branches. Aiyana fell deep into thought as she followed her Aunts and Uncle into the woods. She was not certain how long they had been walking; it could have been five minutes, and it could have been half an hour. At one point, she took note that they walked over a log bridge. At another point she saw they were walking through a small stream. She wondered what could be so terrible that it had to be visited in the middle of the island forest in the middle of the night?\n\nThen Aunt Fey came to a halt in front of two giant trees that seemed to form a doorway. Aiyana was brought back from her thoughts to the present. Aunt Fey took Uncle Max and Aunt Helen’s hands and they began a chant. Aiyana wasn’t certain what they said, but the words sounded very similar to the voice that surrounded her when she’d locked eyes with the Esta-owey chief, Sakima.\n\nWhen they were done chanting, a circle of torches ignited revealing an actual doorway between the two giant trees. An old Gullah woman that Aiyana thought she recognized, but could not name emerged from the doorway.\n\n“Faithful, as always.” Aunt Fey hugged the old woman then lifted the torches and handed one to each of them.\n\nUncle Max led the way through the door and the old woman slammed the door behind them. Aiyana heard a loud metallic click that indicated they were being locked inside.", "voices": [["“Her name was Charii, an", "Uncle Max"], ["“Wait… ” Lucas began.", "Lucas"], ["“What?” Eva asked. Aiyan", "Eva"], ["“Yes. We were born in Af", "Uncle Max"], ["Of all the ways Aiyana h", "Aiyana"], ["“Yes,” Uncle Max confirm", "Uncle Max"], ["“I want to leave, Uncle ", "Aiyana"], ["“We all want to leave, b", "Uncle Max"], ["“Why not?” Eva asked.", "Eva"], ["“Come, let’s go,” he res", "Uncle Max"], ["“Faithful, as always.” A", "Aunt Fey"]]}}, {"id": "ev27_2", "name": "NEW DRAFT: The locked door", "text": "Aiyana turned back and put her palm flat against the wood. It did not give.\n\nThe old woman spoke low from the other side. “Go on down, baby. Nobody leaven till it’s told.”", "choices": [{"label": "Continue", "to": "ev27_3"}], "voices": [["The old woman spoke low ", "Old woman"]], "alt": {"text": "Aiyana turned back and put her palm flat against the wood. It did not give.\n\nFrom the other side the old woman said something low, the way a person hushes a child. “Go on down, baby. Nobody leaven till it’s told.”", "voices": [["From the other side the ", "Old woman"]]}}, {"id": "ev27_3", "name": "Part 2", "text": "Aunt Helen put a hand on Lucas’s shoulder. “It is safe for us to discuss the transition down here.”\n\nThe word made Aiyana shudder. Uncle Max led them down a sloping stone path into a circular room with four prison cells, three occupied by sleeping bodies.\n\n“Who are these people? What is this place?”\n\n“Where it all ended and began.”", "choices": [], "voices": [["Aunt Helen put a hand on", "Aunt Helen"], ["“Who are these people? W", "Vivi"], ["“Where it all ended and ", "Uncle Max"]], "alt": {"text": "“What is going on?” Lucas demanded.\n\n“It is alright.” Aunt Helen put a reassuring hand on his shoulder. “It is safe for us to discuss the transition down here.”\n\nThe word made Aiyana shudder. Transition. Her heart thundered in her ears as Uncle Max continued to lead them down a sloping stone path that gave an ever-growing ominous tone to the hollow echoes of their footsteps. When they reached the bottom of the slope, the floor leveled off. Aunt Fey retrieved each torch one-by-one, placing them along the wall as sconces.\n\nThe room was circular and made of stone. Aiyana counted what looked like four prison cells. As she stepped a little closer to the cells with her torch she saw that three of them were occupied by sleeping bodies. Rudimentary furniture made of wood and rock surrounded a fire pit that automatically lit when Uncle Max, Aunt Fey and Aunt Helen sat down.\n\n“What is going on? Who are these people? What is this place?” Vivi asked, not bothering to hide her revulsion.\n\n“Where it all ended and began,” Uncle Max stated.", "voices": [["“What is going on?” Luca", "Lucas"], ["“It is alright.” Aunt He", "Aunt Helen"], ["“What is going on? Who a", "Vivi"], ["“Where it all ended and ", "Uncle Max"]]}}]}, {"id": "ev28", "title": "Chapter Ten, Part 2", "access": "pass", "price": 0, "scenes": [{"id": "ev28_1", "name": "Part 1", "text": "Eva heaved an impatient sigh as Uncle Max began again with the slave ship and its owner, Captain Patrick Gamelle.\n\n“Your mother,” Eva said cutting him off. “We already got that part. What is the transition?”\n\nUncle Max’s eyes began to glow. An eerie wind without a source brushed over Aiyana’s skin.\n\n“May I continue? With the money he made from his voyage he purchased half of the land of this entire island from the Esta-owey tribe and built a plantation for rice farming.” The captain married Charii, freed his slaves at her request, and died of typhoid, leaving her this half of the island.\n\n“Was Charii some kind of witch?”\n\n“Yes. Like us she had fiery yellow eyes, a family blessing that came from the African Moon and Sun goddess, Mawu.”", "choices": [{"label": "Say the name aloud", "to": "ev28_3"}, {"label": "Keep the name to yourself", "to": "ev28_2"}], "voices": [["“Your mother,” Eva said ", "Eva"], ["“May I continue? With th", "Uncle Max"], ["“Was Charii some kind of", "Vivi"], ["“Yes. Like us she had fi", "Uncle Max"]], "alt": {"text": "Eva heaved an impatient sigh, crossing her arms, mirroring just how impatient Aiyana was getting with all of the theatrics herself.\n\n“More than two hundred years ago, the slave ship Destinus arrived in the port of Charleston. On board was the Portuguese owner of the ship and its cargo, Captain Patrick Gamelle, and he had in his possession an African tribal warrior princess from a village long since destroyed near Abomey in Africa. Her name is Charii and…”\n\n“Your mother,” Eva said cutting him off. “We already got that part. What is the transition?”\n\nUncle Max paused, looking at Eva. He furrowed his brow and his eyes began to glow. All was silent until the thunder began to roll above ground again. An eerie wind without a source blew into the small space, brushing over Aiyana’s skin like an icy touch, sending a chill up her spine and leaving goose bumps in its wake.\n\n“May I continue?” Uncle Max asked when it was apparent Eva had nothing further to say. “As it turns out this warrior surrendered herself to Captain Gamelle in hopes of being reunited with us, her three children who had been captured and sold after a bloody invasion in our village. She endured the Atlantic crossing as Captain Gamelle’s concubine, and once we arrived in the New World, he refused to sell her or us on the block as he did the others.\n\n“With the money he made from his voyage he purchased half of the land of this entire island from the Esta-owey tribe and built a plantation for rice farming. This forced many of the Esta-owey to vacate their homes and relocate to the Western side of the island. Most had to either work on the plantation for little money or leave. Because he had fallen in love with our mother, he moved all of us into the plantation house.\n\n“He soon married her and at her request, he set her children and all of his other slaves free. But, all stayed on the island and worked the rice plantation. However, Captain Gamelle fell ill with typhoid and passed away less than three years later, leaving Charii this half of the island in his will.”\n\n“Was Charii some kind of witch?” Vivi asked.\n\n“Yes. Like us she had fiery yellow eyes, a family blessing that came from the African Moon and Sun goddess, Mawu.”", "voices": [["“More than two hundred y", "Uncle Max"], ["“Your mother,” Eva said ", "Eva"], ["“May I continue?” Uncle ", "Uncle Max"], ["“With the money he made ", "Uncle Max"], ["“He soon married her and", "Uncle Max"], ["“Was Charii some kind of", "Vivi"], ["“Yes. Like us she had fi", "Uncle Max"]]}}, {"id": "ev28_2", "name": "NEW DRAFT: The name", "text": "Aiyana held the name behind her teeth. It pressed there like something that wanted out. Across the fire Aunt Fey was watching her mouth.\n\nIt got out anyway.", "choices": [{"label": "Continue", "to": "ev28_3"}], "alt": {"text": "Aiyana held the name behind her teeth. It pressed there like something that wanted out. Across the fire Aunt Fey was watching her mouth.\n\nIt got out anyway.", "voices": []}, "voices": []}, {"id": "ev28_3", "name": "Part 2", "text": "“Mawu,” Aiyana repeated and felt the strange wind whip around her again.\n\n“One day the Esta-owey chief’s son came to talk to Charii. They fell in love and she became pregnant.”\n\n“She decided to hire an Esta-owey handmaid, a relative of her lover, to help her with the pregnancy and to care for her.”\n\n“What happened?”\n\n“Helen came home first to find the five Esta-owey Elders removing the body of Charii’s lover from the house. His throat was slit.”\n\n“The Elders placed the blame on Charii. Her abdomen had been cut open. A baby lay dead in her arms. But, the Esta-owey handmaiden sat in the chair, rocking the other, crying baby, claiming that she was hers. We struggled in the room and then onto to the balcony. All I could think to do was toss her over it. She fell and broke her neck.”\n\n“Several weeks after we buried our mother, her spirit appeared to each of us. Telling us that it was the fault of the Esta-owey that she was dead and that we needed to avenge her. Charii’s spirit had somehow become dark and dangerous and she possessed her own daughter. She appeared every blood moon bringing forth demons to reign down terror and destruction on the island.”\n\nUncle Max took a torch over to the cells. All three held young Esta-owey men.\n\n“The demons come for people of the Esta-owey tribe chosen at random by Charii. A monster emerges from them during each blood moon, then they return to normal. They are the ones that killed those people on the island this week.”\n\n“One of the prison cells is empty.”\n\n“Yes, there is one that has not yet been identified.”", "choices": [], "voices": [["“Mawu,” Aiyana repeated ", "Aiyana"], ["“One day the Esta-owey c", "Uncle Max"], ["“She decided to hire an ", "Aunt Fey"], ["“What happened?”", "Aiyana"], ["“Helen came home first t", "Aunt Fey"], ["“The Elders placed the b", "Aunt Helen"], ["“Several weeks after we ", "Uncle Max"], ["“The demons come for peo", "Uncle Max"], ["“One of the prison cells", "Levi"], ["“Yes, there is one that ", "Uncle Max"]], "alt": {"text": "“Mawu,” Aiyana repeated and felt the strange wind whip around her again.\n\n“It didn’t take long for the people of the island to learn that we were different. As time went on, the Africans combined their languages and traditions on the island into what is now known as Gullah. The Gullah praised Charii and us, her children, as royalty and honored our secret power. However, the Esta-owey marked us as demons and quietly cursed our being here and lording over what they still felt was their land.”\n\n“One day the Esta-owey chief’s son came to talk to Charii. They ended up having some kind of powerful connection. They fell in love and she became pregnant.”\n\nUncle Max stopped talking and it seemed as if it were too difficult for him to continue. Aiyana wondered how many times he’d had to repeat this story, for her mother, grandmother, great-grandmother, etc. Then, Aunt Fey took over the story.\n\n“But the pregnancy weakened her and her powers. She decided to hire an Esta-owey handmaid, a relative of her lover, to help her with the pregnancy and to care for her. Something so simple turned out to be so dangerous.”\n\n“What happened?” Aiyana felt the strain of anticipation ripping at her gut.\n\n“Rumors,” Aunt Helen replied. “The nastiest rumors possible: rumors that we were jealous of her Esta-owey lover. Rumors that we, her children, were plotting to kill the child to avoid sharing our powers with her. Rumors that we feared the natives would take back the island if the child were half Esta-owey. Rumors that we were plotting to kill her native lover. The handmaid fed all of these rumors and lies to Charii.\n\n“As her pregnancy progressed, Charii became sick and paranoid, only trusting the word of this witch handmaiden. Her mind twisted around the worst she knew of human nature. Not wanting to see any harm come to her lover or his people, she passed a spell of protection over him and his elders, that none of us could harm them with violence. Of course this weakened her even further.”\n\nAunt Helen’s voice cracked with the last word and she clamped her mouth and eyes shut as if remembering the next part of the story.\n\n“But, one night, Charii was weak in bed during the last days of her pregnancy. We left her alone in the care of her handmaiden; not knowing it would be her last. Helen came home first to find the five Esta-owey Elders removing the body of Charii’s lover from the house. His throat was slit.”\n\n“The Elders placed the blame on Charii,” Aunt Helen said. “I ran into the house to see if she needed help. There was blood everywhere. I heard a baby crying and ran upstairs to Charii’s room. There she was lying in the bed. Her abdomen had been cut open. A baby lay dead in her arms. But, the Esta-owey handmaiden sat in the chair, rocking the other, crying baby, claiming that she was hers. I took the baby from her and she went mad. I was able to get the baby down in the crib before she came after me.” Aunt Helen pinched her cross. “We struggled in the room and then onto to the balcony. All I could think to do was toss her over it. She fell and broke her neck.\n\n“Several weeks after we buried our mother, her spirit appeared to each of us. Telling us that it was the fault of the Esta-owey that she was dead and that we needed to avenge her. And ever since, there has been an unsettled evil on the island.” Uncle Max said. “We knew the Esta-owey elders had something to do with what happened, but they blamed it all on the handmaiden. Without further proof, the
